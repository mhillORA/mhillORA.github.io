<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>logic radio fixture</title>
<style>.q.hidden{display:none}</style>
</head><body>
<form id="survey-form">
  <div class="q" data-qid="q1">
    <div class="radio-grid" role="radiogroup" data-qid-group="q1">
      <label><input type="radio" name="q1" value="Yes" /> Yes</label>
      <label><input type="radio" name="q1" value="No" /> No</label>
    </div>
  </div>
  <div class="q" data-qid="q2" data-show-if-qid="q1" data-show-if-equals="No">
    <input type="text" name="q2" />
  </div>
</form>
<script>
function cssEsc(name){return String(name||'').replace(/["\\]/g,'\\$&');}
function normLogicToken(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,' ');}
function logicTokensEquivalent(a,b){
  const x=normLogicToken(a),y=normLogicToken(b);
  if(!x||!y)return false; if(x===y)return true;
  const yes=new Set(['yes','y','true']), no=new Set(['no','n','false']);
  if(yes.has(x)&&yes.has(y))return true; if(no.has(x)&&no.has(y))return true; return false;
}
function selectedHasValue(selected,want){
  const w=String(want??'').trim(); if(!w)return false;
  return (selected||[]).some(s=>logicTokensEquivalent(s,w));
}
function readLogicCurrent(form,dep){
  const esc=cssEsc(dep);
  const row=form.querySelector('.q[data-qid="'+esc+'"]')||null;
  const scope=row||form;
  const multi=[...scope.querySelectorAll('input[type="checkbox"][name="'+esc+'"]')];
  if(multi.length) return multi.filter(el=>el.checked).map(el=>String(el.value||'').trim()).filter(Boolean);
  const radios=[...scope.querySelectorAll('input[type="radio"][name="'+esc+'"]')];
  if(radios.length) return radios.filter(el=>el.checked).map(el=>String(el.value||'').trim()).filter(Boolean);
  return [];
}
function evalShowIf(form,row){
  const dep=row.getAttribute('data-show-if-qid'); if(!dep)return true;
  const selected=readLogicCurrent(form,dep);
  const equals=row.getAttribute('data-show-if-equals');
  if(equals!=null&&equals!=='') return selectedHasValue(selected,equals);
  return true;
}
function syncLogic(form){
  form.querySelectorAll('.q').forEach(row=>{
    const show=evalShowIf(form,row);
    row.classList.toggle('hidden',!show);
  });
}
const form=document.getElementById('survey-form');
syncLogic(form);
form.addEventListener('change',()=>syncLogic(form));
window.__logicProbe=()=>{
  const q2=form.querySelector('[data-qid="q2"]');
  return {selected:readLogicCurrent(form,'q1'), q2Hidden:q2.classList.contains('hidden')};
};
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ARTEMIS Site Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script>
    (function() {
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="min-h-screen bg-gradient-to-b from-indigo-50 via-gray-50 to-gray-100 dark:from-gray-950 dark:via-gray-900 dark:to-gray-950 text-gray-800 dark:text-gray-200">
  <header class="border-b border-indigo-100/80 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <div class="text-[11px] uppercase tracking-[0.18em] text-indigo-600 dark:text-indigo-300 font-semibold">ARTEMIS</div>
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-gray-100">Site feasibility survey</h1>
      </div>
      <div id="status-chip" class="text-xs px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-200">Loading</div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4" id="subtitle">Loading…</p>
    <div id="card" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-lg shadow-indigo-100/40 dark:shadow-none p-5 sm:p-7">
      <div id="content" class="space-y-4"></div>
    </div>
  </main>

  <script>
    const API_BASE_URL = '/api';
    const qs = new URLSearchParams(window.location.search);
    const assignmentId = qs.get('assignmentId');
    const subtitle = document.getElementById('subtitle');
    const content = document.getElementById('content');
    const statusChip = document.getElementById('status-chip');

    const setChip = (label, cls) => {
      statusChip.textContent = label;
      statusChip.className = `text-xs px-2.5 py-1 rounded-full ${cls}`;
    };

    const request = async (endpoint, options = {}) => {
      const url = `${API_BASE_URL}${endpoint}`;
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status} ${res.statusText} - ${text}`);
      }
      if (res.status === 204) return null;
      const ct = res.headers.get('content-type') || '';
      return ct.includes('application/json') ? res.json() : res.text();
    };

    const escapeHtml = (s) => String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');

    const renderBanner = (title, message, tone) => {
      const map = {
        error: 'bg-red-50 dark:bg-red-900/30 border-red-200 dark:border-red-800 text-red-800 dark:text-red-200',
        ok: 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200',
        warn: 'bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800 text-amber-900 dark:text-amber-100',
      };
      return `<div class="p-4 rounded-xl border ${map[tone] || map.warn}">
        <div class="font-semibold">${escapeHtml(title)}</div>
        <div class="text-sm mt-1 whitespace-pre-wrap">${escapeHtml(message)}</div>
      </div>`;
    };

    const renderError = (message) => {
      subtitle.textContent = 'Unable to load survey';
      setChip('Error', 'bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-200');
      content.innerHTML = renderBanner('Error', message, 'error');
    };

    const renderDone = (resubmitted) => {
      subtitle.textContent = resubmitted ? 'Updated' : 'Submitted';
      setChip(resubmitted ? 'Updated' : 'Submitted', 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-200');
      content.innerHTML = renderBanner(
        resubmitted ? 'Answers updated' : 'Thanks — your response was submitted',
        resubmitted
          ? 'Your new answers have been saved. Any previously answered questions you left blank have been kept from your prior submission. Operations can see the latest answers on the site record in ARTEMIS.'
          : 'You can close this tab. Operations can see these answers on the site record in ARTEMIS.',
        'ok'
      );
    };

    const roleLabel = (r) => {
      const x = String(r || '').trim().toLowerCase();
      if (x === 'pi') return 'PI';
      if (x === 'coordinator') return 'Coordinator';
      return String(r || '').trim() || 'Staff';
    };

    const qsByName = (form, name) => {
      try {
        if (typeof CSS !== 'undefined' && CSS.escape) {
          return form.querySelector(`[name="${CSS.escape(String(name))}"]`);
        }
      } catch (_) {}
      return form.querySelector(`[name="${String(name).replace(/"/g, '\\"')}"]`);
    };

    const rowVisible = (row) => !row.classList.contains('hidden');

    const syncConditionalQuestions = (form) => {
      form.querySelectorAll('.site-survey-q-row').forEach((row) => {
        const dep = row.getAttribute('data-show-if-qid');
        let show = true;
        if (dep) {
          const want = row.getAttribute('data-show-if-equals') ?? '';
          const ctrl = qsByName(form, dep);
          const got = ctrl ? String(ctrl.value).trim() : '';
          show = got === String(want).trim();
        }
        row.classList.toggle('hidden', !show);
        row.querySelectorAll('[data-required-when-visible="true"]').forEach((el) => {
          el.required = show;
        });
      });
    };

    const answersToDefaults = (answers) => {
      const map = {};
      (Array.isArray(answers) ? answers : []).forEach((a) => {
        if (!a) return;
        const qid = a.questionId ?? a.id ?? a.qid;
        if (!qid) return;
        map[String(qid)] = a.value ?? '';
      });
      return map;
    };

    const renderSurvey = ({ assignment, definition, siteName, alreadySubmitted }) => {
      const hasPriorChip = !!definition._hasPrior;
      subtitle.textContent = `${siteName} • ${roleLabel(assignment.targetRole)}`;
      setChip(hasPriorChip ? 'Update' : 'In progress', hasPriorChip
        ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200'
        : 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-200');

      const questions = Array.isArray(definition.questions) ? definition.questions : [];
      const defaults = definition.defaultValues || {};

      const qBlocks = questions.map((q, idx) => {
        const id = q.id || `q_${idx}`;
        const label = q.label || q.title || `Question ${idx + 1}`;
        const type = (q.type || 'text').toLowerCase();
        const required = !!q.required;
        const defaultVal = defaults[id] ?? q.defaultValue ?? '';
        const logicQ = q.logic && q.logic.showIf && q.logic.showIf.questionId ? String(q.logic.showIf.questionId) : '';
        const logicEq = q.logic && q.logic.showIf && q.logic.showIf.equals != null ? String(q.logic.showIf.equals) : '';
        const logicAttrs = logicQ
          ? `data-show-if-qid="${escapeHtml(logicQ)}" data-show-if-equals="${escapeHtml(logicEq)}"`
          : '';
        const reqHtml = required ? ' <span class="text-red-600">*</span>' : '';
        const reqNative = required && !logicQ ? 'required' : '';
        const reqDeferred = required && logicQ ? 'data-required-when-visible="true"' : '';
        const disabled = alreadySubmitted ? 'disabled' : '';
        const fieldCls = 'w-full rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2.5 text-base sm:text-sm min-h-[44px] focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500';

        const head = `
          <div class="site-survey-q-row rounded-xl border border-gray-100 dark:border-gray-700 p-3 sm:p-4 bg-gray-50/70 dark:bg-gray-900/20" data-qid="${escapeHtml(id)}" ${logicAttrs}>
            <div class="space-y-1.5">
              <label class="block text-sm font-medium text-gray-800 dark:text-gray-200" for="${escapeHtml(id)}">
                ${escapeHtml(label)}${reqHtml}
              </label>`;
        const foot = `</div></div>`;

        if (type === 'textarea') {
          return head + `<textarea id="${escapeHtml(id)}" name="${escapeHtml(id)}" rows="4" ${reqNative} ${reqDeferred} ${disabled} class="${fieldCls}">${escapeHtml(defaultVal)}</textarea>` + foot;
        }
        if (type === 'select') {
          const opts = Array.isArray(q.options) ? q.options : [];
          return head + `
              <select id="${escapeHtml(id)}" name="${escapeHtml(id)}" ${reqNative} ${reqDeferred} ${disabled} class="${fieldCls}">
                <option value="">Select…</option>
                ${opts.map(o => {
                  const val = typeof o === 'string' ? o : (o.value ?? o.label ?? '');
                  const lbl = typeof o === 'string' ? o : (o.label ?? o.value ?? '');
                  const sel = String(defaultVal) === String(val) ? 'selected' : '';
                  return `<option value="${escapeHtml(val)}" ${sel}>${escapeHtml(lbl)}</option>`;
                }).join('')}
              </select>` + foot;
        }
        if (type === 'number') {
          return head + `<input id="${escapeHtml(id)}" name="${escapeHtml(id)}" type="number" value="${escapeHtml(defaultVal)}" ${reqNative} ${reqDeferred} ${disabled} class="${fieldCls}" />` + foot;
        }
        if (type === 'date') {
          return head + `<input id="${escapeHtml(id)}" name="${escapeHtml(id)}" type="date" value="${escapeHtml(defaultVal)}" ${reqNative} ${reqDeferred} ${disabled} class="${fieldCls}" />` + foot;
        }
        return head + `<input id="${escapeHtml(id)}" name="${escapeHtml(id)}" type="text" value="${escapeHtml(defaultVal)}" ${reqNative} ${reqDeferred} ${disabled} class="${fieldCls}" />` + foot;
      }).join('');

      const emptyHint = questions.length === 0
        ? renderBanner('No questions yet', 'Ask operations to add questions to this survey in ARTEMIS (Comms).', 'warn')
        : '';

      const hasPrior = !!definition._hasPrior;
      content.innerHTML = `
        ${hasPrior ? renderBanner('Updating previous submission', 'Your prior answers are pre-filled below. Fill in or change any answers and hit Submit. Blank fields will keep the previous answer.', 'warn') : ''}
        <div class="space-y-1">
          <div class="text-xs uppercase tracking-wide text-indigo-600 dark:text-indigo-300 font-semibold">Survey</div>
          <div class="text-2xl font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(definition.title || 'Untitled')}</div>
          ${definition.description ? `<div class="text-sm text-gray-600 dark:text-gray-300 mt-1">${escapeHtml(definition.description)}</div>` : ''}
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
          <div class="p-3 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900">
            <div class="text-xs text-indigo-700 dark:text-indigo-300">Site</div>
            <div class="font-medium text-gray-900 dark:text-gray-100">${escapeHtml(siteName)}</div>
          </div>
          <div class="p-3 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900">
            <div class="text-xs text-indigo-700 dark:text-indigo-300">Role</div>
            <div class="font-medium text-gray-900 dark:text-gray-100">${escapeHtml(roleLabel(assignment.targetRole))}</div>
          </div>
        </div>

        <form id="site-survey-form" class="pt-2 space-y-3" novalidate>
          ${emptyHint}
          ${qBlocks}
          <div id="form-error" class="hidden"></div>
          <div class="pt-2 flex items-center justify-end">
            <button id="submit-btn" type="submit"
              class="w-full sm:w-auto min-h-[44px] px-5 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 font-medium shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
              ${questions.length === 0 ? 'disabled' : ''}>
              ${hasPrior ? 'Update answers' : 'Submit answers'}
            </button>
          </div>
        </form>
      `;

      const form = document.getElementById('site-survey-form');
      const formError = document.getElementById('form-error');
      syncConditionalQuestions(form);
      form.addEventListener('input', () => syncConditionalQuestions(form));
      form.addEventListener('change', () => syncConditionalQuestions(form));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (alreadySubmitted) return;
        const submitBtn = document.getElementById('submit-btn');
        formError.classList.add('hidden');
        syncConditionalQuestions(form);

        const missing = [];
        form.querySelectorAll('.site-survey-q-row').forEach((row) => {
          if (!rowVisible(row)) return;
          const field = row.querySelector('[name]');
          if (!field) return;
          const isRequired = field.required || field.getAttribute('data-required-when-visible') === 'true';
          if (isRequired && !String(field.value || '').trim()) {
            const label = row.querySelector('label')?.textContent || field.name;
            missing.push(label.replace('*', '').trim());
          }
        });
        if (missing.length) {
          formError.classList.remove('hidden');
          formError.innerHTML = renderBanner('Please complete required questions', missing.join('\n'), 'warn');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

        try {
          if (!questions.length) return;
          const fd = new FormData(form);
          const answers = questions.map((q, idx) => {
            const id = q.id || `q_${idx}`;
            const label = q.label || q.title || `Question ${idx + 1}`;
            const type = (q.type || 'text').toLowerCase();
            const row = form.querySelector(`.site-survey-q-row[data-qid="${CSS.escape ? CSS.escape(id) : id}"]`);
            const visible = row ? rowVisible(row) : true;
            return {
              questionId: id,
              label,
              type,
              skipped: !visible,
              value: visible ? fd.get(id) : null
            };
          });

          const result = await request('/site-survey-responses', {
            method: 'POST',
            body: JSON.stringify({
              assignmentId: assignment.id,
              surveyId: assignment.surveyId,
              siteId: assignment.siteId,
              targetRole: assignment.targetRole,
              answers
            })
          });

          renderDone(!!result?.resubmitted);
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
          formError.classList.remove('hidden');
          formError.innerHTML = renderBanner('Submit failed', err.message || String(err), 'error');
        }
      });
    };

    (async () => {
      try {
        if (!assignmentId) {
          renderError('Missing assignmentId in the URL. Ask operations to resend the survey link.');
          return;
        }

        const assignment = await request(`/site-survey-assignments/${encodeURIComponent(assignmentId)}`);
        if (!assignment || !assignment.surveyId || !assignment.siteId) {
          renderError('Invalid assignment. The link may be expired or mistyped.');
          return;
        }

        // Allow re-submission: if already submitted, show prefilled form with a "Update answers" button
        const alreadySubmitted = false; // re-submit is always allowed; prior answers are merged server-side

        if (!assignment.openedAt && !alreadySubmitted) {
          try {
            await request(`/site-survey-assignments/${assignment.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ status: 'opened', openedAt: new Date().toISOString() })
            });
          } catch (_) {}
        }

        const definition = await request(`/site-survey-definitions/${encodeURIComponent(assignment.surveyId)}`);
        if (!definition || typeof definition !== 'object') {
          renderError('Survey definition was not found. It may have been deleted, or the assignment points to the wrong survey.');
          return;
        }

        try {
          // Prefer responses for this specific assignment, then fall back to site+survey+role
          const byAssignment = await request(`/site-survey-responses?assignmentId=${encodeURIComponent(assignment.id)}`).catch(() => []);
          const bySite = Array.isArray(byAssignment) && byAssignment.length
            ? byAssignment
            : await request(`/site-survey-responses?siteId=${encodeURIComponent(assignment.siteId)}&surveyId=${encodeURIComponent(assignment.surveyId)}&targetRole=${encodeURIComponent(assignment.targetRole)}`).catch(() => []);
          const last = Array.isArray(bySite) ? bySite.filter(r => !r._archived)[0] : null;

          if (last && last.answers) {
            const prefill = answersToDefaults(last.answers);
            definition.defaultValues = { ...(definition.defaultValues || {}), ...prefill };
            definition._hasPrior = true;
          }
        } catch (_) {}

        const site = await request(`/sites/${encodeURIComponent(assignment.siteId)}`).catch(() => null);
        const siteName = site?.name || assignment.siteId;

        renderSurvey({ assignment, definition, siteName, alreadySubmitted });
      } catch (err) {
        renderError(err.message || String(err));
      }
    })();
  </script>
</body>
</html>

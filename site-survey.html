<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ARTEMIS Site Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script>
    (function() {
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen">
  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100">Site Survey</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="subtitle">Loading…</p>
    </div>

    <div id="card" class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-sm p-6">
      <div id="content" class="space-y-4"></div>
    </div>
  </main>

  <script>
    const API_BASE_URL = '/api';

    const qs = new URLSearchParams(window.location.search);
    const assignmentId = qs.get('assignmentId');

    const subtitle = document.getElementById('subtitle');
    const content = document.getElementById('content');

    const request = async (endpoint, options = {}) => {
      const url = `${API_BASE_URL}${endpoint}`;
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status} ${res.statusText} - ${text}`);
      }
      if (res.status === 204) return null;
      const ct = res.headers.get('content-type') || '';
      return ct.includes('application/json') ? res.json() : res.text();
    };

    const escapeHtml = (s) => String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#039;');

    const renderError = (message) => {
      subtitle.textContent = 'Unable to load survey';
      content.innerHTML = `
        <div class="p-4 rounded-md bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800">
          <div class="font-semibold text-red-700 dark:text-red-200">Error</div>
          <div class="text-sm text-red-700 dark:text-red-200 mt-1">${escapeHtml(message)}</div>
        </div>
      `;
    };

    const renderDone = () => {
      subtitle.textContent = 'Submitted';
      content.innerHTML = `
        <div class="p-4 rounded-md bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800">
          <div class="font-semibold text-green-700 dark:text-green-200">Thanks — your response was submitted.</div>
          <div class="text-sm text-green-700 dark:text-green-200 mt-1">You can close this tab.</div>
        </div>
      `;
    };

    const roleLabel = (r) => {
      const x = String(r || '').trim().toLowerCase();
      if (x === 'pi') return 'PI';
      if (x === 'coordinator') return 'Coordinator';
      return String(r || '').trim() || 'Staff';
    };

    const renderSurvey = ({ assignment, definition, siteName }) => {
      subtitle.textContent = `${siteName} • ${roleLabel(assignment.targetRole)}`;

      const questions = Array.isArray(definition.questions) ? definition.questions : [];
      const defaults = definition.defaultValues || {};

      content.innerHTML = `
        <div class="space-y-1">
          <div class="text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">Survey</div>
          <div class="text-xl font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(definition.title || 'Untitled')}</div>
          ${definition.description ? `<div class="text-sm text-gray-600 dark:text-gray-300 mt-1">${escapeHtml(definition.description)}</div>` : ''}
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
          <div class="p-3 rounded-md bg-gray-50 dark:bg-gray-900/30 border border-gray-200 dark:border-gray-700">
            <div class="text-xs text-gray-500 dark:text-gray-400">Site</div>
            <div class="font-medium">${escapeHtml(siteName)}</div>
          </div>
          <div class="p-3 rounded-md bg-gray-50 dark:bg-gray-900/30 border border-gray-200 dark:border-gray-700">
            <div class="text-xs text-gray-500 dark:text-gray-400">Role</div>
            <div class="font-medium">${escapeHtml(roleLabel(assignment.targetRole))}</div>
          </div>
        </div>

        <form id="site-survey-form" class="pt-2 space-y-4">
          ${questions.map((q, idx) => {
            const id = q.id || `q_${idx}`;
            const label = q.label || q.title || `Question ${idx + 1}`;
            const type = (q.type || 'text').toLowerCase();
            const required = !!q.required;
            const defaultVal = defaults[id] ?? q.defaultValue ?? '';
            const base = `
              <div class="space-y-1">
                <label class="block text-sm font-medium text-gray-800 dark:text-gray-200" for="${escapeHtml(id)}">
                  ${escapeHtml(label)}${required ? ' <span class="text-red-600">*</span>' : ''}
                </label>
            `;
            if (type === 'textarea') {
              return base + `
                  <textarea id="${escapeHtml(id)}" name="${escapeHtml(id)}" rows="4" ${required ? 'required' : ''} class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">${escapeHtml(defaultVal)}</textarea>
                </div>
              `;
            }
            if (type === 'select') {
              const opts = Array.isArray(q.options) ? q.options : [];
              return base + `
                  <select id="${escapeHtml(id)}" name="${escapeHtml(id)}" ${required ? 'required' : ''} class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                    <option value="">Select…</option>
                    ${opts.map(o => {
                      const val = typeof o === 'string' ? o : (o.value ?? o.label ?? '');
                      const lbl = typeof o === 'string' ? o : (o.label ?? o.value ?? '');
                      const sel = String(defaultVal) === String(val) ? 'selected' : '';
                      return `<option value="${escapeHtml(val)}" ${sel}>${escapeHtml(lbl)}</option>`;
                    }).join('')}
                  </select>
                </div>
              `;
            }
            if (type === 'number') {
              return base + `
                  <input id="${escapeHtml(id)}" name="${escapeHtml(id)}" type="number" value="${escapeHtml(defaultVal)}" ${required ? 'required' : ''} class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                </div>
              `;
            }
            if (type === 'date') {
              return base + `
                  <input id="${escapeHtml(id)}" name="${escapeHtml(id)}" type="date" value="${escapeHtml(defaultVal)}" ${required ? 'required' : ''} class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                </div>
              `;
            }
            return base + `
                <input id="${escapeHtml(id)}" name="${escapeHtml(id)}" type="text" value="${escapeHtml(defaultVal)}" ${required ? 'required' : ''} class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
              </div>
            `;
          }).join('')}

          <div class="pt-2 flex items-center justify-end gap-2">
            <button id="submit-btn" type="submit" class="px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 font-medium">
              Submit
            </button>
          </div>
        </form>
      `;

      const form = document.getElementById('site-survey-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

        try {
          const fd = new FormData(form);
          const answers = questions.map((q, idx) => {
            const id = q.id || `q_${idx}`;
            const label = q.label || q.title || `Question ${idx + 1}`;
            const type = (q.type || 'text').toLowerCase();
            return {
              questionId: id,
              label,
              type,
              value: fd.get(id)
            };
          });

          await request('/site-survey-responses', {
            method: 'POST',
            body: JSON.stringify({
              assignmentId: assignment.id,
              surveyId: assignment.surveyId,
              siteId: assignment.siteId,
              targetRole: assignment.targetRole,
              answers
            })
          });

          await request(`/site-survey-assignments/${assignment.id}`, {
            method: 'PUT',
            body: JSON.stringify({ ...assignment, status: 'submitted', submittedAt: new Date().toISOString() })
          });

          renderDone();
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
          renderError(err.message || String(err));
        }
      });
    };

    (async () => {
      try {
        if (!assignmentId) {
          renderError('Missing assignmentId in the URL.');
          return;
        }

        // Load assignment
        const assignment = await request(`/site-survey-assignments/${encodeURIComponent(assignmentId)}`);
        if (!assignment || !assignment.surveyId || !assignment.siteId) {
          renderError('Invalid assignment.');
          return;
        }

        // Mark opened
        if (!assignment.openedAt) {
          try {
            await request(`/site-survey-assignments/${assignment.id}`, {
              method: 'PUT',
              body: JSON.stringify({ ...assignment, status: assignment.status === 'submitted' ? 'submitted' : 'opened', openedAt: new Date().toISOString() })
            });
          } catch (_) {}
        }

        // Load survey definition
        const definition = await request(`/site-survey-definitions/${encodeURIComponent(assignment.surveyId)}`);
        const site = await request(`/sites/${encodeURIComponent(assignment.siteId)}`).catch(() => null);
        const siteName = site?.name || assignment.siteId;

        renderSurvey({ assignment, definition, siteName });
      } catch (err) {
        renderError(err.message || String(err));
      }
    })();
  </script>
</body>
</html>

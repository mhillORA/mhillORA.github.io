<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Diagnostics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }
        .test-item.pass {
            border-left-color: #4caf50;
        }
        .test-item.fail {
            border-left-color: #f44336;
        }
        .test-item.loading {
            border-left-color: #ff9800;
        }
        h1 { color: #333; }
        .error { color: #f44336; }
        .success { color: #4caf50; }
    </style>
</head>
<body>
    <h1>Website Loading Diagnostics</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addTest(name, status, message) {
            const div = document.createElement('div');
            div.className = `test-item ${status}`;
            div.innerHTML = `<strong>${name}:</strong> <span class="${status}">${message}</span>`;
            results.appendChild(div);
        }

        // Test 1: File size
        fetch('index.html', { method: 'HEAD' })
            .then(response => {
                const size = response.headers.get('content-length');
                const sizeMB = (size / 1024 / 1024).toFixed(2);
                if (sizeMB > 2) {
                    addTest('File Size', 'fail', `${sizeMB}MB - Very large, may cause slow loading`);
                } else {
                    addTest('File Size', 'pass', `${sizeMB}MB - OK`);
                }
            })
            .catch(() => addTest('File Size', 'fail', 'Cannot check file size'));

        // Test 2: External CDN resources
        const cdns = [
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/lucide@latest',
            'https://cdn.jsdelivr.net/npm/chart.js',
            'https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js',
            'https://atlas.microsoft.com/sdk/javascript/mapcontrol/3/atlas.min.js'
        ];

        cdns.forEach(cdn => {
            const testName = cdn.split('/')[2];
            addTest(`CDN: ${testName}`, 'loading', 'Checking...');
            
            fetch(cdn, { method: 'HEAD', mode: 'no-cors' })
                .then(() => {
                    const items = document.querySelectorAll('.test-item');
                    items[items.length - 1].className = 'test-item pass';
                    items[items.length - 1].querySelector('span').textContent = 'Accessible';
                    items[items.length - 1].querySelector('span').className = 'success';
                })
                .catch(() => {
                    const items = document.querySelectorAll('.test-item');
                    items[items.length - 1].className = 'test-item fail';
                    items[items.length - 1].querySelector('span').textContent = 'May be blocked or slow';
                    items[items.length - 1].querySelector('span').className = 'error';
                });
        });

        // Test 3: API endpoints
        fetch('/api/azure-maps-config')
            .then(response => {
                if (response.ok) {
                    addTest('API: azure-maps-config', 'pass', 'Working');
                } else {
                    addTest('API: azure-maps-config', 'fail', `Error: ${response.status}`);
                }
            })
            .catch(error => {
                addTest('API: azure-maps-config', 'fail', `Failed: ${error.message}`);
            });

        // Test 4: Main page load
        addTest('Main Page', 'loading', 'Testing load time...');
        const startTime = performance.now();
        fetch('index.html')
            .then(response => response.text())
            .then(html => {
                const loadTime = ((performance.now() - startTime) / 1000).toFixed(2);
                const items = document.querySelectorAll('.test-item');
                const mainTest = Array.from(items).find(item => item.textContent.includes('Main Page'));
                if (mainTest) {
                    mainTest.className = 'test-item pass';
                    mainTest.querySelector('span').textContent = `Loaded in ${loadTime}s (${(html.length / 1024 / 1024).toFixed(2)}MB)`;
                    mainTest.querySelector('span').className = 'success';
                }
            })
            .catch(error => {
                const items = document.querySelectorAll('.test-item');
                const mainTest = Array.from(items).find(item => item.textContent.includes('Main Page'));
                if (mainTest) {
                    mainTest.className = 'test-item fail';
                    mainTest.querySelector('span').textContent = `Failed: ${error.message}`;
                    mainTest.querySelector('span').className = 'error';
                }
            });
    </script>
</body>
</html>

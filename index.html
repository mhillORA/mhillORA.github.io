    <!-- Azure Maps Animation Library -->
    <script src="https://cdn.jsdelivr.net/gh/Azure-Samples/azure-maps-animations@main/dist/azure-maps-animations.min.js"></script>
    <script>
        // Azure Maps key will be loaded from backend
        let AZURE_MAPS_KEY = null;
        
        // Fetch Azure Maps key from backend
        (async () => {
            try {
                const response = await fetch('/api/azure-maps-config');
                const data = await response.json();
                if (data && data.key) {
                    AZURE_MAPS_KEY = data.key;
                } else {
                    console.error('Azure Maps key not found in backend. Please configure AZURE_MAPS_KEY in Azure environment variables.');
                    AZURE_MAPS_KEY = null;
                }
            } catch (error) {
                console.error('Error fetching Azure Maps key:', error);
                console.error('Please configure AZURE_MAPS_KEY in Azure environment variables.');
                AZURE_MAPS_KEY = null;
            }
        })();
    </script>
    <!-- Removed Handsontable and Gantt chart libraries to improve load performance -->
    <style>

        /* Airplane Animations */
        @keyframes takeoff {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-20px) rotate(-10deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-40px) rotate(-20deg);
                opacity: 0;
            }
        }
        @keyframes landing {
            0% {
                transform: translateY(-40px) rotate(20deg);
                opacity: 0;
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes fly-across {
            0% {
                transform: translateX(-100%) translateY(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%) translateY(-20px);
                opacity: 0;
            }
        }
        .airplane-taking-off {
            animation: takeoff 2s ease-in-out infinite;
        }
        .airplane-landing {
            animation: landing 2s ease-in-out infinite;
        }
        .airplane-flying {
            animation: fly-across 3s ease-in-out infinite;
        }
        
        /* Manager View Tab Flash Animation */
        @keyframes slowRedFlash {
            0%, 100% { background-color: transparent; border-bottom-color: transparent; }
            50% { background-color: rgba(239, 68, 68, 0.2); border-bottom-color: rgba(239, 68, 68, 0.8); }
        }
        
        .manager-view-flash {
            animation: slowRedFlash 2s ease-in-out infinite;
        }
        
        /* Unassigned Shift Block Flash Animation - uses dedicated keyframes */
        @keyframes unassignedFlash {
            0%, 100% { 
                background-color: rgba(239, 68, 68, 0.15);
                border-color: rgba(239, 68, 68, 0.5);
                box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
            }
            50% { 
                background-color: rgba(239, 68, 68, 0.4);
                border-color: rgba(239, 68, 68, 0.9);
                box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            }
        }
        
        .unassigned-block-flash {
            animation: unassignedFlash 1.5s ease-in-out infinite !important;
            background-color: rgba(239, 68, 68, 0.15) !important;
            border: 2px solid rgba(239, 68, 68, 0.5) !important;
            color: #dc2626 !important;
        }
        
        /* Unfilled Role Block Flash Animation */
        @keyframes unfilledPulse {
            0%, 100% { 
                background-color: rgba(239, 68, 68, 0.15);
                border-color: rgba(239, 68, 68, 0.4);
            }
            50% { 
                background-color: rgba(239, 68, 68, 0.35);
                border-color: rgba(239, 68, 68, 0.8);
            }
        }
        
        .unfilled-role-box {

            position: fixed;

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        
        .mobile-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

            border-left: 3px solid transparent;

        .mobile-menu-item:hover {

        }
        
        .mobile-menu-item.active {
            background-color: #eff6ff;

        }

        }
        
        @media (max-width: 1024px) {

                display: none !important;

                flex-wrap: wrap;
                gap: 0.5rem;

            }

            }

                font-size: 1.5rem;
            }

            }

        @media (min-width: 1025px) {
            .mobile-menu-button,
            .mobile-menu-overlay,

                display: none !important;
            }

        /* Responsive table improvements */
        @media (max-width: 768px) {
            .crc-calendar-grid {
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 2px;
            }
            
            .crc-calendar-day {
                min-height: 80px;
                padding: 24px 2px 2px 2px;
            }
            
            .crc-event-tag {
                font-size: 0.65rem;
                padding: 1px 4px;
            }
        }
        
        /* Responsive button groups */
        .button-group-mobile {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        @media (min-width: 769px) {
            .button-group-mobile {
                display: none;
            }
        }
        
    </style>
    <script>
        // Apply theme as early as possible to prevent Flash of Unstyled Content (FOUC)
        // No localStorage - use system preference only
        (function() {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>

                    const url = `${API_BASE_URL}${endpoint}`;
                    const config = {
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers
                        },
                        ...options
                    };

                    try {
                        const response = await fetch(url, config);
                        
                        if (!response.ok) {
                            // Try to get error details from response
                            let errorDetails = '';
                            let errorJson = null;
                            let errorText = '';
                            try {
                                errorText = await response.text();
                                if (errorText && errorText.trim()) {
                                    try {
                                        errorJson = JSON.parse(errorText);
                                        errorDetails = errorJson.detail || errorJson.error || errorJson.message || errorJson.summary?.errors?.[0]?.message || errorText;
                                    } catch (e) {
                                        // Not JSON, use as-is
                                        errorDetails = errorText;
                                    }
                                } else {
                                    // Empty response body - likely a timeout or crash
                                    errorDetails = response.status === 500 
                                        ? 'Server error: Function may have timed out or crashed. Check Azure Functions logs for details.'
                                        : `HTTP ${response.status}: ${response.statusText}`;
                                }
                            } catch (e) {
                                // Can't read response - likely a network error or timeout
                                errorDetails = `Unable to read error response: ${e.message || 'Unknown error'}`;
                            }
                            
                            // Don't log 404 errors for permission sets endpoints (they may not exist yet)
                            const isPermissionSets404 = response.status === 404 && 
                                (url.includes('/permission-sets') || url.includes('/permissionsets'));
                            
                            if (!isPermissionSets404) {
                                console.error(`API Error Response: ${response.status} ${response.statusText}`, {
                                    errorDetails,
                                    errorText,
                                    errorJson,
                                    url: url,
                                    method: config.method
                                });
                            }
                            
                            const error = new Error(`API request failed: ${response.status} ${response.statusText}${errorDetails ? ` - ${errorDetails}` : ''}`);
                            error.status = response.status;
                            error.statusText = response.statusText;
                            error.detail = errorDetails;
                            error.jsonBody = errorJson;
                            error.rawResponse = errorText;
                            throw error;
                        }
                        
                        // Handle different response types
                        if (response.status === 204) {
                            return null; // No content
                        }
                        
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            return await response.json();
                        }
                        
                        return await response.text();
                    } catch (error) {
                        console.error('API request error:', error);
                        throw error;
                    }

                                    if (key && dbMap.has(key)) {

                                        const newKey = cached.id || (Date.now().toString(36) + Math.random().toString(36).substr(2));
                                        dbMap.set(newKey, { ...cached, _cached: true, id: newKey });
                                    }
                                });
                                return Array.from(dbMap.values());
                            }

                // 2. Call Navan Bookings API: https://api.navan.com/v1/bookings?createdFrom={timestamp}&createdTo={timestamp}

                // Test Navan API connection
                async testNavanConnection() {
                    try {
                        console.log('Testing Navan API connection...');
                        const response = await fetch('/api/navan-test', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        // Read response as text first (can only read once)
                        let responseText = '';
                        try {
                            responseText = await response.text();
                        } catch (textError) {
                            console.error('Error reading response text:', textError);
                            responseText = `Error reading response: ${textError.message}`;
                        }
                        
                        // Check if response is ok
                        if (!response.ok) {
                            console.error('Navan connection test failed:', response.status, responseText);
                            // Try to parse as JSON to get error details
                            let errorDetail = responseText || response.statusText || 'Unknown error';
                            try {
                                if (responseText && responseText.trim()) {
                                    const errorJson = JSON.parse(responseText);
                                    errorDetail = errorJson.detail || errorJson.error || errorJson.message || errorDetail;
                                    if (errorJson.stack) {
                                        console.error('Backend error stack:', errorJson.stack);
                                    }
                                }
                            } catch (parseError) {
                                // Not JSON, use text as-is
                            }
                            return {
                                connected: false,
                                error: 'Connection test failed',
                                detail: `HTTP ${response.status}: ${errorDetail}`,
                                message: 'Failed to test Navan API connection'
                            };
                        }
                        
                        // Check if response is empty
                        if (!responseText || responseText.trim() === '') {
                            console.error('Navan connection test returned empty response');
                            return {
                                connected: false,
                                error: 'Empty response',
                                detail: 'Backend returned empty response',
                                message: 'Navan API connection test returned no data'
                            };
                        }
                        
                        // Check content type
                        const contentType = response.headers.get('content-type');
                        if (contentType && !contentType.includes('application/json')) {
                            console.error('Navan connection test returned non-JSON:', responseText);
                            return {
                                connected: false,
                                error: 'Invalid response format',
                                detail: `Expected JSON but got: ${contentType}. Response: ${responseText.substring(0, 200)}`,
                                message: 'Navan API returned invalid response format'
                            };
                        }
                        
                        // Try to parse JSON
                        let result;
                        try {
                            result = JSON.parse(responseText);
                        } catch (parseError) {
                            console.error('Failed to parse JSON response:', parseError);
                            console.error('Response text:', responseText);
                            return {
                                connected: false,
                                error: 'JSON parse error',
                                detail: `Failed to parse JSON: ${parseError.message}. Response: ${responseText.substring(0, 200)}`,
                                message: 'Navan API returned invalid JSON'
                            };
                        }
                        
                        console.log('Navan connection test result:', result);
                        return result;
                    } catch (error) {
                        console.error('Error testing Navan connection:', error);
                        return {
                            connected: false,
                            error: 'Connection test failed',
                            detail: error.message || 'Unknown error occurred',
                            stack: error.stack || 'No stack trace available',
                            message: 'Failed to test Navan API connection'
                        };
                    }
                }

                async lookupNavanBooking(bookingId, readOnly = false) {
                    try {
                        // Call backend proxy endpoint (avoids CORS issues and keeps credentials secure)
                        // Backend will handle OAuth token generation and API calls
                        const readOnlyParam = readOnly ? '&readOnly=true' : '';
                        const response = await fetch(`/api/navan-lookup?bookingId=${encodeURIComponent(bookingId)}${readOnlyParam}`, {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const navanData = await response.json();
                            
                            // Check if we have data
                            if (!navanData.data || navanData.data.length === 0) {
                                return {
                                    error: 'No booking found with this ID',
                                    bookingId: bookingId
                                };
                            }
                            
                            const booking = navanData.data[0];
                            const bookingType = booking.bookingType || 'FLIGHT';
                            
                            // Map Navan data based on booking type
                            const mappedData = {
                                bookingId: booking.bookingId || booking.uuid || bookingId,
                                bookingType: bookingType,
                                confirmationNumber: booking.confirmationNumber || booking.bookingId || null,
                                startDate: booking.startDate || null,
                                endDate: booking.endDate || null,
                                vendor: booking.vendor || null,
                                status: this.mapNavanStatus(booking.bookingStatus || booking.approvalStatus),
                                grandTotal: booking.grandTotal || booking.usdGrandTotal || null,
                                currency: booking.currency || 'USD'
                            };
                            
                            // Map booking type specific data
                            if (bookingType === 'FLIGHT') {
                                mappedData.flight = {
                                    flightNumber: booking.segments && booking.segments.length > 0 
                                        ? `${booking.segments[0].providerCode || ''}${booking.segments[0].flightNumber || ''}` 
                                        : null,
                                    airline: booking.vendor || (booking.segments && booking.segments[0]?.providerName) || null,
                                    origin: booking.origin?.airportCode || (booking.segments && booking.segments[0]?.departure?.airportCode) || null,
                                    destination: booking.destination?.airportCode || (booking.segments && booking.segments[0]?.arrival?.airportCode) || null,
                                    departureTime: booking.segments && booking.segments[0]?.startLocalDateTime 
                                        ? new Date(booking.segments[0].startLocalDateTime).toISOString()
                                        : null,
                                    arrivalTime: booking.segments && booking.segments[0]?.endLocalDateTime 
                                        ? new Date(booking.segments[0].endLocalDateTime).toISOString()
                                        : null,
                                    cabin: booking.cabin || booking.cabinPurchased || null,
                                    route: booking.airlineRoute || null,
                                    routeType: booking.routeType || booking.flight || null
                                };
                            } else if (bookingType === 'HOTEL') {
                                mappedData.hotel = {
                                    hotelName: booking.vendor || null,
                                    hotelCode: booking.hotelCode || null,
                                    hotelChain: booking.hotelChain || null,
                                    checkIn: booking.startDate || null,
                                    checkOut: booking.endDate || null,
                                    address: booking.destination?.address || null,
                                    city: booking.destination?.city || null,
                                    state: booking.destination?.state || null,
                                    country: booking.destination?.country || null,
                                    latitude: booking.hotelLatitude || null,
                                    longitude: booking.hotelLongitude || null
                                };
                            } else if (bookingType === 'CAR' || bookingType === 'RENTAL_CAR') {
                                mappedData.car = {
                                    vendor: booking.vendor || null,
                                    carType: booking.carType || null,
                                    pickupDate: booking.startDate || null,
                                    returnDate: booking.endDate || null,
                                    pickupLocation: booking.origin?.address || booking.origin?.city || null,
                                    returnLocation: booking.destination?.address || booking.destination?.city || null
                                };
                            }
                            
                            // Add passenger/traveler information
                            if (booking.passengers && booking.passengers.length > 0) {
                                mappedData.traveler = {
                                    name: booking.passengers[0].person?.name || null,
                                    email: booking.passengers[0].person?.email || null,
                                    employeeId: booking.passengers[0].person?.employeedId || null
                                };
                            }
                            
                            // Add trip information
                            if (booking.tripName) {
                                mappedData.tripName = booking.tripName;
                            }
                            if (booking.purpose) {
                                mappedData.purpose = booking.purpose;
                            }
                            if (booking.reason) {
                                mappedData.reason = booking.reason;
                            }
                            
                            return mappedData;
                        }
                        
                        // Handle specific error statuses
                        let errorMessage = 'Navan booking lookup unavailable';
                        let errorDetail = null;
                        let errorStack = null;
                        console.error(`Navan API returned ${response.status} error for booking ${bookingId}`);
                        
                        // Try to get error details from response
                        try {
                            const errorText = await response.text();
                            if (errorText) {
                                try {
                                    const errorData = JSON.parse(errorText);
                                    console.error('Full error from /api/navan-lookup:', errorData);
                                    
                                    // Extract detailed error information
                                    if (errorData && errorData.detail) {
                                        errorDetail = errorData.detail;
                                        errorMessage = `Backend Error: ${errorData.detail}`;
                                    } else if (errorData && errorData.error) {
                                        errorMessage = errorData.error;
                                    }
                                    
                                    // Get stack trace if available
                                    if (errorData && errorData.stack) {
                                        errorStack = errorData.stack;
                                        console.error('Error stack trace:', errorStack);
                                    }
                                    
                                    // Log all error details
                                    console.error('Error details:', {
                                        message: errorMessage,
                                        detail: errorDetail,
                                        stack: errorStack,
                                        fullError: errorData
                                    });
                                } catch (e) {
                                    // If not JSON, log as text
                                    console.error('Navan lookup error response (not JSON):', errorText);
                                    errorMessage = "Backend error (not JSON): " + errorText;
                                }
                            }
                        } catch (e) {
                            console.error('Error reading error response:', e);
                        }
                        
                        // If API call fails, return error
                        return {
                            error: errorMessage,
                            bookingId: bookingId
                        };
                        
                    } catch (error) {
                        console.error('Error looking up Navan booking:', error);
                        console.error('Error details:', {
                            message: error.message,
                            stack: error.stack,
                            bookingId: bookingId

                            bookingId: bookingId
                        };
                    }

                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            };

                if (!previousState || !Array.isArray(previousState)) {
                    showNotification('Cannot undo: Invalid history state.', 'error');
                    return;
                }
                
                // Get current state to determine what changed
                const currentEvents = state.crc_events;
                const previousEvents = previousState;
                
                // Find events that were added (in current but not in previous)
                const addedEvents = currentEvents.filter(curr => 
                    !previousEvents.some(prev => prev.id === curr.id)
                );
                
                // Find events that were removed (in previous but not in current)
                const removedEvents = previousEvents.filter(prev => 
                    !currentEvents.some(curr => curr.id === prev.id)
                );
                
                // Find events that were modified (exist in both but different)
                const modifiedEvents = currentEvents.filter(curr => {
                    const prev = previousEvents.find(p => p.id === curr.id);
                    return prev && JSON.stringify(prev) !== JSON.stringify(curr);
                });
                
                try {
                    // Delete events that were added

                            await apiService.deleteEvent(event.id);
                        } catch (e) {
                            console.warn('Failed to delete event during undo:', e);
                        }

                    // Restore events that were removed

                            await apiService.createEvent(event);
                        } catch (e) {
                            console.warn('Failed to restore event during undo:', e);
                        }
                    }
                    
                    // Restore modified events to previous state
                    for (const currentEvent of modifiedEvents) {
                        const prevEvent = previousEvents.find(p => p.id === currentEvent.id);

                                } else if (point.position && point.position.longitude !== undefined && point.position.latitude !== undefined) {

            const getDaySaturdayStart = (date) => {
                // Return JavaScript day-of-week (Sunday=0, Monday=1, ..., Saturday=6)
                // Calendar week now starts on Sunday
                return date.getDay(); // Sunday=0, Monday=1, Tuesday=2, ..., Saturday=6
            };
            
            const toDateOnlyString = (dateObj) => {
                if (!(dateObj instanceof Date) || Number.isNaN(dateObj.getTime())) {
                    return '';
                }
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const parseDateOnly = (dateStr) => {
                if (!dateStr || typeof dateStr !== 'string') return null;
                const trimmed = dateStr.trim();
                if (!trimmed) return null;
                const parsed = new Date(`${trimmed}T00:00:00`);
                return Number.isNaN(parsed.getTime()) ? null : parsed;
            };

            const parseDateFlexible = (value) => {
                if (!value) return null;
                if (value instanceof Date) {
                    return new Date(value.getTime());
                }
                if (typeof value === 'string') {
                    const trimmed = value.trim();
                    if (!trimmed) return null;
                    // Handle YYYY-MM-DD format - create local midnight
                    if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) {
                        return new Date(`${trimmed}T00:00:00`);
                    }
                    // Handle ISO dates with Z (UTC) - convert to local date
                    // This prevents timezone shift issues where 2026-01-01T00:00:00Z becomes 2025-12-31 in EST
                    if (/^\d{4}-\d{2}-\d{2}T.*Z$/.test(trimmed) || trimmed.includes('+00:00')) {
                        // Extract just the date part and create local midnight
                        const datePart = trimmed.split('T')[0];
                        return new Date(`${datePart}T00:00:00`);
                    }
                    return new Date(trimmed);
                }
                const result = new Date(value);
                return Number.isNaN(result.getTime()) ? null : result;
            };

            const formatDisplayDate = (value, options) => {
                const dateObj = parseDateFlexible(value);
                if (!dateObj) return 'Unknown date';
                try {
                    return dateObj.toLocaleDateString('en-US', options);
                } catch {
                    return 'Unknown date';
                }
            };

            const formatDateInputValue = (value) => {
                if (!value) return '';
                const dateObj = parseDateFlexible(value);
                if (!dateObj || Number.isNaN(dateObj.getTime())) return value || '';
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                const year = dateObj.getFullYear();
                return `${month}/${day}/${year}`;

            const normalizeDateInput = (value) => {

                const matchesAllowedFormat = /^\d{2}\/\d{2}\/\d{4}$/.test(trimmed) || /^\d{4}-\d{2}-\d{2}$/.test(trimmed);
                if (!matchesAllowedFormat) return null;
                const dateObj = parseDateFlexible(trimmed);
                if (!dateObj || Number.isNaN(dateObj.getTime())) return null;
                return toDateOnlyString(dateObj);

                    const digitsOnly = raw.replace(/\D/g, '').slice(0, 8);

                    if (digitsOnly.length >= 5) {

                    } else if (digitsOnly.length >= 3) {

                    event.target.value = formatted;

            const normalizeTimeOffStatus = (status) => {

            };

            const formatTimeOffStatus = (status) => {
                const normalized = normalizeTimeOffStatus(status);
                if (normalized === 'pending') return 'Pending Review';

            };

            const normalizeTimeOffTypeLabel = (value) => {

                // Legacy / generic labels we never want to show as the "type"

                return raw;

            const hasPendingTimeOffOnDate = (crcId, dateStr) => {
                if (!crcId || !dateStr) return false;
                const standardizedDate = toDateOnlyString(parseDateFlexible(dateStr));
                if (!standardizedDate) return false;
                return (state.timeOffRequests || []).some(req => {
                    if (req.crcId !== crcId) return false;
                    const statusKey = normalizeTimeOffStatus(req.status);
                    if (statusKey !== 'pending') return false;
                    const start = toDateOnlyString(parseDateFlexible(req.startDate || req.date));
                    const end = toDateOnlyString(parseDateFlexible(req.endDate || req.date));
                    if (!start || !end) return false;
                    return standardizedDate >= start && standardizedDate <= end;
                });
            };

            const timeOffRangeOptions = [

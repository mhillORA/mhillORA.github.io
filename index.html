<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ora Data Lens</title>
  <meta name="description" content="Read-only questions over Ora clinical and finance data. The ophthalmology research company." />
  <meta name="theme-color" content="#052c49" />
  <meta name="apple-mobile-web-app-title" content="Data Lens" />
  <meta property="og:title" content="Ora Data Lens" />
  <meta property="og:description" content="Ask Ora clinical and finance data. Read-only." />
  <meta property="og:image" content="/img/logo-poster.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/img/logo-poster.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar" id="sidebarNav" aria-label="Navigation">
      <div class="brand">
        <a class="brand-mark" href="/" id="brandHome">
          <img class="brand-lockup" src="img/logo-lockup.png" width="200" height="82" alt="Ora Data Lens" />
          <img class="brand-icon" src="img/logo-mark.png" width="40" height="40" alt="Ora Data Lens" />
        </a>
        <div class="brand-tag">The ophthalmology research company</div>
      </div>
      <nav class="nav" id="nav" aria-label="Data Lens">
        <div class="nav-label">Data Lens</div>
      </nav>
      <details class="sources" id="sourcesPanel" aria-label="Data sources">
        <summary class="sources-head">
          <div class="eyebrow">Data sources</div>
          <div class="sources-summary" id="enabledSummary"></div>
        </summary>
        <div class="source-list" id="sourceList"></div>
      </details>
      <div class="sidebar-foot">
        <div class="user-row" id="authUser" hidden>
          <div class="avatar" id="authAvatar"></div>
          <div>
            <div class="user-name" id="authName"></div>
            <div class="user-role" id="authEmail"></div>
          </div>
        </div>
        <a class="sign-out" id="btnSignOut" hidden href="/.auth/logout">Sign out</a>
        <div class="scope-note">Read-only · Cosmos bd-budgets</div>
      </div>
    </aside>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden aria-hidden="true"></div>

    <main class="main">
      <header class="mobile-header" id="mobileHeader">
        <button type="button" class="mobile-icon-btn" id="btnMobileNav" aria-label="Open menu" aria-expanded="false" aria-controls="sidebarNav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="mobile-brand" href="/" id="mobileBrandHome">
          <img src="img/logo-lockup.png" width="168" height="68" alt="Ora Data Lens" />
        </a>
        <button type="button" class="mobile-icon-btn" id="btnMobileSources" aria-label="Data sources" aria-expanded="false" aria-controls="sourcesPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
        </button>
      </header>
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">Ask your data</h1>
          <span class="scope-line" id="scopeLine"></span>
        </div>
        <div class="purpose" id="purpose" role="tablist" aria-label="Purpose"></div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-ghost" id="btnNew">New question</button>
          <button type="button" class="btn btn-secondary" id="btnSave">Save this view</button>
        </div>
      </header>

      <div class="scroll">
        <div class="stack" id="viewAsk">
          <div class="ask-box">
            <textarea id="draft" rows="3" placeholder="Ask from the loaded Cosmos sources — or pick a purpose above."></textarea>
            <div class="ask-bar">
              <div class="ask-meta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
                <span id="enabledCount"></span>
              </div>
              <button type="button" class="btn btn-accent" id="btnAsk">Ask</button>
            </div>
          </div>

          <div id="idlePanel"></div>
          <div id="thinkingPanel" class="hidden"></div>
          <div id="answerPanel" class="hidden"></div>
        </div>

        <div class="stack hidden" id="viewRm"></div>
        <div class="stack hidden" id="viewSaved"></div>
        <div class="stack hidden" id="viewHistory"></div>
        <div class="stack hidden" id="viewSourcesHelp"></div>
        <div class="stack hidden" id="viewContext"></div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      function initials(name) {
        const parts = String(name || "").replace(/@.*$/, "").split(/[\s._-]+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      fetch("/.auth/me")
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (payload) {
          if (!payload) return;
          const principal = Array.isArray(payload) ? payload[0] : payload.clientPrincipal;
          if (!principal) return;
          const claims = {};
          (principal.claims || []).forEach(function (c) {
            if (!c || c.typ == null) return;
            claims[c.typ] = c.val;
            const short = String(c.typ).split("/").pop();
            if (short && claims[short] == null) claims[short] = c.val;
          });
          const email = principal.userDetails || claims.preferred_username || claims.email || "";
          const displayName = claims.name || email || principal.userId || "Signed in";
          const row = document.getElementById("authUser");
          const nameEl = document.getElementById("authName");
          const emailEl = document.getElementById("authEmail");
          const avatarEl = document.getElementById("authAvatar");
          if (!row || !nameEl) return;
          nameEl.textContent = displayName;
          if (emailEl) emailEl.textContent = email && email !== displayName ? email : "Ora";
          if (avatarEl) avatarEl.textContent = initials(displayName);
          row.hidden = false;
          const out = document.getElementById("btnSignOut");
          if (out) out.hidden = false;
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>

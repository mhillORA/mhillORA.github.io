<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.A.S.A. - Not Another Scheduling Application</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .calendar-day {
            min-height: 120px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0.5rem;
            position: relative;
        }
        .calendar-day:hover {
            background-color: #f9fafb;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dark .calendar-day:hover {
            background-color: #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        
        .appointment-slot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0.375rem;
            position: relative;
            overflow: hidden;
        }
        .appointment-slot:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .appointment-slot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        }
        .modal-content::-webkit-scrollbar, .side-panel-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-track, .side-panel-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .dark .modal-content::-webkit-scrollbar-track, .dark .side-panel-content::-webkit-scrollbar-track {
            background: #4b5563;
        }
        .modal-content::-webkit-scrollbar-thumb, .side-panel-content::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .modal-content::-webkit-scrollbar-thumb:hover, .side-panel-content::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        #sidebar.sidebar-collapsed { width: 4.5rem; padding-left: .65rem; padding-right: .65rem; }
        #sidebar.sidebar-collapsed .sidebar-label,
        #sidebar.sidebar-collapsed .nav-item span,
        #sidebar.sidebar-collapsed .studies-list,
        #sidebar.sidebar-collapsed #session-controls,
        #sidebar.sidebar-collapsed > div:last-child p { display: none; }
        #sidebar.sidebar-collapsed .nav-item button,
        #sidebar.sidebar-collapsed .nav-item { justify-content: center; }
        #sidebar.sidebar-collapsed [data-action="toggle-sidebar-collapse"] { margin-left: 0; }
        body.patient-panel-open #sidebar { z-index: 40; }
        #side-panel-container { z-index: 70; }
        #modal-container { z-index: 80; }
        #sidebar { z-index: 60; }
        .logo-bg { fill: #3B82F6; }
        .logo-swoosh { stroke: #EF4444; }
        .logo-inner-circle { fill: #1F2937; }
        .logo-dot { fill: white; }
        .dark .logo-bg { fill: #1E40AF; }
        .dark .logo-swoosh { stroke: #F87171; }
        .dark .logo-inner-circle { fill: #D1D5DB; }
        .dark .logo-dot { fill: #1F2937; }
        #notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
        }
        .notification {
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            color: white;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-left: 4px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .notification::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }
        .notification.bg-success { 
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        }
        .notification.bg-error { 
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        }
        .notification.bg-info { 
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
        }
        .notification.bg-warning { 
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }
        /* On-screen PHI/PII privacy mask (shoulder-surfing / demos); not a substitute for access control */
        .privacy-mask-on .phi-sensitive {
            filter: blur(8px);
            user-select: none;
            -webkit-user-select: none;
            transition: filter 0.2s ease;
        }
        .privacy-mask-on .phi-sensitive-input {
            filter: blur(6px);
            user-select: none;
        }
        #econsent-root { display: none; }
        body.econsent-mode #app-shell { display: none !important; }
        body.econsent-mode #econsent-root { display: block; }
        .econsent-sig-pad {
            touch-action: none;
            cursor: crosshair;
            background: #fff;
            border: 2px solid #cbd5e1;
            border-radius: 0.5rem;
            width: 100%;
            max-width: 640px;
            height: 180px;
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script>
        (function () {
            try {
                if (localStorage.getItem('nasa_privacy_mask_phi_pii_v1') === '1') {
                    document.documentElement.classList.add('privacy-mask-on');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900">

<div class="flex flex-col md:flex-row">
    <header class="md:hidden bg-white dark:bg-gray-800 p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
        <div class="flex items-center">
            <div id="mobile-logo-container" class="h-8 w-8 cursor-pointer hover:opacity-80 transition-opacity" title="Toggle dark mode"></div>

                        <i data-lucide="log-out" class="w-4 h-4"></i>

            <div class="flex justify-between items-center gap-1 flex-wrap">
            <p class="text-xs text-gray-500 dark:text-gray-400 px-2">Not Another Scheduling App</p>
            <div class="flex items-center shrink-0">
                <button type="button" id="privacy-mask-toggle" class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300" title="Mask PHI/PII on screen" aria-pressed="false">
                    <i id="privacy-mask-icon" data-lucide="eye" class="w-5 h-5"></i>
                </button>
                <button type="button" id="dark-mode-toggle" class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">

</div><!-- #app-shell -->
<div id="overlay" class="fixed inset-0 bg-black bg-opacity-60 z-40 opacity-0 transition-opacity duration-300 pointer-events-none"></div>
<div id="side-panel-container" class="fixed top-0 right-0 h-full w-full max-w-2xl bg-white dark:bg-gray-800 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
</div>
<div id="modal-container" class="fixed inset-0 z-50 hidden bg-black bg-opacity-60 flex justify-center items-center p-4"></div>
<script type="module">
const API_BASE_URL = '/api'; // Use relative path like other files
const API_KEY = ''; // Optional. Prefer platform auth; leave empty for local/dev.
const SCHEDULING_TEST_MODE = true; // QA: skip eligibility/enrollment gates so visits can be booked
const NASA_SESSION_KEY = 'nasa_session';

const toLocalDateKey = (value) => {
    const d = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
};

/** Normalize YYYY-MM-DD from report form or prior generate. */
const normalizeReportDateInput = (value) => {
    const s = String(value || '').trim().slice(0, 10);
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : null;
};

/** Prefer live Reporting form dates so Export respects fields even before/without re-Generate. */
const getReportDateRange = () => {
    const form = document.getElementById('report-filter-form');
    const startDate = normalizeReportDateInput(form?.querySelector('[name="startDate"]')?.value)
        || normalizeReportDateInput(state.lastReportDateStart);
    const endDate = normalizeReportDateInput(form?.querySelector('[name="endDate"]')?.value)
        || normalizeReportDateInput(state.lastReportDateEnd);
    return { startDate, endDate };
};

/** Local calendar-day compare — avoids UTC off-by-one making date filters look inert. */
const isTimestampInReportDateRange = (raw, startDate, endDate) => {
    if (!startDate && !endDate) return true;
    const key = toLocalDateKey(raw);
    if (!key) return false;
    if (startDate && key < startDate) return false;
    if (endDate && key > endDate) return false;
    return true;
};

const patientHasActivityInReportDateRange = (patient, startDate, endDate) => {
    if (!startDate && !endDate) return true;
    if ((patient.surveyResults || []).some(sr => isTimestampInReportDateRange(sr.completedAt, startDate, endDate))) return true;
    if (patient.appointment && isTimestampInReportDateRange(patient.appointment.time, startDate, endDate)) return true;
    const appts = typeof getPatientAppointments === 'function' ? getPatientAppointments(patient) : (patient.appointments || []);
    if ((appts || []).some(a => a && isTimestampInReportDateRange(a.time, startDate, endDate))) return true;
    if ((patient.enrollments || []).some(e => isTimestampInReportDateRange(e.enrolledDate || e.assignedAt, startDate, endDate))) return true;
    if (isTimestampInReportDateRange(patient.createdAt || patient.lastUpdated, startDate, endDate)) return true;
    return false;
};

const getReportSourceOptions = () => {
    const defaults = ['Facebook', 'Instagram', 'Reddit', 'Site', 'Marketing', 'Email', 'subject-import'];
    const fromData = (state.patients || []).map(p => String(p.source || '').trim()).filter(Boolean);
    return [...new Set([...defaults, ...fromData])].sort((a, b) => a.localeCompare(b));
};

/** Patients available to Reporting — same universe as Studies roster (merged excluded). */
const getReportPatientUniverse = () =>
    (state.patients || []).filter(p => p && p.status !== 'Merged' && !p.mergedIntoId);

/** Shared Reporting filters — used by Generate Report (and tests). */
const applyReportFilters = (raw = {}, options = {}) => {
    const studyId = raw.studyId && raw.studyId !== 'all' ? String(raw.studyId) : null;
    const siteId = raw.siteId && raw.siteId !== 'all' ? String(raw.siteId) : null;
    const status = raw.status && raw.status !== 'all' ? String(raw.status) : null;
    const source = raw.source && raw.source !== 'all' ? String(raw.source) : null;
    const schedulingStatus = raw.schedulingStatus && raw.schedulingStatus !== 'all' ? String(raw.schedulingStatus) : null;
    const surveyOutcome = raw.surveyOutcome && raw.surveyOutcome !== 'all' ? String(raw.surveyOutcome) : null;
    const minAge = raw.minAge !== undefined && raw.minAge !== null && String(raw.minAge).trim() !== ''
        ? parseInt(raw.minAge, 10) : null;
    const maxAge = raw.maxAge !== undefined && raw.maxAge !== null && String(raw.maxAge).trim() !== ''
        ? parseInt(raw.maxAge, 10) : null;
    const surveyCompleted = options.surveyCompleted === true
        || raw.surveyCompleted === true
        || raw.surveyCompleted === 'on'
        || raw.surveyCompleted === 'true';
    const startDate = normalizeReportDateInput(raw.startDate);
    const endDate = normalizeReportDateInput(raw.endDate);

    // Match Studies tab counts: do not ACL-hide enrolled patients from reports.
    let list = getReportPatientUniverse();
    if (studyId) list = list.filter(p => patientBelongsToStudy(p, studyId));
    if (siteId) list = list.filter(p => patientBelongsToSite(p, siteId));
    if (status) list = list.filter(p => p.status === status);
    if (source) list = list.filter(p => p.source === source);
    if (Number.isFinite(minAge)) list = list.filter(p => p.age != null && p.age >= minAge);
    if (Number.isFinite(maxAge)) list = list.filter(p => p.age != null && p.age <= maxAge);
    if (schedulingStatus === 'scheduled') list = list.filter(p => !!p.appointment);
    if (schedulingStatus === 'not-scheduled') list = list.filter(p => !p.appointment);
    if (surveyCompleted) list = list.filter(p => p.surveyResults && p.surveyResults.length > 0);
    if (surveyOutcome) list = list.filter(p => p.surveyResults?.some(sr => sr.outcome === surveyOutcome));
    if (startDate || endDate) list = list.filter(p => patientHasActivityInReportDateRange(p, startDate, endDate));

    return { patients: list, startDate, endDate, studyId, siteId };
};

const REPORT_TABLE_DISPLAY_LIMIT = 500;

const clearReportFilters = () => {
    const form = document.getElementById('report-filter-form');
    if (form) {
        form.reset();
        form.querySelectorAll('select').forEach((el) => { el.value = 'all'; });
        form.querySelectorAll('input[type="number"], input[type="date"]').forEach((el) => { el.value = ''; });
        const surveyCompleted = form.querySelector('[name="surveyCompleted"]');
        if (surveyCompleted) surveyCompleted.checked = false;
    }
    state.lastReportData = null;
    state.lastReportDateStart = null;
    state.lastReportDateEnd = null;
    state.lastReportMeta = null;
    const resultsBody = document.getElementById('report-results-body');
    if (resultsBody) {
        resultsBody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 dark:text-gray-400 py-8">Generate a report to see results.</td></tr>`;
    }
    const metricsContainer = document.getElementById('report-metrics');
    if (metricsContainer) metricsContainer.innerHTML = '';
    ['export-csv-btn', 'export-surveys-btn', 'export-five9-btn'].forEach((id) => {
        const btn = document.getElementById(id);
        if (btn) btn.disabled = true;
    });
    showNotification('Report filters cleared.', 'info');
};

const renderReportResults = (filteredPatients, meta = {}) => {
    const exportBtn = document.getElementById('export-csv-btn');
    const exportSurveysBtn = document.getElementById('export-surveys-btn');
    const exportFive9Btn = document.getElementById('export-five9-btn');
    const resultsBody = document.getElementById('report-results-body');
    const metricsContainer = document.getElementById('report-metrics');
    if (!resultsBody) return;

    const total = (filteredPatients || []).length;
    const displayRows = (filteredPatients || []).slice(0, REPORT_TABLE_DISPLAY_LIMIT);

    try {
        if (total > 0) {
            resultsBody.innerHTML = displayRows.map(p => {
                const currentEnrollment = p.enrollments?.find(e => e.status === 'current');
                const lastSurvey = p.surveyResults && p.surveyResults.length > 0 ? p.surveyResults[p.surveyResults.length - 1] : null;
                const outcome = lastSurvey ? lastSurvey.outcome : 'N/A';
                const outcomeColor = outcome === 'Pass' ? 'text-green-500' : outcome === 'Fail' ? 'text-red-500' : '';
                return `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">${phiName(p)}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${phi(p.age != null ? String(p.age) : 'N/A')}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${p.status || 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${currentEnrollment ? state.studies.find(s => s.id === currentEnrollment.studyId)?.title || 'N/A' : 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${currentEnrollment ? state.sites.find(s => s.id === currentEnrollment.siteId)?.name || 'N/A' : 'N/A'}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${p.appointment ? phi(new Date(p.appointment.time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })) : 'Not Scheduled'}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-semibold ${outcomeColor}">${outcome}</td>
                    </tr>
                `;
            }).join('') + (total > REPORT_TABLE_DISPLAY_LIMIT
                ? `<tr><td colspan="7" class="text-center text-amber-700 dark:text-amber-300 py-3 text-sm">Showing first ${REPORT_TABLE_DISPLAY_LIMIT} of ${total}. Use Export for the full set.</td></tr>`
                : '');
            if (exportBtn) exportBtn.disabled = false;
            if (exportSurveysBtn) exportSurveysBtn.disabled = false;
            if (exportFive9Btn) exportFive9Btn.disabled = false;
        } else {
            resultsBody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 dark:text-gray-400 py-8">No patients match the selected criteria.</td></tr>`;
            if (exportBtn) exportBtn.disabled = true;
            if (exportSurveysBtn) exportSurveysBtn.disabled = true;
            if (exportFive9Btn) exportFive9Btn.disabled = true;
        }
    } catch (err) {
        console.error('renderReportResults failed', err);
        resultsBody.innerHTML = `<tr><td colspan="7" class="text-center text-red-600 py-8">Could not render ${total} rows. Use Export Report for the full set.</td></tr>`;
        if (exportBtn) exportBtn.disabled = total === 0;
        if (exportSurveysBtn) exportSurveysBtn.disabled = total === 0;
        if (exportFive9Btn) exportFive9Btn.disabled = total === 0;
    }

    if (metricsContainer) {
        const withAge = (filteredPatients || []).filter(p => p.age != null && !Number.isNaN(Number(p.age)));
        const avgAge = withAge.length
            ? (withAge.reduce((sum, p) => sum + Number(p.age), 0) / withAge.length).toFixed(1)
            : 'N/A';
        const scheduled = (filteredPatients || []).filter(p => p.appointment).length;
        const studyId = meta.studyId || null;
        const studyRosterCount = studyId
            ? getReportPatientUniverse().filter(p => patientBelongsToStudy(p, studyId)).length
            : getReportPatientUniverse().length;
        const dateNote = (meta.startDate || meta.endDate)
            ? `<p class="text-xs text-amber-600 dark:text-amber-400 mt-1">Date filter ${meta.startDate || '…'} → ${meta.endDate || '…'}</p>`
            : '';
        const rosterLabel = studyId ? 'on study roster' : 'in patient file';
        metricsContainer.innerHTML = `
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md text-center"><p class="text-sm text-gray-500 dark:text-gray-400">Total Patients</p><p class="text-2xl font-bold dark:text-white">${total}</p><p class="text-xs text-gray-500 mt-1">${studyRosterCount} ${rosterLabel}</p>${dateNote}</div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md text-center"><p class="text-sm text-gray-500 dark:text-gray-400">Average Age</p><p class="text-2xl font-bold dark:text-white">${avgAge}</p></div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md text-center"><p class="text-sm text-gray-500 dark:text-gray-400">Scheduled</p><p class="text-2xl font-bold dark:text-white">${scheduled}</p></div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md text-center"><p class="text-sm text-gray-500 dark:text-gray-400">Not Scheduled</p><p class="text-2xl font-bold dark:text-white">${total - scheduled}</p></div>
        `;
    }
    if (typeof lucide !== 'undefined') lucide.createIcons();
};

let msalInstance = null;
let nasaEntraEnabled = false;
let nasaInternalEmailDomains = ['oraclinical.com'];
const msalConfig = {
    auth: {
        clientId: '',
        authority: 'https://login.microsoftonline.com/common',
        redirectUri: typeof window !== 'undefined' ? window.location.origin : '',
    },
    cache: {
        cacheLocation: 'sessionStorage',
        storeAuthStateInCookie: false,
    },
};

const initializeMSAL = () => {
    if (typeof msal === 'undefined' || !msalConfig.auth.clientId) return;
    try {
        msalInstance = new msal.PublicClientApplication(msalConfig);
        msalInstance.initialize().catch((error) => {
            console.warn('MSAL initialization failed:', error);
            msalInstance = null;
        });
    } catch (error) {
        console.warn('MSAL initialization error:', error);

        if (!raw) return false;
        const parsed = JSON.parse(raw);
        const maxAgeMs = 7 * 24 * 60 * 60 * 1000;
        if (!parsed?.user || Date.now() - (parsed.timestamp || 0) > maxAgeMs) {
            clearStoredSession();

        }

        return true;
    } catch {

        return false;
    }
};

const apiCall = async (endpoint, method = 'GET', data = null) => {
    try {
        const options = {
            method,
            headers: {
                'Content-Type': 'application/json'
            }
        };

        if (API_KEY) {
            options.headers['x-functions-key'] = API_KEY;
        }

        if (state.currentUser?.id) {
            options.headers['X-NASA-User-Id'] = state.currentUser.id;
        }
        
        if (data) {
            options.body = JSON.stringify(data);
        }
        
        const response = await fetch(`${API_BASE_URL}/${endpoint}`, options);
        
        if (!response.ok) {
            let details = '';
            let parsed = null;
            try {
                const text = await response.text();
                details = text || '';
                try {
                    parsed = JSON.parse(text);
                    if (parsed && parsed.error) details = parsed.error;
                    else if (parsed && parsed.message) details = parsed.message;
                } catch { /* keep raw text */ }
            } catch {}
            const err = new Error(`API call failed: ${response.status} ${response.statusText}${details ? ' - ' + details : ''}`);
            err.status = response.status;
            err.body = parsed;
            throw err;
        }
        
        return await response.json();
    } catch (error) {
        console.error(`API Error (${endpoint}):`, error);
        throw error;
    }
};

const normalizeScheduleDocument = (s, index) => {
    const rawSlots = Array.isArray(s.slots) ? s.slots : [];
    const sid = s.id != null ? String(s.id) : `row-${index}`;
    const slots = rawSlots.map((slot, idx) => ({
        ...slot,
        id: slot && slot.id != null ? String(slot.id) : `slot-${sid}-${idx}`,
        startTime: slot && slot.startTime ? slot.startTime : new Date().toISOString(),
        capacity: typeof slot?.capacity === 'number' && slot.capacity > 0 ? slot.capacity : 1,
        booked: typeof slot?.booked === 'number' && slot.booked >= 0 ? slot.booked : 0,
    }));
    return {
        ...s,
        studyId: s.studyId != null ? String(s.studyId) : '',
        siteId: s.siteId != null ? String(s.siteId) : '',
        visit: s.visit || '',
        slots,
    };
};

const normalizeReferenceData = (rawData) => {
    const defaults = getDefaultReferenceData();
    const data = rawData && typeof rawData === 'object' ? rawData : {};
    const normList = (list, fallback) => {
        if (!Array.isArray(list) || !list.length) return fallback;
        return list.map((item, i) => {
            if (typeof item === 'string') return { id: 'item_' + (i + 1), name: item, active: true };
            return {
                id: item.id || ('item_' + (i + 1)),
                name: String(item.name || '').trim(),
                active: item.active !== false,
            };
        }).filter(x => x.name);
    };
    return {
        id: 'nasa-reference-data',
        medications: normList(data.medications, defaults.medications),
        tags: normList(data.tags, defaults.tags),
        nqReasons: normList(data.nqReasons, defaults.nqReasons),
        niReasons: normList(data.niReasons, defaults.niReasons),
        updatedAt: data.updatedAt || new Date().toISOString(),
    };
};

    if (!iso) return '—';

    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {

        return m + '/' + day + '/' + y;

    return new Date(iso).toLocaleDateString();

const isActualStudy = (study) => {
    if (!study || study.archived || String(study.status || '').toLowerCase() === 'archived') return false;
    if (study.isTraining === true || study.isDepartment === true) return false;
    const source = String(study.sourceSystem || study.integrationSource || study.source || '').trim().toLowerCase();
    if (source && !['artemis', 'manual', 'nasa'].includes(source)) return false;
    const text = `${study.title || ''} ${study.name || ''} ${study.type || ''} ${study.category || ''} ${study.recordType || ''}`.toLowerCase();
    if (/\b(training|department|orientation|onboarding|education|course)\b/.test(text)) return false;
    if (source) return true;
    // Legacy Artemis rows predate sourceSystem; a protocol/integration identifier distinguishes studies from training records.
    return !!(study.protocolNumber || study.protocol || study.artemisId || study.ctmsId || study.externalId);
};

const formatPhoneFive9 = (phone) => {
    // Strip to digits only; US numbers -> 1 + 10 digits (e.g. 17153074271)
    let digits = String(phone || '').replace(/\D/g, '');
    if (!digits) return '';
    // Drop a leading +1 / 1 country code duplicates if someone pasted 11+ digits oddly
    if (digits.length > 11 && digits.startsWith('1')) digits = digits.slice(-11);
    if (digits.length > 11) digits = digits.slice(-10);
    if (digits.length === 11 && digits.startsWith('1')) return digits;
    if (digits.length === 10) return '1' + digits;
    // Already has country code or incomplete — return digits only (no punctuation)
    return digits;
};

const buildFieldDiffDetails = (before, after, keys) => {
    const changes = [];
    keys.forEach((key) => {
        const sa = JSON.stringify(before && before[key] != null ? before[key] : null);
        const sb = JSON.stringify(after && after[key] != null ? after[key] : null);
        if (sa !== sb) changes.push(key + ': ' + sa + ' → ' + sb);
    });
    return changes.join('; ').slice(0, 1800);
};

const inferOverallStatusFromSurvey = (outcome, answers) => {
    const list = answers || [];
    const blob = list.map(a => ((a.question || '') + ' ' + (a.answer || '')).toLowerCase()).join(' | ');
    if (outcome === 'Fail' || /not qualified|disqualif|exclusion|screen fail|\bnq\b/.test(blob)) {
        const hit = list.find(a => /fail|nq|not qualified|exclusion/i.test((a.question || '') + ' ' + (a.answer || '')));
        return { overallStatus: 'Not qualified', nqReason: (hit && hit.answer) || 'Failed pre-screen survey' };
    }
    if (/not interested|decline|no thanks|\bni\b/.test(blob)) {
        const hit = list.find(a => /not interested|decline|ni/i.test((a.question || '') + ' ' + (a.answer || '')));
        return { overallStatus: 'Not interested', niReason: (hit && hit.answer) || 'Not interested' };
    }
    if (/waitlist|wait list/.test(blob)) return { overallStatus: 'Waitlist' };
    if (/call back|callback|call-back/.test(blob)) return { overallStatus: 'Call Back' };
    if (/unreachable|wrong number|disconnected|no answer/.test(blob)) return { overallStatus: 'Unreachable' };
    if (/attempted|left voicemail|voicemail left/.test(blob)) return { overallStatus: 'Attempted' };
    if (outcome === 'Pass' || /schedul/.test(blob)) return { overallStatus: 'Scheduled' };
    return {};
};

const getLatestNqNiSummary = (patient) => {
    const parts = [];
    const current = (patient && patient.enrollments || []).find(e => e.status === 'current');
    const study = current ? (state.studies || []).find(s => s.id === current.studyId) : null;
    const studyLabel = (study && (study.title || study.name)) || (patient && patient.nqStudyTitle) || (patient && patient.niStudyTitle) || '';
    if (patient && patient.overallStatus) {
        parts.push('Status: ' + patient.overallStatus + (studyLabel ? (' (' + studyLabel + ')') : ''));
    }
    if (patient && patient.nqReason) {
        parts.push('NQ' + ((patient.nqStudyTitle || studyLabel) ? (' [' + (patient.nqStudyTitle || studyLabel) + ']') : '') + ': ' + patient.nqReason);
    }
    if (patient && patient.niReason) {
        parts.push('NI' + ((patient.niStudyTitle || studyLabel) ? (' [' + (patient.niStudyTitle || studyLabel) + ']') : '') + ': ' + patient.niReason);
    }
    const logs = (patient && patient.contactLogs) || [];
    const lastLog = [...logs].reverse().find(l => l.outcome || l.notes || l.overallStatus);
    if (lastLog) {
        parts.push('Last contact (' + new Date(lastLog.date).toLocaleString() + '): '
            + [lastLog.overallStatus, lastLog.outcome, lastLog.notes].filter(Boolean).join(' — '));
    }
    return parts;
};

/**
 * Show notification to user with enhanced styling and error handling
 * @param {string} message - Notification message
 * @param {string} type - Notification type ('success', 'error', 'info', 'warning')
 * @param {number} duration - Display duration in milliseconds (default: 3000)

const showNotification = (message, type = 'info', duration = 3000) => {
    try {
        const container = document.getElementById('notification-container');
        if (!container) {
            console.warn('Notification container not found');
            return;
        }

        const notif = document.createElement('div');
        notif.className = `notification bg-${type}`;

        // Trigger the animation
        requestAnimationFrame(() => {
            notif.classList.add('show');

        setTimeout(() => {
            notif.classList.remove('show');

const normalizeHeaderKey = (h) => String(h || '').trim().toLowerCase().replace(/[_/]+/g, ' ').replace(/\s+/g, ' ');

/** Split "Anne Marie Hill" / "Doe, Jane" into first/last for older roster sheets.
 *  3+ tokens → last word is surname ("Anne Marie" / "Hill"); 2 tokens → first/last. */
const splitImportFullName = (fullName) => {
    const raw = String(fullName || '').trim().replace(/\s+/g, ' ');
    if (!raw) return { firstName: '', lastName: '' };
    if (raw.includes(',')) {
        const [last, rest] = raw.split(',').map(p => p.trim()).filter(Boolean);
        const first = (rest || '').trim();
        return { firstName: first || last, lastName: first ? last : '' };
    }
    const parts = raw.split(/\s+/).filter(Boolean);
    if (parts.length === 1) return { firstName: parts[0], lastName: '' };
    if (parts.length === 2) return { firstName: parts[0], lastName: parts[1] };
    return { firstName: parts.slice(0, -1).join(' '), lastName: parts[parts.length - 1] };
};

const looksLikeFullName = (value) => {
    const s = String(value || '').trim();
    if (!s) return false;
    if (s.includes(',')) return true;
    return s.split(/\s+/).filter(Boolean).length >= 2;
};

/**
 * Messy clinic sheets often put the whole name in First, Last, or a Full Name column.
 * Pivot: split whichever field looks like a full name when the other side is missing/duplicate.
 */
const coerceImportPersonName = (firstName, lastName, fullName = '', fallback = 'Unknown') => {
    let first = String(firstName || '').trim().replace(/\s+/g, ' ');
    let last = String(lastName || '').trim().replace(/\s+/g, ' ');
    const full = String(fullName || '').trim().replace(/\s+/g, ' ');

    // Dedicated full-name column wins when first/last are incomplete or identical copies of it
    if (full && looksLikeFullName(full)) {
        const sameAsFull = (v) => v && v.toLowerCase() === full.toLowerCase();
        if (!first || !last || sameAsFull(first) || sameAsFull(last) || first.toLowerCase() === last.toLowerCase()) {
            const split = splitImportFullName(full);
            first = split.firstName || first;
            last = split.lastName || last;
        }
    }

    // Full name dumped into First Name only (or First == Last both full)
    if (looksLikeFullName(first) && (!last || first.toLowerCase() === last.toLowerCase())) {
        const split = splitImportFullName(first);
        first = split.firstName;
        last = split.lastName || last;
    }

    // Full name dumped into Last Name only (or Last starts with First as "Jane" + "Jane Doe")
    if (looksLikeFullName(last) && (
        !first
        || first.toLowerCase() === last.toLowerCase()
        || last.toLowerCase().startsWith(`${first.toLowerCase()} `)
    )) {
        const split = splitImportFullName(last);
        first = split.firstName || first;
        last = split.lastName;
    }

    // Still only one token somewhere — use fullName leftovers or mirror
    if ((!first || !last) && full) {
        const split = splitImportFullName(full);
        first = first || split.firstName;
        last = last || split.lastName;
    }
    if (!first && last) {
        if (looksLikeFullName(last)) {
            const split = splitImportFullName(last);
            first = split.firstName;
            last = split.lastName || fallback;
        } else {
            first = last;
            last = fallback;
        }
    }
    if (!last && first) {
        if (looksLikeFullName(first)) {
            const split = splitImportFullName(first);
            first = split.firstName;
            last = split.lastName || fallback;
        } else {
            last = fallback;
        }
    }
    if (!first) first = fallback;
    if (!last) last = fallback;
    return { firstName: first, lastName: last };
};

const mapSubjectImportHeaders = (headers) => {

    const normalized = headers.map(normalizeHeaderKey);
    Object.entries(SUBJECT_IMPORT_ALIASES).forEach(([field, aliases]) => {

        if (idx >= 0) mapping[field] = headers[idx];

const parseSubjectImportCsvText = (text) => {
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;
    const pushCell = () => { row.push(cell); cell = ''; };
    const pushRow = () => {
        if (row.some(c => String(c).trim() !== '')) rows.push(row);
        row = [];
    };
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
            if (ch === '"' && next === '"') { cell += '"'; i++; }
            else if (ch === '"') inQuotes = false;
            else cell += ch;
        } else if (ch === '"') {
            inQuotes = true;
        } else if (ch === ',') {
            pushCell();
        } else if (ch === '\n') {
            pushCell();
            pushRow();
        } else if (ch === '\r') {
            // skip
        } else {
            cell += ch;
        }
    }
    pushCell();
    pushRow();
    if (!rows.length) return { headers: [], rows: [] };
    const headers = rows[0].map(h => String(h || '').trim());
    const dataRows = rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = r[i] != null ? String(r[i]).trim() : ''; });
        return obj;
    });
    return { headers, rows: dataRows };
};

/** Excel serial day → YYYY-MM-DD (1900 date system). Rejects time-only fractions and out-of-range years. */
const excelSerialToDateKey = (serial) => {
    if (typeof serial !== 'number' || !Number.isFinite(serial)) return '';
    if (serial > 0 && serial < 1) return ''; // time-only fraction
    const whole = Math.floor(serial);
    // ~1982–2064 keeps clinic schedules / avoids Global IDs and epoch junk
    if (whole < 30000 || whole > 60000) return '';
    const utc = new Date(Date.UTC(1899, 11, 30));
    utc.setUTCDate(utc.getUTCDate() + whole);
    const y = utc.getUTCFullYear();
    if (y < 2015 || y > 2040) return '';
    return `${y}-${String(utc.getUTCMonth() + 1).padStart(2, '0')}-${String(utc.getUTCDate()).padStart(2, '0')}`;
};

const isPlausibleClinicDateKey = (key, { minYear = 2018, maxYear = 2038 } = {}) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(key || ''))) return false;
    const y = parseInt(String(key).slice(0, 4), 10);
    return y >= minYear && y <= maxYear;
};

const excelCellToDisplay = (v) => {
    if (v == null || v === '') return '';
    if (v instanceof Date && !Number.isNaN(v.getTime())) {
        if (v.getFullYear() === 1899 || v.getFullYear() === 1900) {
            return `${String(v.getHours()).padStart(2, '0')}:${String(v.getMinutes()).padStart(2, '0')}`;
        }
        return toLocalDateKey(v);
    }
    if (typeof v === 'number' && Number.isFinite(v)) {
        if (v > 0 && v < 1) {
            const totalMinutes = Math.round(v * 24 * 60);
            const hh = Math.floor(totalMinutes / 60);
            const mm = totalMinutes % 60;
            return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
        }
        const fromSerial = excelSerialToDateKey(v);
        if (fromSerial) return fromSerial;
    }
    return String(v).trim();
};

const isVandaClinicHeaderRow = (row) => {
    const norms = (row || []).map(c => normalizeHeaderKey(c));
    return norms.includes('time') && norms.includes('first name') && norms.includes('last name');

const parseVandaClinicWorkbook = (workbook) => {
    const visitSheetNames = workbook.SheetNames.filter(n => /visit\s*\d+/i.test(n));
    const sheetsToScan = visitSheetNames.length
        ? visitSheetNames
        : workbook.SheetNames.filter(n => !/waitlist|referral|do not call|visit windows/i.test(n));
    const canonicalHeaders = [
        'Time', 'Study', 'Site', 'Group', 'Visit', 'Date', 'First Name', 'Last Name', 'Full Name',
        'Global ID', 'Phone #', 'Email Address', 'Initials', 'Screening #', 'Visit Status', 'Comments', 'Sheet'
    ];
    const rows = [];
    sheetsToScan.forEach(sheetName => {
        const sheet = workbook.Sheets[sheetName];
        if (!sheet) return;
        const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
        let colIndex = null;
        let sheetVisitHint = '';
        const visitFromName = sheetName.match(/visit\s*(\d+)/i);
        if (visitFromName) sheetVisitHint = `Visit ${visitFromName[1]}`;
        matrix.forEach(row => {
            if (isVandaClinicHeaderRow(row)) {
                colIndex = {};
                row.forEach((cell, i) => {
                    const key = normalizeHeaderKey(cell);
                    if (key) colIndex[key] = i;
                });
                return;
            }
            if (!colIndex) return;
            const getByAliases = (aliases) => {
                for (const alias of aliases) {
                    const idx = colIndex[normalizeHeaderKey(alias)];
                    if (idx == null) continue;
                    const raw = row[idx];
                    if (raw == null || raw === '') continue;
                    return raw;
                }
                return '';
            };
            const firstNameRaw = excelCellToDisplay(getByAliases(['First Name']));
            const lastNameRaw = excelCellToDisplay(getByAliases(['Last Name']));
            const fullNameRaw = excelCellToDisplay(getByAliases(['Full Name', 'Patient Name', 'Subject Name', 'Name']));
            const named = coerceImportPersonName(firstNameRaw, lastNameRaw, fullNameRaw);
            if (!named.firstName && !named.lastName) return;
            const firstName = named.firstName;
            const lastName = named.lastName;
            const study = excelCellToDisplay(getByAliases(['Study']));
            const site = excelCellToDisplay(getByAliases(['Site']));
            if (/^per\s/i.test(site) && !study) return;
            let visitVal = excelCellToDisplay(getByAliases(['Visit']));
            if (/^\d+$/.test(visitVal)) visitVal = `Visit ${visitVal}`;
            if (!visitVal) visitVal = sheetVisitHint || 'Visit';
            const dateRaw = getByAliases(['Date']);
            const timeRaw = getByAliases(['Time']);
            const dateKey = coerceImportDateKey(dateRaw);
            rows.push({
                Time: excelCellToDisplay(timeRaw) || coerceImportTime(timeRaw, ''),
                Study: study,
                Site: site,
                Group: excelCellToDisplay(getByAliases(['Group'])),
                Visit: visitVal,
                Date: dateKey,
                'First Name': firstName,
                'Last Name': lastName,
                'Full Name': fullNameRaw || `${firstName} ${lastName}`.trim(),
                'Global ID': excelCellToDisplay(getByAliases(['Global ID'])),
                'Phone #': excelCellToDisplay(getByAliases(['Phone #', 'Phone', 'Phone Number'])),
                'Email Address': excelCellToDisplay(getByAliases(['Email Address', 'Email'])),
                Initials: excelCellToDisplay(getByAliases(['Initials'])),
                'Screening #': excelCellToDisplay(getByAliases(['Screening #', 'Screening Number'])),
                'Visit Status': excelCellToDisplay(getByAliases(['Visit Status', 'Status'])),
                Comments: excelCellToDisplay(getByAliases(['Comments', 'Notes'])),
                Sheet: sheetName
            });
        });
    });
    const waitlist = parseVandaWaitlistSheet(workbook);
    return {
        headers: canonicalHeaders,
        rows,
        waitlist,
        sheetName: visitSheetNames.join(', ') || 'clinic-workbook',
        format: 'vanda-clinic'
    };
};

const parseVandaWaitlistSheet = (workbook) => {
    const sheetName = workbook.SheetNames.find(n => /waitlist/i.test(n));
    if (!sheetName) return [];
    const sheet = workbook.Sheets[sheetName];
    const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
    let colIndex = null;
    const out = [];
    matrix.forEach(row => {
        const norms = (row || []).map(c => normalizeHeaderKey(c));
        if (norms.includes('first name') && norms.includes('last name')) {
            colIndex = {};
            row.forEach((cell, i) => {
                const key = normalizeHeaderKey(cell);
                if (key) colIndex[key] = i;
            });
            return;
        }
        if (!colIndex) return;
        const get = (...aliases) => {
            for (const a of aliases) {
                const idx = colIndex[normalizeHeaderKey(a)];
                if (idx == null) continue;
                const v = row[idx];
                if (v == null || String(v).trim() === '') continue;
                return String(v).trim();
            }
            return '';
        };
        const firstNameRaw = get('First name', 'First Name');
        const lastNameRaw = get('Last Name', 'Last name');
        const fullNameRaw = get('Full Name', 'Patient Name', 'Name');
        const named = coerceImportPersonName(firstNameRaw, lastNameRaw, fullNameRaw);
        if (!named.firstName && !named.lastName) return;
        out.push({
            firstName: named.firstName,
            lastName: named.lastName,
            phoneNumber: get('Phone Number', 'Phone #', 'Phone'),
            group: '1',
            notes: get('Preferred Group', 'Notes'),
            siteHint: get('Site Name', 'Site')
        });
    });
    return out;
};

const getNextMondayDateKey = (from = new Date()) => {
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    const day = d.getDay(); // 0 Sun … 1 Mon
    const add = day === 1 ? 7 : ((8 - day) % 7) || 7;
    // If today is Monday, still use next Monday for "next week"; if Tue-Sun go to upcoming Monday
    const daysUntilMon = day === 0 ? 1 : (day === 1 ? 7 : (8 - day));
    d.setDate(d.getDate() + daysUntilMon);
    return toLocalDateKey(d);
};

const addDaysToDateKey = (dateKey, days) => {
    if (!dateKey) return '';
    const d = new Date(`${dateKey}T00:00:00`);
    if (Number.isNaN(d.getTime())) return '';
    d.setDate(d.getDate() + days);
    return toLocalDateKey(d);
};

/** Pick a stable schedule anchor: prefer the densest early cluster, not a single outlier min. */
const pickImportScheduleAnchor = (dateKeys) => {
    const sorted = [...dateKeys].filter(isPlausibleClinicDateKey).sort();
    if (!sorted.length) return '';
    if (sorted.length === 1) return sorted[0];
    // Mode of YYYY-MM buckets among the earliest half — resists one bad 2000-01-01 row
    const half = sorted.slice(0, Math.max(1, Math.ceil(sorted.length / 2)));
    const counts = {};
    half.forEach(k => {
        const bucket = k.slice(0, 7);
        counts[bucket] = (counts[bucket] || 0) + 1;
    });
    const bestBucket = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0][0];
    return half.find(k => k.startsWith(bestBucket)) || sorted[0];
};

const visitNumberFromLabel = (visit) => {
    const m = String(visit || '').match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 1;
};

const shiftSubjectsToNextWeek = (subjects) => {
    const targetStart = getNextMondayDateKey();
    const plausible = subjects.map(s => coerceImportDateKey(s.visitDate)).filter(isPlausibleClinicDateKey).sort();
    const anchor = pickImportScheduleAnchor(plausible);

    // No usable dates → rebuild onto next week by visit number (1 week apart)
    if (!anchor) {
        const remapped = subjects.map(s => {
            const vn = visitNumberFromLabel(s.visit);
            const day = addDaysToDateKey(targetStart, Math.max(0, vn - 1) * 7);
            return {
                ...s,
                visitDateOriginal: coerceImportDateKey(s.visitDate) || '',
                visitDate: day,
                dateRemapped: true
            };
        });
        const ends = remapped.map(s => s.visitDate).filter(isPlausibleClinicDateKey).sort();
        return {
            subjects: remapped,
            shiftDays: 0,
            targetStart,
            targetEnd: ends[ends.length - 1] || targetStart,
            remapped: true
        };
    }

    const d0 = new Date(`${anchor}T00:00:00`);
    const d1 = new Date(`${targetStart}T00:00:00`);
    let shiftDays = Math.round((d1 - d0) / 86400000);
    // Cap so a single epoch/serial bug can't push end dates into the 2050s
    const MAX_SHIFT = 4000;
    if (Math.abs(shiftDays) > MAX_SHIFT) {
        shiftDays = shiftDays > 0 ? MAX_SHIFT : -MAX_SHIFT;
    }

    const shifted = subjects.map(s => {
        const original = coerceImportDateKey(s.visitDate);
        if (!original || !isPlausibleClinicDateKey(original)) {
            const vn = visitNumberFromLabel(s.visit);
            return {
                ...s,
                visitDateOriginal: original || '',
                visitDate: addDaysToDateKey(targetStart, Math.max(0, vn - 1) * 7),
                dateRemapped: true
            };
        }
        const next = addDaysToDateKey(original, shiftDays);
        // After shift, still reject nonsense years
        if (!isPlausibleClinicDateKey(next, { minYear: 2020, maxYear: 2035 })) {
            const vn = visitNumberFromLabel(s.visit);
            return {
                ...s,
                visitDateOriginal: original,
                visitDate: addDaysToDateKey(targetStart, Math.max(0, vn - 1) * 7),
                dateRemapped: true
            };
        }
        return {
            ...s,
            visitDateOriginal: original,
            visitDate: next
        };
    });
    const targetEnd = shifted.map(s => s.visitDate).filter(isPlausibleClinicDateKey).sort().slice(-1)[0] || targetStart;
    return { subjects: shifted, shiftDays, targetStart, targetEnd, remapped: false };
};

const buildSyntheticVisit79Subjects = (subjects) => {
    const v6 = subjects.filter(s => String(s.visit || '').toLowerCase() === 'visit 6');
    const v6Dates = v6.map(s => s.visitDate).filter(Boolean).sort();
    if (!v6Dates.length) return [];
    const v6Last = v6Dates[v6Dates.length - 1];
    const continuing = [];
    const seen = new Set();
    v6.forEach(s => {
        if (String(s.visitStatus || '').toLowerCase() !== 'complete') return;
        const key = `${String(s.screeningNumber || '').toLowerCase()}|${String(s.firstName || '').toLowerCase()}|${String(s.lastName || '').toLowerCase()}`;
        if (seen.has(key)) return;
        seen.add(key);
        continuing.push(s);
    });
    if (!continuing.length) {
        // fall back to unique V6 subjects who are not SF
        v6.forEach(s => {
            if (s.isCancelledOrSf) return;
            const key = `${String(s.screeningNumber || '').toLowerCase()}|${String(s.firstName || '').toLowerCase()}|${String(s.lastName || '').toLowerCase()}`;
            if (seen.has(key)) return;
            seen.add(key);
            continuing.push(s);
        });
    }
    const out = [];
    [[7, 1], [8, 2], [9, 3]].forEach(([vn, weeks]) => {
        const day = addDaysToDateKey(v6Last, 7 * weeks);
        continuing.forEach((s, i) => {
            const mins = 7 * 60 + i * 20;
            const hh = Math.floor(mins / 60);
            const mm = mins % 60;
            if (hh >= 16) return;
            out.push({
                ...s,
                rowIndex: `v${vn}-${i}`,
                visit: `Visit ${vn}`,
                visitDate: day,
                visitTime: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`,
                visitStatus: `V${vn}`,
                isCancelledOrSf: false,
                synthetic: true
            });
        });
    });
    return out;
};

const prepareVandaImportDraft = (parsed, fileName) => {
    const mapping = mapSubjectImportHeaders(parsed.headers);
    let mappedSubjects = buildMappedSubjectsFromImport(parsed.headers, parsed.rows, mapping);
    const rawMappedSubjects = mappedSubjects.map(s => ({ ...s }));
    const shifted = shiftSubjectsToNextWeek(mappedSubjects);
    mappedSubjects = shifted.subjects;
    const visit79 = buildSyntheticVisit79Subjects(mappedSubjects);
    mappedSubjects = [...mappedSubjects, ...visit79];
    const dates = mappedSubjects.map(s => s.visitDate).filter(isPlausibleClinicDateKey).sort();
    return {
        fileName,
        headers: parsed.headers,
        rows: parsed.rows,
        mapping,
        format: 'vanda-clinic',
        rawMappedSubjects,
        mappedSubjects,
        waitlistCandidates: parsed.waitlist || [],
        shiftDays: shifted.shiftDays,
        remappedDates: !!shifted.remapped,
        targetStart: dates[0] || shifted.targetStart,
        targetEnd: dates[dates.length - 1] || shifted.targetEnd,
        visit79Count: visit79.length
    };
};

const ingestWaitlistCandidates = async ({ candidates, studyId, siteId, onProgress = null }) => {
    if (!candidates?.length) return { created: 0, matched: 0 };
    let created = 0;
    let matched = 0;
    const total = candidates.length;
    for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if (typeof onProgress === 'function') {
            onProgress({
                phase: 'waitlist',
                done: i,
                total,
                label: 'Importing waitlist',
                detail: `${c.firstName || ''} ${c.lastName || ''}`.trim()
            });
        }
        const existing = findPatientForSubjectImport(c);
        if (existing) {
            matched += 1;
            continue;
        }
        const named = coerceImportPersonName(c.firstName, c.lastName, c.fullName || '', 'Candidate');
        const draftPatient = patientTemplate();
        draftPatient.id = ensureId('patient');
        draftPatient.firstName = named.firstName;
        draftPatient.lastName = named.lastName;
        draftPatient.phoneNumber = c.phoneNumber || '';
        draftPatient.group = c.group || '1';
        draftPatient.status = 'Candidate';
        draftPatient.registryStatus = 'Active';
        draftPatient.pipelineStage = 'lead';
        draftPatient.globalId = generateShortId();
        draftPatient.initials = `${(named.firstName[0] || '').toUpperCase()}${(named.lastName[0] || '').toUpperCase()}`;
        draftPatient.inclusionCriteriaMet = false;
        draftPatient.exclusionCriteriaMet = false;
        draftPatient.comments = c.notes || '';
        draftPatient.source = 'subject-import-waitlist';
        draftPatient.enrollments = studyId && siteId ? [{
            studyId,
            siteId,
            status: 'candidate',
            enrolledDate: new Date().toISOString()
        }] : [];
        const createdDoc = await createDocument('patients', draftPatient);
        const patient = normalizePatientRecord(convertPatientFromAzureFormat({ ...draftPatient, ...(createdDoc || {}) }));
        if (!state.patients.some(p => p.id === patient.id)) state.patients.push(patient);
        created += 1;
    }
    if (typeof onProgress === 'function') {
        onProgress({ phase: 'waitlist', done: total, total, label: 'Waitlist complete', detail: `${created} new · ${matched} matched` });
    }
    return { created, matched };
};

const parseSubjectImportWorkbook = (arrayBuffer) => {
    if (typeof XLSX === 'undefined') throw new Error('Spreadsheet parser not loaded. Use CSV or refresh the page.');
    const workbook = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
    const looksLikeVanda = workbook.SheetNames.some(n => /visit\s*\d+/i.test(n))
        || workbook.SheetNames.some(n => /visit windows/i.test(n));
    if (looksLikeVanda) {
        const parsed = parseVandaClinicWorkbook(workbook);
        if (parsed.rows.length) return parsed;
    }
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
    if (!matrix.length) return { headers: [], rows: [] };
    const headers = matrix[0].map(h => String(h || '').trim());
    const rows = matrix.slice(1).filter(r => r.some(c => String(c || '').trim() !== '')).map(r => {
        const obj = {};
        headers.forEach((h, i) => {
            const v = r[i];
            obj[h] = v == null ? '' : (v instanceof Date ? (coerceImportDateKey(v) || toLocalDateKey(v)) : String(v).trim());
        });
        return obj;
    });
    return { headers, rows, sheetName, format: 'flat' };
};

const coerceImportDateKey = (value, { forVisit = true } = {}) => {
    if (value == null || value === '') return '';
    let key = '';
    if (value instanceof Date && !Number.isNaN(value.getTime())) {
        const y = value.getFullYear();
        if (y === 1899 || y === 1900) return ''; // time-only Excel date
        key = toLocalDateKey(value);
    } else if (typeof value === 'number' && Number.isFinite(value)) {
        key = excelSerialToDateKey(value);
    } else {
        const s = String(value).trim();
        if (!s) return '';
        // Bare Excel serial as text (SheetJS raw:false / String() path)
        if (/^\d{5}(\.\d+)?$/.test(s)) {
            key = excelSerialToDateKey(parseFloat(s));
        } else if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
            key = s.slice(0, 10);
        } else {
            const mdy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            if (mdy) {
                const mm = mdy[1].padStart(2, '0');
                const dd = mdy[2].padStart(2, '0');
                let yyyy = mdy[3];
                if (yyyy.length === 2) yyyy = String(2000 + parseInt(yyyy, 10));
                key = `${yyyy}-${mm}-${dd}`;
            } else if (!/^\d{1,2}:\d{2}/.test(s)) {
                const parsed = new Date(s);
                if (!Number.isNaN(parsed.getTime())) {
                    const y = parsed.getFullYear();
                    if (y !== 1899 && y !== 1900) key = toLocalDateKey(parsed);
                }
            }
        }
    }
    if (!key) return '';
    if (forVisit) return isPlausibleClinicDateKey(key) ? key : '';
    return isPlausibleClinicDateKey(key, { minYear: 1920, maxYear: 2018 }) ? key : '';
};

const coerceImportTime = (value, fallback = '08:00') => {
    if (!value && value !== 0) return fallback;
    if (typeof value === 'number' && value > 0 && value < 1) {
        const totalMinutes = Math.round(value * 24 * 60);
        return `${String(Math.floor(totalMinutes / 60)).padStart(2, '0')}:${String(totalMinutes % 60).padStart(2, '0')}`;
    }
    const s = String(value).trim();
    const m24 = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*$/);
    if (m24) return `${String(parseInt(m24[1], 10)).padStart(2, '0')}:${m24[2]}`;
    const m12 = s.match(/^(\d{1,2}):(\d{2})\s*(am|pm)$/i);
    if (m12) {
        let h = parseInt(m12[1], 10);
        const min = m12[2];
        const ap = m12[3].toLowerCase();
        if (ap === 'pm' && h < 12) h += 12;
        if (ap === 'am' && h === 12) h = 0;
        return `${String(h).padStart(2, '0')}:${min}`;
    }
    return fallback;
};

const isCancelledOrScreenFailStatus = (status) => {
    const s = String(status || '').toLowerCase();
    if (!s) return false;
    return /\bsf\b/.test(s) || s.includes('screen fail') || /\bcx\b/.test(s) || s.includes('cancel')
        || s.includes('ncns') || s.includes('no show') || s.includes('do not');
};

const buildMappedSubjectsFromImport = (headers, rows, mapping) => {
    const map = mapping || mapSubjectImportHeaders(headers);
    return rows.map((row, index) => {
        const get = (field) => {
            const key = map[field];
            return key ? String(row[key] ?? '').trim() : '';
        };
        const getRaw = (field) => {
            const key = map[field];
            return key ? row[key] : '';
        };
        const named = coerceImportPersonName(
            get('firstName'),
            get('lastName'),
            get('fullName') || String(row['Full Name'] || row['Patient Name'] || row['Name'] || '').trim(),
            get('screeningNumber') || `ROW-${index + 1}`
        );
        let firstName = named.firstName;
        let lastName = named.lastName;
        const initials = get('initials');
        if (initials && (firstName === lastName || lastName === 'Unknown')) {
            // keep initials for display; names already coerced
        }
        let visit = get('visit');
        if (/^\d+$/.test(visit)) visit = `Visit ${visit}`;
        const emailRaw = get('email');
        const email = !emailRaw || /^n\/?a$/i.test(emailRaw) ? '' : emailRaw;
        const globalId = get('globalId');
        const visitStatus = get('visitStatus') || String(row['Visit Status'] || '').trim();
        return {
            rowIndex: index,
            screeningNumber: get('screeningNumber'),
            firstName,
            lastName,
            initials: initials || `${(firstName[0] || '').toUpperCase()}${(lastName[0] || '').toUpperCase()}`,
            dob: coerceImportDateKey(getRaw('dob') !== '' && getRaw('dob') != null ? getRaw('dob') : get('dob'), { forVisit: false }),
            phoneNumber: get('phoneNumber'),
            email,
            globalId: globalId && !/^(called|texted|lvm)/i.test(globalId) && globalId.length > 4 ? globalId : '',
            visitDate: coerceImportDateKey(getRaw('visitDate') !== '' && getRaw('visitDate') != null ? getRaw('visitDate') : get('visitDate')),
            visitTime: get('visitTime'),
            group: get('group'),
            visit,
            visitStatus,
            isCancelledOrSf: isCancelledOrScreenFailStatus(visitStatus) || isCancelledOrScreenFailStatus(String(row.Comments || '')),
            raw: row
        };
    }).filter(s => String(s.firstName || '').trim() && String(s.lastName || '').trim());
};

const findPatientForSubjectImport = (subject) => {
    const gid = String(subject.globalId || '').trim();
    if (gid) {
        const byGid = (state.patients || []).find(p => String(p.globalId || '').trim() === gid);
        if (byGid) return byGid;
    }
    const screening = String(subject.screeningNumber || '').trim().toLowerCase();
    if (screening && /^101-/.test(screening)) {
        const byScreen = (state.patients || []).find(p => String(p.screeningNumber || '').trim().toLowerCase() === screening);
        if (byScreen) return byScreen;
    } else if (screening) {
        const byScreen = (state.patients || []).find(p => String(p.screeningNumber || '').trim().toLowerCase() === screening);
        if (byScreen) return byScreen;
    }
    const fn = String(subject.firstName || '').trim().toLowerCase();
    const ln = String(subject.lastName || '').trim().toLowerCase();
    const dob = String(subject.dob || '').trim();
    const phone = String(subject.phoneNumber || '').replace(/\D/g, '');
    return (state.patients || []).find(p => {
        const sameName = String(p.firstName || '').trim().toLowerCase() === fn
            && String(p.lastName || '').trim().toLowerCase() === ln;
        if (!sameName) return false;
        if (dob && String(p.dob || '').trim() === dob) return true;
        if (phone && String(p.phoneNumber || '').replace(/\D/g, '') === phone) return true;
        return !dob && !phone;
    }) || null;
};

const updateSubjectImportProgress = ({ done = 0, total = 0, label = '', detail = '' } = {}) => {
    const wrap = document.getElementById('subject-import-progress-wrap');
    const bar = document.getElementById('subject-import-progress-bar');
    const pctEl = document.getElementById('subject-import-progress-pct');
    const labelEl = document.getElementById('subject-import-progress-label');
    const detailEl = document.getElementById('subject-import-progress-detail');
    if (!wrap || !bar) return;
    wrap.classList.remove('hidden');
    const safeTotal = Math.max(0, Number(total) || 0);
    const safeDone = Math.max(0, Math.min(safeTotal || Number(done) || 0, Number(done) || 0));
    const pct = safeTotal > 0 ? Math.min(100, Math.round((safeDone / safeTotal) * 100)) : 0;
    bar.style.width = `${pct}%`;
    if (pctEl) pctEl.textContent = `${pct}%`;
    if (labelEl) labelEl.textContent = label || (safeTotal ? `Uploading ${safeDone} of ${safeTotal}` : 'Working…');
    if (detailEl) detailEl.textContent = detail || (safeTotal ? `${safeDone} / ${safeTotal}` : '');
};

const ingestSubjectRoster = async ({ subjects, studyId, siteId, visit, group, startDate, endDate, startTime, intervalMinutes, includeSf = false, onProgress = null }) => {
    if (!subjects?.length) throw new Error('No subjects to ingest.');
    if (!studyId || !siteId) throw new Error('Study and site are required.');
    const interval = Math.max(5, parseInt(intervalMinutes, 10) || 30);
    const [defaultHour, defaultMinute] = String(startTime || '08:00').split(':').map(Number);
    const rangeStart = coerceImportDateKey(startDate) || toLocalDateKey(new Date());
    let rangeEnd = coerceImportDateKey(endDate) || rangeStart;
    // Guard against a bad end date from older drafts / manual edits
    if (!isPlausibleClinicDateKey(rangeEnd, { minYear: 2020, maxYear: 2035 }) || rangeEnd < rangeStart) {
        rangeEnd = rangeStart;
    }

    let working = subjects.filter(s => includeSf || !s.isCancelledOrSf);
    working = working.filter(s => {
        const day = coerceImportDateKey(s.visitDate);
        if (!day) return true;
        return day >= rangeStart && day <= rangeEnd;
    });
    if (!working.length) throw new Error('No subjects left after date/SF filters.');

    const stamped = working.map((subject, index) => {
        const day = coerceImportDateKey(subject.visitDate) || rangeStart;
        const time = coerceImportTime(subject.visitTime, null);
        let hour = defaultHour;
        let minute = defaultMinute + (time ? 0 : index * interval);
        if (time) {
            const [h, m] = time.split(':').map(Number);
            hour = h;
            minute = m;
        } else {
            hour += Math.floor(minute / 60);
            minute = minute % 60;
        }
        const start = new Date(`${day}T00:00:00`);
        start.setHours(hour, minute, 0, 0);
        return {
            ...subject,
            visit: subject.visit || visit || 'Visit 1',
            group: subject.group || group || '',
            slotStart: start
        };
    }).sort((a, b) => a.slotStart - b.slotStart);

    const byVisit = new Map();
    stamped.forEach(s => {
        const key = s.visit || visit || 'Visit 1';
        if (!byVisit.has(key)) byVisit.set(key, []);
        byVisit.get(key).push(s);
    });

    let createdPatients = 0;
    let matchedPatients = 0;
    let booked = 0;
    const scheduleIds = [];
    const firstDay = toLocalDateKey(stamped[0].slotStart);
    const patientCache = new Map();
    const totalRows = stamped.length;
    const report = (done, visitName, subject) => {
        if (typeof onProgress !== 'function') return;
        const name = subject ? `${subject.firstName || ''} ${subject.lastName || ''}`.trim() : '';
        onProgress({
            phase: 'visits',
            done,
            total: totalRows,
            label: `Uploading visits`,
            detail: `${done} / ${totalRows}`
                + (visitName ? ` · ${visitName}` : '')
                + (name ? ` · ${name}` : '')
                + ` · ${createdPatients} new · ${matchedPatients} matched`
        });
    };
    report(0, '', null);

    for (const [visitName, visitSubjects] of byVisit.entries()) {
        if (typeof onProgress === 'function') {
            onProgress({
                phase: 'schedule',
                done: booked,
                total: totalRows,
                label: `Creating ${visitName} schedule`,
                detail: `${visitSubjects.length} slots`
            });
        }
        const slots = visitSubjects.map((s, i) => ({
            id: `slot-import-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 7)}`,
            startTime: s.slotStart.toISOString(),
            booked: 0,
            capacity: 1
        }));
        const newSchedule = {
            id: ensureId('sched'),
            siteId,
            studyId,
            visit: visitName,
            group: group || visitSubjects[0]?.group || '',
            shiftId: null,
            source: 'subject-import',
            slots,
            lastUpdated: new Date().toISOString()
        };
        const createdSchedule = await createDocument('schedules', newSchedule);
        const scheduleId = createdSchedule?.id || newSchedule.id;
        if (!scheduleId) throw new Error('Schedule create did not return an id.');
        scheduleIds.push(scheduleId);
        const scheduleRef = { ...newSchedule, id: scheduleId, slots: slots.map(s => ({ ...s })) };

        for (let i = 0; i < visitSubjects.length; i++) {
            const subject = visitSubjects[i];
            const slot = scheduleRef.slots[i];
            report(booked, visitName, subject);
            const cacheKey = [
                String(subject.globalId || '').trim(),
                String(subject.screeningNumber || '').trim().toLowerCase(),
                String(subject.firstName || '').trim().toLowerCase(),
                String(subject.lastName || '').trim().toLowerCase(),
                String(subject.phoneNumber || '').replace(/\D/g, '')
            ].join('|');
            let patient = patientCache.get(cacheKey) || findPatientForSubjectImport(subject);
            if (!patient) {
                const named = coerceImportPersonName(subject.firstName, subject.lastName, subject.raw?.['Full Name'] || '', subject.screeningNumber || 'Unknown');
                const draftPatient = patientTemplate();
                draftPatient.firstName = named.firstName;
                draftPatient.lastName = named.lastName;
                draftPatient.initials = subject.initials || `${(named.firstName[0] || '').toUpperCase()}${(named.lastName[0] || '').toUpperCase()}`;
                draftPatient.screeningNumber = subject.screeningNumber || '';
                draftPatient.dob = subject.dob || '';
                draftPatient.phoneNumber = subject.phoneNumber || '';
                draftPatient.email = subject.email || '';
                draftPatient.group = subject.group || '';
                draftPatient.status = subject.isCancelledOrSf ? 'Screen Fail' : 'Enrolled';
                draftPatient.registryStatus = 'Active';
                draftPatient.globalId = subject.globalId ? String(subject.globalId) : generateShortId();
                draftPatient.age = draftPatient.dob ? calculateAge(draftPatient.dob) : null;
                draftPatient.inclusionCriteriaMet = true;
                draftPatient.exclusionCriteriaMet = false;
                draftPatient.enrollments = [{
                    studyId,
                    siteId,
                    status: 'current',
                    enrolledDate: new Date().toISOString()
                }];
                draftPatient.source = 'subject-import';
                draftPatient.id = ensureId('patient');
                const created = await createDocument('patients', draftPatient);
                patient = normalizePatientRecord(convertPatientFromAzureFormat({ ...draftPatient, ...(created || {}) }));
                if (!state.patients.some(p => p.id === patient.id)) state.patients.push(patient);
                createdPatients += 1;
            } else {
                matchedPatients += 1;
                const enrollments = Array.isArray(patient.enrollments) ? [...patient.enrollments] : [];
                if (!enrollments.some(e => e.studyId === studyId && e.status === 'current')) {
                    enrollments.forEach(e => { if (e.status === 'current') e.status = 'past'; });
                    enrollments.push({ studyId, siteId, status: 'current', enrolledDate: new Date().toISOString() });
                }
                const patch = {
                    enrollments,
                    screeningNumber: patient.screeningNumber || subject.screeningNumber || '',
                    initials: patient.initials || subject.initials || '',
                    group: subject.group || patient.group || '',
                    globalId: patient.globalId || subject.globalId || patient.globalId
                };
                await updatePatientFields(patient.id, patch, 'subject_import_matched', scheduleId);
                patient = { ...patient, ...patch };
                const idx = state.patients.findIndex(p => p.id === patient.id);
                if (idx >= 0) state.patients[idx] = { ...state.patients[idx], ...patient };
            }
            patientCache.set(cacheKey, patient);

            const newAppt = {
                id: ensureId('appt'),
                scheduleId,
                slotId: slot.id,
                time: slot.startTime,
                visit: visitName,
                studyId,
                siteId,
                group: subject.group || group || '',
                status: subject.isCancelledOrSf ? 'cancelled' : 'scheduled',
                visitStatus: subject.visitStatus || (subject.isCancelledOrSf ? 'Screen Fail' : 'Scheduled'),
                inClinicStatus: '',
                visitOutcome: subject.isCancelledOrSf ? (subject.visitStatus || 'Screen Fail') : '',
                checkInStatus: 'not-checked-in',
                createdAt: new Date().toISOString(),
                source: 'subject-import'
            };
            const appointments = [...getPatientAppointments(patient), newAppt];
            await updatePatientFields(patient.id, {
                appointment: newAppt,
                appointments,
                group: subject.group || patient.group || ''
            }, 'subject_import_booked', `${newAppt.visit} ${slot.startTime}`, { allowWhenLocked: true });
            slot.booked = subject.isCancelledOrSf ? 0 : 1;
            booked += 1;
            report(booked, visitName, subject);
        }

        await updateDocument('schedules', scheduleId, {
            ...scheduleRef,
            slots: scheduleRef.slots,
            lastUpdated: new Date().toISOString()
        });
    }

    if (typeof onProgress === 'function') {
        onProgress({
            phase: 'visits',
            done: totalRows,
            total: totalRows,
            label: 'Visits uploaded',
            detail: `${booked} booked · ${createdPatients} new · ${matchedPatients} matched`
        });
    }

    const visitSchedules = scheduleIds.map((id, index) => ({
        scheduleId: id,
        visit: [...byVisit.keys()][index] || visit || 'Visit',
    }));

    return {
        scheduleId: scheduleIds[0],
        scheduleIds,
        visitSchedules,
        createdPatients,
        matchedPatients,
        booked,
        firstDay
    };
};

                    `;
                    lucide.createIcons();
                }
                
                // Update weather widget after navigation renders
                setTimeout(() => {
                    updateWeather();
                }, 500);
            };

            const renderContent = () => {
                // Show login page if not authenticated
                if (!state.isAuthenticated) {
                    // Hide loading overlay when showing login page
                    if (loadingOverlay) {
                        loadingOverlay.style.display = 'none';
                    }
                    // Hide header and navigation for login page
                    const headerContainer = mainAppContent.parentElement;
                    const navTabs = document.getElementById('main-nav-tabs');
                    if (headerContainer) {
                        const headerDiv = headerContainer.querySelector('.flex.flex-wrap');
                        if (headerDiv) headerDiv.style.display = 'none';
                        if (navTabs) navTabs.style.display = 'none';
                        headerContainer.style.padding = '0';
                    }
                    mainAppContent.innerHTML = getLoginPageHTML();
                    mainAppContent.className = 'w-full fixed inset-0';
                    // Initialize login form handler
                    setTimeout(() => {
                        // Check for existing failed attempts and apply appropriate animation
                        const failedAttempts = parseInt(localStorage.getItem('login_failed_attempts') || '0', 10);
                        const redLine = document.getElementById('red-line');
                        const redLineFallen = document.getElementById('red-line-fallen');
                        const moustache = document.getElementById('moustache');
                        const monocle = document.getElementById('monocle');
                        
                        // Attempt 4: Show monocle and moustache
                        if (failedAttempts >= 4) {
                            if (monocle) monocle.classList.add('show');
                            if (moustache) moustache.classList.add('show');
                        }
                        
                        // Attempt 3: Red line falls off
                        if (failedAttempts >= 3 && redLineFallen) {
                            if (redLine) {
                                redLine.style.display = 'none';
                            }
                            redLineFallen.classList.add('show');
                        } else if (failedAttempts >= 2 && redLine) {
                            // Attempt 2: Red line dangles
                            redLine.classList.add('dangle');
                        }
                        
                        const loginForm = document.getElementById('login-page-form');
                        if (loginForm) {
                            // Track failed login attempts
                            let currentFailedAttempts = parseInt(localStorage.getItem('login_failed_attempts') || '0', 10);
                            
                            loginForm.addEventListener('submit', async (e) => {
                                e.preventDefault();
                                const formData = new FormData(loginForm);
                                const username = formData.get('username');
                                const password = formData.get('password');
                                
                                const redLine = document.getElementById('red-line');
                                const redLineFallen = document.getElementById('red-line-fallen');
                                const moustache = document.getElementById('moustache');
                                const monocle = document.getElementById('monocle');
                                
                                try {
                                    const user = await apiService.authenticateUser(username, password);
                                    if (user) {
                                        // Reset failed attempts on success
                                        localStorage.removeItem('login_failed_attempts');
                                        
                                        const loginTimestamp = Date.now();
                                        // Store session in localStorage
                                        localStorage.setItem('ora_smo_session', JSON.stringify({
                                            user: user,
                                            timestamp: loginTimestamp
                                        }));
                                        
                                        setState({
                                            currentUser: user,
                                            isAuthenticated: true
                                        });
                                        
                                        showNotification('Login successful!', 'success');
                                        
                                        // Load data after successful login
                                        if (user.permissionLevel === 'Manager') {
                                            const users = await apiService.getUsers();
                                            setState({ users });
                                        }
                                        state.authReady = true;
                                        state.userId = 'chaos-user';
                                        
                                        // Auto-launch dashboard for CRC users
                                        if (user.permissionLevel === 'CRC') {
                                            setState({ activeTab: 'dashboard' });
                                        }
                                        
                                        performInitialLoad();
                                        renderNav();
                                        renderContent();
                                    } else {
                                        // Failed login
                                        currentFailedAttempts++;
                                        localStorage.setItem('login_failed_attempts', currentFailedAttempts.toString());
                                        
                                        const errorDiv = document.getElementById('login-page-error');
                                        if (errorDiv) {
                                            errorDiv.textContent = 'Invalid username or password';
                                            errorDiv.classList.remove('hidden');
                                        }
                                        
                                        // Attempt 4: Show monocle and moustache
                                        if (monocle && currentFailedAttempts >= 4) {
                                            monocle.classList.add('show');
                                        }
                                        
                                        if (moustache && currentFailedAttempts >= 4) {
                                            moustache.classList.add('show');
                                        }
                                        
                                        // Animate red line
                                        if (redLine && redLineFallen) {
                                            if (currentFailedAttempts >= 3) {
                                                // Attempt 3: Detach and fall off screen
                                                redLine.classList.remove('spin-bounce', 'dangle');
                                                void redLine.offsetWidth;
                                                redLine.classList.add('detach-fall');
                                                
                                                // After animation, hide original and show fallen version
                                                setTimeout(() => {
                                                    redLine.style.display = 'none';
                                                    redLineFallen.classList.add('show');
                                                }, 1500);
                                            } else if (currentFailedAttempts >= 2) {
                                                // Attempt 2: Dangle
                                                redLine.classList.remove('spin-bounce', 'detach-fall');
                                                void redLine.offsetWidth;
                                                redLine.classList.add('dangle');
                                            } else {
                                                // Attempt 1: Spin and bounce
                                                redLine.classList.remove('dangle', 'detach-fall');
                                                void redLine.offsetWidth;
                                                redLine.classList.add('spin-bounce');
                                                
                                                // Remove animation class after animation completes
                                                setTimeout(() => {
                                                    redLine.classList.remove('spin-bounce');
                                                }, 800);
                                            }
                                        }
                                    }
                                } catch (error) {
                                    console.error('Error logging in:', error);
                                    
                                    // Failed login
                                    currentFailedAttempts++;
                                    localStorage.setItem('login_failed_attempts', currentFailedAttempts.toString());
                                    
                                    const errorDiv = document.getElementById('login-page-error');
                                    if (errorDiv) {
                                        errorDiv.textContent = error.message || 'Login failed. Please try again.';
                                        errorDiv.classList.remove('hidden');
                                    }
                                    
                                    // Attempt 4: Show monocle and moustache
                                    if (monocle && currentFailedAttempts >= 4) {
                                        monocle.classList.add('show');
                                    }
                                    
                                    if (moustache && currentFailedAttempts >= 4) {
                                        moustache.classList.add('show');
                                    }
                                    
                                    // Animate red line
                                    if (redLine && redLineFallen) {
                                        if (currentFailedAttempts >= 3) {
                                            // Attempt 3: Detach and fall off screen
                                            redLine.classList.remove('spin-bounce', 'dangle');
                                            void redLine.offsetWidth;
                                            redLine.classList.add('detach-fall');
                                            
                                            // After animation, hide original and show fallen version
                                            setTimeout(() => {
                                                redLine.style.display = 'none';
                                                redLineFallen.classList.add('show');
                                            }, 1500);
                                        } else if (currentFailedAttempts >= 2) {
                                            // Attempt 2: Dangle
                                            redLine.classList.remove('spin-bounce', 'detach-fall');
                                            void redLine.offsetWidth;
                                            redLine.classList.add('dangle');
                                        } else {
                                            // Attempt 1: Spin and bounce
                                            redLine.classList.remove('dangle', 'detach-fall');
                                            void redLine.offsetWidth;
                                            redLine.classList.add('spin-bounce');
                                            
                                            // Remove animation class after animation completes
                                            setTimeout(() => {
                                                redLine.classList.remove('spin-bounce');
                                            }, 800);
                                        }
                                    }
                                }
                            });
                        }
                        
                        // Handle Entra ID login button
                        const entraIdBtn = document.querySelector('[data-action="login-page-entra-id"]');
                        if (entraIdBtn) {
                            entraIdBtn.addEventListener('click', handleEntraIdLogin);
                        }
                        
                        lucide.createIcons();
                    }, 100);
                    return;
                }
                
                // Restore header and navigation visibility for authenticated users
                if (state.isAuthenticated) {
                    const headerContainer = mainAppContent.parentElement;
                    const navTabs = document.getElementById('main-nav-tabs');
                    if (headerContainer) {
                        const headerDiv = headerContainer.querySelector('.flex.flex-wrap');
                        if (headerDiv) headerDiv.style.display = '';
                        if (navTabs) navTabs.style.display = '';
                        headerContainer.style.padding = '';
                    }
                    mainAppContent.className = '';
                }
                
                if (state.activeTab === 'scheduler') {
                    mainAppContent.innerHTML = getSchedulerHTML();
                    mainAppContent.className = 'flex flex-col lg:flex-row gap-8';
                    renderSupervisorFilters();
                    renderCRCCalendar();
                    renderSidebarTabs();
                    // Only refresh the sidebar lists if they currently exist in the DOM
                    if (typeof renderCRCLists === 'function' && (document.getElementById('studyList') || document.getElementById('roleList') || document.getElementById('crcList') || document.getElementById('crcSiteList'))) {
                        renderCRCLists();
                        // Initialize icons after rendering lists
                        setTimeout(() => {
                            lucide.createIcons();
                        }, 100);
                    }
                    renderUtilization();
                    renderSidebarAvailability();
                    renderNavanChecklist();
                    // Initialize map if not already initialized
                    if (typeof initializeSchedulerMap === 'function') {
                        setTimeout(() => {
                            initializeSchedulerMap();
                        }, 200);
                    }
                    // Initialize icons for toggle buttons
                    setTimeout(() => {
                        lucide.createIcons();
                    }, 100);
                } else if (state.activeTab === 'allSchedule') {
                    mainAppContent.innerHTML = getAllInclusiveScheduleHTML();
                    mainAppContent.className = 'w-full';
                    setupAllScheduleFilters();
                } else if (state.activeTab === 'studyWorkload') {
                    mainAppContent.innerHTML = getStudyWorkloadHTML();
                    mainAppContent.className = 'w-full';
                } else if (state.activeTab === 'crcs') {
                    mainAppContent.innerHTML = getCRCManagementHTML();
                    mainAppContent.className = 'w-full';
                    setupCRCSearch();
                    lucide.createIcons();
                } else if (state.activeTab === 'dashboard') {
                    // Show CRC Dashboard for non-managers, regular dashboard for managers
                    if (state.currentUser && state.currentUser.permissionLevel !== 'Manager') {
                        mainAppContent.innerHTML = getCRCDashboardHTML();
                    } else {
                        mainAppContent.innerHTML = getDashboardHTML();
                        // Initialize map when dashboard is shown
                        if (typeof initializeSchedulerMap === 'function') {
                            setTimeout(() => {
                                initializeSchedulerMap();
                            }, 100);
                        }
                        renderDashboardCharts();
                    }
                    mainAppContent.className = 'w-full';
                } else if (state.activeTab === 'reporting') {
                    mainAppContent.innerHTML = getReportingHTML();
                    mainAppContent.className = 'w-full';
                    setupReportingAutoGenerate();
                } else if (state.activeTab === 'training') {
                    mainAppContent.innerHTML = getTrainingHTML();
                    mainAppContent.className = 'w-full';
                    renderTrainingContent();
                } else if (state.activeTab === 'jennysView') {
                    mainAppContent.innerHTML = getJennysViewHTML();
                    mainAppContent.className = 'w-full';
                    renderJennysViewContent();
                } else if (state.activeTab === 'sites') {
                    mainAppContent.innerHTML = getSitesHTML();
                    mainAppContent.className = 'w-full';
                    renderSitesContent();
                } else if (state.activeTab === 'studies') {
                    mainAppContent.innerHTML = getStudiesHTML();
                    mainAppContent.className = 'w-full';
                    renderStudiesContent();
                } else if (state.activeTab === 'users') {
                    mainAppContent.innerHTML = getUsersHTML();
                    mainAppContent.className = 'w-full';
                    renderUsersContent();
                } else if (state.activeTab === 'crc-schedule') {
                    mainAppContent.innerHTML = getCRCScheduleHTML();
                    mainAppContent.className = 'w-full';
                    // Initialize CRC Schedule view
                    setTimeout(() => {
                        renderCRCScheduleView();
                        lucide.createIcons();
                    }, 100);
                } else if (state.activeTab === 'timeOff') {
                    mainAppContent.innerHTML = getTimeOffHTML();
                    mainAppContent.className = 'w-full';
                    renderTimeOffContent();
                    // Also refresh the calendar view
                    setTimeout(() => {
                        if (document.getElementById('unavailability-calendar-container')) {
                            renderUnavailabilityCalendar();
                        }
                    }, 100);
                } else if (state.activeTab === 'timeOffRequests') {
                    mainAppContent.innerHTML = getTimeOffRequestsHTML();
                    mainAppContent.className = 'w-full';
                    // Small delay to ensure DOM is ready
                    setTimeout(() => {
                    renderTimeOffRequestsContent();
                    }, 50);
                } else if (state.activeTab === 'travel') {
                    mainAppContent.innerHTML = getTravelHTML();
                    mainAppContent.className = 'w-full';
                    renderTravelContent();
                }
            };

            const refreshActiveTabContent = () => {
                if (!state.initialLoadComplete) return;
                if (!state.activeTab) return;
                if (modalContainer && !modalContainer.classList.contains('hidden')) {
                    // Avoid re-rendering while a modal is open to preserve user context
                    return;
                }
                const activeElement = document.activeElement;
                if (activeElement && mainAppContent.contains(activeElement)) {
                    return;
                }
                renderContent();
            };

            const DATA_REFRESH_INTERVAL_MS = 10 * 60 * 1000; // 10 minutes
            const NAVAN_CONNECTION_CHECK_INTERVAL_MS = 120000;
            const DEFAULT_NAVAN_PAST_DAYS = 365;
            const DEFAULT_NAVAN_FUTURE_DAYS = 180; // 6 months
            let dataRefreshTimerId = null;
            let isRefreshingData = false;

            // --- Change Logging for Catch-Up Feature ---
            const logChange = (type, details) => {
                try {
                    const change = {
                        id: crypto.randomUUID(),
                        timestamp: Date.now(),
                        type, // 'shift_created', 'shift_updated', 'shift_deleted', 'crc_reassigned', 'study_updated'
                        details
                    };
                    if (!state.changeLog) {
                        state.changeLog = [];
                    }
                    state.changeLog.push(change);
                    // Keep only last 7 days of changes
                    const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
                    state.changeLog = state.changeLog.filter(c => c.timestamp > sevenDaysAgo);
                    // Persist to localStorage
                    try {
                        localStorage.setItem('chaos_changeLog', JSON.stringify(state.changeLog));
                        console.log('Change logged:', type, details, 'Total changes:', state.changeLog.length);
                    } catch (e) {
                        console.warn('Failed to persist change log:', e);
                    }
                } catch (error) {
                    console.error('Error in logChange:', error);
                }
            };

            const loadChangeLog = () => {
                try {
                    const stored = localStorage.getItem('chaos_changeLog');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
                        state.changeLog = parsed.filter(c => c.timestamp > sevenDaysAgo);
                        console.log('Loaded change log from localStorage:', state.changeLog.length, 'changes');
                    } else {
                        state.changeLog = state.changeLog || [];
                        console.log('No change log in localStorage, initializing empty array');
                    }
                } catch (e) {
                    console.warn('Failed to load change log:', e);
                    state.changeLog = state.changeLog || [];
                }
            };

            const getChangesLast24Hours = () => {
                if (!state.changeLog) return [];
                const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);
                return state.changeLog
                    .filter(c => c.timestamp > twentyFourHoursAgo)
                    .sort((a, b) => b.timestamp - a.timestamp);
            };
            
            const getChangesByDateRange = (startDate, endDate, updatesOnly = false) => {
                if (!state.changeLog || state.changeLog.length === 0) {
                    console.log('No change log available or empty');
                    return [];
                }
                
                // Parse dates correctly - handle date strings like "2024-01-15"
                const start = startDate ? new Date(startDate + 'T00:00:00').getTime() : 0;
                const end = endDate ? new Date(endDate + 'T23:59:59').getTime() : Date.now();
                
                console.log('Filtering changes:', {
                    startDate,
                    endDate,
                    start: new Date(start).toLocaleString(),
                    end: new Date(end).toLocaleString(),
                    totalChanges: state.changeLog.length
                });
                
                let changes = state.changeLog.filter(c => {
                    const inRange = c.timestamp >= start && c.timestamp <= end;
                    if (inRange) {
                        console.log('Change in range:', c.type, new Date(c.timestamp).toLocaleString());
                    }
                    return inRange;
                });
                
                console.log('Changes after date filter:', changes.length);
                
                if (updatesOnly) {
                    // Filter to only show updates (not creations or deletions)
                    changes = changes.filter(c => 
                        c.type === 'shift_updated' || 
                        c.type === 'training_updated' || 
                        c.type === 'study_updated' ||
                        c.type === 'crc_reassigned'
                    );
                    console.log('Changes after updates-only filter:', changes.length);
                }
                
                return changes.sort((a, b) => b.timestamp - a.timestamp);
            };

            const renderCatchUpResults = (changes, startDate, endDate, updatesOnly) => {
                const container = document.getElementById('catchup-results');
                if (!container) return;
                
                if (changes.length === 0) {
                    const dateRange = startDate && endDate 
                        ? `${new Date(startDate).toLocaleDateString()} - ${new Date(endDate).toLocaleDateString()}`
                        : 'the selected date range';
                    container.innerHTML = `
                        <p class="text-gray-500 dark:text-gray-400 text-center py-4">
                            No ${updatesOnly ? 'updates' : 'changes'} found for ${dateRange}.
                        </p>
                    `;
                    return;
                }
                
                const changesHTML = changes.map(change => {
                    const formatted = formatChangeDetails(change);
                    return `
                        <div class="flex items-start gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-lg mb-2">
                            <i data-lucide="${formatted.icon}" class="w-5 h-5 ${formatted.color} mt-0.5"></i>
                            <div class="flex-1">
                                <div class="font-semibold ${formatted.color}">${formatted.title}</div>
                                <div class="text-sm text-gray-700 dark:text-gray-300 mt-1">${formatted.message}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${formatted.time}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                const dateRange = startDate && endDate 
                    ? `${new Date(startDate).toLocaleDateString()} - ${new Date(endDate).toLocaleDateString()}`
                    : 'the selected date range';
                const title = updatesOnly ? 'Updates Only' : 'All Changes';
                
                container.innerHTML = `
                    <div class="mb-2">
                        <p class="text-sm font-semibold dark:text-gray-300">${title} (${changes.length} ${changes.length === 1 ? 'change' : 'changes'})</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Date Range: ${dateRange}</p>
                    </div>
                    ${changesHTML}
                `;
                
                setTimeout(() => lucide.createIcons(), 100);
            };
            
            const formatChangeDetails = (change) => {
                const time = new Date(change.timestamp);
                const timeStr = time.toLocaleString();
                const details = change.details || {};
                
                switch (change.type) {
                    case 'shift_created':
                        return {
                            icon: 'plus-circle',
                            color: 'text-green-600 dark:text-green-400',
                            title: 'Shift Created',
                            message: `New ${details.eventType || 'shift'} scheduled${details.date ? ` for ${details.date}` : ''}${details.siteName ? ` at ${details.siteName}` : ''}${details.crcNames && details.crcNames.length > 0 ? ` with ${details.crcNames.join(', ')}` : ''}`,
                            time: timeStr
                        };
                    case 'shift_updated':
                        const updates = [];
                        if (details.crcChanged) {
                            updates.push(`CRC changed from ${details.oldCrcName || 'unassigned'} to ${details.newCrcName || 'unassigned'}`);
                        }
                        if (details.dateChanged) {
                            updates.push(`Date changed from ${details.oldDate || 'N/A'} to ${details.newDate || 'N/A'}`);
                        }
                        if (details.siteChanged) {
                            updates.push(`Site changed from ${details.oldSiteName || 'N/A'} to ${details.newSiteName || 'N/A'}`);
                        }
                        if (details.studyChanged) {
                            updates.push(`Study changed from ${details.oldStudyName || 'N/A'} to ${details.newStudyName || 'N/A'}`);
                        }
                        if (details.roleAssignmentsChanged) {
                            updates.push('Role assignments updated');
                        }

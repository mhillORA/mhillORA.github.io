<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ora Data Lens</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23052c49'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%233ebdac'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <a class="brand-mark" href="#">
          <svg width="92" height="26" viewBox="0 0 92 26" fill="none" aria-label="Ora">
            <text x="0" y="20" fill="#fff" font-family="Roboto,sans-serif" font-size="22" font-weight="700" letter-spacing="4">ORA</text>
          </svg>
        </a>
      </div>
      <nav class="nav" id="nav" aria-label="Data Lens">
        <div class="nav-label">Data Lens</div>
      </nav>
      <div class="sidebar-foot">
        <div class="scope-note">Read-only · Cosmos bd-budgets</div>
      </div>
    </aside>

    <section class="sources">
      <div class="sources-head">
        <div class="eyebrow">Data sources</div>
        <div class="sources-summary" id="enabledSummary"></div>
      </div>
      <div class="sources-presets">
        <div class="preset-label">Saved preset</div>
        <div class="chips" id="workspaces"></div>
      </div>
      <div class="source-list" id="sourceList"></div>
    </section>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">Ask your data</h1>
          <span class="scope-line" id="scopeLine"></span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-ghost" id="btnNew">New question</button>
          <button type="button" class="btn btn-secondary" id="btnSave">Save this view</button>
        </div>
      </header>

      <div class="scroll">
        <div class="stack" id="viewAsk">
          <div class="ask-box">
            <textarea id="draft" rows="3" placeholder="Ask anything across the sources you selected — enrollment pace, site performance, revenue recognition, competitive activity."></textarea>
            <div class="ask-bar">
              <div class="ask-meta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
                <span id="enabledCount"></span>
              </div>
              <button type="button" class="btn btn-accent" id="btnAsk">Ask</button>
            </div>
          </div>

          <div id="idlePanel"></div>
          <div id="thinkingPanel" class="hidden"></div>
          <div id="answerPanel" class="hidden"></div>
        </div>

        <div class="stack hidden" id="viewSaved"></div>
        <div class="stack hidden" id="viewHistory"></div>
        <div class="stack hidden" id="viewSourcesHelp"></div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

                if (eventsToExport.length === 0) {
                    showNotification('No events match the selected filters to export.', 'info');
                    return;
                }

                const headers = ['Date', 'EventType', 'CRCName', 'SiteName', 'StudyName', 'Roles', 'Hours', 'Period', 'Notes', 'VisitNumber', 'NumberOfPatients', 'PrincipalInvestigator', 'Mileage'];
                const rows = eventsToExport.map(event => {
                    const crc = state.crcs.find(c => c.id === event.crcId);
                    const site = state.crc_sites.find(s => s.id === event.siteId);
                    const studies = (event.studyIds || []).map(id => {
                        try {
                            const study = state.studies?.find(s => s.id === id);
                            // Fallback: If study not found, show studyId or skip
                            return study?.name || `Study ${id} (Not Found)`;
                        } catch (error) {
                            console.warn('Study lookup failed for studyId:', id, error);
                            return `Study ${id} (Error)`;
                        }
                    }).filter(Boolean).join('; ');
                    return [
                        event.date,
                        event.type,
                        crc ? crc.name : '',
                        site ? site.name : '',
                        studies,
                        (event.roles || []).join('; '),
                        event.hours || '',
                        event.period || 'Full Day',
                        event.notes || '',
                        event.visitNumber || '',
                        event.numberOfPatients || '',
                        event.principalInvestigator || '',
                        event.mileage || ''
                    ].map(val => `"${(val || '').toString().replace(/"/g, '""')}"`).join(',');
                });

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                const startDateStr = startDate.replace(/-/g, '');
                const endDateStr = endDate.replace(/-/g, '');

                    // Check legacy crcId

                    // Check roleAssignments

                    (
                        e.type === 'Travel Day' || // Travel Days don't need studyIds

                        e.studyIds.length > 0 &&

                // Find next scheduled shift
                const nextShifts = crcEvents

                const nextShift = nextShifts[0];
                
                // Get next 5 shifts (regardless of how far out they are)

                    .sort((a, b) => new Date(a.date) - new Date(b.date))
                    .slice(0, 5); // Get only the next 5 shifts
                
                // Get roles for next shift
                const getEventRoles = (event) => {
                    const roles = [];
                    if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                        Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                            if (Array.isArray(assignments) && assignments.includes(matchingCrcId)) {
                                const role = state.roles.find(r => r.id === roleId);
                                if (role) roles.push(role.name);
                            }
                        });
                    }
                    if (event.roles && event.roles.length > 0) {
                        event.roles.forEach(roleName => {
                            if (!roles.includes(roleName)) roles.push(roleName);
                        });
                    }
                    return roles;
                };
                
                let nextShiftHTML = '';
                let nextSiteHTML = '';
                let nextStudyHTML = '';
                let upcomingShiftsHTML = '';
                
                if (nextShift) {

                            </div>

                    const travelCrcId = travel.crcId;

            const renderCRCDashboardCalendar = () => {
                const container = document.getElementById('crc-dashboard-calendar-container');
                if (!container) return;
                
                const matchingCrcId = getLoggedInCrcId();
                if (!matchingCrcId) return;
                
                const dashboardView = state.crcDashboardView || 'mySchedule';
                const now = state.crcCalendarDate || new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const monthName = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                
                // Get events based on view selection
                let filteredEvents = [];
                if (dashboardView === 'mySchedule') {
                    // Only show this CRC's events
                    filteredEvents = (state.crc_events || []).filter(e => {
                        if (e.crcId === matchingCrcId) return true;
                        if (e.roleAssignments && Object.keys(e.roleAssignments).length > 0) {
                            return Object.values(e.roleAssignments).some(assignments => {
                                if (Array.isArray(assignments)) {
                                    return assignments.includes(matchingCrcId);
                                }
                                return false;
                            });
                        }
                        return false;
                    });
                } else {
                    // Show all events (entire schedule)
                    filteredEvents = state.crc_events || [];
                }
                
                // Filter to current month
                filteredEvents = filteredEvents.filter(e => {
                    const eventDate = new Date(e.date + 'T00:00:00');
                    return eventDate.getFullYear() === year && eventDate.getMonth() === month;
                });
                
                // Group events by date
                const eventsByDate = {};
                filteredEvents.forEach(event => {
                    if (!eventsByDate[event.date]) {
                        eventsByDate[event.date] = [];

                    eventsByDate[event.date].push(event);

                let calendarHTML = `

                }
                
                const now = state.crcCalendarDate || new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDayOfMonth = new Date(year, month, 1).getDay();
                
                // Get all events for this CRC
                const allCrcEvents = (state.crc_events || []).filter(e => {
                    // Check legacy crcId
                    if (e.crcId === matchingCrcId) return true;
                    // Check roleAssignments
                    if (e.roleAssignments && Object.keys(e.roleAssignments).length > 0) {
                        return Object.values(e.roleAssignments).some(assignments => {
                            if (Array.isArray(assignments)) {
                                return assignments.includes(matchingCrcId);
                            }
                            return false;
                        });
                    }
                    return false;
                });
                
                // Separate time off events from shift events
                const timeOffTypes = ['Unavailable', 'Paid Time Off', 'Sick Time', 'PTO', 'Vacation', 'Holiday', 'Bereavement', 'Per Diem', 'Sick', 'Jury Duty'];
                const timeOffEvents = allCrcEvents.filter(e => timeOffTypes.includes(e.type) || timeOffTypes.includes(e.name));
                
                // Shift events - must have studyIds OR be Travel Day
                const crcEvents = allCrcEvents.filter(e => 
                    !timeOffTypes.includes(e.type) && 
                    !timeOffTypes.includes(e.name) &&
                    (
                        e.type === 'Travel Day' || // Travel Days don't need studyIds
                        (e.studyIds && 
                        Array.isArray(e.studyIds) && 
                        e.studyIds.length > 0 && 
                        e.studyIds.filter(Boolean).length > 0)
                    )
                );
                
                // Also get time off requests for this CRC
                const crcTimeOffRequests = (state.timeOffRequests || []).filter(req => 
                    (req.crcId === matchingCrcId || req.requestedBy === matchingCrcId) &&
                    req.status !== 'rejected'
                );
                
                // Group events by date, deduplicating travel days (only show one per date)
                const eventsByDate = {};
                const travelDaysSeen = new Set(); // Track travel days by date to prevent duplicates
                
                crcEvents.forEach(event => {
                    if (!eventsByDate[event.date]) {
                        eventsByDate[event.date] = { shifts: [], timeOff: [] };
                    }
                    
                    // For Travel Day events, only add if we haven't seen a travel day for this date yet
                    if (event.type === 'Travel Day') {
                        if (!travelDaysSeen.has(event.date)) {
                            eventsByDate[event.date].shifts.push(event);
                            travelDaysSeen.add(event.date);
                        }
                    } else {
                        eventsByDate[event.date].shifts.push(event);
                    }
                });
                
                // Add time off events
                timeOffEvents.forEach(event => {
                    if (!eventsByDate[event.date]) {
                        eventsByDate[event.date] = { shifts: [], timeOff: [] };
                    }
                    eventsByDate[event.date].timeOff.push(event);
                });
                
                // Add time off requests (they might span multiple days)
                crcTimeOffRequests.forEach(req => {
                    const startDate = parseDateFlexible(req.startDate);
                    const endDate = parseDateFlexible(req.endDate || req.startDate);
                    if (startDate && endDate) {
                        const cursor = new Date(startDate);
                        while (cursor <= endDate) {
                            const dateStr = toDateOnlyString(cursor);
                            if (!eventsByDate[dateStr]) {
                                eventsByDate[dateStr] = { shifts: [], timeOff: [] };
                            }
                            // Only add if not already added as an event
                            const alreadyExists = eventsByDate[dateStr].timeOff.some(e => 
                                e.requestId === req.id || e.id === req.id
                            );
                            if (!alreadyExists) {
                                eventsByDate[dateStr].timeOff.push({
                                    ...req,
                                    requestId: req.id,
                                    type: req.type || req.name || 'Time Off',
                                    isRequest: true
                                });
                            }
                            cursor.setDate(cursor.getDate() + 1);
                        }
                    }
                });
                
                // Build calendar HTML
                let calendarHTML = `
                    <div class="grid grid-cols-7 gap-2 mb-2">
                        ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => 
                            `<div class="text-center font-semibold text-gray-700 dark:text-gray-300 py-2">${day}</div>`
                        ).join('')}
                    </div>
                    <div class="grid grid-cols-7 gap-2">
                `;
                
                // Empty cells for days before month starts
                for (let i = 0; i < firstDayOfMonth; i++) {
                    calendarHTML += `<div class="min-h-[100px] border border-gray-200 dark:border-gray-700 rounded-md bg-gray-50 dark:bg-gray-900/40"></div>`;
                }
                
                // Days of the month
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayData = eventsByDate[dateStr] || { shifts: [], timeOff: [] };
                    const isToday = dateStr === toDateOnlyString(new Date());
                    
                    calendarHTML += `
                        <div class="min-h-[100px] border ${isToday ? 'border-blue-500 border-2' : 'border-gray-200 dark:border-gray-700'} rounded-md bg-white dark:bg-gray-800 p-2 ${isToday ? 'bg-blue-50 dark:bg-blue-900/20' : ''}">
                            <div class="text-sm font-semibold mb-1 ${isToday ? 'text-blue-600 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'}">${day}</div>
                            <div class="space-y-1">
                                ${dayData.timeOff.map(event => {
                                    const typeDisplay = 'Time Off';
                                    const statusBadge = event.isRequest ? 
                                        (event.status === 'pending' ? ' (Pending)' : event.status === 'approved' ? ' ✓' : '') : '';
                                    // Color scheme based on status only: approved = green, pending/submitted = blue, rejected = red
                                    const normalizedStatus = normalizeTimeOffStatus(event.status);
                                    let bgColor = '#3b82f6'; // default blue for pending/submitted
                                    if (normalizedStatus === 'approved') {
                                        bgColor = '#10b981'; // green for approved
                                    } else if (normalizedStatus === 'rejected') {
                                        bgColor = '#ef4444'; // red for rejected
                                    } else {
                                        bgColor = '#3b82f6'; // blue for pending/submitted
                                    }
                                    const periodDisplay = event.period && event.period !== 'Full Day' ? event.period : '';
                                    
                                    return `
                                        <div class="text-xs p-1 rounded cursor-pointer hover:opacity-80 transition-opacity" 
                                             style="background-color: ${bgColor}; color: white;"
                                             title="${typeDisplay}${statusBadge}${periodDisplay ? ' - ' + periodDisplay : ''}">
                                            <div class="font-medium truncate">🏖 ${typeDisplay}${statusBadge}</div>
                                            ${periodDisplay ? `<div class="text-[10px] opacity-75">${periodDisplay}</div>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                                ${dayData.shifts.map(event => {
                                    const site = state.crc_sites.find(s => s.id === event.siteId);
                                    const studies = (event.studyIds || []).map(id => state.studies.find(s => s.id === id)).filter(Boolean);
                                    const studyNames = studies.map(s => s.title || s.name).join(', ') || 'No study';
                                    const pi = event.principalInvestigator || (site && site.principalInvestigator) || '';
                                    // Use blue for Travel Day to distinguish from time off colors (amber/green/red)
                                    const bgColor = event.type === 'Travel Day' ? '#3b82f6' : '#8b5cf6';
                                    
                                    return `
                                        <div class="text-xs p-1 rounded cursor-pointer hover:opacity-80 transition-opacity" 
                                             style="background-color: ${bgColor}; color: white;"
                                             data-action="view-crc-schedule-event" 
                                             data-event-id="${event.id}"
                                             title="${event.type} - ${site ? site.name : 'Unknown Site'}${pi ? ' - PI: ' + pi : ''} - ${studyNames}">
                                            <div class="font-medium truncate">${event.type === 'Travel Day' ? '✈ Travel' : (site ? site.name : 'Unknown')}</div>
                                            ${pi ? `<div class="text-[10px] opacity-90 truncate">PI: ${pi}</div>` : ''}
                                            <div class="text-[10px] opacity-90 truncate">${studyNames}</div>
                                            ${event.period ? `<div class="text-[10px] opacity-75">${event.period}</div>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }
                
                calendarHTML += `</div>`;
                container.innerHTML = calendarHTML;
                
                // Add event listeners for event clicks
                container.querySelectorAll('[data-action="view-crc-schedule-event"]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const eventId = btn.dataset.eventId;
                        const event = state.crc_events.find(e => e.id === eventId);
                        if (event) {
                            showCRCScheduleEventDetails(event, matchingCrcId);
                        }
                    });
                });
            };

            const showCRCScheduleEventDetails = (event, currentCrcId) => {
                const site = state.crc_sites.find(s => s.id === event.siteId);
                const studies = (event.studyIds || []).map(id => state.studies.find(s => s.id === id)).filter(Boolean);
                const studyNames = studies.map(s => s.title || s.name).join(', ') || 'No study';
                
                // Get all CRCs assigned to this event
                const assignedCrcs = [];
                if (event.crcId && event.crcId !== 'SITE_STAFF' && event.crcId !== 'UNASSIGNED') {
                    const crc = state.crcs.find(c => c.id === event.crcId);
                    if (crc) assignedCrcs.push({ crc, roles: event.roles || [] });
                }
                
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                        if (Array.isArray(assignments)) {
                            assignments.forEach(crcId => {
                                if (crcId && crcId !== 'SITE_STAFF' && crcId !== 'UNASSIGNED' && !assignedCrcs.find(ac => ac.crc.id === crcId)) {
                                    const crc = state.crcs.find(c => c.id === crcId);
                                    const role = state.roles.find(r => r.id === roleId);
                                    if (crc) {
                                        const existing = assignedCrcs.find(ac => ac.crc.id === crcId);
                                        if (existing) {
                                            if (role) existing.roles.push(role.name);
                                        } else {
                                            assignedCrcs.push({ crc, roles: role ? [role.name] : [] });
                                        }
                                    }
                                }
                            });
                        }
                    });
                }
                
                // Remove duplicates and sort
                const uniqueCrcs = [];
                assignedCrcs.forEach(({ crc, roles }) => {
                    const existing = uniqueCrcs.find(uc => uc.crc.id === crc.id);
                    if (existing) {
                        roles.forEach(role => {
                            if (!existing.roles.includes(role)) existing.roles.push(role);
                        });
                    } else {
                        uniqueCrcs.push({ crc, roles });
                    }
                });
                
                
                openModal(`
                    <h3 class="text-xl font-bold dark:text-white mb-4">Shift Details</h3>
                    <div class="space-y-4">
                        <div>
                            <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Date</div>
                            <div class="text-gray-900 dark:text-white">${formatDisplayDate(event.date)}</div>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Type</div>
                            <div class="text-gray-900 dark:text-white">${event.type}</div>
                        </div>
                        ${site ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Site</div>
                                <div class="text-gray-900 dark:text-white">${site.name}</div>
                                ${site.city || site.state ? `
                                    <div class="text-sm text-gray-600 dark:text-gray-400 mt-1">${[site.city, site.state].filter(Boolean).join(', ')}</div>
                                ` : ''}
                            </div>
                        ` : ''}
                        ${(event.principalInvestigator || (site && site.principalInvestigator)) ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Principal Investigator</div>
                                <div class="text-gray-900 dark:text-white">${event.principalInvestigator || site.principalInvestigator || 'Unknown PI'}</div>
                            </div>
                        ` : ''}
                        <div>
                            <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Study</div>
                            <div class="text-gray-900 dark:text-white">${studyNames}</div>
                        </div>
                        ${event.hours ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Hours</div>
                                <div class="text-gray-900 dark:text-white">${event.hours}</div>
                            </div>
                        ` : ''}
                        ${event.period ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Time</div>
                                <div class="text-gray-900 dark:text-white">${event.period}</div>
                            </div>
                        ` : ''}
                        ${uniqueCrcs.length > 0 ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Staff Count</div>
                                <div class="text-gray-900 dark:text-white">${uniqueCrcs.length}</div>
                            </div>
                        ` : ''}
                        ${event.visitNumber ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Visit</div>
                                <div class="text-gray-900 dark:text-white">${getVisitDisplayName(event.visitNumber, event.studyIds)}</div>
                            </div>
                        ` : ''}
                        ${event.numberOfPatients ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Number of Patients</div>
                                <div class="text-gray-900 dark:text-white">${event.numberOfPatients}</div>
                            </div>
                        ` : ''}
                        ${event.groupNumber ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Group</div>
                                <div class="text-gray-900 dark:text-white">${event.groupNumber}</div>
                            </div>
                        ` : ''}
                        ${uniqueCrcs.length > 0 ? `
                            <div>
                                <div class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Staff on This Shift</div>
                                <div class="space-y-1 max-h-60 overflow-y-auto">
                                    ${uniqueCrcs.map(({ crc, roles }) => {
                                        const isCurrentUser = crc.id === currentCrcId;
                                        return `
                                        <div class="p-2 ${isCurrentUser ? 'bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700' : 'bg-gray-50 dark:bg-gray-700'} rounded-md">
                                            <div class="font-medium ${isCurrentUser ? 'text-blue-900 dark:text-blue-200' : 'text-gray-700 dark:text-gray-300'}">
                                                ${crc.name}${isCurrentUser ? ' (You)' : ''}
                                            </div>
                                            ${roles.length > 0 ? `<div class="text-xs text-gray-600 dark:text-gray-400 mt-1">${roles.join(', ')}</div>` : ''}
                                        </div>
                                    `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : '<div class="text-sm text-gray-600 dark:text-gray-400">No staff assigned</div>'}
                    </div>
                `, 'lg');
            };

            const getReportingHTML = () => {
                const today = new Date();
                const currentYear = today.getFullYear();
                const currentMonthIndex = today.getMonth();
                // Map to create year options for the last 5 years
                const yearOptions = Array.from({length: 5}, (_, i) => currentYear - i)
                    .map(y => `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}</option>`)
                    .join('');
                // Map to create month options (preselect current month)
                const monthOptions = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
                    .map((m, i) => `<option value="${i}" ${i === currentMonthIndex ? 'selected' : ''}>${m}</option>`)
                    .join('');
                // Map to create CRC options (preselect all by default)
                const crcOptions = state.crcs.map(crc => `<option value="${crc.id}" selected>${crc.name}</option>`).join('');
                const currentMonthValue = `${currentYear}-${String(currentMonthIndex + 1).padStart(2, '0')}`;
                const timeOffStartValue = state.timeOffReportStartMonth || currentMonthValue;
                const timeOffEndValue = state.timeOffReportEndMonth || currentMonthValue;
                const defaultTimeOffCrcs = state.crcs.map(crc => crc.id);
                const selectedTimeOffCrcs = (state.timeOffReportSelectedCrcs && state.timeOffReportSelectedCrcs.length > 0) ? state.timeOffReportSelectedCrcs : defaultTimeOffCrcs;
                const selectedTimeOffStatuses = (state.timeOffReportStatuses && state.timeOffReportStatuses.length > 0) ? state.timeOffReportStatuses : ['pending', 'approved', 'rejected'];
                const timeOffStatusOptions = [
                    { value: 'pending', label: 'Pending Review' },
                    { value: 'approved', label: 'Approved' },
                    { value: 'rejected', label: 'Rejected' }
                ];

                return `
                <div class="w-full bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md">
                    <h3 class="text-xl font-bold mb-2">Utilization Reporting</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3 p-3 bg-gray-50 dark:bg-gray-900/50 rounded-lg border dark:border-gray-700 mb-2">
                        <div>
                            <label for="report-year-filter" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Year</label>
                            <select id="report-year-filter" class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white">
                                ${yearOptions}
                            </select>
                        </div>
                        <div>
                            <label for="report-month-filter" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Months</label>
                            <input type="text" id="month-search" placeholder="Search months..." class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white mb-1">
                            <select id="report-month-filter" multiple class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white h-24">
                                ${monthOptions}
                            </select>
                        </div>
                        <div>
                            <label for="report-crc-filter" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">CRCs</label>
                            <input type="text" id="crc-search" placeholder="Search CRCs..." class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white mb-1">
                            <select id="report-crc-filter" multiple class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white h-24">
                                ${crcOptions}
                            </select>
                        </div>
                        <div>
                            <label for="report-site-filter" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Sites</label>
                            <input type="text" id="site-search" placeholder="Search sites..." class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white mb-1">
                            <select id="report-site-filter" multiple class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white h-24">
                                ${state.crc_sites.map(site => `<option value="${site.id}" selected>${site.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label for="report-study-filter" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Studies</label>
                            <input type="text" id="study-search" placeholder="Search studies..." class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white mb-1">
                            <select id="report-study-filter" multiple class="w-full p-1.5 text-sm border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white h-24">
                                ${state.studies.map(study => `<option value="${study.id}" selected>${study.name}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 mb-1">
                        <button data-action="generate-utilization-report" class="bg-blue-600 text-white py-1.5 px-3 text-sm rounded-md hover:bg-blue-700">Generate Report</button>
                        <button data-action="reset-report-filters" class="bg-gray-600 text-white py-1.5 px-3 text-sm rounded-md hover:bg-gray-700">Reset Filters</button>
                        <button id="export-utilization-report-btn" data-action="export-utilization-report" class="bg-green-600 text-white py-1.5 px-3 text-sm rounded-md hover:bg-green-700 flex items-center gap-1 hidden">
                             <i data-lucide="download" class="w-3 h-3"></i>Export CSV
                        </button>
                    </div>
                    <div id="report-results-container" class="mt-1"></div>
                    <div class="mt-8 pt-4 border-t border-gray-200 dark:border-gray-700">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
                            <div>
                                <h3 class="text-xl font-bold">Time Off Reporting</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400">Summaries of pending and approved time off by CRC and month.</p>
                            </div>
                            <div class="text-xs text-gray-500 dark:text-gray-400">
                                Tip: adjust the month range and statuses, then export the monthly breakdown to CSV.
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-3 p-3 bg-indigo-50 dark:bg-indigo-900/30 rounded-lg border border-indigo-200 dark:border-indigo-700">
                            <div>
                                <label for="timeoff-report-start" class="block text-xs font-medium text-indigo-900 dark:text-indigo-200 mb-1">Start Month</label>
                                <input type="month" id="timeoff-report-start" value="${timeOffStartValue}" class="w-full p-1.5 text-sm border border-indigo-300 dark:border-indigo-600 rounded-md bg-white dark:bg-indigo-900/40 dark:text-indigo-100">
                            </div>
                            <div>
                                <label for="timeoff-report-end" class="block text-xs font-medium text-indigo-900 dark:text-indigo-200 mb-1">End Month</label>
                                <input type="month" id="timeoff-report-end" value="${timeOffEndValue}" class="w-full p-1.5 text-sm border border-indigo-300 dark:border-indigo-600 rounded-md bg-white dark:bg-indigo-900/40 dark:text-indigo-100">
                            </div>
                            <div class="md:col-span-2 xl:col-span-2">
                                <label class="block text-xs font-medium text-indigo-900 dark:text-indigo-200 mb-1">Statuses</label>
                                <div class="flex flex-wrap gap-2">
                                    ${timeOffStatusOptions.map(option => `
                                        <label class="inline-flex items-center gap-2 px-2 py-1 bg-white/80 dark:bg-indigo-900/60 border border-indigo-200 dark:border-indigo-700 rounded-md text-sm text-indigo-900 dark:text-indigo-100">
                                            <input type="checkbox" name="timeoff-status" value="${option.value}" ${selectedTimeOffStatuses.includes(option.value) ? 'checked' : ''} class="rounded border-indigo-300 text-indigo-600 focus:ring-indigo-500">
                                            <span>${option.label}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="md:col-span-2 xl:col-span-1">
                                <label for="timeoff-report-crc-filter" class="block text-xs font-medium text-indigo-900 dark:text-indigo-200 mb-1">CRCs</label>
                                <input type="text" id="timeoff-crc-search" placeholder="Search CRCs..." class="w-full p-1.5 text-sm border border-indigo-300 dark:border-indigo-600 rounded-md bg-white dark:bg-indigo-900/40 dark:text-indigo-100 mb-1">
                                <select id="timeoff-report-crc-filter" multiple class="w-full p-1.5 text-sm border border-indigo-300 dark:border-indigo-600 rounded-md bg-white dark:bg-indigo-900/40 dark:text-indigo-100 h-28">
                                    ${state.crcs.map(crc => `<option value="${crc.id}" ${selectedTimeOffCrcs.includes(crc.id) ? 'selected' : ''}>${crc.name}</option>`).join('')}
                                </select>
                                <p class="text-[10px] text-indigo-800/70 dark:text-indigo-200/70 mt-1">Hold Ctrl/Cmd to select multiple.</p>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-3 mt-3">
                            <button data-action="generate-timeoff-report" class="bg-indigo-600 text-white py-1.5 px-3 text-sm rounded-md hover:bg-indigo-700 flex items-center gap-1">
                                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>Generate Time Off Report
                            </button>
                            <button data-action="reset-timeoff-report-filters" class="bg-indigo-100 text-indigo-800 py-1.5 px-3 text-sm rounded-md hover:bg-indigo-200 dark:bg-indigo-800/60 dark:text-indigo-100 dark:hover:bg-indigo-800 flex items-center gap-1">
                                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>Reset Time Off Filters
                            </button>
                            <button id="export-timeoff-report-btn" data-action="export-timeoff-report" class="bg-green-600 text-white py-1.5 px-3 text-sm rounded-md hover:bg-green-700 flex items-center gap-1 hidden">
                                <i data-lucide="download" class="w-3.5 h-3.5"></i>Export Months CSV
                            </button>
                        </div>
                        <div id="timeoff-report-results" class="mt-4"></div>
                    </div>
                </div>
            `;
            };

            const getAllInclusiveScheduleHTML = () => {
                // Check if current user is CRC and find matching CRC
                const isCRCUser = state.currentUser && state.currentUser.permissionLevel === 'CRC';
                const matchingCrcId = getLoggedInCrcId();
                // Check permissions for edit/delete buttons - CRC users cannot edit/delete events
                const isManager = state.currentUser && state.currentUser.permissionLevel === 'Manager';
                const isCRC = state.currentUser && getEffectivePermissionLevel() === 'CRC' && !isAdminUser();
                const canEditEvents = !isCRC && (canEdit() || isManager);
                const canDeleteEvents = !isCRC && (canDelete() || isManager);
                
                // Initialize filters from state if they don't exist
                if (!state.allScheduleFilters) {
                    const today = new Date();
                    state.allScheduleFilters = {
                        crc: isCRCUser && matchingCrcId ? matchingCrcId : 'all',
                        site: 'all',
                        study: 'all',
                        eventType: 'all',
                        startDate: toDateOnlyString(new Date(today.getFullYear(), today.getMonth(), 1)),
                        endDate: toDateOnlyString(new Date(today.getFullYear(), today.getMonth() + 1, 0))
                    };
                } else if (isCRCUser && matchingCrcId) {
                    // Force CRC filter to their own schedule
                    state.allScheduleFilters.crc = matchingCrcId;
                }
                
                // Get filtered events based on permissions
                let baseEvents = getFilteredEvents();
                
                // For CRC users, filter to ONLY their events BEFORE date filtering (check both crcId and roleAssignments)
                if (isCRCUser && matchingCrcId) {
                    baseEvents = baseEvents.filter(e => {
                        // Check legacy crcId
                        if (e.crcId === matchingCrcId) return true;
                        // Check roleAssignments
                        if (e.roleAssignments && Object.keys(e.roleAssignments).length > 0) {
                            return Object.values(e.roleAssignments).some(assignments => {
                                if (Array.isArray(assignments)) {
                                    return assignments.includes(matchingCrcId);
                                }
                                return false;
                            });
                        }
                        return false;
                    });
                }
                
                let filteredEvents = baseEvents.filter(event => {
                    const eventDate = new Date(event.date + 'T00:00:00');
                    const startDate = new Date(state.allScheduleFilters.startDate + 'T00:00:00');
                    const endDate = new Date(state.allScheduleFilters.endDate + 'T23:59:59');
                    return eventDate >= startDate && eventDate <= endDate;
                });

                // Add time off requests as events for display
                // Use a Set to track unique PTO event IDs to prevent duplicates
                // Also track by CRC ID and date to ensure only one PTO event per CRC per day
                const ptoEventIds = new Set();
                const ptoEventKeys = new Set(); // Track by crcId-date combination
                const timeOffRequests = state.timeOffRequests || [];
                
                // First, check if there are any actual PTO events in baseEvents to avoid duplicates
                const existingPtoEvents = new Set();
                baseEvents.forEach(event => {
                    if (event.type === 'Paid Time Off' || event.type === 'PTO' || event.isPTORequest) {
                        const key = `${event.crcId}-${event.date}`;
                        existingPtoEvents.add(key);
                    }
                });
                
                timeOffRequests.forEach(request => {
                    if (!request.crcId) return;
                    
                    // Only show pending and approved time off requests as PTO events
                    const requestStatus = normalizeTimeOffStatus(request.status);
                    if (requestStatus !== 'pending' && requestStatus !== 'approved') return;
                    
                    const requestStart = parseDateFlexible(request.startDate || request.date);
                    const requestEnd = parseDateFlexible(request.endDate || request.startDate || request.date);
                    if (!requestStart) return;
                    
                    const filterStart = new Date(state.allScheduleFilters.startDate + 'T00:00:00');
                    const filterEnd = new Date(state.allScheduleFilters.endDate + 'T23:59:59');
                    
                    // Create an event for each day in the time off request range
                    const currentDate = new Date(requestStart);
                    const endDateObj = requestEnd ? new Date(requestEnd) : new Date(requestStart);
                    
                    while (currentDate <= endDateObj) {
                        const dateStr = toDateOnlyString(currentDate);
                        const dateObj = new Date(dateStr + 'T00:00:00');
                        
                        // Check if this date is within the filter range
                        if (dateObj >= filterStart && dateObj <= filterEnd) {
                            // Create a unique ID for this PTO event
                            const ptoEventId = `pto-${request.id}-${dateStr}`;
                            // Also create a key for CRC-date combination to ensure only one per day
                            const ptoEventKey = `${request.crcId}-${dateStr}`;
                            
                            // Only add if:
                            // 1. We haven't already added this specific PTO event ID
                            // 2. We haven't already added a PTO event for this CRC on this date
                            // 3. There isn't already an actual PTO event in baseEvents for this CRC on this date
                            if (!ptoEventIds.has(ptoEventId) && 
                                !ptoEventKeys.has(ptoEventKey) && 
                                !existingPtoEvents.has(ptoEventKey)) {
                                ptoEventIds.add(ptoEventId);
                                ptoEventKeys.add(ptoEventKey);
                                
                                // Create a pseudo-event for the time off request
                                const ptoEvent = {
                                    id: ptoEventId,
                                    crcId: request.crcId,
                                    date: dateStr,
                                    type: 'Time Off', // Category is always 'Time Off'
                                    name: request.type || 'Time Off',
                                    period: request.period || 'Full Day',
                                    hours: request.hours || 8,
                                    notes: request.reason || request.notes || '',
                                    ptoRequestId: request.id,
                                    ptoStatus: normalizeTimeOffStatus(request.status),
                                    ptoStatusLabel: formatTimeOffStatus(request.status),
                                    ptoType: request.type || 'Time Off', // Subcategory like 'Vacation'
                                    isPTORequest: true
                                };
                                filteredEvents.push(ptoEvent);
                            }
                        }
                        
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                });

                // Apply filters
                if (state.allScheduleFilters.crc !== 'all') {
                    filteredEvents = filteredEvents.filter(e => eventBelongsToCrc(e, state.allScheduleFilters.crc));
                }
                if (state.allScheduleFilters.site !== 'all') {
                    filteredEvents = filteredEvents.filter(e => e.siteId === state.allScheduleFilters.site);
                }
                if (state.allScheduleFilters.study !== 'all') {
                    filteredEvents = filteredEvents.filter(e => (e.studyIds || []).includes(state.allScheduleFilters.study));
                }
                if (state.allScheduleFilters.eventType !== 'all') {
                    if (state.allScheduleFilters.eventType === 'Time Off') {
                        filteredEvents = filteredEvents.filter(e => {
                            if (e.isPTORequest) return true;
                            const t = (e.type || '').toString().trim().toLowerCase();
                            return [
                                'time off',
                                'unavailable',
                                'paid time off',
                                'pto',
                                'sick time',
                                'vacation',
                                'per diem',
                                'holiday',
                                'bereavement',
                                'jury duty'
                            ].includes(t);
                        });
                    } else {
                        filteredEvents = filteredEvents.filter(e => e.type === state.allScheduleFilters.eventType);
                    }
                }

                // Filter out N/A entries - events with no crcId and no valid roleAssignments (unless it's a PTO request or Open Shift)
                filteredEvents = filteredEvents.filter(event => {
                    // PTO requests are always valid (they have crcId)
                    if (event.isPTORequest) return true;
                    
                    // Open Shift and Site Staff are valid
                    if (event.crcId === 'UNASSIGNED' || event.crcId === 'SITE_STAFF' || event.type === 'Open Shift') return true;
                    
                    // If event has a valid crcId, it's valid
                    if (event.crcId && event.crcId !== 'UNASSIGNED' && event.crcId !== 'SITE_STAFF') return true;
                    
                    // If event has valid roleAssignments, it's valid
                    if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                        const hasValidAssignment = Object.values(event.roleAssignments).some(assignments => {
                            if (Array.isArray(assignments)) {
                                return assignments.some(crcId => 
                                    crcId && 
                                    typeof crcId === 'string' &&
                                    crcId.trim() !== '' &&
                                    crcId !== 'SITE_STAFF' && 
                                    crcId !== 'UNASSIGNED'
                                );
                            }
                            return false;
                        });
                        if (hasValidAssignment) return true;
                    }
                    
                    // Otherwise, filter it out (it's an N/A entry)
                    return false;
                });

                // Group events by date
                const eventsByDate = {};
                filteredEvents.forEach(event => {
                    if (!eventsByDate[event.date]) {
                        eventsByDate[event.date] = [];
                    }
                    eventsByDate[event.date].push(event);
                });

                // Sort dates
                const sortedDates = Object.keys(eventsByDate).sort();

                let scheduleHTML = `
                    <div class="w-full bg-white dark:bg-gray-800 p-4 rounded-lg shadow-md">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="text-xl font-bold dark:text-gray-200">All-Inclusive Schedule View</h3>
                                <p class="text-sm text-gray-600 dark:text-gray-400">Complete schedule showing all CRCs, positions, sites, and studies at a glance</p>
                            </div>
                            ${!isCRCUser ? `
                            <button data-action="reset-all-schedule-filters" class="text-sm bg-gray-500 text-white px-3 py-1 rounded-md hover:bg-gray-600">
                                <i data-lucide="refresh-cw" class="w-4 h-4 inline mr-1"></i>Reset Filters
                            </button>
                            ` : ''}
                        </div>
                        
                        <!-- Filters -->
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg" ${isCRCUser ? 'style="display: none;"' : ''}>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Start Date</label>
                                <input type="date" id="all-schedule-start-date" value="${state.allScheduleFilters.startDate}" class="w-full p-2 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">End Date</label>
                                <input type="date" id="all-schedule-end-date" value="${state.allScheduleFilters.endDate}" class="w-full p-2 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">CRC</label>
                                <select id="all-schedule-crc-filter" class="w-full p-2 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white">
                                    <option value="all">All CRCs</option>
                                    ${state.crcs.map(crc => `<option value="${crc.id}" ${state.allScheduleFilters.crc === crc.id ? 'selected' : ''}>${crc.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Site</label>
                                <select id="all-schedule-site-filter" class="w-full p-2 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white">
                                    <option value="all">All Sites</option>
                                    ${getFilteredSites().map(site => `<option value="${site.id}" ${state.allScheduleFilters.site === site.id ? 'selected' : ''}>${site.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Study</label>
                                <select id="all-schedule-study-filter" class="w-full p-2 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white">
                                    <option value="all">All Studies</option>
                                    ${getFilteredStudies().map(study => `<option value="${study.id}" ${state.allScheduleFilters.study === study.id ? 'selected' : ''}>${study.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Event Type</label>
                                <select id="all-schedule-type-filter" class="w-full p-2 text-sm border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white">
                                    <option value="all">All Types</option>
                                    <option value="Site Assignment" ${state.allScheduleFilters.eventType === 'Site Assignment' ? 'selected' : ''}>Site Assignment</option>
                                    <option value="Travel Day" ${state.allScheduleFilters.eventType === 'Travel Day' ? 'selected' : ''}>Travel Day</option>
                                    <option value="Paid Time Off" ${state.allScheduleFilters.eventType === 'Paid Time Off' ? 'selected' : ''}>Paid Time Off</option>
                                    <option value="Time Off" ${state.allScheduleFilters.eventType === 'Time Off' ? 'selected' : ''}>Time Off</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-4 flex justify-between items-center">
                            <p class="text-sm text-gray-600 dark:text-gray-400">Showing <strong>${filteredEvents.length}</strong> events</p>
                            <div class="flex gap-2">
                                ${canDeleteEvents ? `
                                <button id="bulk-delete-events-btn" data-action="bulk-delete-all-schedule-events" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 flex items-center text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                                    <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>Delete Selected (<span id="selected-count">0</span>)
                                </button>
                                ` : ''}
                                <button data-action="export-all-schedule" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 flex items-center text-sm">
                                    <i data-lucide="download" class="w-4 h-4 mr-2"></i>Export to CSV
                                </button>
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto border border-gray-300 dark:border-gray-600 rounded-lg">
                            <table class="min-w-full border-collapse">
                                <thead class="bg-gray-100 dark:bg-gray-800">
                                    <tr>
                                        ${canDeleteEvents ? `
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800 w-12">
                                            <input type="checkbox" id="select-all-events" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" title="Select all events shown">
                                        </th>
                                        ` : ''}
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800 sticky left-0 z-10">Date</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Event Type</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">CRC Name</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Position/Role</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Visit</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Group</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Staffing</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Site</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Study</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Time Off/PTO</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Hours</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Period</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Status</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Record IDs</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Notes</th>
                                        <th class="border border-gray-300 dark:border-gray-600 px-4 py-3 text-left text-xs font-semibold text-gray-900 dark:text-white uppercase tracking-wider bg-gray-100 dark:bg-gray-800">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white dark:bg-gray-900">
                `;

                if (sortedDates.length === 0) {
                    scheduleHTML += `
                        <tr>
                            <td colspan="${canDeleteEvents ? '17' : '16'}" class="border border-gray-300 dark:border-gray-600 px-4 py-4 text-center text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-900">No events found for the selected filters</td>
                        </tr>
                    `;
                } else {
                    sortedDates.forEach(date => {
                        const events = eventsByDate[date];
                        const formattedDate = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { 
                            weekday: 'short', 
                            month: 'short', 
                            day: 'numeric' 
                        });
                        
                        events.forEach((event, index) => {
                            const crc = state.crcs.find(c => c.id === event.crcId);
                            const site = state.crc_sites.find(s => s.id === event.siteId);
                            const studies = event.studyIds ? event.studyIds.map(studyId => {
                                try {
                                    const study = state.studies?.find(s => s.id === studyId);
                                    // Fallback: If study not found, show studyId or "Unknown Study"
                                    return study ? (study.title || study.name) : `Study ${studyId} (Not Found)`;
                                } catch (error) {
                                    console.warn('Study lookup failed for studyId:', studyId, error);
                                    return `Study ${studyId} (Error)`;
                                }
                            }).join(', ') : 'None';
                            const roles = getEventRoles(event);
                            
                            // Check if this is a PTO event
                            const isPTO = event.isPTORequest || event.type === 'Time Off' || event.type === 'Paid Time Off';
                            const timeOffSubcategory = event.ptoType || event.name || (isPTO ? 'Time Off' : null);
                            
                            // Check if event is understaffed
                            const isUnderstaffed = !isPTO && event.type !== 'Travel Day' && isEventUnderstaffed(event);
                            
                            // Handle Site Staff / Unassigned / Open Shift display
                            let crcDisplayName = 'Open until filled';
                            if (event.crcId === 'SITE_STAFF') {
                                crcDisplayName = 'Site Staff';
                            } else if (event.crcId === 'UNASSIGNED') {
                                crcDisplayName = 'Open until filled';
                            } else if (crc) {
                                crcDisplayName = crc.name;
                            }
                            if (event.type === 'Open Shift') {
                                crcDisplayName = 'Open until filled';
                            }
                            
                            const visitDisplay = isPTO
                                ? 'Not applicable'
                                : (event.visitNumber ? getVisitDisplayName(event.visitNumber, event.studyIds) : 'Not set');
                            
                            const groupDisplay = isPTO
                                ? 'Not applicable'
                                : (event.groupNumber ? String(event.groupNumber) : 'Not set');
                            
                            // Staffing summary (shifts only)
                            let staffingDisplay = 'Not applicable';
                            let statusDisplay = '';
                            if (!isPTO && event.type !== 'Travel Day') {
                                if (event.type === 'Open Shift' || event.crcId === 'UNASSIGNED' || event.crcId === null) {
                                    staffingDisplay = 'Open until filled';
                                    statusDisplay = 'Open until filled';
                                } else {
                                    try {
                                        const roleFulfillment = checkRoleFulfillment(event);
                                        const assignedCount = getEventCRCs(event).length;
                                        const missingCount = roleFulfillment?.totalUnfilled || 0;
                                        const requiredCount = assignedCount + missingCount;
                                        staffingDisplay = requiredCount > 0 ? `${assignedCount}/${requiredCount}` : `${assignedCount}/Unknown`;
                                        statusDisplay = roleFulfillment?.fulfilled ? 'Filled' : `Needs ${missingCount}`;

                                        staffingDisplay = 'Unknown';
                                        statusDisplay = 'Unknown';
                                    }
                                }
                            } else if (isPTO) {
                                staffingDisplay = 'Not applicable';
                                statusDisplay = event.ptoStatusLabel || (event.ptoStatus ? String(event.ptoStatus) : 'Time Off');
                            } else {
                                staffingDisplay = 'Not applicable';
                                statusDisplay = event.type || 'Event';
                            }
                            
                            // Record IDs (always show something actionable)
                            const shortId = (value) => {
                                if (!value || typeof value !== 'string') return 'Unknown';
                                return value.length > 10 ? `${value.slice(0, 10)}…` : value;
                            };
                            const recordIdsDisplay = isPTO
                                ? `PTO Req: ${shortId(event.ptoRequestId || event.id)}`
                                : `Event: ${shortId(event.id)}${event.groupId ? ` • Group: ${shortId(event.groupId)}` : ''}`;
                            
                            const normalizedEventType = event.type === 'Unavailable' ? 'Time Off' : (event.type || 'Event');
                            const isTimeOffEvent = !isPTO && ['Paid Time Off', 'Unavailable', 'Time Off', 'PTO', 'Sick Time'].includes(event.type);
                            const timeOffSubLabel = normalizeTimeOffTypeLabel(event.name || event.ptoType || event.type);
                            
                            // Display site - always show a category label (no "Unknown")
                            const siteDisplay = (isPTO || isTimeOffEvent)
                                ? 'Time Off'
                                : (site ? site.name : (normalizedEventType === 'Travel Day' ? 'Travel' : (event.crcId === null ? 'Open until filled' : normalizedEventType)));
                            
                            // Display study - always show a category label (no "Unknown")
                            const studyDisplay = isPTO
                                ? (timeOffSubcategory || 'Time Off')
                                : (isTimeOffEvent ? timeOffSubLabel : (studies !== 'None' ? studies : (normalizedEventType === 'Travel Day' ? 'Travel' : normalizedEventType)));
                            
                            // Display roles - always show a category label (no "Unknown")
                            const rolesDisplay = (isPTO || isTimeOffEvent)
                                ? (event.period ? `Time Off (${event.period})` : 'Time Off')

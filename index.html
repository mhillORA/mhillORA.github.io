            const renderReportingTable = () => {
                const container = document.getElementById('report-results-container');
                const year = document.getElementById('report-year-filter').value;
                const monthSelect = document.getElementById('report-month-filter');
                const crcSelect = document.getElementById('report-crc-filter');
                const siteSelect = document.getElementById('report-site-filter');
                const studySelect = document.getElementById('report-study-filter');
                const exportBtn = document.getElementById('export-utilization-report-btn');

                const selectedMonths = Array.from(monthSelect.selectedOptions).map(opt => parseInt(opt.value));
                const selectedCrcs = Array.from(crcSelect.selectedOptions).map(opt => opt.value);
                const selectedSites = Array.from(siteSelect.selectedOptions).map(opt => opt.value);
                const selectedStudies = Array.from(studySelect.selectedOptions).map(opt => opt.value);

                if (selectedMonths.length === 0 || selectedCrcs.length === 0) {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">Please select at least one month and one CRC to generate a report.</p>`;
                    exportBtn.classList.add('hidden');
                    return;
                }

                let reportData = [];
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                selectedCrcs.forEach(crcId => {
                    selectedMonths.forEach(month => {
                        const daysInMonth = new Date(year, month + 1, 0).getDate();
                        let totalWorkingDaysInMonth = 0;
                        for (let day = 1; day <= daysInMonth; day++) {
                            const dayOfWeek = new Date(year, month, day).getDay();
                            if (dayOfWeek > 0 && dayOfWeek < 6) { // Monday to Friday
                                totalWorkingDaysInMonth++;
                            }
                        }

                        let eventsForMonth = state.crc_events.filter(e => {
                            const eventDate = new Date(e.date + 'T00:00:00');
                            return eventBelongsToCrc(e, crcId) && 
                                   eventDate.getFullYear() == year && 
                                   eventDate.getMonth() == month &&
                                   isSiteAssignmentWithCrc(e);
                        });

                        // Apply site filter
                        if (selectedSites.length > 0) {
                            eventsForMonth = eventsForMonth.filter(e => !e.siteId || selectedSites.includes(e.siteId));
                        }

                        // Apply study filter
                        if (selectedStudies.length > 0) {
                            eventsForMonth = eventsForMonth.filter(e => {
                                if (!e.studyIds || e.studyIds.length === 0) return false;
                                return e.studyIds.some(studyId => selectedStudies.includes(studyId));
                            });
                        }

                        const timeOffDaysSet = new Set();
                        (state.timeOffRequests || []).forEach(req => {
                            if (!req || req.crcId !== crcId) return;
                            const statusKey = normalizeTimeOffStatus(req.status);
                            if (statusKey !== 'approved') return;
                            const start = parseDateFlexible(req.startDate || req.date);
                            const end = parseDateFlexible(req.endDate || req.startDate || req.date);
                            if (!start) return;
                            const cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                            const limit = end ? new Date(end.getFullYear(), end.getMonth(), end.getDate()) : new Date(cursor);
                            while (cursor <= limit) {
                                if (cursor.getFullYear() == year && cursor.getMonth() == month) {
                                    timeOffDaysSet.add(toDateOnlyString(cursor));
                                }
                                cursor.setDate(cursor.getDate() + 1);
                            }
                        });

                        // Only count Site Assignments with CRCs assigned (not empty/open shifts)
                        const productiveDaysSet = new Set(eventsForMonth.filter(e => isSiteAssignmentWithCrc(e)).map(e => e.date));
                        const nonWorkDaysSet = new Set(eventsForMonth.filter(e => ['Paid Time Off', 'Unavailable'].includes(e.type)).map(e => e.date));
                        const travelDaysSet = new Set(eventsForMonth.filter(e => e.type === 'Travel Day').map(e => e.date));
                        timeOffDaysSet.forEach(date => nonWorkDaysSet.add(date));

                        const crcRecord = state.crcs.find(c => c.id === crcId);
                        const crcName = crcRecord?.name || 'Unknown';
                        const monthlyTravel = (state.travel || []).filter(travel => {
                            if (!travel) return false;
                            const travelCrcId = travel.crcId;
                            const travelMatchesCrc = travelCrcId === crcId || (crcName && travelCrcId === crcName);
                            if (!travelMatchesCrc) return false;
                            const travelDate = parseDateFlexible(travel.date) || parseDateFlexible(travel.departureTime) || parseDateFlexible(travel.hotelCheckIn) || parseDateFlexible(travel.pickupDate);
                            if (!travelDate) return false;
                            return travelDate.getFullYear() == year && travelDate.getMonth() == month;
                        });
                        const travelRecords = monthlyTravel.length;
                        let flightsCount = 0;
                        let hotelsCount = 0;
                        let carsCount = 0;
                        let travelCost = 0;
                        monthlyTravel.forEach(travel => {
                            const type = (travel.bookingType || '').toUpperCase();
                            if (type === 'FLIGHT') flightsCount += 1;
                            else if (type === 'HOTEL') hotelsCount += 1;
                            else if (type === 'CAR') carsCount += 1;
                            const costFields = ['flightCost', 'hotelCost', 'carRentalCost', 'grandTotal', 'totalCost'];
                            costFields.forEach(field => {
                                const val = travel[field];
                                if (typeof val === 'number' && !Number.isNaN(val)) {
                                    travelCost += val;
                                } else if (typeof val === 'string' && val.trim()) {
                                    const parsed = parseFloat(val.replace(/[^0-9.\-]/g, ''));
                                    if (!Number.isNaN(parsed)) {
                                        travelCost += parsed;
                                    }
                                }
                            });
                        });

                        const productiveDays = productiveDaysSet.size;
                        const nonWorkDays = nonWorkDaysSet.size;
                        const travelDays = travelDaysSet.size;
                        const timeOffDays = timeOffDaysSet.size;
                        const availableWorkDays = totalWorkingDaysInMonth - nonWorkDays;
                        const utilizationPercent = availableWorkDays > 0 ? Math.round((productiveDays / availableWorkDays) * 100) : 0;
                        
                        reportData.push({
                            crcName,
                            month: monthNames[month],
                            year: year,
                            productiveDays,
                            nonWorkDays,
                            timeOffDays,
                            travelDays,
                            travelRecords,
                            flightsCount,
                            hotelsCount,
                            carsCount,
                            travelCost: Number.isFinite(travelCost) ? Math.round(travelCost * 100) / 100 : 0,
                            availableWorkDays,
                            utilizationPercent
                        });
                    });
                });

                if (reportData.length > 0) {
                    let tableHtml = `
                        <h4 class="text-lg font-semibold mb-1">Report Results</h4>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                                <thead class="bg-gray-50 dark:bg-gray-800">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">CRC Name</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Month</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Productive Days</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Travel Days</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Travel Records</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Flights</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Hotels</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Cars</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Travel Cost</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Non-Working Days</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Time Off Days</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Total Working Days</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Utilization %</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white dark:bg-gray-900 divide-y divide-gray-200 dark:divide-gray-700">
                                    ${reportData.map(row => `
                                    <tr>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-gray-100">${row.crcName}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.month}, ${row.year}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.productiveDays}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.travelDays}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.travelRecords}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.flightsCount}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.hotelsCount}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.carsCount}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">$${row.travelCost.toFixed(2)}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.nonWorkDays}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.timeOffDays}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.availableWorkDays}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${row.utilizationPercent}%</td>
                                    </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.innerHTML = tableHtml;
                    exportBtn.classList.remove('hidden');
                } else {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">No data found for the selected filters.</p>`;
                    exportBtn.classList.add('hidden');
                }

                // Store report data for export
                state.reportData = reportData;

                lucide.createIcons();
            };
            const exportUtilizationReport = () => {
                const data = state.reportData;
                if (!data || data.length === 0) {
                    showNotification('No report data to export.', 'info');
                    return;
                }

                const headers = ['CRC Name', 'Month', 'Year', 'Productive Days', 'Travel Days', 'Travel Records', 'Flights', 'Hotels', 'Cars', 'Travel Cost', 'Non-Working Days', 'Time Off Days', 'Total Working Days', 'Utilization %'];
                const rows = data.map(row => [
                    row.crcName,
                    row.month,
                    row.year,
                    row.productiveDays,
                    row.travelDays,
                    row.travelRecords,
                    row.flightsCount,
                    row.hotelsCount,
                    row.carsCount,
                    `$${row.travelCost.toFixed(2)}`,
                    row.nonWorkDays,
                    row.timeOffDays,
                    row.availableWorkDays,
                    `${row.utilizationPercent}%`
                ].map(val => `"${(val || '').toString().replace(/"/g, '""')}"`).join(','));
                
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                const now = new Date();
                const filename = `utilization_report_${now.getFullYear()}_${now.getMonth() + 1}_${now.getDate()}.csv`;
                link.setAttribute("download", filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const renderTimeOffReportTable = () => {
                const container = document.getElementById('timeoff-report-results');
                const exportBtn = document.getElementById('export-timeoff-report-btn');
                const startInput = document.getElementById('timeoff-report-start');
                const endInput = document.getElementById('timeoff-report-end');
                const crcSelect = document.getElementById('timeoff-report-crc-filter');
                const statusCheckboxes = Array.from(document.querySelectorAll('input[name="timeoff-status"]'));

                if (!container || !startInput || !endInput || !crcSelect || !exportBtn) {
                    return;
                }

                const selectedStatuses = statusCheckboxes.filter(cb => cb.checked).map(cb => cb.value);
                const selectedCrcs = Array.from(crcSelect.selectedOptions).map(opt => opt.value);
                const startValue = startInput.value;
                const endValue = endInput.value;

                if (!startValue || !endValue) {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">Select a start and end month to generate the report.</p>`;
                    exportBtn.classList.add('hidden');
                    state.timeOffReportData = null;
                    return;
                }

                if (startValue > endValue) {
                    container.innerHTML = `<p class="p-4 text-center text-red-500 dark:text-red-400">End month must be the same as or after the start month.</p>`;
                    exportBtn.classList.add('hidden');
                    state.timeOffReportData = null;
                    return;
                }

                if (selectedStatuses.length === 0) {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">Select at least one status to include in the report.</p>`;
                    exportBtn.classList.add('hidden');
                    state.timeOffReportData = null;
                    return;
                }

                if (selectedCrcs.length === 0) {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">Select at least one CRC to generate the report.</p>`;
                    exportBtn.classList.add('hidden');
                    state.timeOffReportData = null;
                    return;
                }

                if (!Array.isArray(state.timeOffRequests) || state.timeOffRequests.length === 0) {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">No time off requests found.</p>`;
                    exportBtn.classList.add('hidden');
                    state.timeOffReportData = null;
                    return;
                }

                state.timeOffReportStartMonth = startValue;
                state.timeOffReportEndMonth = endValue;
                state.timeOffReportStatuses = [...selectedStatuses];
                state.timeOffReportSelectedCrcs = [...selectedCrcs];

                const [startYear, startMonthRaw] = startValue.split('-').map(Number);
                const [endYear, endMonthRaw] = endValue.split('-').map(Number);
                const startMonthIndex = startMonthRaw - 1;
                const endMonthIndex = endMonthRaw - 1;
                const startDateStr = `${startYear}-${String(startMonthRaw).padStart(2, '0')}-01`;
                const endDateObj = new Date(endYear, endMonthRaw, 0);
                const endDateStr = toDateOnlyString(endDateObj);

                const summaryData = calculateTimeOffSummary('custom', startDateStr, endDateStr);

                const monthKeys = [];
                const cursor = new Date(startYear, startMonthIndex, 1);
                const endCursor = new Date(endYear, endMonthIndex, 1);
                while (cursor <= endCursor) {
                    monthKeys.push(getMonthKey(cursor));
                    cursor.setMonth(cursor.getMonth() + 1);
                }

                if (monthKeys.length === 0) {
                    container.innerHTML = `<p class="p-4 text-center text-gray-500 dark:text-gray-400">No months found within the selected range.</p>`;
                    exportBtn.classList.add('hidden');
                    state.timeOffReportData = null;
                    return;
                }

                const statusMeta = [
                    { value: 'pending', label: 'Pending Review', accentClass: 'text-yellow-700 dark:text-yellow-300' },
                    { value: 'approved', label: 'Approved', accentClass: 'text-green-700 dark:text-green-300' },
                    { value: 'rejected', label: 'Rejected', accentClass: 'text-red-600 dark:text-red-300' }
                ];
                const activeStatuses = statusMeta.filter(meta => selectedStatuses.includes(meta.value));

                const rangeStartDate = parseDateOnly(startDateStr);
                const rangeEndDate = new Date(endDateObj.getFullYear(), endDateObj.getMonth(), endDateObj.getDate());
                const selectedCrcMeta = selectedCrcs.map(crcId => {
                    const crc = state.crcs.find(c => c.id === crcId);
                    return {
                        id: crcId,
                        name: crc ? crc.name : `CRC ${crcId}`
                    };
                });

                const summaryRows = [];
                const monthlyRows = [];

                selectedCrcMeta.forEach(({ id: crcId, name: crcName }) => {
                    const summary = summaryData.summaries.get(crcId);
                    const statusTotals = {
                        pendingHours: summary ? summary.pendingHours : 0,
                        pendingDays: summary ? summary.pendingDays : 0,
                        approvedHours: summary ? summary.approvedHours : 0,
                        approvedDays: summary ? summary.approvedDays : 0,
                        rejectedHours: summary ? summary.rejectedHours : 0,
                        rejectedDays: summary ? summary.rejectedDays : 0
                    };
                    const totalHours = activeStatuses.reduce((sum, meta) => sum + (statusTotals[`${meta.value}Hours`] || 0), 0);
                    const totalDays = activeStatuses.reduce((sum, meta) => sum + (statusTotals[`${meta.value}Days`] || 0), 0);

                    summaryRows.push({
                        crcId,
                        crcName,
                        totals: statusTotals,
                        totalHours,
                        totalDays
                    });

                    monthKeys.forEach(monthKey => {
                        const monthData = summary?.months?.[monthKey] || {};
                        const row = {
                            crcId,
                            crcName,
                            monthKey,
                            pendingHours: selectedStatuses.includes('pending') ? (monthData.pendingHours || 0) : 0,
                            pendingDays: selectedStatuses.includes('pending') ? (monthData.pendingDays || 0) : 0,
                            approvedHours: selectedStatuses.includes('approved') ? (monthData.approvedHours || 0) : 0,
                            approvedDays: selectedStatuses.includes('approved') ? (monthData.approvedDays || 0) : 0,
                            rejectedHours: selectedStatuses.includes('rejected') ? (monthData.rejectedHours || 0) : 0,
                            rejectedDays: selectedStatuses.includes('rejected') ? (monthData.rejectedDays || 0) : 0
                        };
                        row.totalHours = row.pendingHours + row.approvedHours + row.rejectedHours;
                        row.totalDays = row.pendingDays + row.approvedDays + row.rejectedDays;
                        monthlyRows.push(row);
                    });
                });

                const normalizedSelectedStatuses = selectedStatuses.map(normalizeTimeOffStatus);
                const dailyEntriesMap = new Map();
                selectedCrcMeta.forEach(({ id }) => dailyEntriesMap.set(id, []));

                (Array.isArray(state.timeOffRequests) ? state.timeOffRequests : []).forEach(request => {
                    if (!request || !request.crcId || !selectedCrcs.includes(request.crcId)) {
                        return;
                    }
                    const statusKey = normalizeTimeOffStatus(request.status);
                    if (!normalizedSelectedStatuses.includes(statusKey)) {
                        return;
                    }
                    const entries = getDailyEntriesForTimeOffRequest(request, rangeStartDate, rangeEndDate);
                    if (!entries.length) return;
                    const bucket = dailyEntriesMap.get(request.crcId) || [];
                    entries.forEach(entry => bucket.push(entry));
                    dailyEntriesMap.set(request.crcId, bucket);
                });

                dailyEntriesMap.forEach(entries => {
                    entries.sort((a, b) => {
                        const dateCompare = a.dateStr.localeCompare(b.dateStr);
                        if (dateCompare !== 0) return dateCompare;
                        return a.status.localeCompare(b.status);
                    });
                });

            const exportTimeOffReport = () => {
                const reportState = state.timeOffReportData;

                    return;

                const detailGroups = Array.isArray(reportState.dailyByCrc) ? reportState.dailyByCrc : [];

                    return;

                const sortedGroups = [...detailGroups].sort((a, b) => (a.crcName || '').localeCompare(b.crcName || ''));
                const csvLines = [];

                if (reportState.rangeStart && reportState.rangeEnd) {
                    const rangeLabel = `${formatDisplayDate(reportState.rangeStart, { month: 'short', day: 'numeric', year: 'numeric' })} - ${formatDisplayDate(reportState.rangeEnd, { month: 'short', day: 'numeric', year: 'numeric' })}`;
                    csvLines.push(`"Report Range","${rangeLabel.replace(/"/g, '""')}"`);
                    csvLines.push('');
                }

                sortedGroups.forEach(group => {
                    csvLines.push([
                        group.crcName || 'Unknown CRC',
                        'Date',
                        'Status',
                        'Period',
                        'Hours',
                        'Type',
                        'Request ID'
                    ].map(val => `"${(val || '').toString().replace(/"/g, '""')}"`).join(','));

                    const days = Array.isArray(group.days) ? group.days : [];

                const monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });
                const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - getDaySaturdayStart(now));
                const weekName = `Week of ${startOfWeek.toLocaleDateString('en-US', {month: 'long', day: 'numeric'})}`;
                const dayName = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                
                let title;
                if (state.calendarView === 'week') title = weekName;
                else if (state.calendarView === 'planning-grid') {
                    if (state.planningGridMode === 'daily') {
                        title = `Planning Grid - ${dayName}`;
                    } else if (state.planningGridMode === 'weekly') {
                        title = `Planning Grid - ${weekName}`;
                    } else {
                        title = `Planning Grid - ${monthName}`;
                    }
                } else if (state.calendarView === 'roles') title = `Roles View - ${weekName}`;
                else if (state.calendarView === 'total-view') title = `Total View - ${monthName}`;
                else title = monthName;
                
                // Determine navigation actions based on view
                let prevAction, nextAction;
                if (state.calendarView === 'planning-grid' && state.planningGridMode === 'daily') {
                    prevAction = 'prev-crc-day';
                    nextAction = 'next-crc-day';
                } else if (state.calendarView === 'planning-grid' && state.planningGridMode === 'weekly') {
                    prevAction = 'prev-crc-week';
                    nextAction = 'next-crc-week';
                } else if (state.calendarView === 'week' || state.calendarView === 'roles') {
                    prevAction = 'prev-crc-week';
                    nextAction = 'next-crc-week';
                } else {
                    prevAction = 'prev-crc-month';
                    nextAction = 'next-crc-month';
                }
                
                // Generate month value in YYYY-MM format for input type="month"
                const currentMonthValue = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                
                // Generate date options for daily view - all dates in current month
                let dateOptions = '';
                if (state.calendarView === 'planning-grid' && state.planningGridMode === 'daily') {
                    const currentMonth = now.getMonth();
                    const currentYear = now.getFullYear();
                    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                    const currentDateStr = toDateOnlyString(now);
                    
                    dateOptions = Array.from({ length: daysInMonth }, (_, i) => {
                        const day = i + 1;
                        const date = new Date(currentYear, currentMonth, day);
                        const dateStr = toDateOnlyString(date);
                        const isSelected = dateStr === currentDateStr;
                        const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                        const displayText = `${day} (${dayName})`;
                        return `<option value="${dateStr}" ${isSelected ? 'selected' : ''}>${displayText}</option>`;
                    }).join('');
                }
                
                // Removed at-a-glance toggle since we now show both study and site together

                return `
                    <div class="mb-4 space-y-3">
                        <!-- Title and Display Mode on first row -->
                        <div class="flex flex-wrap items-center gap-2 md:gap-4">
                            <h3 class="text-xl font-semibold text-gray-800 dark:text-gray-200">${title}</h3>
                            <div class="flex items-center rounded-md border dark:border-gray-600 overflow-x-auto">
                                <button data-action="set-display-mode" data-mode="employee" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarDisplayMode === 'employee' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'} rounded-l-md">Employee</button>
                                <button data-action="set-display-mode" data-mode="study" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarDisplayMode === 'study' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'}">Study</button>
                                <button data-action="set-display-mode" data-mode="site" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarDisplayMode === 'site' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'}">Site</button>
                                <button data-action="set-display-mode" data-mode="travel" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarDisplayMode === 'travel' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'}">Travel</button>
                                <button data-action="set-display-mode" data-mode="at-a-glance" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarDisplayMode === 'at-a-glance' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'} ${state.calendarView === 'planning-grid' ? '' : 'rounded-r-md'}">At-a-Glance</button>
                            </div>
                        </div>
                        <!-- Calendar View and Navigation on second row -->
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <div class="flex items-center rounded-md border dark:border-gray-600 overflow-x-auto">
                                    <button data-action="set-view" data-view="planning-grid" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarView === 'planning-grid' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'} rounded-l-md">Planning Grid</button>
                                    ${state.calendarView === 'planning-grid' ? `
                                        <button data-action="set-planning-grid-mode" data-mode="monthly" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.planningGridMode === 'monthly' ? 'bg-green-600 text-white' : 'bg-white dark:bg-gray-700'}">Monthly</button>
                                        <button data-action="set-planning-grid-mode" data-mode="weekly" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.planningGridMode === 'weekly' ? 'bg-green-600 text-white' : 'bg-white dark:bg-gray-700'}">Weekly</button>
                                        <button data-action="set-planning-grid-mode" data-mode="daily" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.planningGridMode === 'daily' ? 'bg-green-600 text-white' : 'bg-white dark:bg-gray-700'} rounded-r-md">Daily</button>
                                    ` : ''}
                                </div>
                                <div class="flex items-center rounded-md border dark:border-gray-600 overflow-x-auto">
                                    <button data-action="set-view" data-view="roles" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarView === 'roles' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'} rounded-l-md">Roles</button>
                                    <button data-action="set-view" data-view="total-view" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarView === 'total-view' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'}">Total View</button>
                                    <button data-action="set-view" data-view="month" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarView === 'month' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'}">Month</button>
                                    <button data-action="set-view" data-view="week" class="px-2 md:px-3 py-1 text-xs md:text-sm whitespace-nowrap ${state.calendarView === 'week' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-gray-700'} rounded-r-md">Week</button>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button data-action="${prevAction}" class="p-1.5 md:p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700"><i data-lucide="chevron-left" class="w-4 h-4 md:w-5 md:h-5"></i></button>
                                ${state.calendarView === 'planning-grid' && state.planningGridMode === 'daily' ? `
                                    <select id="date-selector" class="p-1.5 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white text-xs md:text-sm">
                                        ${dateOptions}
                                    </select>
                                ` : ''}
                                <input type="month" id="month-selector" value="${currentMonthValue}" class="p-1.5 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 dark:text-white text-xs md:text-sm">
                                <button data-action="${nextAction}" class="p-1.5 md:p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700"><i data-lucide="chevron-right" class="w-4 h-4 md:w-5 md:h-5"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            };

            const getGenericCalendarHTML = (groupBy) => {
                const now = state.crcCalendarDate;
                const year = now.getFullYear();
                const month = now.getMonth();
                const collection = groupBy === 'study' ? state.studies : state.crc_sites;
                const idField = groupBy === 'study' ? 'studyIds' : 'siteId';

                const firstDayOfMonth = getDaySaturdayStart(new Date(year, month, 1));
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                let dayGrid = '<div class="crc-calendar-grid bg-gray-200 dark:bg-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">';
                const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                dayGrid += weekdays.map(day => `<div class="text-center font-medium text-sm py-2 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400">${day}</div>`).join('');
                
                for (let i = 0; i < firstDayOfMonth; i++) {
                    dayGrid += '<div class="bg-gray-50 dark:bg-gray-800/50"></div>';
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();
                    const dayClass = isToday ? 'bg-blue-50 dark:bg-blue-900/30' : 'bg-white dark:bg-gray-800';
                    const todaysEvents = state.crc_events.filter(e => e.date === dateStr);
                    
                    const uniqueIds = idField === 'studyIds'
                        ? [...new Set(todaysEvents.flatMap(e => e.studyIds || []))]
                        : [...new Set(todaysEvents.map(e => e.siteId).filter(Boolean))];

                    let eventTags = uniqueIds.slice(0, 3).map(id => {
                        const item = collection.find(s => s.id === id);
                        const bgColor = item?.color || (groupBy === 'study' ? '#10b981' : '#06b6d4');
                        const textColor = getContrastColor(bgColor);
                        return item ? `<div class="crc-event-tag" style="background-color: ${bgColor}; color: ${textColor};">${item.name}</div>` : '';
                    }).join('');

                    if (uniqueIds.length > 3) {
                        eventTags += `<div class="more-events-btn" data-action="view-day-events" data-date="${dateStr}">+${uniqueIds.length - 3} more</div>`;
                    }

                    dayGrid += `
                        <div class="crc-calendar-day ${dayClass}" data-action="view-day-events" data-date="${dateStr}">
                            <span class="day-number text-gray-500 dark:text-gray-400 ${isToday ? 'font-bold text-blue-600 dark:text-blue-400' : ''}">${day}</span>
                            ${isSupervisor ? '' : `
                            <button data-action="open-crc-event-modal" data-date="${dateStr}" class="add-event-btn p-1 text-gray-500 hover:text-blue-600 dark:text-gray-400 dark:hover:text-blue-400 rounded-full">
                                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                            </button>
                            `}
                            <div class="mt-1 space-y-1">${eventTags}</div>
                        </div>
                    `;
                }
                dayGrid += '</div>';
                return getCalendarHeaderHTML() + dayGrid;
            };

            const getStudyCalendarHTML = () => getGenericCalendarHTML('study');
            const getSiteCalendarHTML = () => getGenericCalendarHTML('site');

            const getMonthlyCalendarHTML = () => {
                const now = state.crcCalendarDate;
                const year = now.getFullYear();
                const month = now.getMonth();
                
                // Check if CRC user - filter to only their events
                const isCRCUser = state.currentUser && state.currentUser.permissionLevel === 'CRC';
                const matchingCrcId = getLoggedInCrcId();

                let crcsToDisplay = state.crcs;
                
                // For CRC users, only show themselves
                if (isCRCUser && matchingCrcId) {
                    crcsToDisplay = [state.crcs.find(c => c.id === matchingCrcId)].filter(Boolean);
                } else {
                    if (state.selectedEmploymentTypeFilter !== 'all') {
                        crcsToDisplay = crcsToDisplay.filter(c => normalizeEmploymentType(c.employmentType) === state.selectedEmploymentTypeFilter);
                    }
                    
                    // Filter out CRCs who have time off (Paid Time Off or Unavailable) in the current month
                    const monthStart = new Date(year, month, 1);
                    const monthEnd = new Date(year, month + 1, 0);
                    const monthStartStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
                    const monthEndStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(monthEnd.getDate()).padStart(2, '0')}`;
                    
                    crcsToDisplay = crcsToDisplay.filter(crc => {
                        // Check if this CRC has any time off events in the current month
                        const hasTimeOff = state.crc_events.some(event => 
                            event.crcId === crc.id && 
                            (event.type === 'Paid Time Off' || event.type === 'Unavailable') &&
                            event.date >= monthStartStr && 
                            event.date <= monthEndStr
                        );
                        return !hasTimeOff;
                    });
                }
                
                const crcIdsToDisplay = crcsToDisplay.map(c => c.id);

                let filteredEvents = state.crc_events;
                console.log('All events:', state.crc_events.length);
                console.log('Travel Day events in state:', state.crc_events.filter(e => e.type === 'Travel Day'));
                
                // Filter out PTO/Unavailable/Sick Time events - they should only appear in the time off calendar, not the main scheduler
                filteredEvents = filteredEvents.filter(e => 
                    e.type !== 'Unavailable' && 
                    e.type !== 'Paid Time Off' && 
                    e.type !== 'Sick Time' &&
                    e.type !== 'PTO'
                );
                // Filter events - show Site Assignments with siteId or studyIds, and show Travel Days
                filteredEvents = filteredEvents.filter(e => 
                    e.type === 'Travel Day' || 
                    e.siteId || 
                    (e.studyIds && Array.isArray(e.studyIds) && e.studyIds.length > 0 && e.studyIds.filter(Boolean).length > 0)
                );
                console.log('After filtering out PTO/Unavailable/Sick and unassigned:', filteredEvents.length);
                
                // For CRC users, ONLY show their events (check both crcId and roleAssignments)
                if (isCRCUser && matchingCrcId) {
                    const beforeFilter = filteredEvents.length;
                    filteredEvents = filteredEvents.filter(e => {
                        const belongs = eventBelongsToCrc(e, matchingCrcId);
                        if (belongs) {
                            console.log('Event belongs to CRC:', {
                                eventId: e.id,
                                date: e.date,
                                type: e.type,
                                crcId: e.crcId,
                                hasRoleAssignments: !!(e.roleAssignments && Object.keys(e.roleAssignments).length > 0),
                                matchingCrcId: matchingCrcId
                            });
                        }
                        return belongs;
                    });
                    console.log(`CRC filter: ${beforeFilter} events before, ${filteredEvents.length} events after for CRC ID: ${matchingCrcId}`);
                } else {
                    if (state.selectedCrcFilter !== 'all') {
                        filteredEvents = filteredEvents.filter(e => eventBelongsToCrc(e, state.selectedCrcFilter));
                    } else {
                        // For "all" filter, check if event belongs to any CRC in the display list (via crcId or roleAssignments)
                        filteredEvents = filteredEvents.filter(e => {
                            // Events with no CRC assignment
                            if (!e.crcId && (!e.roleAssignments || Object.keys(e.roleAssignments).length === 0)) {
                                return true; // Show unassigned events
                            }
                            // Check legacy crcId
                            if (e.crcId && crcIdsToDisplay.includes(e.crcId)) return true;
                            // Check roleAssignments
                            if (e.roleAssignments && Object.keys(e.roleAssignments).length > 0) {
                                return Object.values(e.roleAssignments).some(assignments => {
                                    if (Array.isArray(assignments)) {
                                        return assignments.some(crcId => crcIdsToDisplay.includes(crcId));
                                    }
                                    return false;
                                });
                            }
                            return false;
                        });
                    }
                }
                console.log('After CRC filter:', filteredEvents.length);
                console.log('Travel Day events after CRC filter:', filteredEvents.filter(e => e.type === 'Travel Day'));
                
                if (state.selectedSiteFilter !== 'all') {
                    filteredEvents = filteredEvents.filter(e => e.siteId === state.selectedSiteFilter);
                }
                if (state.selectedStudyFilter && state.selectedStudyFilter !== 'all') {
                    filteredEvents = filteredEvents.filter(e => 
                        (e.studyIds || []).includes(state.selectedStudyFilter)
                    );
                }
                if (state.selectedRegionFilter !== 'all') {
                    const crcsInRegion = state.crcs.filter(c => c.region === state.selectedRegionFilter).map(c => c.id);
                    filteredEvents = filteredEvents.filter(e => {
                        // Check legacy crcId
                        if (e.crcId && crcsInRegion.includes(e.crcId)) return true;
                        // Check roleAssignments
                        if (e.roleAssignments && Object.keys(e.roleAssignments).length > 0) {
                            return Object.values(e.roleAssignments).some(assignments => {
                                if (Array.isArray(assignments)) {
                                    return assignments.some(crcId => crcsInRegion.includes(crcId));
                                }
                                return false;
                            });
                        }
                        return false;
                    });
                }
                if (state.selectedEventTypeFilter !== 'all') {
                    filteredEvents = filteredEvents.filter(e => e.type === state.selectedEventTypeFilter);
                }
                
                // Apply open shifts filter
                filteredEvents = applyOpenShiftsFilter(filteredEvents);
                
                console.log('Final filtered events:', filteredEvents.length);
                console.log('Final Travel Day events:', filteredEvents.filter(e => e.type === 'Travel Day'));
                
                const firstDayOfMonth = getDaySaturdayStart(new Date(year, month, 1));
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                let dayGrid = '<div class="crc-calendar-grid bg-gray-200 dark:bg-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">';
                const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                dayGrid += weekdays.map(day => `<div class="text-center font-medium text-sm py-2 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400">${day}</div>`).join('');
                
                for (let i = 0; i < firstDayOfMonth; i++) {
                    dayGrid += '<div class="bg-gray-50 dark:bg-gray-800/50"></div>';
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();
                    const dayClass = isToday ? 'bg-blue-50 dark:bg-blue-900/30' : 'bg-white dark:bg-gray-800';
                    const todaysEvents = filteredEvents.filter(e => e.date === dateStr);
                    
                    // No grouping: render each event as-is to avoid unintended merging
                    const consolidatedEvents = todaysEvents;
                    
                    // Create one block per CRC per event - so a shift with 4 employees shows 4 blocks
                    let eventTags = consolidatedEvents.flatMap(event => {
                        // Get CRCs from both legacy crcId and new roleAssignments
                        let eventCrcs = getEventCRCs(event);
                        // Filter to only show selected CRC's block when CRC filter is applied
                        if (state.selectedCrcFilter && state.selectedCrcFilter !== 'all') {
                            eventCrcs = eventCrcs.filter(crc => crc.id === state.selectedCrcFilter);
                        }
                        // Only show CRCs if there are actual role assignments (not just legacy crcId)
                        const hasRoleAssignments = event.roleAssignments && Object.keys(event.roleAssignments).length > 0 && 
                                                   Object.values(event.roleAssignments).some(arr => Array.isArray(arr) && arr.length > 0);
                        const site = state.crc_sites.find(s => s.id === event.siteId);
                        const study = (event.studyIds && event.studyIds.length > 0) ? state.studies.find(s => s.id === event.studyIds[0]) : null;
                        const eventTypeColors = { 'Site Assignment': '#3b82f6', 'Travel Day': '#f97316', 'Paid Time Off': '#a855f7', 'Unavailable': '#6b7280', 'Open Shift': '#ef4444' };
                        const bgColor = site?.color || study?.color || eventTypeColors[event.type] || '#6b7280';
                        const textColor = getContrastColor(bgColor);
                        // Display roles first, then CRC name
                        // Use getAllEventRoles to get all roles including empty ones
                        const allRoles = getAllEventRoles(event);
                        const roleNames = allRoles.length > 0 ? allRoles : getEventRoles(event);
                        
                        // Build header information for the shift - ALWAYS show headers
                        const headerParts = [];
                        // Always include site if available
                        if (site) {
                            headerParts.push(site.name);
                            // Add PI if available
                            if (site.principalInvestigator) {
                                headerParts.push(`PI: ${site.principalInvestigator}`);
                            }
                        }
                        // Always include study if available
                        if (study) {
                            headerParts.push(study.title || study.name);
                        }
                        // Add visit number if available
                        if (event.visitNumber) headerParts.push(`Visit ${getVisitDisplayName(event.visitNumber, event.studyIds)}`);
                        // Add group number if available
                        if (event.groupNumber) headerParts.push(`Group ${event.groupNumber}`);
                        // Add hours if available
                        if (event.hours) headerParts.push(`${event.hours}h`);
                        // Add all CRC names to the header if available
                        if (eventCrcs.length > 0) {
                            const crcNames = eventCrcs.map(crc => crc.name.split(' ')[0]).join(', ');
                            headerParts.push(crcNames);
                        }
                        // If no header parts, use event type as fallback
                        const headerText = headerParts.length > 0 ? headerParts.join(' • ') : (event.type || 'Event');
                        
                        // If there are CRCs, create grouped container with header + one block per CRC
                        if ((hasRoleAssignments && eventCrcs.length > 0) || (event.type === 'Travel Day' && eventCrcs.length > 0)) {
                            const blocks = eventCrcs.map(crc => {
                                // Build display text with site/study info if available
                                let displayParts = [];
                                
                                // For Travel Day events, show "Travel" and this CRC's name, plus training info if applicable
                                if (event.type === 'Travel Day') {
                                    displayParts.push('Travel');
                                    // Check if CRC is in training and display training info
                                    const crcTrainingInfo = getCRCInTrainingInfo(crc);
                                    if (crcTrainingInfo && crcTrainingInfo.length > 0) {
                                        displayParts.push(crcTrainingInfo.join(', '));
                                    }
                                    displayParts.push(crc.name.split(' ')[0]);
                                } else {
                                    // Add site name if available
                                    if (site) {
                                        displayParts.push(site.name);
                                    }
                                    
                                    // Add study name if available
                                    if (study) {
                                        displayParts.push(study.title || study.name);
                                    }
                                    
                                    // Add roles if available - show only first role or count if multiple
                                    if (roleNames.length > 0) {
                                        if (roleNames.length === 1) {
                                            displayParts.push(roleNames[0]);
                                        } else {
                                            displayParts.push(`${roleNames[0]} (+${roleNames.length - 1})`);
                                        }
                                    }
                                    
                                    // Add this specific CRC's name
                                    displayParts.push(crc.name.split(' ')[0]);
                                }
                                
                                // Build final display text
                                let title = displayParts.length > 0 ? displayParts.join(' - ') : `Open: ${event.type}`;
                                if(event.period && event.period !== 'Full Day') title += ` (${event.period})`;
                                
                                const overrideIcon = event.isOverridden ? `<i data-lucide="alert-triangle" class="inline-block w-3 h-3 text-yellow-300 ml-1"></i>` : '';
                                
                                // Check role fulfillment
                                const roleFulfillment = checkRoleFulfillment(event);
                                const roleIcon = roleFulfillment.fulfilled ? 
                                    `<i data-lucide="check-circle" class="inline-block w-3 h-3 text-green-400 ml-1"></i>` : 
                                    `<span class="inline-flex items-center ml-1"><span class="text-red-400 font-bold" style="font-size: 14px;">⚠</span></span>`;
                                
                                const tooltip = roleFulfillment.fulfilled ? 
                                    (event.notes || title) : 
                                    `${event.notes || title}\nOpen: ${roleFulfillment.missingRoles.join(', ')}`;
                                
                                // Build unfilled roles display if there are unfilled slots - with flashing red box
                                const unfilledRolesDisplay = !roleFulfillment.fulfilled && roleFulfillment.unfilledSlots && roleFulfillment.unfilledSlots.length > 0 
                                    ? `<div class="unfilled-role-box text-[10px] text-red-100 font-medium">
                                        <span class="flex items-center gap-1">
                                            <span style="font-size: 10px;">⚠</span>
                                            Unfilled: ${[...new Set(roleFulfillment.unfilledSlots.map(s => s.roleName))].join(', ')}
                                        </span>
                                    </div>`

                let tableHtml = `<div class="dual-scroll-wrapper border dark:border-gray-700 rounded-lg">

                                const tooltip = tooltipParts.length > 0 ? tooltipParts.join('\n') : '';
                                
                                // For Travel Day events, show all travelers in one block

                                    const travelDayCrcNames = travelDayCrcs.length > 0 ? travelDayCrcs.map(c => c.name.split(' ')[0]).join(', ') : '';
                                    const displayText = travelDayCrcNames

                                        : 'Travel - Unassigned';
                                    tableHtml += `<div class="global-view-event cursor-pointer hover:ring-2 hover:ring-blue-500 mb-1" style="background-color: ${eventBgColor}; color: ${eventTextColor};" data-action="view-crc-event" data-event-id="${event.id}" ${tooltip ? `title="${tooltip}"` : ''}>
                                        ${headerText ? `<div class="font-bold text-xs mb-1" style="color: ${spanTextColor};">${headerText}</div>` : ''}

                                } else if (group.allRoles.size > 0 || allCrcs.length > 0) {
                                    // Group by CRC - each CRC gets their own block with ALL their roles combined
                                    // First, build a map of CRC -> roles (using roleAssignments from the primary event)

                                    if (event.roleAssignments && typeof event.roleAssignments === 'object') {

            const getDailyPlanningGridHTML = () => {

                // Check if CRC user - filter to only their events

                    const crcsInRegion = state.crcs.filter(c => c.region === state.selectedRegionFilter).map(c => c.id);
                    filteredEvents = filteredEvents.filter(e => {

                                if (Array.isArray(assignments)) {
                                    return assignments.some(crcId => crcsInRegion.includes(crcId));

                        return false;

                if (state.selectedEventTypeFilter !== 'all') {

                filteredEvents = applyOpenShiftsFilter(filteredEvents);

                // Calculate daily stats
                const dayEvents = filteredEvents;
                const uniqueCRCs = new Set();

                    // Check legacy crcId
                    if (event.crcId) {
                        const isUnavailable = isCRCUnavailable(event.crcId, dateStr, event.period || 'Full Day');

                            uniqueCRCs.add(event.crcId);

                    // Check roleAssignments for all assigned CRCs
                    if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                        Object.values(event.roleAssignments).forEach(assignments => {
                            if (Array.isArray(assignments)) {
                                assignments.forEach(crcId => {
                                    if (crcId && crcId !== 'SITE_STAFF') {
                                        const isUnavailable = isCRCUnavailable(crcId, dateStr, event.period || 'Full Day');

                                            uniqueCRCs.add(crcId);

                    totalStaff: uniqueCRCs.size,

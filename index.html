                    </div>
                `).join('');

            if (roleEl && !roleEl.dataset.bound) {
                roleEl.dataset.bound = '1';
                roleEl.addEventListener('change', () => renderStaff());
            }
            if (searchEl && !searchEl.dataset.bound) {
                searchEl.dataset.bound = '1';
                searchEl.addEventListener('input', () => renderStaff());
            }
        };

        const stripStaffLinkFromSite = (site, staffId, role) => {
            if (!site || !staffId) return site;
            const s = { ...site };
            const r = String(role || '').toLowerCase();
            if (r === 'pi' && s.piStaffId === staffId) {
                delete s.piStaffId;
                s.pi = '';
                s.piEmail = '';
            }
            if (r === 'coordinator' && s.coordinatorStaffId === staffId) {
                delete s.coordinatorStaffId;
                s.siteCoordinator = '';
                s.siteCoordinatorEmail = '';
            }
            return s;
        };

        const assignStaffToSiteRecord = (site, staff) => {
            if (!site || !staff?.id) return site;
            const s = { ...site };
            const r = String(staff.role || '').toLowerCase();
            if (r === 'pi') {
                s.piStaffId = staff.id;
                s.pi = staff.name || '';
                s.piEmail = staff.email || '';
            } else if (r === 'coordinator') {
                s.coordinatorStaffId = staff.id;
                s.siteCoordinator = staff.name || '';
                s.siteCoordinatorEmail = staff.email || '';
            }
            return s;
        };

        const createStaffModal = (existingStaff = null) => {
            const isEdit = !!(existingStaff && existingStaff.id);
            const sites = (allSites || []).slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            const r = String(existingStaff?.role || 'pi').toLowerCase();
            const rolePiSel = r === 'pi' ? 'selected' : '';
            const roleCoordSel = r === 'coordinator' ? 'selected' : '';
            const nameVal = isEdit ? escapeHtml(existingStaff.name || '') : '';
            const emailVal = isEdit ? escapeHtml(existingStaff.email || '') : '';

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content import-modal-content dark:bg-gray-800">
                        <form id="staff-form" ${isEdit ? `data-edit-id="${escapeHtml(existingStaff.id)}"` : ''}>
                            <div class="p-6 space-y-4">
                                <div>
                                    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">${isEdit ? 'Edit PI / Coordinator' : 'Add PI / Coordinator'}</h2>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${isEdit ? 'Update the staff record and site assignment.' : 'Create a staff record and assign it to a site.'}</p>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Site</label>
                                        <select name="siteId" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                                            <option value="">Select…</option>
                                            ${sites.map(s => `<option value="${escapeHtml(s.id)}" ${isEdit && s.id === existingStaff.siteId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Role</label>
                                        <select name="role" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                                            <option value="pi" ${rolePiSel}>PI</option>
                                            <option value="coordinator" ${roleCoordSel}>Coordinator</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                                        <input name="email" type="email" value="${emailVal}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Name</label>
                                        <input name="name" required value="${nameVal}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                    </div>
                                </div>
                                <div id="staff-form-error" class="text-sm text-red-600 dark:text-red-300 hidden"></div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 sm:px-6 flex flex-row-reverse gap-2">
                                <button type="submit" class="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:w-auto sm:text-sm">${isEdit ? 'Save' : 'Create & Assign'}</button>
                                <button type="button" data-action="cancel" class="inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-500 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 sm:w-auto sm:text-sm">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            showModal(modalHTML);
        };

        const getFeasibilityHTML = () => {
            const allDefs = asSurveyList(allSiteSurveyDefinitions);
            const predefinedCount = allDefs.filter(isPredefinedSurveyDef).length;
            const customCount = Math.max(0, allDefs.length - predefinedCount);
            const assignments = asSurveyList(allSiteSurveyAssignments);
            const responses = asSurveyList(allSiteSurveyResponses).filter(r => r && !r._archived);
            const pendingLinks = assignments.filter(a => String(a.status || '').toLowerCase() !== 'submitted').length;
            const notes = Array.isArray(window.__siteSurveyNotifications) ? window.__siteSurveyNotifications : [];
            const unread = notes.filter(n => n && !n.read).length;

            const filterSiteName = commsSiteFilterId
                ? ((allSites || []).find(s => s.id === commsSiteFilterId)?.name || commsSiteFilterId)
                : '';

            let studyStatusSent = assignments.length;
            let studyStatusRecommended = 0;
            let studyStatusNeedReview = 0;
            let studyStatusDnr = 0;
            let studyStatusUnanswered = 0;
            const responseByAssignment = new Map();
            const responseBySiteSurvey = new Map();
            for (const r of responses) {
                if (!r) continue;
                if (r.assignmentId) responseByAssignment.set(String(r.assignmentId), r);
                if (r.siteId && r.surveyId) responseBySiteSurvey.set(`${r.siteId}::${r.surveyId}`, r);
            }
            for (const a of assignments) {
                if (!a) continue;
                const submitted = String(a.status || '').toLowerCase() === 'submitted';
                const resp = (a.id && responseByAssignment.get(String(a.id)))
                    || (a.siteId && a.surveyId && responseBySiteSurvey.get(`${a.siteId}::${a.surveyId}`))
                    || null;
                if (!submitted && !resp) {
                    studyStatusUnanswered += 1;
                    continue;
                }
                if (!resp) {
                    studyStatusUnanswered += 1;
                    continue;
                }
                const def = (allSiteSurveyDefinitions || []).find(d => d && d.id === (resp.surveyId || a.surveyId));
                const outcome = resolveScoreOutcome(resp.score, def);
                if (outcome === 'pass') studyStatusRecommended += 1;
                else if (outcome === 'borderline') studyStatusNeedReview += 1;
                else if (outcome === 'fail') studyStatusDnr += 1;
                else studyStatusNeedReview += 1; // unscored → need review bucket
            }

            const tab = (id, label, count) => {
                const on = commsPanel === id;
                const badge = count != null
                    ? `<span class="ml-1.5 inline-flex min-w-[1.25rem] justify-center px-1.5 py-0.5 rounded-full text-[10px] font-semibold ${on ? 'bg-indigo-200 text-indigo-900 dark:bg-indigo-800 dark:text-indigo-100' : 'bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200'}">${count}</span>`
                    : '';
                return `<button type="button" class="comms-panel-btn px-3 py-1.5 rounded-md text-sm font-medium whitespace-nowrap ${on ? 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-100' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'}" data-comms-panel="${id}">${label}${badge}</button>`;
            };

            return `
                <div class="px-4 py-5 sm:px-0 space-y-4">
                    <div id="comms-site-filter-banner" class="${commsSiteFilterId ? '' : 'hidden'} flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-lg border border-indigo-200 dark:border-indigo-800 bg-indigo-50 dark:bg-indigo-900/20">
                        <span class="text-sm text-indigo-900 dark:text-indigo-100">Filtered to <strong>${escapeHtml(filterSiteName)}</strong></span>
                        <button type="button" id="clear-comms-site-filter-btn" class="px-2.5 py-1 rounded-md bg-white dark:bg-gray-800 border border-indigo-300 dark:border-indigo-600 text-xs text-indigo-800 dark:text-indigo-200">Clear</button>
                    </div>

                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Feasibility</h2>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">Question bank, templates, and site responses${pendingLinks ? ` · ${pendingLinks} pending` : ''}</p>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button id="new-site-survey-btn" class="inline-flex items-center px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700">New template</button>
                            <button id="new-library-question-btn" class="inline-flex items-center px-3 py-2 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700">New question</button>
                            <button id="new-site-survey-assignment-btn" class="inline-flex items-center px-3 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 text-sm font-medium">Send survey</button>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-1.5 p-1 rounded-lg bg-gray-100 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700">
                        ${tab('templates', 'Templates', allDefs.length)}
                        ${tab('questions', 'Questions', (allSiteSurveyQuestionLibrary || []).filter(q => q && q.status !== 'archived').length)}
                        ${tab('links', 'Links', assignments.length)}
                        ${tab('responses', 'Responses', responses.length)}
                        ${tab('activity', 'Activity', unread || notes.length)}
                        ${tab('privacy', 'Privacy')}
                    </div>

                    <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden">
                        <div class="px-3 py-2 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between gap-2 bg-gray-50/80 dark:bg-gray-900/30">
                            <div class="text-sm font-semibold text-gray-800 dark:text-gray-100">Study status</div>
                            <div class="text-[11px] text-gray-500 dark:text-gray-400">Across open assignments &amp; scored responses</div>
                        </div>
                        <div class="p-3 grid grid-cols-2 sm:grid-cols-5 gap-2 text-center">
                            <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                                <div class="text-[10px] uppercase tracking-wide text-gray-500">Sent</div>
                                <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${studyStatusSent}</div>
                            </div>
                            <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                                <div class="text-[10px] uppercase tracking-wide text-gray-500">Recommended</div>
                                <div class="text-lg font-semibold text-emerald-700 dark:text-emerald-300">${studyStatusRecommended}</div>
                            </div>
                            <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                                <div class="text-[10px] uppercase tracking-wide text-gray-500">Need review</div>
                                <div class="text-lg font-semibold text-amber-700 dark:text-amber-300">${studyStatusNeedReview}</div>
                            </div>
                            <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                                <div class="text-[10px] uppercase tracking-wide text-gray-500">Do Not Recommend</div>
                                <div class="text-lg font-semibold text-red-700 dark:text-red-300">${studyStatusDnr}</div>
                            </div>
                            <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                                <div class="text-[10px] uppercase tracking-wide text-gray-500">Unanswered</div>
                                <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${studyStatusUnanswered}</div>
                            </div>
                        </div>
                    </div>

                    <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden">
                        <div class="px-3 py-2 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between gap-2 bg-gray-50/80 dark:bg-gray-900/30">
                            <div class="text-sm font-semibold text-gray-800 dark:text-gray-100" id="comms-panel-title">Templates</div>
                            <div class="flex items-center gap-2" id="comms-panel-actions"></div>
                        </div>
                        <div class="p-2 sm:p-3">
                            <div id="comms-search-wrap" class="mb-2 ${['templates','questions','links','responses'].includes(commsPanel) ? '' : 'hidden'}">
                                <input id="comms-list-search" type="search" placeholder="Filter list…" class="w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-1.5 text-sm" />
                            </div>
                            <div id="comms-panel-body" class="max-h-[min(58vh,560px)] overflow-y-auto space-y-1"></div>
                            <div id="comms-panel-footer" class="pt-2 text-xs text-gray-500 dark:text-gray-400"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
                        <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                            <div class="text-[10px] uppercase tracking-wide text-gray-500">Predefined</div>
                            <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${predefinedCount}</div>
                        </div>
                        <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                            <div class="text-[10px] uppercase tracking-wide text-gray-500">Custom</div>
                            <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${customCount}</div>
                        </div>
                        <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                            <div class="text-[10px] uppercase tracking-wide text-gray-500">Pending links</div>
                            <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${pendingLinks}</div>
                        </div>
                        <div class="rounded-md border border-gray-200 dark:border-gray-700 px-2 py-2">
                            <div class="text-[10px] uppercase tracking-wide text-gray-500">Responses</div>
                            <div class="text-lg font-semibold text-gray-900 dark:text-gray-100">${responses.length}</div>
                        </div>
                    </div>
                </div>
            `;
        };

        const normalizeSurveyAudience = (audience) => {
            const out = [];
            const seen = new Set();
            for (const raw of asSurveyList(audience)) {
                const key = String(raw || '').trim().toLowerCase();
                let label = null;
                if (key === 'pi' || key === 'principal investigator' || key === 'investigator') label = 'PI';
                else if (key === 'coordinator' || key === 'crc' || key === 'study coordinator') label = 'Coordinator';
                else if (String(raw || '').trim()) label = String(raw).trim();
                if (!label || seen.has(label)) continue;
                seen.add(label);
                out.push(label);
            }
            return out.length ? out : ['PI', 'Coordinator'];
        };

        const isPredefinedSurveyDef = (d) => {
            if (!d) return false;
            if (d.isPredefined === true || d.library === 'feasibility') return true;
            const id = String(d.id || '');
            return id.startsWith('survey-feas-')
                || id === 'survey-general-feasibility'
                || id === 'survey-general-feasibility-short';
        };

        const surveyDefRowHtml = (d, { predefined = false } = {}) => {
            const ind = d.indication || d.therapeuticArea || '';
            const scoring = surveyDefinitionScoringSummary(d);
            const scoreChip = scoring.hasScoring
                ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200" title="${escapeHtml(scoring.detail)}">Scored</span>`
                : `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400" title="${escapeHtml(scoring.detail)}">No score</span>`;
            return `
                <div class="comms-row flex items-center gap-2 px-2.5 py-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700/40 border border-transparent hover:border-gray-200 dark:hover:border-gray-600" data-search="${escapeHtml(`${d.title || ''} ${ind} ${d.id || ''}`.toLowerCase())}">
                    <div class="min-w-0 flex-1">
                        <div class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">
                            ${escapeHtml(d.title || '(untitled)')}
                            ${predefined ? '<span class="ml-1 text-[10px] font-semibold text-indigo-600 dark:text-indigo-300">LIB</span>' : ''}
                            <span class="ml-1 align-middle">${scoreChip}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" class="send-predefined-survey-btn px-2 py-1 rounded text-xs bg-gray-800 text-white" data-definition-id="${escapeHtml(d.id)}">Send</button>
                        <button type="button" class="clone-site-survey-definition-btn px-2 py-1 rounded text-xs bg-indigo-600 text-white" data-definition-id="${escapeHtml(d.id)}">Clone</button>
                        <button type="button" class="edit-site-survey-definition-btn px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700" data-definition-id="${escapeHtml(d.id)}">Edit</button>
                    </div>
                </div>`;
        };

        // Back-compat alias used nowhere critical after cleanup
        const surveyDefCardHtml = (d, opts) => surveyDefRowHtml(d, opts);

        const renderFeasibility = () => {
            const body = document.getElementById('comms-panel-body');
            const titleEl = document.getElementById('comms-panel-title');
            const actionsEl = document.getElementById('comms-panel-actions');
            const footerEl = document.getElementById('comms-panel-footer');
            const searchWrap = document.getElementById('comms-search-wrap');
            if (!body) return;

            const allDefs = asSurveyList(allSiteSurveyDefinitions).slice().sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            const predefined = allDefs.filter(isPredefinedSurveyDef);
            const custom = allDefs.filter(d => !isPredefinedSurveyDef(d));

            let assignments = asSurveyList(allSiteSurveyAssignments).slice();
            if (commsSiteFilterId) assignments = assignments.filter(a => a && a.siteId === commsSiteFilterId);
            assignments.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

            let responses = asSurveyList(allSiteSurveyResponses).filter(r => r && !r._archived);
            if (commsSiteFilterId) responses = responses.filter(r => r && r.siteId === commsSiteFilterId);
            responses.sort((a, b) => String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || '')));

            const notes = Array.isArray(window.__siteSurveyNotifications) ? window.__siteSurveyNotifications : [];
            const cap = COMMS_LIST_CAP;
            const showSearch = ['templates', 'questions', 'links', 'responses'].includes(commsPanel);
            if (searchWrap) searchWrap.classList.toggle('hidden', !showSearch);

            const titles = {
                templates: 'Templates',
                questions: 'Question library',
                links: 'Secure links',
                responses: 'Responses',
                activity: 'Activity',
                privacy: 'Privacy tools'
            };
            if (titleEl) titleEl.textContent = titles[commsPanel] || 'Feasibility';
            if (actionsEl) {
                if (commsPanel === 'responses') {
                    actionsEl.innerHTML = `
                        <button type="button" id="jump-survey-reporting-btn" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline">Question report →</button>
                        <button type="button" id="comms-sponsor-excel-btn" class="text-xs font-medium px-2 py-1 rounded bg-teal-700 text-white">Sponsor Excel</button>
                        <button type="button" id="comms-sponsor-pdf-btn" class="text-xs font-medium px-2 py-1 rounded bg-indigo-600 text-white">Sponsor PDF</button>`;
                } else if (commsPanel === 'activity') {
                    actionsEl.innerHTML = `<button type="button" id="mark-survey-notifications-read-btn" class="text-xs font-medium text-emerald-700 dark:text-emerald-300 hover:underline">Mark all read</button>`;
                } else if (commsPanel === 'questions') {
                    actionsEl.innerHTML = `
                        <button type="button" id="import-questions-from-templates-btn" class="text-xs font-medium px-2 py-1 rounded border border-gray-300 dark:border-gray-600">Import from templates</button>
                        <button type="button" id="new-library-question-btn-panel" class="text-xs font-medium px-2 py-1 rounded bg-indigo-600 text-white">New question</button>`;
                } else {
                    actionsEl.innerHTML = '';
                }
            }

            const empty = (msg) => `<div class="text-sm text-gray-500 dark:text-gray-400 px-2 py-6 text-center">${msg}</div>`;

            if (commsPanel === 'templates') {
                if (!custom.length && !predefined.length) {
                    body.innerHTML = empty('No survey templates yet. Create one or clone from ingest.');
                } else {
                    body.innerHTML = `
                        ${custom.length ? `<div class="px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 sticky top-0 bg-white dark:bg-gray-800 z-[1]">Custom (${custom.length})</div>${custom.map(d => surveyDefRowHtml(d, { predefined: false })).join('')}` : ''}
                        ${predefined.length ? `<div class="px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 sticky top-0 bg-white dark:bg-gray-800 z-[1] ${custom.length ? 'mt-1' : ''}">Library (${predefined.length})</div>${predefined.map(d => surveyDefRowHtml(d, { predefined: true })).join('')}` : ''}
                    `;
                }
                const total = custom.length + predefined.length;
                if (footerEl) footerEl.textContent = `${total} template${total === 1 ? '' : 's'} · use Filter to jump`;
            } else if (commsPanel === 'questions') {
                const lib = asSurveyList(allSiteSurveyQuestionLibrary)
                    .slice()
                    .sort((a, b) => String(a.label || '').localeCompare(String(b.label || '')));
                const active = lib.filter(q => q && q.status !== 'archived');
                const archived = lib.filter(q => q && q.status === 'archived');
                const typeLabel = (t) => ({ select: 'Multiple choice', text: 'Short text', textarea: 'Long text', number: 'Number', date: 'Date' }[t] || t);
                const row = (q) => {
                    const opts = Array.isArray(q.options) ? q.options.length : 0;
                    const scored = (q.scoringWeight || 0) > 0 || q.knockout;
                    const search = `${q.label || ''} ${q.category || ''} ${q.type || ''} ${(q.tags || []).join(' ')}`.toLowerCase();
                    return `
                        <div class="comms-row flex items-center gap-2 px-2.5 py-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700/40" data-search="${escapeHtml(search)}">
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">${escapeHtml(q.label || '(untitled)')}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 truncate">${escapeHtml(typeLabel(q.type))} · ${escapeHtml(q.category || 'General')}${opts ? ` · ${opts} choices` : ''}${scored ? ' · scored' : ''}</div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" class="edit-library-question-btn px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700" data-question-id="${escapeHtml(q.id)}">Edit</button>
                                <button type="button" class="archive-library-question-btn px-2 py-1 rounded text-xs border border-gray-300 dark:border-gray-600" data-question-id="${escapeHtml(q.id)}" data-archive="${q.status === 'archived' ? '0' : '1'}">${q.status === 'archived' ? 'Restore' : 'Archive'}</button>
                            </div>
                        </div>`;
                };
                if (!lib.length) {
                    body.innerHTML = empty('No library questions yet. Create reusable questions here, then pick them when building a survey.');
                } else {
                    body.innerHTML = `
                        ${active.length ? `<div class="px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 sticky top-0 bg-white dark:bg-gray-800 z-[1]">Active (${active.length})</div>${active.map(row).join('')}` : ''}
                        ${archived.length ? `<div class="px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-gray-400 sticky top-0 bg-white dark:bg-gray-800 z-[1] ${active.length ? 'mt-1' : ''}">Archived (${archived.length})</div>${archived.map(row).join('')}` : ''}
                    `;
                }
                if (footerEl) footerEl.textContent = `${lib.length} library question${lib.length === 1 ? '' : 's'}`;
            } else if (commsPanel === 'links') {
                const rows = assignments.map(a => {
                    const siteName = allSites.find(s => s.id === a.siteId)?.name || a.siteId;
                    const surveyTitle = allDefs.find(d => d.id === a.surveyId)?.title || a.surveyId;
                    const exp = a.expiresAt ? new Date(a.expiresAt).toLocaleDateString() : '—';
                    const search = `${siteName} ${surveyTitle} ${a.targetEmail || ''} ${a.status || ''}`.toLowerCase();
                    return `
                        <div class="comms-row flex items-center gap-2 px-2.5 py-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700/40" data-search="${escapeHtml(search)}">
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">${escapeHtml(siteName)} · ${escapeHtml(formatSiteSurveyRoleLabel(a.targetRole))}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 truncate">${escapeHtml(surveyTitle)} · ${escapeHtml(a.status || 'sent')} · exp ${escapeHtml(exp)}${a.targetEmail ? ` · ${escapeHtml(a.targetEmail)}` : ''}</div>
                            </div>
                            <button type="button" class="resend-site-survey-btn px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700 shrink-0" data-assignment-id="${escapeHtml(a.id)}">Resend</button>
                        </div>`;
                });
                const shown = rows.slice(0, cap);
                body.innerHTML = rows.length === 0 ? empty('No links yet. Hit Send survey.') : shown.join('');
                if (footerEl) footerEl.textContent = rows.length > cap ? `Showing ${cap} of ${rows.length}.` : `${rows.length} link${rows.length === 1 ? '' : 's'}`;
            } else if (commsPanel === 'responses') {
                const rows = responses.map(r => {
                    const siteName = allSites.find(s => s.id === r.siteId)?.name || r.siteId;
                    const def = allDefs.find(d => d.id === r.surveyId);
                    const surveyTitle = def?.title || r.surveyId;
                    const answerCount = asSurveyList(r.answers).filter(a => a && String(a.value ?? '').trim() !== '').length;
                    const when = r.submittedAt || r.createdAt || '';
                    const whenLabel = when ? new Date(when).toLocaleString() : '—';
                    const search = `${siteName} ${surveyTitle} ${r.targetRole || ''}`.toLowerCase();
                    return `
                        <div class="comms-row flex items-center gap-2 px-2.5 py-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700/40" data-search="${escapeHtml(search)}">
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-2 min-w-0">
                                    <div class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">${escapeHtml(siteName)}</div>
                                    ${surveyOutcomeBadgeHtml(r, def)}
                                </div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 truncate">${escapeHtml(surveyTitle)} · ${escapeHtml(formatSiteSurveyRoleLabel(r.targetRole))} · ${answerCount} ans · ${escapeHtml(whenLabel)}</div>
                            </div>
                            <button type="button" class="view-site-survey-response-btn px-2 py-1 rounded text-xs bg-gray-100 dark:bg-gray-700 shrink-0" data-response-id="${escapeHtml(r.id)}">View</button>
                        </div>`;
                });
                const shown = rows.slice(0, cap);
                body.innerHTML = rows.length === 0 ? empty('No responses yet.') : shown.join('');
                if (footerEl) footerEl.textContent = rows.length > cap ? `Showing latest ${cap} of ${rows.length}.` : `${rows.length} response${rows.length === 1 ? '' : 's'}`;
            } else if (commsPanel === 'activity') {
                body.innerHTML = notes.length === 0
                    ? empty('No activity yet.')
                    : notes.slice(0, 30).map(n => `
                        <div class="flex items-center gap-2 px-2.5 py-2 rounded-md ${n.read ? 'opacity-55' : 'bg-emerald-50/60 dark:bg-emerald-950/20'}">
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">${escapeHtml(n.summary || n.kind || 'Event')}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(n.createdAt ? new Date(n.createdAt).toLocaleString() : '')}</div>
                            </div>
                            ${n.responseId ? `<button type="button" class="view-site-survey-response-btn text-xs text-indigo-600 dark:text-indigo-400 hover:underline shrink-0" data-response-id="${escapeHtml(n.responseId)}">View</button>` : ''}
                        </div>`).join('');
                if (footerEl) footerEl.textContent = `${Math.min(notes.length, 30)} recent event${notes.length === 1 ? '' : 's'}`;
            } else if (commsPanel === 'privacy') {
                body.innerHTML = `
                    <div class="space-y-3 px-1 text-sm">
                        <p class="text-xs text-gray-500 dark:text-gray-400">Export or erase survey personal data by respondent email. Logged to privacy-audit-log.</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <label class="block text-xs">Email
                                <input id="privacy-email" type="email" placeholder="pi@example.com" class="mt-1 w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-sm" />
                            </label>
                            <label class="block text-xs">Archive retention (days)
                                <input id="privacy-retention-days" type="number" min="1" value="365" class="mt-1 w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 px-3 py-2 text-sm" />
                            </label>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button type="button" id="privacy-export-btn" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white text-xs">Export JSON</button>
                            <button type="button" id="privacy-erase-btn" class="px-3 py-1.5 rounded-md bg-amber-600 text-white text-xs">Redact by email</button>
                            <button type="button" id="privacy-purge-btn" class="px-3 py-1.5 rounded-md bg-red-700 text-white text-xs">Purge archives</button>
                            <button type="button" id="privacy-audit-btn" class="px-3 py-1.5 rounded-md border border-gray-300 dark:border-gray-600 text-xs">Refresh audit</button>
                        </div>
                        <pre id="privacy-ops-result" class="hidden text-xs bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-md p-2 max-h-36 overflow-auto whitespace-pre-wrap"></pre>
                        <div id="privacy-audit-list" class="text-xs text-gray-500 dark:text-gray-400 space-y-1 max-h-40 overflow-y-auto"></div>
                    </div>`;
                if (footerEl) footerEl.textContent = '';
                // Re-bind privacy buttons after rebuild
                wireFeasibilityPrivacyTools();
            }

            const clearCommsFilterBtn = document.getElementById('clear-comms-site-filter-btn');
            if (clearCommsFilterBtn && !clearCommsFilterBtn.dataset.bound) {
                clearCommsFilterBtn.dataset.bound = '1';
                clearCommsFilterBtn.addEventListener('click', () => {
                    commsSiteFilterId = null;
                    activeTab = 'feasibility';
                    render();
                });
            }

            const searchInput = document.getElementById('comms-list-search');
            if (searchInput && !searchInput.dataset.bound) {
                searchInput.dataset.bound = '1';
                searchInput.addEventListener('input', () => {
                    const q = String(searchInput.value || '').trim().toLowerCase();
                    body.querySelectorAll('.comms-row').forEach(row => {
                        const hay = row.getAttribute('data-search') || '';
                        row.classList.toggle('hidden', q && !hay.includes(q));
                    });
                });
            } else if (searchInput) {
                searchInput.value = '';
            }

            document.querySelectorAll('.copy-site-survey-link-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(btn.getAttribute('data-url') || '');
                        showNotification('Link copied to clipboard', 'success');
                    } catch (e) {
                        showNotification('Failed to copy link', 'error');
                    }
                });
            });
        };

        const wireFeasibilityPrivacyTools = () => {
            const privacyResult = document.getElementById('privacy-ops-result');
            const showPrivacyResult = (obj) => {
                if (!privacyResult) return;
                privacyResult.classList.remove('hidden');
                privacyResult.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
            };
            const loadPrivacyAudit = async () => {
                const list = document.getElementById('privacy-audit-list');
                if (!list) return;
                try {
                    const rows = await apiService.privacyAudit();
                    const arr = Array.isArray(rows) ? rows : [];
                    list.innerHTML = arr.length === 0
                        ? `<div>No privacy audit events yet.</div>`
                        : arr.slice(0, 20).map(e => `
                            <div class="border-b border-gray-100 dark:border-gray-700 py-1">
                                <span class="font-medium">${escapeHtml(e.action || '')}</span>
                                · ${escapeHtml(e.createdAt || '')}
                                · op ${escapeHtml(e.operator || '')}
                                ${e.counts ? ` · ${escapeHtml(JSON.stringify(e.counts))}` : ''}
                            </div>`).join('');
                } catch (err) {
                    list.textContent = 'Audit load failed: ' + (err.message || err);
                }
            };

            const bind = (id, handler) => {
                const btn = document.getElementById(id);
                if (btn && !btn.dataset.bound) {
                    btn.dataset.bound = '1';
                    btn.addEventListener('click', handler);
                }
            };
            bind('privacy-export-btn', async () => {
                try {
                    const email = document.getElementById('privacy-email')?.value?.trim();
                    if (!email) throw new Error('Email required');
                    const data = await apiService.privacyExport({ email });
                    showPrivacyResult(data);
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `artemis-privacy-export-${email.replace(/[^a-z0-9@._-]/gi, '_')}.json`;
                    a.click();
                    showNotification('Export ready', 'success');
                    await loadPrivacyAudit();
                } catch (err) {
                    showPrivacyResult(err.message || String(err));
                    showNotification('Export failed', 'error');
                }
            });
            bind('privacy-erase-btn', async () => {
                try {
                    const email = document.getElementById('privacy-email')?.value?.trim();
                    if (!email) throw new Error('Email required');
                    if (!confirm(`Redact survey PII for ${email}?`)) return;
                    const data = await apiService.privacyErase({ email, mode: 'redact', confirm: true });
                    showPrivacyResult(data);
                    showNotification('Redacted', 'success');
                    await loadPrivacyAudit();
                } catch (err) {
                    showPrivacyResult(err.message || String(err));
                    showNotification('Erase failed', 'error');
                }
            });
            bind('privacy-purge-btn', async () => {
                try {
                    const olderThanDays = Number(document.getElementById('privacy-retention-days')?.value || 365);
                    if (!confirm(`Purge archived responses older than ${olderThanDays} days?`)) return;
                    const data = await apiService.privacyPurgeArchived({ olderThanDays, confirm: true });
                    showPrivacyResult(data);
                    showNotification('Purge done', 'success');
                    await loadPrivacyAudit();
                } catch (err) {
                    showPrivacyResult(err.message || String(err));
                    showNotification('Purge failed', 'error');
                }
            });
            bind('privacy-audit-btn', () => loadPrivacyAudit());
            loadPrivacyAudit();
        };

        const createLibraryQuestionModal = (existing = null) => {
            const isEdit = !!(existing && existing.id);
            const opts = Array.isArray(existing?.options) ? existing.options : ['Yes', 'No'];
            const typeLabels = { select: 'Multiple choice', text: 'Short text', textarea: 'Long text', number: 'Number', date: 'Date' };
            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content dark:bg-gray-800" style="max-width: 36rem;">
                        <form id="library-question-form" ${isEdit ? `data-edit-id="${escapeHtml(existing.id)}"` : ''}>
                            <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700">
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">${isEdit ? 'Edit library question' : 'New library question'}</h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Reusable question with a fixed data type — surveys pick it so answers normalize and prefill across templates.</p>
                            </div>
                            <div class="p-5 space-y-3">
                                <div>
                                    <label class="block text-sm font-medium">Question</label>
                                    <input name="label" required value="${escapeHtml(existing?.label || '')}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-sm font-medium">Data type (collection)</label>
                                        <select name="type" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                                            ${['select','text','textarea','number','date'].map(t => `<option value="${t}" ${(existing?.type || 'select') === t ? 'selected' : ''}>${typeLabels[t] || t}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium">Category</label>
                                        <input name="category" value="${escapeHtml(existing?.category || 'General')}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                    </div>
                                </div>
                                <label class="flex items-center gap-2 text-sm"><input name="required" type="checkbox" class="h-4 w-4" ${existing?.required !== false ? 'checked' : ''} /> Required (default)</label>
                                <div>
                                    <label class="block text-sm font-medium">Choices (one per line, multiple choice only)</label>
                                    <textarea name="options" rows="4" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">${escapeHtml(opts.join('\n'))}</textarea>
                                </div>
                                <div id="library-question-error" class="text-sm text-red-600 hidden"></div>
                            </div>
                            <div class="px-5 py-3 bg-gray-50 dark:bg-gray-700 flex flex-row-reverse gap-2">
                                <button type="submit" class="px-4 py-2 rounded-md bg-indigo-600 text-white text-sm">${isEdit ? 'Save' : 'Create'}</button>
                                <button type="button" data-action="cancel" class="px-4 py-2 rounded-md border border-gray-300 dark:border-gray-500 text-sm">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>`;
            showModal(modalHTML);
        };

        const SURVEY_QUESTION_TYPES = ['select', 'text', 'textarea', 'number', 'date'];
        const surveyQuestionTypeLabel = (t) => ({
            select: 'Multiple choice',
            text: 'Short text',
            textarea: 'Long text',
            number: 'Number',
            date: 'Date',
        }[String(t || '').toLowerCase()] || t || 'Text');

        const normalizeSurveyQuestionType = (type) => {
            const t = String(type || 'text').toLowerCase().trim();
            if (t === 'yesno' || t === 'yes/no' || t === 'boolean') return 'select';
            if (SURVEY_QUESTION_TYPES.includes(t)) return t;
            if (t === 'longtext' || t === 'paragraph') return 'textarea';
            if (t === 'shorttext' || t === 'string') return 'text';
            return 'text';
        };

        const normalizeLibraryLabelKey = (label) => String(label || '').trim().toLowerCase().replace(/\s+/g, ' ');

        const stripCosmosMeta = (doc) => {
            if (!doc || typeof doc !== 'object') return doc;
            const { _rid, _self, _etag, _attachments, _ts, ...rest } = doc;
            return rest;
        };

        const libraryItemToBuilderQuestion = (lib) => {
            const type = normalizeSurveyQuestionType(lib?.type);
            let options = Array.isArray(lib?.options)
                ? lib.options.map((o) => (typeof o === 'string' ? o : String(o?.label ?? o?.value ?? ''))).filter(Boolean)
                : [];
            if (type === 'select' && options.length < 2) options = ['Yes', 'No'];
            return {
                id: `q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`,
                label: String(lib?.label || '').trim(),
                type,
                required: lib?.required !== false,
                options: type === 'select' ? options : [],
                logic: null,
                scoringWeight: typeof lib?.scoringWeight === 'number' ? lib.scoringWeight : 0,
                scoringOptions: Array.isArray(lib?.scoringOptions) ? lib.scoringOptions : [],
                category: lib?.category || 'General',
                knockout: !!lib?.knockout,
                knockoutOnBlank: !!lib?.knockoutOnBlank,
                knockoutFailValues: Array.isArray(lib?.knockoutFailValues) ? lib.knockoutFailValues : [],
                libraryQuestionId: lib?.id || null,
            };
        };

        /** Ensure each survey question has libraryQuestionId + canonical type for cross-survey normalize/prefill. */
        const ensureQuestionsLinkedToLibrary = async (questions) => {
            let lib = asSurveyList(allSiteSurveyQuestionLibrary).filter((q) => q && q.status !== 'archived');
            if (!lib.length) {
                lib = asSurveyList(await apiService.getSiteSurveyQuestionLibrary().catch(() => [])).filter((q) => q && q.status !== 'archived');
                allSiteSurveyQuestionLibrary = lib;
            }
            const byId = new Map(lib.map((q) => [q.id, q]));
            const byLabelType = new Map(lib.map((q) => [`${normalizeLibraryLabelKey(q.label)}::${normalizeSurveyQuestionType(q.type)}`, q]));
            const byLabel = new Map();
            lib.forEach((q) => {
                const k = normalizeLibraryLabelKey(q.label);
                if (k && !byLabel.has(k)) byLabel.set(k, q);
            });

            const out = [];
            for (const q of questions) {
                const type = normalizeSurveyQuestionType(q.type);
                const label = String(q.label || '').trim();
                let libraryQuestionId = q.libraryQuestionId || null;
                if (libraryQuestionId && byId.has(libraryQuestionId)) {
                    const canon = byId.get(libraryQuestionId);
                    out.push({
                        ...q,
                        type: normalizeSurveyQuestionType(canon.type || type),
                        libraryQuestionId,
                    });
                    continue;
                }
                const key = `${normalizeLibraryLabelKey(label)}::${type}`;
                let hit = byLabelType.get(key) || byLabel.get(normalizeLibraryLabelKey(label));
                if (hit) {
                    out.push({ ...q, type: normalizeSurveyQuestionType(hit.type || type), libraryQuestionId: hit.id });
                    continue;
                }
                try {
                    const created = await apiService.createSiteSurveyQuestionLibraryItem({
                        label,
                        type,
                        required: q.required !== false,
                        options: type === 'select' ? (q.options || []) : [],
                        category: q.category || 'General',
                        scoringWeight: q.scoringWeight || 0,
                        scoringOptions: q.scoringOptions || [],
                        knockout: !!q.knockout,
                        knockoutOnBlank: !!q.knockoutOnBlank,
                        status: 'active',
                        tags: ['from-survey'],
                    });
                    lib.push(created);
                    byId.set(created.id, created);
                    byLabelType.set(key, created);
                    byLabel.set(normalizeLibraryLabelKey(label), created);
                    out.push({ ...q, type, libraryQuestionId: created.id });
                } catch (_) {
                    out.push({ ...q, type, libraryQuestionId: libraryQuestionId || undefined });
                }
            }
            allSiteSurveyQuestionLibrary = lib;
            return out;
        };

        const importLibraryQuestionsFromTemplates = async () => {
            const defs = asSurveyList(allSiteSurveyDefinitions);
            let existing = asSurveyList(allSiteSurveyQuestionLibrary);
            const byLabel = new Map(existing.map(q => [normalizeLibraryLabelKey(q.label), q]));
            let created = 0;
            let skipped = 0;
            let linkedDefs = 0;
            for (const def of defs) {
                for (const q of asSurveyList(def.questions)) {
                    const label = String(q.label || q.title || '').trim();
                    if (!label) continue;
                    const key = normalizeLibraryLabelKey(label);
                    if (byLabel.has(key)) { skipped += 1; continue; }
                    const type = normalizeSurveyQuestionType(q.type);
                    const item = {
                        label,
                        type,
                        required: q.required !== false,
                        options: Array.isArray(q.options) ? q.options.map(o => typeof o === 'string' ? o : String(o.label ?? o.value ?? '')).filter(Boolean) : [],
                        category: q.category || 'General',
                        scoringWeight: typeof q.scoringWeight === 'number' ? q.scoringWeight : 0,
                        scoringOptions: Array.isArray(q.scoringOptions) ? q.scoringOptions : [],
                        knockout: !!q.knockout,
                        knockoutOnBlank: !!q.knockoutOnBlank,
                        status: 'active',
                        tags: [def.id === 'survey-general-feasibility' ? 'general-feasibility' : 'template'],
                        sourceSurveyId: def.id,
                    };
                    if (item.type === 'select' && item.options.length < 2) item.options = ['Yes', 'No'];
                    try {
                        const saved = await apiService.createSiteSurveyQuestionLibraryItem(item);
                        byLabel.set(key, saved);
                        existing.push(saved);
                        created += 1;
                    } catch (_) { /* skip bad rows */ }
                }
            }

            // Backfill libraryQuestionId + canonical type onto existing survey templates
            for (const def of defs) {
                const qs = asSurveyList(def.questions);
                if (!qs.length) continue;
                let changed = false;
                const nextQs = qs.map((q) => {
                    const label = String(q.label || q.title || '').trim();
                    const hit = byLabel.get(normalizeLibraryLabelKey(label));
                    if (!hit) return q;
                    const nextType = normalizeSurveyQuestionType(hit.type || q.type);
                    if (q.libraryQuestionId === hit.id && normalizeSurveyQuestionType(q.type) === nextType) return q;
                    changed = true;
                    return { ...q, libraryQuestionId: hit.id, type: nextType };
                });
                if (!changed) continue;
                try {
                    await apiService.updateSiteSurveyDefinition(def.id, {
                        ...stripCosmosMeta(def),
                        questions: nextQs,
                        updatedAt: new Date().toISOString(),
                    });
                    linkedDefs += 1;
                } catch (_) { /* non-fatal */ }
            }

            allSiteSurveyQuestionLibrary = await apiService.getSiteSurveyQuestionLibrary().catch(() => existing);
            allSiteSurveyDefinitions = await apiService.getSiteSurveyDefinitions().catch(() => allSiteSurveyDefinitions);
            showNotification(
                `Imported ${created} unique question${created === 1 ? '' : 's'}${skipped ? ` · ${skipped} already in library` : ''}${linkedDefs ? ` · linked ${linkedDefs} template${linkedDefs === 1 ? '' : 's'}` : ''}`,
                'success'
            );
            if (activeTab === 'feasibility') render();
        };

        const showLibraryQuestionPicker = ({ excludeLibraryIds = [], onAdd } = {}) => {
            const exclude = new Set((excludeLibraryIds || []).filter(Boolean).map(String));
            const lib = asSurveyList(allSiteSurveyQuestionLibrary)
                .filter((q) => q && q.status !== 'archived' && !exclude.has(String(q.id)))
                .slice()
                .sort((a, b) => String(a.label || '').localeCompare(String(b.label || '')));

            const host = document.getElementById('modal-container') || document.body;
            const overlay = document.createElement('div');
            overlay.id = 'library-question-picker-overlay';
            overlay.className = 'fixed inset-0 z-[80] flex items-center justify-center p-4';
            overlay.style.background = 'rgba(15, 23, 42, 0.55)';
            overlay.innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden border border-gray-200 dark:border-gray-700">
                    <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Add from question library</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Select existing questions (with data types). Same library id keeps answers comparable across surveys.</p>
                        <input id="library-picker-search" type="search" placeholder="Search questions…" class="mt-3 w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm" />
                    </div>
                    <div id="library-picker-list" class="flex-1 overflow-y-auto p-3 space-y-1"></div>
                    <div class="px-5 py-3 border-t border-gray-200 dark:border-gray-700 flex flex-wrap items-center gap-2 justify-between bg-gray-50 dark:bg-gray-900/40">
                        <div class="text-xs text-gray-500 dark:text-gray-400"><span id="library-picker-count">0</span> selected · ${lib.length} available</div>
                        <div class="flex gap-2">
                            <button type="button" id="library-picker-cancel" class="px-3 py-1.5 rounded-md border border-gray-300 dark:border-gray-600 text-sm">Cancel</button>
                            <button type="button" id="library-picker-add" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white text-sm" ${lib.length ? '' : 'disabled'}>Add selected</button>
                        </div>
                    </div>
                </div>`;
            host.appendChild(overlay);

            const listEl = overlay.querySelector('#library-picker-list');
            const countEl = overlay.querySelector('#library-picker-count');
            const selected = new Set();

            const renderList = (filter = '') => {
                const q = filter.trim().toLowerCase();
                const rows = lib.filter((item) => {
                    if (!q) return true;
                    const blob = `${item.label || ''} ${item.category || ''} ${item.type || ''} ${(item.tags || []).join(' ')}`.toLowerCase();
                    return blob.includes(q);
                });
                if (!rows.length) {
                    listEl.innerHTML = `<div class="text-sm text-gray-500 dark:text-gray-400 text-center py-8">${lib.length ? 'No matches.' : 'Library is empty. Import from templates (Feasibility → Questions) or create questions first.'}</div>`;
                    return;
                }
                listEl.innerHTML = rows.map((item) => {
                    const opts = Array.isArray(item.options) ? item.options.length : 0;
                    const checked = selected.has(item.id) ? 'checked' : '';
                    return `
                        <label class="flex items-start gap-3 px-3 py-2 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700/50 cursor-pointer border border-transparent hover:border-gray-200 dark:hover:border-gray-600">
                            <input type="checkbox" class="library-pick mt-1 h-4 w-4" data-lib-id="${escapeHtml(item.id)}" ${checked} />
                            <div class="min-w-0 flex-1">
                                <div class="text-sm font-medium text-gray-900 dark:text-gray-100">${escapeHtml(item.label || '(untitled)')}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(surveyQuestionTypeLabel(item.type))} · ${escapeHtml(item.category || 'General')}${opts ? ` · ${opts} choices` : ''}</div>
                            </div>
                        </label>`;
                }).join('');
            };

            const syncCount = () => { if (countEl) countEl.textContent = String(selected.size); };
            renderList();
            syncCount();

            overlay.querySelector('#library-picker-search')?.addEventListener('input', (e) => renderList(e.target.value || ''));
            listEl.addEventListener('change', (e) => {
                const cb = e.target.closest('.library-pick');
                if (!cb) return;
                const id = cb.getAttribute('data-lib-id');
                if (cb.checked) selected.add(id); else selected.delete(id);
                syncCount();
            });
            const close = () => overlay.remove();
            overlay.querySelector('#library-picker-cancel')?.addEventListener('click', close);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
            overlay.querySelector('#library-picker-add')?.addEventListener('click', () => {
                const picks = lib.filter((q) => selected.has(q.id)).map(libraryItemToBuilderQuestion);
                close();
                if (typeof onAdd === 'function') onAdd(picks);
            });
        };

        const createSiteSurveyDefinitionModal = (existingDefinition = null, options = {}) => {
            const isClone = !!(options && options.clone);
            const isEdit = !!(existingDefinition && existingDefinition.id) && !isClone;
            const cloneQuestionsFromDef = () => {
                const raw = existingDefinition?.questions;
                if (!Array.isArray(raw) || raw.length === 0) return null;
                return raw.map((q) => ({
                    id: isClone
                        ? `q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`
                        : (q.id || `q_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`),
                    label: q.label || q.title || '',
                    type: normalizeSurveyQuestionType(q.type),
                    required: q.required !== false,
                    options: Array.isArray(q.options) ? q.options.map(o => (typeof o === 'string' ? o : String(o.label ?? o.value ?? ''))) : [],
                    logic: q.logic && typeof q.logic === 'object' ? q.logic : null,
                    scoringWeight: typeof q.scoringWeight === 'number' ? q.scoringWeight : 0,
                    scoringOptions: Array.isArray(q.scoringOptions) ? q.scoringOptions : [],
                    category: q.category || 'General',
                    knockout: q.knockout === true,
                    knockoutOnBlank: q.knockoutOnBlank === true,
                    knockoutFailValues: Array.isArray(q.knockoutFailValues) ? q.knockoutFailValues : [],
                    libraryQuestionId: q.libraryQuestionId || null,
                }));
            };

            const fromDef = cloneQuestionsFromDef();
            // New templates start empty — prompt to add from question bank.
            window.__siteSurveyBuilderQuestions = fromDef && fromDef.length
                ? fromDef
                : (isEdit || isClone ? [] : []);
            window.__siteSurveyBuilderMeta = {
                isClone,
                clonedFromId: isClone ? existingDefinition?.id : null,
                preservePredefined: isEdit && isPredefinedSurveyDef(existingDefinition),
            };

            const aud = Array.isArray(existingDefinition?.audience) ? existingDefinition.audience : [];
            const audNorm = aud.map(a => String(a).trim().toLowerCase());
            const piChecked = isEdit || isClone ? audNorm.includes('pi') : true;
            const coordChecked = isEdit || isClone ? audNorm.includes('coordinator') : true;
            const passThresholdVal = Number(existingDefinition?.passThreshold ?? existingDefinition?.scoring?.passThreshold ?? 70);
            const borderlineThresholdVal = Number(existingDefinition?.borderlineThreshold ?? existingDefinition?.scoring?.borderlineThreshold ?? 50);

            const baseTitle = existingDefinition?.title || '';
            const titleVal = isEdit
                ? escapeHtml(baseTitle)
                : (isClone ? escapeHtml(baseTitle ? `Copy of ${baseTitle}` : 'Copy of survey') : '');
            const descVal = (isEdit || isClone) ? escapeHtml(existingDefinition?.description || '') : '';
            const statusVal = isEdit
                ? String(existingDefinition.status || 'draft').toLowerCase()
                : (isClone ? 'draft' : 'draft');
            const heading = isEdit ? 'Edit Site Survey' : (isClone ? 'Clone Survey' : 'New Site Survey');
            const sub = isEdit
                ? 'Update the template; existing assignment links keep the same survey id. Changing scoring affects new submissions and resubmits.'
                : (isClone
                    ? 'Creates a new custom survey from a predefined template. The original library survey is unchanged.'
                    : 'Start empty and add questions from the question bank. Prefer library items so answers stay comparable across studies.');

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content import-modal-content dark:bg-gray-800">
                        <form id="site-survey-definition-form" ${isEdit ? `data-edit-id="${escapeHtml(existingDefinition.id)}"` : ''}${isClone ? ` data-clone-from="${escapeHtml(existingDefinition.id || '')}"` : ''}>
                            <div class="p-6 space-y-4">
                                <div>
                                    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">${heading}</h2>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${sub}</p>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Title</label>
                                        <input name="title" required value="${titleVal}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Description (optional)</label>
                                        <textarea name="description" rows="2" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">${descVal}</textarea>
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Audience</label>
                                        <div class="flex gap-4">
                                            <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
                                                <input type="checkbox" name="audience" value="PI" ${piChecked ? 'checked' : ''} class="h-4 w-4" />
                                                PI
                                            </label>
                                            <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
                                                <input type="checkbox" name="audience" value="Coordinator" ${coordChecked ? 'checked' : ''} class="h-4 w-4" />
                                                Coordinator
                                            </label>
                                        </div>
                                    </div>
                                    <div class="md:col-span-2 rounded-lg border border-[#1B2A4A]/20 dark:border-[#1B2A4A]/50 bg-[#1B2A4A]/5 dark:bg-[#1B2A4A]/20 p-4">
                                        <div class="flex flex-wrap items-start justify-between gap-2 mb-1">
                                            <div>
                                                <div class="text-sm font-semibold text-[#1B2A4A] dark:text-indigo-200">How sites get ranked</div>
                                                <p class="text-xs text-gray-600 dark:text-gray-400 mt-0.5">Score % from answers → Recommend / Needs review / Do not recommend. Auto-fail answers always skip the site.</p>
                                            </div>
                                            <div class="flex flex-wrap gap-1.5">
                                                <button type="button" data-score-preset="standard" class="score-preset-btn px-2 py-1 rounded text-[11px] bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 hover:border-indigo-400">Standard 70/50</button>
                                                <button type="button" data-score-preset="strict" class="score-preset-btn px-2 py-1 rounded text-[11px] bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 hover:border-indigo-400">Strict 80/60</button>
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                                            <div>
                                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">Recommend site at or above (%)</label>
                                                <input name="passThreshold" id="survey-pass-threshold" type="number" min="0" max="100" step="1" value="${escapeHtml(String(Number.isFinite(passThresholdVal) ? passThresholdVal : 70))}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300">Needs review starting at (%)</label>
                                                <input name="borderlineThreshold" id="survey-border-threshold" type="number" min="0" max="100" step="1" value="${escapeHtml(String(Number.isFinite(borderlineThresholdVal) ? borderlineThresholdVal : 50))}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                            </div>
                                        </div>
                                        <div id="scoring-zone-bar-host">${scoringZoneBarHtml(passThresholdVal, borderlineThresholdVal)}</div>
                                    </div>
                                    <div class="md:col-span-2">
                                        <div class="flex flex-wrap items-center justify-between gap-2">
                                            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Questions</label>
                                            <div class="flex flex-wrap gap-2">
                                                <button type="button" id="add-from-library-question-btn" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 text-sm font-medium">Add from library</button>
                                                <button type="button" id="add-site-survey-question-btn" class="px-3 py-1.5 rounded-md border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 text-sm">Custom (not in bank)</button>
                                            </div>
                                        </div>
                                        <div id="site-survey-questions-builder" class="mt-2 space-y-3"></div>
                                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2"><strong>Add from library</strong> is preferred so each question keeps one identity and data type for prefill/deltas. Use Custom only when the bank has no match — customs are linked into the library on save. Required by default; branching only when shown. General Feasibility is auto-added at the top of every sent survey.</p>
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Status</label>
                                        <select name="status" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                                            <option value="draft" ${statusVal === 'draft' ? 'selected' : ''}>draft</option>
                                            <option value="active" ${statusVal === 'active' ? 'selected' : ''}>active</option>
                                            <option value="archived" ${statusVal === 'archived' ? 'selected' : ''}>archived</option>
                                        </select>
                                    </div>
                                </div>
                                <div id="site-survey-definition-error" class="text-sm text-red-600 dark:text-red-300 hidden"></div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 sm:px-6 flex flex-row-reverse gap-2">
                                <button type="submit" class="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:w-auto sm:text-sm">${isEdit ? 'Save changes' : (isClone ? 'Create clone' : 'Create')}</button>
                                <button type="button" data-action="cancel" class="inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-500 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 sm:w-auto sm:text-sm">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            showModal(modalHTML);

            const refreshScoringZoneBar = () => {
                const host = document.getElementById('scoring-zone-bar-host');
                const passEl = document.getElementById('survey-pass-threshold');
                const borderEl = document.getElementById('survey-border-threshold');
                if (!host || !passEl || !borderEl) return;
                let pass = parseInt(passEl.value || '70', 10);
                let border = parseInt(borderEl.value || '50', 10);
                if (Number.isNaN(pass)) pass = 70;
                if (Number.isNaN(border)) border = 50;
                pass = Math.max(0, Math.min(100, pass));
                border = Math.max(0, Math.min(pass, border));
                if (Number(borderEl.value) !== border) borderEl.value = String(border);
                host.innerHTML = scoringZoneBarHtml(pass, border);
            };
            document.getElementById('survey-pass-threshold')?.addEventListener('input', refreshScoringZoneBar);
            document.getElementById('survey-border-threshold')?.addEventListener('input', refreshScoringZoneBar);
            document.querySelectorAll('.score-preset-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const preset = btn.getAttribute('data-score-preset');
                    const passEl = document.getElementById('survey-pass-threshold');
                    const borderEl = document.getElementById('survey-border-threshold');
                    if (!passEl || !borderEl) return;
                    if (preset === 'strict') {
                        passEl.value = '80';
                        borderEl.value = '60';
                    } else {
                        passEl.value = '70';
                        borderEl.value = '50';
                    }
                    refreshScoringZoneBar();
                });
            });

            const renderBuilder = () => {
                const root = document.getElementById('site-survey-questions-builder');
                if (!root) return;
                const questions = window.__siteSurveyBuilderQuestions || [];
                const typeLabels = {
                    text: 'Short text',
                    textarea: 'Long text',
                    number: 'Number',

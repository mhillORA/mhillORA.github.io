    <script>
        // Azure Maps key will be loaded from backend
        let AZURE_MAPS_KEY = null;
        
        // Fetch Azure Maps key from backend
        (async () => {
            try {
                const response = await fetch('/api/azure-maps-config');
                const data = await response.json();
                if (data && data.key) {
                    AZURE_MAPS_KEY = data.key;
                } else {
                    console.error('Azure Maps key not found in backend. Please configure AZURE_MAPS_KEY in Azure environment variables.');
                    AZURE_MAPS_KEY = null;
                }
            } catch (error) {
                console.error('Error fetching Azure Maps key:', error);
                console.error('Please configure AZURE_MAPS_KEY in Azure environment variables.');
                AZURE_MAPS_KEY = null;
            }
        })();
    </script>

        /* Airplane Animations */
        @keyframes takeoff {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translateY(-20px) rotate(-10deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-40px) rotate(-20deg);
                opacity: 0;
            }
        }
        @keyframes landing {
            0% {
                transform: translateY(-40px) rotate(20deg);
                opacity: 0;
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes fly-across {
            0% {
                transform: translateX(-100%) translateY(0);
                opacity: 0;

            50% {

            100% {

                opacity: 0;

    <script>

                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

                        const contentType = response.headers.get('content-type');

                            } catch (parseError) {

                            }
                            return {
                                connected: false,
                                error: 'Connection test failed',
                                detail: `HTTP ${response.status}: ${errorDetail}`,
                                message: 'Failed to test Navan API connection'
                            };
                        }
                        
                        // Check if response is empty
                        if (!responseText || responseText.trim() === '') {
                            console.error('Navan connection test returned empty response');
                            return {
                                connected: false,
                                error: 'Empty response',
                                detail: 'Backend returned empty response',
                                message: 'Navan API connection test returned no data'
                            };
                        }
                        
                        // Check content type
                        const contentType = response.headers.get('content-type');
                        if (contentType && !contentType.includes('application/json')) {
                            console.error('Navan connection test returned non-JSON:', responseText);
                            return {
                                connected: false,
                                error: 'Invalid response format',
                                detail: `Expected JSON but got: ${contentType}. Response: ${responseText.substring(0, 200)}`,

                        // Try to parse JSON
                        let result;
                        try {

                            console.error('Response text:', responseText);

                            };

                        console.log('Navan connection test result:', result);

                            error: 'Connection test failed',
                            detail: error.message || 'Unknown error occurred',
                            stack: error.stack || 'No stack trace available',
                            message: 'Failed to test Navan API connection'
                        };
                    }
                }

                async lookupNavanBooking(bookingId, readOnly = false) {
                    try {
                        // Call backend proxy endpoint (avoids CORS issues and keeps credentials secure)
                        // Backend will handle OAuth token generation and API calls
                        const readOnlyParam = readOnly ? '&readOnly=true' : '';
                        const response = await fetch(`/api/navan-lookup?bookingId=${encodeURIComponent(bookingId)}${readOnlyParam}`, {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const navanData = await response.json();
                            
                            // Check if we have data
                            if (!navanData.data || navanData.data.length === 0) {
                                return {
                                    error: 'No booking found with this ID',
                                    bookingId: bookingId
                                };
                            }
                            
                            const booking = navanData.data[0];
                            const bookingType = booking.bookingType || 'FLIGHT';
                            
                            // Map Navan data based on booking type
                            const mappedData = {
                                bookingId: booking.bookingId || booking.uuid || bookingId,
                                bookingType: bookingType,
                                confirmationNumber: booking.confirmationNumber || booking.bookingId || null,
                                startDate: booking.startDate || null,
                                endDate: booking.endDate || null,
                                vendor: booking.vendor || null,
                                status: this.mapNavanStatus(booking.bookingStatus || booking.approvalStatus),
                                grandTotal: booking.grandTotal || booking.usdGrandTotal || null,
                                currency: booking.currency || 'USD'
                            };
                            
                            // Map booking type specific data
                            if (bookingType === 'FLIGHT') {
                                mappedData.flight = {
                                    flightNumber: booking.segments && booking.segments.length > 0 
                                        ? `${booking.segments[0].providerCode || ''}${booking.segments[0].flightNumber || ''}` 
                                        : null,
                                    airline: booking.vendor || (booking.segments && booking.segments[0]?.providerName) || null,
                                    origin: booking.origin?.airportCode || (booking.segments && booking.segments[0]?.departure?.airportCode) || null,
                                    destination: booking.destination?.airportCode || (booking.segments && booking.segments[0]?.arrival?.airportCode) || null,
                                    departureTime: booking.segments && booking.segments[0]?.startLocalDateTime 
                                        ? new Date(booking.segments[0].startLocalDateTime).toISOString()
                                        : null,
                                    arrivalTime: booking.segments && booking.segments[0]?.endLocalDateTime 
                                        ? new Date(booking.segments[0].endLocalDateTime).toISOString()
                                        : null,
                                    cabin: booking.cabin || booking.cabinPurchased || null,
                                    route: booking.airlineRoute || null,
                                    routeType: booking.routeType || booking.flight || null
                                };
                            } else if (bookingType === 'HOTEL') {
                                mappedData.hotel = {
                                    hotelName: booking.vendor || null,
                                    hotelCode: booking.hotelCode || null,
                                    hotelChain: booking.hotelChain || null,
                                    checkIn: booking.startDate || null,
                                    checkOut: booking.endDate || null,
                                    address: booking.destination?.address || null,
                                    city: booking.destination?.city || null,
                                    state: booking.destination?.state || null,
                                    country: booking.destination?.country || null,
                                    latitude: booking.hotelLatitude || null,
                                    longitude: booking.hotelLongitude || null
                                };
                            } else if (bookingType === 'CAR' || bookingType === 'RENTAL_CAR') {
                                mappedData.car = {
                                    vendor: booking.vendor || null,
                                    carType: booking.carType || null,
                                    pickupDate: booking.startDate || null,
                                    returnDate: booking.endDate || null,
                                    pickupLocation: booking.origin?.address || booking.origin?.city || null,
                                    returnLocation: booking.destination?.address || booking.destination?.city || null
                                };
                            }
                            
                            // Add passenger/traveler information
                            if (booking.passengers && booking.passengers.length > 0) {
                                mappedData.traveler = {
                                    name: booking.passengers[0].person?.name || null,
                                    email: booking.passengers[0].person?.email || null,
                                    employeeId: booking.passengers[0].person?.employeedId || null
                                };
                            }
                            
                            // Add trip information
                            if (booking.tripName) {
                                mappedData.tripName = booking.tripName;
                            }
                            if (booking.purpose) {
                                mappedData.purpose = booking.purpose;
                            }
                            if (booking.reason) {
                                mappedData.reason = booking.reason;
                            }
                            
                            return mappedData;
                        }
                        
                        // Handle specific error statuses
                        let errorMessage = 'Navan booking lookup unavailable';
                        let errorDetail = null;
                        let errorStack = null;
                        console.error(`Navan API returned ${response.status} error for booking ${bookingId}`);
                        
                        // Try to get error details from response
                        try {
                            const errorText = await response.text();
                            if (errorText) {
                                try {
                                    const errorData = JSON.parse(errorText);
                                    console.error('Full error from /api/navan-lookup:', errorData);
                                    
                                    // Extract detailed error information

                                        errorDetail = errorData.detail;

            // --- Helpers ---
            // Calculate distance between two coordinates (Haversine formula - straight line distance)
            const calculateHaversineDistance = (lat1, lon1, lat2, lon2) => {
                const R = 3959; // Earth's radius in miles
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            };

                const previousState = state.undoHistory.pop();
                if (!previousState || !Array.isArray(previousState)) {
                    showNotification('Cannot undo: Invalid history state.', 'error');
                    return;
                }
                
                // Get current state to determine what changed
                const currentEvents = state.crc_events;
                const previousEvents = previousState;
                
                // Find events that were added (in current but not in previous)
                const addedEvents = currentEvents.filter(curr => 
                    !previousEvents.some(prev => prev.id === curr.id)
                );
                
                // Find events that were removed (in previous but not in current)
                const removedEvents = previousEvents.filter(prev => 
                    !currentEvents.some(curr => curr.id === prev.id)
                );
                
                // Find events that were modified (exist in both but different)
                const modifiedEvents = currentEvents.filter(curr => {
                    const prev = previousEvents.find(p => p.id === curr.id);
                    return prev && JSON.stringify(prev) !== JSON.stringify(curr);
                });

                                // Azure Maps uses [longitude, latitude] format
                                if (point.longitude !== undefined && point.latitude !== undefined) {
                                    path.push([point.longitude, point.latitude]);
                                } else if (point.position && point.position.longitude !== undefined && point.position.latitude !== undefined) {

                .slice()
                .sort((a, b) => String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || '')));
        };

        const priorAnswersPreviewHtml = (siteIds, { surveyId = '', roles = [] } = {}) => {
            const selected = (siteIds || []).filter(Boolean);
            if (!selected.length) {
                return `<div class="text-sm text-gray-500 dark:text-gray-400 py-3 text-center">Select one or more sites to preview their previous answers.</div>`;
            }
            const roleSet = new Set((roles || []).map(r => String(r || '').toLowerCase()).filter(Boolean));
            const blocks = selected.map((sid) => {
                const site = (allSites || []).find(s => s.id === sid);
                const name = site?.name || sid;
                let responses = allPriorSurveyResponsesForSite(sid);
                if (roleSet.size) {
                    const roleFiltered = responses.filter(r => roleSet.has(String(r.targetRole || '').toLowerCase()));
                    if (roleFiltered.length) responses = roleFiltered;
                }
                if (surveyId) {
                    responses = responses.slice().sort((a, b) => {
                        const am = a.surveyId === surveyId ? 0 : 1;
                        const bm = b.surveyId === surveyId ? 0 : 1;
                        return am - bm || String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || ''));
                    });
                }
                if (!responses.length) {
                    return `
                        <div class="rounded-lg border border-dashed border-gray-200 dark:border-gray-600 p-3 mb-3">
                            <div class="font-medium text-gray-900 dark:text-gray-100">${escapeHtml(name)}</div>
                            <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">No previous survey answers on file for this site.</div>
                        </div>`;
                }
                const cards = responses.map((r, idx) => {
                    const when = r.submittedAt
                        ? new Date(r.submittedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
                        : (r.createdAt ? new Date(r.createdAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : 'N/A');
                    const title = (allSiteSurveyDefinitions || []).find(d => d.id === r.surveyId)?.title || r.surveyId || 'Survey';
                    const match = surveyId && r.surveyId === surveyId;
                    const open = (match || idx === 0) ? ' open' : '';
                    return `
                        <details class="survey-accordion mb-2"${open}>
                            <summary>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(title)}</span>
                                        ${match ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200">This survey</span>' : ''}
                                        ${surveyScoreBadgeHtml(r)}
                                    </div>
                                    <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                                        ${escapeHtml(formatSiteSurveyRoleLabel(r.targetRole))} · ${escapeHtml(when)} · ${surveyAnswerCount(r)} answers
                                    </div>
                                </div>
                            </summary>
                            <div class="survey-accordion-body">
                                ${surveyAnswersListHtml(r, { skipEmpty: true })}
                            </div>
                        </details>`;
                }).join('');
                return `
                    <div class="mb-4 last:mb-0">
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <div class="font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(name)}</div>
                            <div class="text-xs text-gray-500 dark:text-gray-400">${responses.length} prior submission${responses.length === 1 ? '' : 's'}</div>
                        </div>
                        ${responses.length >= 1 ? surveyDeltaHtml(compareSiteSurveyResponses(responses[0], responses[1] || null, [
                            ...asSurveyList((allSiteSurveyDefinitions || []).find(d => d.id === 'survey-general-feasibility')?.questions),
                            ...asSurveyList((allSiteSurveyDefinitions || []).find(d => d.id === (surveyId || responses[0].surveyId))?.questions),
                        ])) : ''}
                        ${cards}
                    </div>`;
            }).join('');
            return blocks;
        };

        let feasibilityReportSurveyId = null;
        let feasibilityReportRole = 'all';

        const csvEscapeCell = (value) => {
            const s = String(value ?? '');
            if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
            return s;
        };

        const truncateLabel = (label, max = 28) => {
            const s = String(label || '').trim();
            if (s.length <= max) return s;
            return `${s.slice(0, max - 1)}…`;
        };

        /** True for Cosmos / ingest ids that must never appear on sponsor-facing packs. */
        const looksLikeInternalSiteId = (value) => {
            const s = String(value || '').trim();
            if (!s) return true;
            if (/^(legacy[-_])?site[-_]/i.test(s)) return true;
            if (/^site[-_]?feas[-_]/i.test(s)) return true;
            if (/^survey[-_]/i.test(s)) return true;
            if (/^[a-z0-9]+-[a-z0-9-]{10,}$/i.test(s) && !/\s/.test(s)) return true;
            return false;
        };

        const humanizeSiteIdSlug = (siteId) => {
            let s = String(siteId || '').trim();
            s = s
                .replace(/^legacy[-_]?site[-_]?/i, '')
                .replace(/^site[-_]?feas[-_]?/i, '')
                .replace(/^site[-_]?/i, '')
                .replace(/[-_]+/g, ' ')
                .trim();
            if (!s) return 'Site';
            return s.replace(/\b([a-z])/g, (m) => m.toUpperCase());
        };

        const normalizeSiteNameKey = (name) =>
            String(name || '')
                .toLowerCase()
                .replace(/\b(inc\.?|llc|corp\.?|ltd\.?|pllc|pc|md|dr\.?|sc)\b/gi, '')
                .replace(/[^a-z0-9]+/g, '');

        const legacySitesCatalog = () => {
            const fromState = window.ArtemisLegacy?.state?.sites;
            return Array.isArray(fromState) ? fromState : [];
        };

        /**
         * Sponsor-facing site label: never emit backend ids like site-feas-andover.
         * Prefer live Sites → legacy-sites → response metadata → humanized slug.
         */
        const resolveSponsorSiteDisplayName = (siteId, response = null) => {
            const pick = (value) => {
                const t = String(value || '').trim();
                if (!t || looksLikeInternalSiteId(t)) return null;
                return t;
            };

            const live = (allSites || []).find((s) => s && s.id === siteId);
            const legacy = legacySitesCatalog().find((s) => s && s.id === siteId);

            const candidates = [
                live?.name,
                live?.institution_name,
                legacy?.name,
                legacy?.institution_name,
                response?.siteName,
                response?.institution_name,
                response?.site?.name,
                response?.site?.institution_name,
                response?.study?.site_name,
                response?.displaySiteName,
            ];
            for (const c of candidates) {
                const hit = pick(c);
                if (hit) return hit;
            }

            // Match slug tokens against known site directories (e.g. site-feas-andover → Andover Eye…)
            const slugKey = normalizeSiteNameKey(humanizeSiteIdSlug(siteId));
            if (slugKey && slugKey.length >= 4) {
                const pool = [...(allSites || []), ...legacySitesCatalog()].filter((s) => s?.name);
                let best = null;
                let bestScore = 0;
                for (const s of pool) {
                    const key = normalizeSiteNameKey(s.name);
                    if (!key) continue;
                    let score = 0;
                    if (key === slugKey) score = 100;
                    else if (key.includes(slugKey) || slugKey.includes(key)) score = Math.min(key.length, slugKey.length);
                    if (score > bestScore) {
                        bestScore = score;
                        best = s.name;
                    }
                }
                if (best && bestScore >= 4) return best;
            }

            return humanizeSiteIdSlug(siteId);
        };

        const formatSponsorSurveyTitle = (def, surveyId) => {
            const t = String(def?.title || '').trim();
            if (t && !looksLikeInternalSiteId(t) && !/^survey[-_]/i.test(t)) return t;
            return 'Site Feasibility Survey';
        };

        const formatSponsorQuestionLabel = (question, index = 0) => {
            let label = String(question?.label || '').trim();
            label = label.replace(/\s*\|\s*\d{4}-\d{1,2}-\d{1,2}.*$/, '').trim();
            if (label && !/^q[-_]?\d+$/i.test(label) && !looksLikeInternalSiteId(label) && !isSpuriousExcelDateValue(label)) {
                return label;
            }
            return `Question ${index + 1}`;
        };

        const formatSponsorRoleLabel = (role) => {
            const r = String(role || '').trim().toLowerCase();
            if (r === 'pi') return 'Principal Investigator';
            if (r === 'coordinator') return 'Site Coordinator';
            if (!r) return 'Site staff';
            return formatSiteSurveyRoleLabel(role);
        };

        const formatSponsorDate = (iso) => {
            if (!iso) return '—';
            try {
                const d = new Date(iso);
                if (Number.isNaN(d.getTime())) return '—';
                return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
            } catch (_) {
                return '—';
            }
        };

        const isSpuriousExcelDateValue = (value) => {
            const s = String(value || '').trim();
            if (!s) return false;
            return /^\d{4}-\d{1,2}-\d{1,2}([ T]\d{1,2}:\d{2}(:\d{2}(\.\d+)?)?)?$/.test(s)
                || /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s);
        };

        const isDateQuestionLabel = (label) => {
            const l = String(label || '').toLowerCase();
            if (l.includes('update')) return false;
            return /\bdate\b|completion date|start date|end date/.test(l);
        };

        const isSponsorInsightQuestion = (question) => {
            const label = String(question?.label || '');
            if (!label.trim()) return false;
            if (/\|\s*\d{4}-\d{1,2}-\d{1,2}/.test(label)) return false;
            if (isSpuriousExcelDateValue(label)) return false;
            if (isDateQuestionLabel(label)) return false;
            const l = label.toLowerCase();
            if (/person completing|email|phone|address|ip address|collector|respondent id/.test(l)) return false;
            return true;
        };

        const normalizeSponsorAnswerValue = (value, question) => {
            const raw = String(value ?? '').trim();
            if (!raw) return '';
            if (isSpuriousExcelDateValue(raw) && !isDateQuestionLabel(question?.label)) return '';
            if (isSpuriousExcelDateValue(raw) && isDateQuestionLabel(question?.label)) {
                return formatSponsorDate(raw.includes('T') || raw.includes(' ') ? raw : `${raw}T00:00:00`);
            }
            return raw;
        };

        const findAnswerForQuestion = (response, question) => {
            const answers = asSurveyList(response?.answers);
            const qid = question?.id;
            const a = answers.find(x => x && (x.questionId === qid || String(x.questionId) === String(qid)
                || (x.label && question?.label && String(x.label).trim() === String(question.label).trim())));
            if (!a) return { skipped: true, value: '' };
            if (a.skipped && (a.value == null || String(a.value).trim() === '')) return { skipped: true, value: '' };
            const value = normalizeSponsorAnswerValue(a.value, question);
            if (!value) return { skipped: true, value: '' };
            return { skipped: false, value };
        };

        const buildFeasibilityQuestionReport = (surveyId, targetRole = 'all') => {
            const def = (allSiteSurveyDefinitions || []).find(d => d && d.id === surveyId) || null;
            const questions = asSurveyList(def?.questions);
            const roleFilter = String(targetRole || 'all').trim().toLowerCase();

            let responses = (allSiteSurveyResponses || []).filter(r =>
                r && !r._archived && r.surveyId === surveyId
            );
            if (roleFilter && roleFilter !== 'all') {
                responses = responses.filter(r => String(r.targetRole || '').toLowerCase() === roleFilter);
            }

            const bySite = new Map();
            responses
                .slice()
                .sort((a, b) => String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || '')))
                .forEach(r => {
                    if (!r.siteId) return;
                    if (!bySite.has(r.siteId)) bySite.set(r.siteId, r);
                });

            const siteRows = Array.from(bySite.entries()).map(([siteId, response]) => {
                const outcome = resolveScoreOutcome(response?.score, def);
                const pct = typeof response?.score?.pct === 'number' ? response.score.pct : null;
                const knockouts = Array.isArray(response?.score?.knockouts) ? response.score.knockouts : [];
                return {
                    siteId,
                    siteName: resolveSponsorSiteDisplayName(siteId, response),
                    response,
                    when: response.submittedAt || response.createdAt || '',
                    outcome,
                    pct,
                    knockouts,
                };
            });

            const outcomeRank = { pass: 0, borderline: 1, fail: 2, unscored: 3 };
            siteRows.sort((a, b) => {
                const oa = outcomeRank[a.outcome] ?? 9;
                const ob = outcomeRank[b.outcome] ?? 9;
                if (oa !== ob) return oa - ob;
                const pa = a.pct == null ? -1 : a.pct;
                const pb = b.pct == null ? -1 : b.pct;
                if (pb !== pa) return pb - pa;
                return String(a.siteName).localeCompare(String(b.siteName));
            });
            siteRows.forEach((row, idx) => { row.rank = idx + 1; });

            const questionStats = questions.map(q => {
                const counts = new Map();
                let answered = 0;
                let skipped = 0;
                const samples = [];
                siteRows.forEach(({ siteName, response }) => {
                    const { skipped: isSkipped, value } = findAnswerForQuestion(response, q);
                    if (isSkipped || !value) {
                        skipped += 1;
                        return;
                    }
                    answered += 1;
                    counts.set(value, (counts.get(value) || 0) + 1);
                    samples.push({ siteName, value, responseId: response.id });
                });
                const distribution = Array.from(counts.entries())
                    .map(([value, count]) => ({
                        value,
                        count,
                        pct: answered ? Math.round((count / answered) * 100) : 0
                    }))
                    .sort((a, b) => b.count - a.count || a.value.localeCompare(b.value));
                const isLongText = String(q.type || '').toLowerCase() === 'textarea'
                    || distribution.some(d => d.value.length > 80)
                    || distribution.length > 12;
                return { question: q, answered, skipped, distribution, samples, isLongText };
            });

            return { def, questions, siteRows, questionStats, hasScoring: surveyDefinitionHasScoring(def) };
        };

        const renderFeasibilityRankBoardHtml = (report) => {
            if (!report?.siteRows?.length) return '';
            const passN = report.siteRows.filter(r => r.outcome === 'pass').length;
            const borderN = report.siteRows.filter(r => r.outcome === 'borderline').length;
            const failN = report.siteRows.filter(r => r.outcome === 'fail').length;
            const unscoredN = report.siteRows.filter(r => r.outcome === 'unscored').length;
            const passTh = report.def?.passThreshold ?? report.def?.scoring?.passThreshold ?? 70;
            const borderTh = report.def?.borderlineThreshold ?? report.def?.scoring?.borderlineThreshold ?? 50;
            const scoringNote = report.hasScoring
                ? `Recommend ≥ ${passTh}% · Needs review ≥ ${borderTh}% · Do not recommend below that, or any auto-fail`
                : 'This survey template has no scoring rules yet — outcomes show as Unscored until you add points / auto-fails and sites resubmit.';

            const rows = report.siteRows.map((row) => {
                const when = row.when ? new Date(row.when).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '—';
                const koText = row.knockouts?.length
                    ? row.knockouts.map(k => `${k.label}: ${k.answer}`).join('; ')
                    : '—';
                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/40">
                        <td class="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">${row.rank}</td>
                        <td class="px-3 py-2 text-sm font-medium text-gray-900 dark:text-gray-100">
                            <button type="button" class="view-site-details-btn hover:underline" data-site-id="${escapeHtml(row.siteId)}">${escapeHtml(row.siteName)}</button>
                        </td>
                        <td class="px-3 py-2 text-xs">${surveyOutcomeBadgeHtml(row.response, report.def)}</td>
                        <td class="px-3 py-2 text-sm text-gray-700 dark:text-gray-300">${row.pct == null ? '—' : `${row.pct}%`}</td>
                        <td class="px-3 py-2 text-xs text-gray-600 dark:text-gray-300">
                            <button type="button" class="view-site-survey-response-btn text-indigo-600 dark:text-indigo-400 hover:underline" data-response-id="${escapeHtml(row.response.id)}">${escapeHtml(formatSiteSurveyRoleLabel(row.response.targetRole))}</button>
                        </td>
                        <td class="px-3 py-2 text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap">${escapeHtml(when)}</td>
                        <td class="px-3 py-2 text-xs text-red-700 dark:text-red-300 max-w-[16rem]" title="${escapeHtml(koText)}">${escapeHtml(koText)}</td>
                    </tr>`;
            }).join('');

            return `
                <div class="mb-6 rounded-xl border border-[#1B2A4A]/20 dark:border-[#1B2A4A]/50 overflow-hidden">
                    <div class="bg-[#1B2A4A] text-white px-4 py-3 flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <div class="font-semibold">Site Ops ranking</div>
                            <div class="text-xs text-white/75 mt-0.5">${escapeHtml(scoringNote)}</div>
                        </div>
                        <button type="button" id="feasibility-ops-html-btn" class="px-3 py-1.5 rounded-md bg-white/15 hover:bg-white/25 text-sm font-medium">Export Site Ops HTML</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-0 divide-x divide-gray-200 dark:divide-gray-700 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/40">
                        <div class="p-3 text-center"><div class="text-[10px] uppercase text-gray-500">Recommend</div><div class="text-lg font-bold text-emerald-700 dark:text-emerald-300">${passN}</div></div>
                        <div class="p-3 text-center"><div class="text-[10px] uppercase text-gray-500">Needs review</div><div class="text-lg font-bold text-amber-700 dark:text-amber-300">${borderN}</div></div>
                        <div class="p-3 text-center"><div class="text-[10px] uppercase text-gray-500">Do not recommend</div><div class="text-lg font-bold text-red-700 dark:text-red-300">${failN}</div></div>
                        <div class="p-3 text-center"><div class="text-[10px] uppercase text-gray-500">Unscored</div><div class="text-lg font-bold text-gray-600 dark:text-gray-300">${unscoredN}</div></div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                            <thead class="bg-gray-50 dark:bg-gray-700">
                                <tr>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">#</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Site</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Outcome</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Score</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Submitted</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase">Knockouts</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">${rows}</tbody>
                        </table>
                    </div>
                </div>`;
        };

        const exportSiteOpsRankHtml = ({ surveyId, targetRole = 'all' } = {}) => {
            const report = buildFeasibilityQuestionReport(surveyId || feasibilityReportSurveyId, targetRole || feasibilityReportRole || 'all');
            if (!report?.def || !report.siteRows.length) {
                showNotification('No ranked responses to export.', 'info');
                return;
            }
            const title = formatSponsorSurveyTitle(report.def, report.def.id);
            const passTh = report.def?.passThreshold ?? report.def?.scoring?.passThreshold ?? 70;
            const borderTh = report.def?.borderlineThreshold ?? report.def?.scoring?.borderlineThreshold ?? 50;
            const generated = new Date().toLocaleString();
            const rows = report.siteRows.map((row) => {
                const outcome = row.outcome || 'unscored';
                const color = outcome === 'pass' ? '#0F6E56' : outcome === 'borderline' ? '#B45309' : outcome === 'fail' ? '#B91C1C' : '#64748B';
                const ko = row.knockouts?.length
                    ? row.knockouts.map(k => `<li><strong>${escapeHtml(k.label)}</strong>: ${escapeHtml(k.answer)} <em>(${escapeHtml(k.reason || 'knockout')})</em></li>`).join('')
                    : '<li>—</li>';
                return `
                    <tr>
                        <td>${row.rank}</td>
                        <td>${escapeHtml(row.siteName)}</td>
                        <td><span style="color:${color};font-weight:700;text-transform:uppercase">${escapeHtml(outcome)}</span></td>
                        <td>${row.pct == null ? '—' : `${row.pct}%`}</td>
                        <td>${escapeHtml(formatSiteSurveyRoleLabel(row.response.targetRole))}</td>
                        <td>${escapeHtml(row.when ? new Date(row.when).toLocaleString() : '—')}</td>
                        <td><ul style="margin:0;padding-left:1.1rem">${ko}</ul></td>
                    </tr>`;
            }).join('');

            const html = `<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Site Ops Ranking — ${escapeHtml(title)}</title>
<style>
  body{font-family:Georgia,'Times New Roman',serif;color:#0f172a;margin:32px;line-height:1.45}
  h1{font-size:1.6rem;margin:0 0 .25rem;color:#1B2A4A}
  .meta{color:#64748b;font-size:.9rem;margin-bottom:1.25rem}
  .banner{background:#1B2A4A;color:#fff;padding:14px 16px;border-radius:8px;margin-bottom:1rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{border:1px solid #e2e8f0;padding:8px 10px;vertical-align:top;text-align:left}
  th{background:#f8fafc;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:#64748b}
  .note{margin-top:1.25rem;font-size:.85rem;color:#64748b}
  @media print{body{margin:12px}}
</style></head><body>
  <div class="banner">
    <div style="font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8">Ora Clinical · Site Ops</div>
    <div style="font-size:1.25rem;font-weight:700;margin-top:4px">Feasibility ranking — who passed / failed</div>
  </div>
  <h1>${escapeHtml(title)}</h1>
  <div class="meta">Generated ${escapeHtml(generated)} · Audience filter: ${escapeHtml(targetRole === 'all' ? 'All respondents' : formatSiteSurveyRoleLabel(targetRole))} · Pass ≥ ${passTh}% · Borderline ≥ ${borderTh}%</div>
  ${report.hasScoring ? '' : '<p class="meta"><strong>Warning:</strong> This survey template has no scoring rules. Outcomes are Unscored until weights/knockouts are configured and sites resubmit.</p>'}
  <table>
    <thead><tr><th>#</th><th>Site</th><th>Outcome</th><th>Score</th><th>Role</th><th>Submitted</th><th>Knockouts</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <p class="note">Confidential — for Ora Site Ops. Prior submissions are archived on resubmit; ranking uses the latest live response per site.</p>
</body></html>`;

            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safe = String(title).replace(/[^a-z0-9]+/gi, '_').slice(0, 40);
            a.href = url;
            a.download = `ORA_SiteOps_Ranking_${safe}_${new Date().toISOString().slice(0, 10)}.html`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            showNotification('Site Ops ranking HTML downloaded.', 'success');
        };

        const renderFeasibilityReportBodyHtml = (report) => {
            if (!report?.def) {
                return `<div class="text-sm text-gray-500 dark:text-gray-400 py-6 text-center">Select a survey definition to report on feasibility answers.</div>`;
            }
            if (!report.questions.length) {
                return `<div class="text-sm text-gray-500 dark:text-gray-400 py-6 text-center">This survey has no questions.</div>`;
            }
            if (!report.siteRows.length) {
                return `<div class="text-sm text-gray-500 dark:text-gray-400 py-6 text-center">No responses yet for this survey${feasibilityReportRole !== 'all' ? ` (${escapeHtml(formatSiteSurveyRoleLabel(feasibilityReportRole))})` : ''}.</div>`;
            }

                const distHtml = report.questionStats.map((stat, idx) => {
                const q = stat.question;
                const label = formatSponsorQuestionLabel(q, idx);
                let body;
                if (stat.answered === 0) {
                    body = `<div class="text-xs text-gray-500 dark:text-gray-400">No answers (${stat.skipped} blank/skipped).</div>`;
                } else if (stat.isLongText) {
                    body = `
                        <div class="text-xs text-gray-600 dark:text-gray-300 mb-2">${stat.answered} free-text answer${stat.answered === 1 ? '' : 's'} · ${stat.skipped} blank</div>
                        <details class="text-xs">
                            <summary class="cursor-pointer text-indigo-600 dark:text-indigo-400 hover:underline">Show site answers</summary>
                            <ul class="mt-2 space-y-2 max-h-48 overflow-y-auto">
                                ${stat.samples.map(s => `
                                    <li class="border-b border-gray-100 dark:border-gray-700 pb-1">
                                        <button type="button" class="view-site-survey-response-btn font-medium text-indigo-600 dark:text-indigo-400 hover:underline" data-response-id="${escapeHtml(s.responseId)}">${escapeHtml(s.siteName)}</button>
                                        <div class="text-gray-700 dark:text-gray-300 mt-0.5 whitespace-pre-wrap">${escapeHtml(s.value)}</div>
                                    </li>`).join('')}
                            </ul>
                        </details>`;
                } else {
                    body = `
                        <div class="flex flex-wrap gap-2">
                            ${stat.distribution.map(d => `
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100" title="${escapeHtml(d.value)}">
                                    <span class="max-w-[14rem] truncate">${escapeHtml(d.value)}</span>
                                    <span class="font-bold text-indigo-600 dark:text-indigo-300">${d.count}</span>
                                    <span class="text-gray-500 dark:text-gray-400">${d.pct}%</span>
                                </span>`).join('')}
                        </div>
                        <div class="text-[11px] text-gray-500 dark:text-gray-400 mt-2">${stat.answered} answered · ${stat.skipped} blank/skipped</div>`;
                }
                return `
                    <div class="p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900/30">
                        <div class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-2">${escapeHtml(label)}</div>
                        ${body}
                    </div>`;
            }).join('');

            const matrixHead = `
                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase sticky left-0 bg-gray-50 dark:bg-gray-700 z-10">Site</th>
                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Outcome</th>
                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Role</th>
                ${report.questions.map(q => `
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase whitespace-nowrap" title="${escapeHtml(q.label || q.id || '')}">${escapeHtml(truncateLabel(q.label || q.id || ''))}</th>`).join('')}`;

            const matrixBody = report.siteRows.map(row => {
                const when = row.when ? new Date(row.when).toLocaleDateString() : '—';
                const cells = report.questions.map(q => {
                    const { skipped, value } = findAnswerForQuestion(row.response, q);
                    const display = skipped || !value ? '—' : (value.length > 60 ? `${value.slice(0, 59)}…` : value);
                    return `<td class="px-3 py-2 text-xs text-gray-700 dark:text-gray-300 max-w-[12rem] truncate" title="${escapeHtml(value || '')}">${escapeHtml(display)}</td>`;
                }).join('');
                return `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/40">
                        <td class="px-3 py-2 text-sm font-medium text-gray-900 dark:text-gray-100 sticky left-0 bg-white dark:bg-gray-800 z-10 whitespace-nowrap">
                            <button type="button" class="view-site-details-btn hover:underline" data-site-id="${escapeHtml(row.siteId)}">${escapeHtml(row.siteName)}</button>
                            <div class="text-[10px] text-gray-400 font-normal">${escapeHtml(when)}</div>
                        </td>
                        <td class="px-3 py-2 text-xs whitespace-nowrap">${surveyOutcomeBadgeHtml(row.response, report.def)}</td>
                        <td class="px-3 py-2 text-xs text-gray-600 dark:text-gray-300 whitespace-nowrap">
                            <button type="button" class="view-site-survey-response-btn text-indigo-600 dark:text-indigo-400 hover:underline" data-response-id="${escapeHtml(row.response.id)}">${escapeHtml(formatSiteSurveyRoleLabel(row.response.targetRole))}</button>
                        </td>
                        ${cells}
                    </tr>`;
            }).join('');

            return `
                ${renderFeasibilityRankBoardHtml(report)}
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <div class="p-3 rounded-lg border border-gray-200 dark:border-gray-700 text-center">
                        <div class="text-xs text-gray-500 dark:text-gray-400">Questions</div>
                        <div class="text-xl font-bold text-gray-900 dark:text-gray-100">${report.questions.length}</div>
                    </div>
                    <div class="p-3 rounded-lg border border-gray-200 dark:border-gray-700 text-center">
                        <div class="text-xs text-gray-500 dark:text-gray-400">Sites responded</div>
                        <div class="text-xl font-bold text-gray-900 dark:text-gray-100">${report.siteRows.length}</div>
                    </div>
                    <div class="p-3 rounded-lg border border-gray-200 dark:border-gray-700 text-center">
                        <div class="text-xs text-gray-500 dark:text-gray-400">Survey</div>
                        <div class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate" title="${escapeHtml(report.def.title || report.def.id)}">${escapeHtml(report.def.title || report.def.id)}</div>
                        <div class="text-[10px] mt-1">${report.hasScoring ? '<span class="text-emerald-700 dark:text-emerald-300">Scoring configured</span>' : '<span class="text-amber-700 dark:text-amber-300">No scoring rules</span>'}</div>
                    </div>
                </div>
                <h4 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">Answer distributions</h4>
                <div class="space-y-3 mb-6">${distHtml}</div>
                <h4 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-2">Site × question matrix</h4>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Latest response per site (ranked by outcome). Use Export CSV for full cell values.</p>
                <div class="overflow-x-auto border border-gray-200 dark:border-gray-700 rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-700"><tr>${matrixHead}</tr></thead>
                        <tbody class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">${matrixBody}</tbody>
                    </table>
                </div>`;
        };

        const downloadCsvText = (filename, csvText) => {
            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        };

        const exportFeasibilitySurveyCsv = ({ surveyId, mode = 'wide', targetRole = 'all' } = {}) => {
            try {
                const sid = surveyId || feasibilityReportSurveyId;
                if (!sid) {
                    showNotification('Select a survey first.', 'info');
                    return;
                }
                const report = buildFeasibilityQuestionReport(sid, targetRole || feasibilityReportRole);
                if (!report.def) {
                    showNotification('Survey definition not found.', 'error');
                    return;
                }
                if (!report.siteRows.length) {
                    showNotification('No responses to export.', 'info');
                    return;
                }
                const safeTitle = String(report.def.title || sid).replace(/[^a-z0-9]+/gi, '_').slice(0, 40);
                const generatedStamp = new Date().toISOString().slice(0, 10);
                const lines = [];
                if (mode === 'long') {
                    lines.push(['Generated', new Date().toISOString()].map(csvEscapeCell).join(','));
                    lines.push(['Site', 'SiteId', 'Role', 'SubmittedAt', 'Question', 'Answer'].map(csvEscapeCell).join(','));
                    report.siteRows.forEach(row => {
                        report.questions.forEach(q => {
                            const { value } = findAnswerForQuestion(row.response, q);
                            lines.push([
                                row.siteName,
                                row.siteId,
                                formatSiteSurveyRoleLabel(row.response.targetRole),
                                row.when || '',
                                q.label || q.id || '',
                                value
                            ].map(csvEscapeCell).join(','));
                        });
                    });
                    downloadCsvText(`feasibility_${safeTitle}_long_${generatedStamp}.csv`, lines.join('\n'));
                } else {
                    lines.push(['Generated', new Date().toISOString()].map(csvEscapeCell).join(','));
                    const headers = ['Site', 'SiteId', 'Role', 'SubmittedAt', ...report.questions.map(q => q.label || q.id || '')];
                    lines.push(headers.map(csvEscapeCell).join(','));
                    report.siteRows.forEach(row => {
                        const cells = report.questions.map(q => findAnswerForQuestion(row.response, q).value);
                        lines.push([
                            row.siteName,
                            row.siteId,
                            formatSiteSurveyRoleLabel(row.response.targetRole),
                            row.when || '',
                            ...cells
                        ].map(csvEscapeCell).join(','));
                    });
                    downloadCsvText(`feasibility_${safeTitle}_matrix_${generatedStamp}.csv`, lines.join('\n'));
                }
                showNotification('Feasibility CSV downloaded.', 'success');
            } catch (err) {
                console.error(err);
                showNotification('Failed to export feasibility CSV.', 'error');
            }
        };

        let __excelJsLoading = null;
        const ensureExcelJsLib = () => {
            if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
            if (__excelJsLoading) return __excelJsLoading;
            __excelJsLoading = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
                s.async = true;
                s.onload = () => (window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('ExcelJS failed to load')));
                s.onerror = () => reject(new Error('Could not load Excel library'));
                document.head.appendChild(s);
            }).catch((e) => {
                __excelJsLoading = null;
                throw e;
            });
            return __excelJsLoading;
        };

        const downloadExcelJsWorkbook = async (workbook, filename) => {
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        };

        const applySponsorReviewColumns = (sheet, startRow, endRow, includeCol, feedbackCol, notesCol) => {
            if (endRow < startRow) return;
            const includeLetter = sheet.getColumn(includeCol).letter;
            sheet.dataValidations.add(`${includeLetter}${startRow}:${includeLetter}${endRow}`, {
                type: 'list',
                allowBlank: true,
                formulae: ['"Include,Exclude"'],
                showErrorMessage: true,
                errorTitle: 'Include / Exclude',
                error: 'Select Include or Exclude from the list.',
                promptTitle: 'Site decision',
                prompt: 'Choose Include or Exclude',
                showInputMessage: true
            });
            for (let r = startRow; r <= endRow; r++) {
                const includeCell = sheet.getCell(r, includeCol);
                includeCell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                includeCell.border = {
                    top: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                    left: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                    bottom: { style: 'thin', color: { argb: 'FFCBD5E1' } },
                    right: { style: 'thin', color: { argb: 'FFCBD5E1' } }
                };
                includeCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };

                [feedbackCol, notesCol].forEach((col) => {
                    const cell = sheet.getCell(r, col);
                    cell.alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
                    cell.border = {
                        top: { style: 'thin', color: { argb: 'FF94A3B8' } },
                        left: { style: 'thin', color: { argb: 'FF94A3B8' } },
                        bottom: { style: 'thin', color: { argb: 'FF94A3B8' } },
                        right: { style: 'thin', color: { argb: 'FF94A3B8' } }
                    };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFBEB' } };
                });
                sheet.getRow(r).height = Math.max(sheet.getRow(r).height || 0, 48);
            }
            sheet.getColumn(includeCol).width = 16;
            sheet.getColumn(feedbackCol).width = 36;
            sheet.getColumn(notesCol).width = 36;
        };

        const surveyInviteStats = (surveyId, targetRole = 'all') => {
            const roleFilter = String(targetRole || 'all').trim().toLowerCase();
            let assignments = asSurveyList(allSiteSurveyAssignments).filter(a => a && a.surveyId === surveyId);
            if (roleFilter && roleFilter !== 'all') {
                assignments = assignments.filter(a => String(a.targetRole || '').toLowerCase() === roleFilter);
            }
            const bySite = new Map();
            assignments.forEach(a => {
                if (!a.siteId) return;
                const prev = bySite.get(a.siteId);
                const rank = String(a.status || '').toLowerCase() === 'submitted' ? 2 : 1;
                if (!prev || rank >= prev.rank) bySite.set(a.siteId, { assignment: a, rank });
            });
            const invited = bySite.size;
            const submitted = [...bySite.values()].filter(x => String(x.assignment.status || '').toLowerCase() === 'submitted').length;
            return { invited, submitted, pending: Math.max(0, invited - submitted), assignments };
        };

        const buildSponsorPackModel = ({ surveyId, targetRole = 'all' } = {}) => {
            const sid = surveyId || feasibilityReportSurveyId;
            const role = targetRole || feasibilityReportRole || 'all';
            const report = buildFeasibilityQuestionReport(sid, role);
            if (!report?.def) return null;
            const invites = surveyInviteStats(sid, role);
            const responded = report.siteRows.length;
            const invited = Math.max(invites.invited, responded);
            const rate = invited ? Math.round((responded / invited) * 100) : (responded ? 100 : 0);
            const generatedAt = new Date();
            const surveyTitle = formatSponsorSurveyTitle(report.def, sid);
            const closedQs = report.questionStats.filter(s =>
                !s.isLongText
                && s.distribution.length
                && s.answered
                && isSponsorInsightQuestion(s.question)
                && !s.distribution.every(d => isSpuriousExcelDateValue(d.value))
            );
            const highlights = closedQs
                .slice()
                .sort((a, b) => b.answered - a.answered)
                .slice(0, 6)
                .map((s, idx) => ({
                    question: formatSponsorQuestionLabel(s.question, idx),
                    answered: s.answered,
                    top: s.distribution[0] || null,
                    distribution: s.distribution.slice(0, 4)
                }));
            return { report, invites, invited, responded, rate, role, generatedAt, highlights, surveyId: sid, surveyTitle };
        };

        const ensureSponsorPackLookups = async () => {
            if (window.ArtemisLegacy?.ensureLegacySitesForMatching) {
                try {
                    await window.ArtemisLegacy.ensureLegacySitesForMatching();
                } catch (err) {
                    console.warn('Legacy site lookup for sponsor pack failed', err);
                }
            }
        };

        const exportSponsorPackExcel = async ({ surveyId, targetRole = 'all' } = {}) => {
            try {
                await ensureSponsorPackLookups();
                const model = buildSponsorPackModel({ surveyId, targetRole });
                if (!model) {
                    showNotification('Select a survey with a definition first.', 'info');
                    return;
                }
                if (!model.report.siteRows.length) {
                    showNotification('No responses to include in the sponsor pack.', 'info');
                    return;
                }
                showNotification('Building Excel sponsor pack…', 'info');
                const ExcelJS = await ensureExcelJsLib();
                const { report, invited, responded, rate, role, generatedAt, highlights, surveyTitle } = model;
                const safeTitle = String(surveyTitle).replace(/[^a-z0-9]+/gi, '_').slice(0, 36);
                const roleLabel = role === 'all' ? 'All respondents' : formatSponsorRoleLabel(role);
                const wb = new ExcelJS.Workbook();
                wb.creator = 'Ora Clinical Research';
                wb.created = generatedAt;

                const styleHeaderRow = (row) => {
                    row.font = { bold: true, color: { argb: 'FF0F172A' } };
                    row.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE2E8F0' } };
                    row.alignment = { vertical: 'middle', wrapText: true };
                    row.height = 22;
                };

                const summary = wb.addWorksheet('Summary', { views: [{ state: 'frozen', ySplit: 1 }] });
                summary.addRow(['Ora Clinical Research']);
                summary.addRow(['Site Feasibility — Sponsor Pack']);
                summary.addRow([]);
                summary.addRow(['Survey', surveyTitle]);
                summary.addRow(['Audience', roleLabel]);
                summary.addRow(['Generated', formatSponsorDate(generatedAt.toISOString())]);
                summary.addRow(['Classification', 'Confidential — for sponsor review']);
                summary.addRow([]);
                summary.addRow(['Metric', 'Value']);
                summary.addRow(['Participating sites', responded]);
                summary.addRow(['Sites invited', invited]);
                summary.addRow(['Response rate', `${rate}%`]);
                summary.addRow(['Questions', report.questions.length]);
                summary.addRow([]);
                summary.addRow(['Key answer patterns']);
                summary.addRow(['Question', 'Sites answered', 'Leading response', 'Share']);
                highlights.forEach(h => {
                    summary.addRow([
                        h.question,
                        h.answered,
                        h.top?.value || '—',
                        h.top ? `${h.top.pct}%` : '—'
                    ]);
                });
                summary.getColumn(1).width = 42;
                summary.getColumn(2).width = 18;
                summary.getColumn(3).width = 28;
                summary.getColumn(4).width = 12;

                // Primary sponsor markup sheet
                const review = wb.addWorksheet('Site Review', { views: [{ state: 'frozen', ySplit: 2 }] });
                review.mergeCells('A1:H1');
                review.getCell('A1').value = 'Sponsor site decisions — use Include/Exclude dropdown; type Feedback and Notes in the yellow boxes.';
                review.getCell('A1').font = { italic: true, color: { argb: 'FF475569' }, size: 10 };
                review.getCell('A1').alignment = { vertical: 'middle', wrapText: true };
                review.getRow(1).height = 28;
                const reviewHeaders = ['Site', 'Respondent', 'Submitted', 'Answers completed', 'Score %', 'Include / Exclude', 'Feedback', 'Notes'];
                const reviewHeaderRow = review.addRow(reviewHeaders);
                styleHeaderRow(reviewHeaderRow);
                report.siteRows.forEach(row => {
                    const filled = asSurveyList(row.response?.answers).filter(a => a && !a.skipped && String(a.value ?? '').trim() !== '').length;
                    review.addRow([
                        row.siteName,
                        formatSponsorRoleLabel(row.response.targetRole),
                        formatSponsorDate(row.when),
                        filled,
                        typeof row.response?.score?.pct === 'number' ? row.response.score.pct : '',
                        '',
                        '',
                        ''
                    ]);
                });
                review.getColumn(1).width = 28;
                review.getColumn(2).width = 14;
                review.getColumn(3).width = 14;
                review.getColumn(4).width = 16;
                review.getColumn(5).width = 10;
                applySponsorReviewColumns(review, 3, 2 + report.siteRows.length, 6, 7, 8);

                const dist = wb.addWorksheet('Distributions');
                styleHeaderRow(dist.addRow(['Question', 'Answer', 'Sites', 'Percent', 'Blank']));
                report.questionStats.forEach((stat, qi) => {
                    const qLabel = formatSponsorQuestionLabel(stat.question, qi);
                    if (!stat.distribution.length) {
                        dist.addRow([qLabel, '(no answers)', 0, '0%', stat.skipped]);
                        return;
                    }
                    stat.distribution.forEach((d, i) => {
                        dist.addRow([
                            i === 0 ? qLabel : '',
                            d.value,
                            d.count,
                            `${d.pct}%`,
                            i === 0 ? stat.skipped : ''
                        ]);
                    });
                });
                dist.getColumn(1).width = 40;
                dist.getColumn(2).width = 28;
                dist.getColumn(3).width = 10;
                dist.getColumn(4).width = 10;
                dist.getColumn(5).width = 10;

                const matrix = wb.addWorksheet('Site Matrix', { views: [{ state: 'frozen', xSplit: 1, ySplit: 1 }] });
                const matrixHeaders = [
                    'Site',
                    'Respondent',
                    'Submitted',
                    'Score %',
                    ...report.questions.map((q, i) => formatSponsorQuestionLabel(q, i)),
                    'Include / Exclude',
                    'Feedback',
                    'Notes'
                ];
                styleHeaderRow(matrix.addRow(matrixHeaders));
                report.siteRows.forEach(row => {
                    const scorePct = typeof row.response?.score?.pct === 'number' ? row.response.score.pct : '';
                    matrix.addRow([
                        row.siteName,
                        formatSponsorRoleLabel(row.response.targetRole),
                        formatSponsorDate(row.when),
                        scorePct,
                        ...report.questions.map(q => findAnswerForQuestion(row.response, q).value || ''),
                        '',
                        '',
                        ''
                    ]);
                });
                matrix.getColumn(1).width = 26;
                matrix.getColumn(2).width = 14;
                matrix.getColumn(3).width = 14;
                matrix.getColumn(4).width = 10;

                        <ul class="list-disc pl-4 space-y-0.5">${knockouts.map(k => `<li>${escapeHtml(typeof k === 'string' ? k : (k.reason || k.label || k.questionId || JSON.stringify(k)))}</li>`).join('')}</ul>
                   </div>`
                : '';

            const previous = previousResponseForCompare(response);
            const genDef = (allSiteSurveyDefinitions || []).find(d => d.id === 'survey-general-feasibility');
            const questionUniverse = [
                ...asSurveyList(genDef?.questions),
                ...asSurveyList(def?.questions),
            ];
            const delta = compareSiteSurveyResponses(response, previous, questionUniverse);

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content dark:bg-gray-800" style="max-width: 56rem;">
                        <div class="p-0 overflow-hidden rounded-xl">
                            <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 dark:from-indigo-800 dark:to-indigo-900 px-6 py-5 text-white">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="min-w-0">
                                        <div class="text-indigo-200 text-xs font-semibold uppercase tracking-wider mb-1">Survey response</div>
                                        <h2 class="text-xl font-bold truncate">${escapeHtml(surveyTitle)}</h2>
                                        <div class="text-indigo-100 text-sm mt-1">${escapeHtml(siteName)} · ${escapeHtml(formatSiteSurveyRoleLabel(response.targetRole))}</div>
                                        <div class="mt-2 flex flex-wrap items-center gap-2">
                                            ${surveyOutcomeBadgeHtml(response, def)}
                                            <span class="text-indigo-100 text-xs">${escapeHtml(pointsLine)}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3 shrink-0">
                                        ${surveyScoreRingHtml(response)}
                                        <button type="button" data-action="cancel" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-sm text-white">Close</button>
                                    </div>
                                </div>
                            </div>
                            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex flex-wrap gap-4 text-sm text-gray-600 dark:text-gray-300">
                                <span><strong class="text-gray-800 dark:text-gray-100">${answerCount}</strong> answers</span>
                                <span>Submitted ${escapeHtml(when)}</span>
                                ${response._resubmitCount ? `<span class="text-blue-600 dark:text-blue-400">Updated ${response._resubmitCount}×</span>` : ''}
                                ${response.displayName || response.email ? `<span>${escapeHtml(response.displayName || '')}${response.displayName && response.email ? ' · ' : ''}${escapeHtml(response.email || '')}</span>` : ''}
                            </div>
                            <div class="p-6 max-h-[65vh] overflow-y-auto">
                                ${knockoutHtml}
                                ${surveyDeltaHtml(delta)}
                                <div class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-2">All answers</div>
                                ${surveyAnswersListHtml(response, { skipEmpty: false })}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            showModal(modalHTML);
        };

        /** Shared with Legacy Sites — same survey UI as live Sites (Chaos never sees legacy-only data). */
        window.ArtemisSurveyUI = {
            syncCache({ definitions, assignments, responses } = {}) {
                if (Array.isArray(definitions)) allSiteSurveyDefinitions = definitions;
                if (Array.isArray(assignments)) allSiteSurveyAssignments = assignments;
                if (Array.isArray(responses)) allSiteSurveyResponses = responses;
            },
            siteSurveySectionsHtml: (...args) => siteSurveySectionsHtml(...args),
            surveyAnswersListHtml: (...args) => surveyAnswersListHtml(...args),
            surveyScoreBadgeHtml: (...args) => surveyScoreBadgeHtml(...args),
            surveyOutcomeBadgeHtml: (...args) => surveyOutcomeBadgeHtml(...args),
            createSiteSurveyResponseModal: (...args) => createSiteSurveyResponseModal(...args),
            latestSurveyResponsesBySurvey: (...args) => latestSurveyResponsesBySurvey(...args),
            surveyAnswerCount: (...args) => surveyAnswerCount(...args),
            formatSiteSurveyRoleLabel: (...args) => formatSiteSurveyRoleLabel(...args),
        };

        const siteDetailField = (label, valueHtml) => {
            if (!valueHtml) return '';
            return `
                <div>
                    <dt class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(label)}</dt>
                    <dd class="text-sm text-gray-900 dark:text-gray-100 mt-0.5">${valueHtml}</dd>
                </div>
            `;
        };

        const formatSiteAddressHtml = (site) => {
            const lines = [
                site.address1,
                site.address2,
                [site.city, site.state, site.zipCode || site.zip].filter(Boolean).join(', '),
                site.country
            ].filter(line => line && String(line).trim());
            if (lines.length === 0) return '';
            return lines.map(line => escapeHtml(line)).join('<br>');
        };

        const formatSiteMailingAddressHtml = (site) => {
            const lines = [
                site.mailingAddress1,
                site.mailingAddress2,
                [site.mailingCity, site.mailingState, site.mailingZipCode].filter(Boolean).join(', '),
                site.mailingCountry
            ].filter(line => line && String(line).trim());
            if (lines.length === 0) return '';
            return lines.map(line => escapeHtml(line)).join('<br>');
        };

        const formatSiteCoordinatorHtml = (name, email) => {
            if (!name && !email) return '';
            if (name && email) {
                return `${escapeHtml(name)} <span class="text-gray-500 dark:text-gray-400">(${escapeHtml(email)})</span>`;
            }
            return escapeHtml(name || email);
        };

        const getSiteInvestigatorPairs = (site) => ([
            [site?.pi, site?.piEmail],
            [site?.pi2Name, site?.pi2Email],
            [site?.pi3Name, site?.pi3Email],
        ]);

        const formatSiteInvestigatorsSummary = (site) => {
            const names = getSiteInvestigatorPairs(site)
                .map(([name]) => name)
                .filter(name => name && String(name).trim());
            return names.length ? names.join(', ') : 'N/A';
        };

        const createSiteDetailsModal = (siteId, { initialTab = 'overview' } = {}) => {
            const site = (allSites || []).find(s => s && s.id === siteId);
            if (!site) return;

            const legacyStats = getArtemisSiteLegacyStats(siteId);

            const addressHtml = formatSiteAddressHtml(site);
            const mailingAddressHtml = formatSiteMailingAddressHtml(site);
            const studiesAtSite = (allStudies || []).filter(st => (st.siteIds || []).includes(site.id));
            const sitePatients = (allPatients || []).filter(p => {
                const currentEnrollment = p.enrollments?.find(e => e.status === 'current');
                return currentEnrollment?.siteId === site.id;
            });
            const enrolledCount = sitePatients.filter(p => p.status && p.status.toLowerCase() === 'enrolled').length;
            const screenFailedCount = sitePatients.filter(p => p.status && p.status.toLowerCase() === 'screen fail').length;
            const totalScreened = enrolledCount + screenFailedCount;
            const screenFailRate = totalScreened > 0 ? Math.round((screenFailedCount / totalScreened) * 100) : 0;
            const indicationBadges = ensureArray(site.indication).map(ind =>
                `<span class="inline-block text-xs bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-200 px-2 py-0.5 rounded-full mr-1 mb-1">${escapeHtml(ind)}</span>`
            ).join('');
            const studyListHtml = studiesAtSite.length
                ? studiesAtSite.map(st => escapeHtml(st.title || st.id)).join(', ')
                : '';

            const siteAssignments = (allSiteSurveyAssignments || []).filter(a => a && a.siteId === siteId);
            const responses = (allSiteSurveyResponses || [])
                .filter(r => r && r.siteId === siteId && !r._archived)
                .slice()
                .sort((a, b) => String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || '')));
            const latestBySurvey = latestSurveyResponsesBySurvey(siteId);
            const surveyAnswerTotal = latestBySurvey.reduce((n, r) => n + surveyAnswerCount(r), 0);
            const scoredResponses = latestBySurvey.filter(r => r.score && typeof r.score.pct === 'number');
            const avgScore = scoredResponses.length
                ? Math.round(scoredResponses.reduce((s, r) => s + r.score.pct, 0) / scoredResponses.length)
                : null;

            const statusBadgeCls = String(site.status || '').toLowerCase() === 'active'
                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200'
                : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300';

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content site-modal-content dark:bg-gray-800 overflow-hidden">
                        <!-- Header -->
                        <div class="bg-gradient-to-br from-slate-50 to-indigo-50/80 dark:from-gray-900 dark:to-indigo-950/40 px-6 pt-6 pb-4 border-b border-gray-200 dark:border-gray-700">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap mb-1">
                                        <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100 truncate">${escapeHtml(site.name || site.id)}</h2>
                                        <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold ${statusBadgeCls}">${escapeHtml(site.status || 'N/A')}</span>
                                        ${site.siteCode ? `<span class="text-xs font-mono text-gray-600 dark:text-gray-300">Code: ${escapeHtml(site.siteCode)}</span>` : (site.siteNameAbbreviation ? `<span class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(site.siteNameAbbreviation)}</span>` : '')}
                                        ${feasibilityOutdatedBadgeHtml(site.id)}
                                    </div>
                                    ${indicationBadges ? `<div class="mt-1">${indicationBadges}</div>` : ''}
                                </div>
                                <div class="flex gap-2 shrink-0">
                                    <button type="button" class="send-site-survey-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700 shadow-sm" data-site-id="${escapeHtml(site.id)}">Send survey</button>
                                    <button type="button" data-action="edit-site" data-id="${escapeHtml(site.id)}" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm hover:bg-white dark:hover:bg-gray-700">Edit</button>
                                    <button type="button" data-action="cancel" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm">Close</button>
                                </div>
                            </div>
                            <!-- Tabs -->
                            <div class="flex gap-1 mt-4">
                                <button type="button" class="site-tab-btn" data-site-tab="overview">Overview</button>
                                <button type="button" class="site-tab-btn" data-site-tab="surveys">
                                    Surveys
                                    ${latestBySurvey.length ? `<span class="ml-1 inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 rounded-full bg-indigo-600 text-white text-[10px] font-bold">${latestBySurvey.length}</span>` : ''}
                                </button>
                            </div>
                        </div>

                        <div class="p-6 max-h-[70vh] overflow-y-auto">
                            <!-- Overview panel -->
                            <div data-site-panel="overview" class="space-y-5">
                                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                                    <div class="survey-summary-chip"><div class="label">Active studies</div><div class="value">${studiesAtSite.length}</div></div>
                                    <div class="survey-summary-chip border-violet-200 dark:border-violet-900/40"><div class="label">Completed Studies</div><div class="value text-violet-700 dark:text-violet-300">${legacyStats?.nStudies ?? '—'}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Total (active + completed)</div><div class="value">${studiesAtSite.length + (legacyStats?.nStudies || 0)}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Patients Currently Enrolled In Trials</div><div class="value">${Math.round(enrolledCount)}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Total Patients Enrolled All Time</div><div class="value">${legacyStats?.enrolled != null ? Math.round(Number(legacyStats.enrolled)).toLocaleString() : '—'}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Study Specific Feasibility Questionnaires</div><div class="value">${latestBySurvey.length}</div></div>
                                </div>
                                <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden">
                                    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-700 dark:text-gray-200">Site information</div>
                                    <dl class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
                                        ${siteDetailField('Site address', addressHtml)}
                                        ${siteDetailField('Mailing address', mailingAddressHtml)}
                                        ${siteDetailField('Investigator 1', formatSiteCoordinatorHtml(site.pi, site.piEmail))}
                                        ${siteDetailField('Investigator 2', formatSiteCoordinatorHtml(site.pi2Name, site.pi2Email))}
                                        ${siteDetailField('Investigator 3', formatSiteCoordinatorHtml(site.pi3Name, site.pi3Email))}
                                        ${siteDetailField('Primary site coordinator', formatSiteCoordinatorHtml(site.siteCoordinator, site.siteCoordinatorEmail))}
                                        ${siteDetailField('Optional coordinator 2', formatSiteCoordinatorHtml(site.siteCoordinator2Name, site.siteCoordinator2Email))}
                                        ${siteDetailField('Optional coordinator 3', formatSiteCoordinatorHtml(site.siteCoordinator3Name, site.siteCoordinator3Email))}
                                        ${siteDetailField('Studies', studyListHtml)}
                                    </dl>
                                </div>
                                ${legacySiteHistoryHtml(siteId)}
                            </div>

                            <!-- Surveys panel -->
                            <div data-site-panel="surveys" class="hidden space-y-4">
                                ${latestBySurvey.length || siteAssignments.length ? `
                                <div class="survey-summary-strip">
                                    <div class="survey-summary-chip"><div class="label">Completed</div><div class="value">${latestBySurvey.length}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Pending links</div><div class="value">${siteAssignments.filter(a => String(a.status || '').toLowerCase() !== 'submitted').length}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Total answers</div><div class="value">${surveyAnswerTotal}</div></div>
                                    ${avgScore != null ? `<div class="survey-summary-chip"><div class="label">Avg score</div><div class="value text-indigo-600 dark:text-indigo-400">${avgScore}%</div></div>` : ''}
                                </div>` : ''}
                                ${siteSurveySectionsHtml(siteId)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            showModal(modalHTML);
            wireSiteDetailsModalUI(siteId, { initialTab });
        };

        const getStaffHTML = () => {
            return `
                <div class="px-4 py-6 sm:px-0 space-y-6">
                    ${workspacePeopleSubnav('staff')}
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-200">PI / Coordinators</h2>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Separate staff records linked to sites (studies derived via site participation).</p>
                        </div>
                        <div class="flex gap-2 flex-wrap justify-end">
                            <select id="staff-role-filter" class="rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
                                <option value="all">All</option>
                                <option value="pi">PI</option>
                                <option value="coordinator">Coordinator</option>
                            </select>
                            <input id="staff-search" type="text" placeholder="Search name/email/site/study…" class="w-full sm:w-72 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm" />
                            <button id="add-staff-btn" class="inline-flex items-center px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 text-sm font-medium">
                                Add PI/Coordinator
                            </button>
                        </div>
                    </div>

                    <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden">
                        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 font-semibold">Staff (${allSiteStaff.length})</div>
                        <div class="p-4">
                            <div id="staff-list" class="space-y-2"></div>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderStaff = () => {
            const listEl = document.getElementById('staff-list');
            const roleEl = document.getElementById('staff-role-filter');
            const searchEl = document.getElementById('staff-search');
            if (!listEl) return;

            const role = String(roleEl?.value || 'all').toLowerCase();
            const term = String(searchEl?.value || '').trim().toLowerCase();

            const items = (allSiteStaff || [])
                .filter(s => s && s.siteId && s.role)
                .filter(s => role === 'all' ? true : String(s.role).toLowerCase() === role)
                .map(s => {
                    const site = allSites.find(x => x.id === s.siteId);
                    const siteName = site?.name || s.siteId;
                    const studies = allStudies
                        .filter(st => (st.siteIds || []).includes(s.siteId))
                        .map(st => st.title)
                        .filter(Boolean);
                    const assignments = (allSiteSurveyAssignments || [])
                        .filter(a => a && a.siteId === s.siteId)
                        .filter(a => {
                            const r = String(s.role || '').toLowerCase();
                            const tr = String(a.targetRole || '').toLowerCase();
                            return !tr ? true : tr === r;
                        })
                        .slice()
                        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
                    return { ...s, siteName, studies, assignments };
                })
                .filter(s => {
                    if (!term) return true;
                    const assignmentHay = (s.assignments || []).map(a => `${a.id || ''} ${a.status || ''} ${a.surveyId || ''}`).join(' ');
                    const hay = `${s.name || ''} ${s.email || ''} ${s.siteName || ''} ${(s.studies || []).join(' ')} ${assignmentHay}`.toLowerCase();
                    return hay.includes(term);
                })
                .sort((a, b) =>
                    String(a.siteName || '').localeCompare(String(b.siteName || '')) ||
                    String(a.role || '').localeCompare(String(b.role || '')) ||
                    String(a.name || '').localeCompare(String(b.name || ''))
                );

            listEl.innerHTML = items.length === 0
                ? `<div class="text-sm text-gray-500 dark:text-gray-400">No staff found.</div>`
                : items.map(s => `
                    <div class="p-3 rounded-md border border-gray-200 dark:border-gray-700">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <div class="font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(s.name || '(no name)')}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(String(s.role || '').toUpperCase())}${s.email ? ` • ${escapeHtml(s.email)}` : ''}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Site: ${escapeHtml(s.siteName)}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Studies: ${(s.studies || []).length ? escapeHtml((s.studies || []).slice(0, 4).join(', ')) + ((s.studies || []).length > 4 ? '…' : '') : '—'}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                                    Surveys:
                                    ${(s.assignments || []).length
                                        ? (s.assignments || []).slice(0, 4).map(a => {
                                            const label = `${a.status || 'sent'} • ${String(a.createdAt || '').slice(0, 10) || 'date'}`;
                                            return `<button type="button" class="resend-site-survey-btn text-blue-600 dark:text-blue-400 underline mr-2" data-assignment-id="${escapeHtml(a.id)}">${escapeHtml(label)}</button>`;
                                        }).join(' ')
                                        : '—'}
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-2 shrink-0">
                                <button type="button" class="edit-staff-btn px-3 py-1.5 rounded-md bg-gray-100 dark:bg-gray-700 text-sm" data-staff-id="${escapeHtml(s.id)}">Edit</button>
                                <div class="text-xs text-gray-400">ID: ${escapeHtml(s.id || '')}</div>
                            </div>
                        </div>

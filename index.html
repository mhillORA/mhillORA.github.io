// --- APPOINTMENT UTILITIES ---
const cancelAppointment = async (patientId) => {
    const patient = state.patients.find(p => p.id === patientId);
    if (!patient || !patient.appointment) return patient || null;
    const { scheduleId, slotId, visit } = patient.appointment;
    const schedule = state.schedules.find(s => s.id === scheduleId);
    if (schedule) {
        const slotIndex = schedule.slots.findIndex(s => s.id === slotId);
        if (slotIndex > -1 && schedule.slots[slotIndex].booked > 0) {
            schedule.slots[slotIndex].booked -= 1;
            await updateDocument('schedules', scheduleId, { slots: schedule.slots });
        }
    }
    // NOTE: We no longer decrement the study enrollment here,
    // as the CTMS is now the source of truth for enrollment numbers.
    // This prevents a double-decrement if the CTMS sends an update.
    const patientToUpdate = state.patients.find(p => p.id === patientId);
    if (patientToUpdate) {
        const cancelledAt = new Date().toISOString();
        const appointments = getPatientAppointments(patientToUpdate).map(appointment =>
            (appointment.id && appointment.id === patientToUpdate.appointment.id) || appointment.slotId === slotId
                ? { ...appointment, status: 'cancelled', visitStatus: 'Cancelled', cancelledAt }
                : appointment);
        const nextPrimary = getPrimaryAppointment({ ...patientToUpdate, appointment: null, appointments });
        const updates = { appointment: nextPrimary, appointments };
        if (visit && patientToUpdate.completedVisits) {
            updates.completedVisits = patientToUpdate.completedVisits.filter(v => v !== visit);
        }
        await updatePatientFields(patientId, updates, 'appointment_cancelled', `${visit || 'Visit'} ${slotId || ''}`.trim());
        const idx = state.patients.findIndex(p => p.id === patientId);
        if (idx >= 0) state.patients[idx] = normalizePatientRecord({ ...state.patients[idx], ...updates });
        return state.patients[idx] || { ...patientToUpdate, ...updates };
    }
    return null;
};
const deletePatient = async (patientId) => {
    const patient = state.patients.find(p => p.id === patientId);
    if (!patient) return;
    // If patient had an appointment, free up the slot.
    // Enrollment count is handled by CTMS, so we don't adjust it here.
    if (patient.appointment) {
        const { scheduleId, slotId } = patient.appointment;
        const schedule = state.schedules.find(s => s.id === scheduleId);
        if (schedule) {
            const slotIndex = schedule.slots.findIndex(s => s.id === slotId);
            if (slotIndex > -1 && schedule.slots[slotIndex].booked > 0) {
                schedule.slots[slotIndex].booked -= 1;
                await updateDocument('schedules', scheduleId, { slots: schedule.slots });
            }
        }
    }
    // Delete the patient document
    await deleteDocument('patients', patientId);
    closeModal();
};
// --- DATA STRUCTURES & UTILITIES ---
const calculateAge = (dobString) => {
    if (!dobString) return '';
    const dob = new Date(dobString);
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
        age--;
    }
    return age >= 0 ? age : '';
};

// --- WASHOUT PERIOD UTILITIES ---
const calculateWashoutEndDate = (exitedDate, washoutDays) => {
    if (!exitedDate || !washoutDays) return null;
    const exitDate = new Date(exitedDate);
    const washoutEndDate = new Date(exitDate);
    washoutEndDate.setDate(exitDate.getDate() + washoutDays);
    return washoutEndDate;
};

const isWashoutPeriodActive = (patient) => {
    if (!patient.enrollments || patient.enrollments.length === 0) return false;
    
    // Find the most recent past enrollment
    const pastEnrollments = patient.enrollments.filter(e => e.status === 'past');
    if (pastEnrollments.length === 0) return false;
    
    const mostRecentPastEnrollment = pastEnrollments.reduce((latest, current) => {
        if (!latest.exitedDate || !current.exitedDate) return latest;
        return new Date(current.exitedDate) > new Date(latest.exitedDate) ? current : latest;
    });
    
    if (!mostRecentPastEnrollment.exitedDate) return false;
    
    // Get the study to find washout days
    const study = state.studies.find(s => s.id === mostRecentPastEnrollment.studyId);
    const washoutDays = study?.washoutDays || 30; // Default to 30 days
    
    const washoutEndDate = calculateWashoutEndDate(mostRecentPastEnrollment.exitedDate, washoutDays);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    return washoutEndDate && today < washoutEndDate;
};

const canBePrescreened = (patient) => {
    // Check if patient is in washout period
    if (isWashoutPeriodActive(patient)) {
        return false;
    }
    
    // Check if patient is already enrolled in a study
    const currentEnrollment = patient.enrollments?.find(e => e.status === 'current');
    if (currentEnrollment) {
        return false;
    }
    
    return true;
};

        const patientId = e.target.dataset.patientId;
        const newStatus = e.target.value;
        const patient = state.patients.find(p => p.id === patientId);
        if (patient && patient.appointment) {
            const updatedAppointment = { ...patient.appointment, visitStatus: newStatus };
            const appointments = getPatientAppointments(patient).map(appointment =>
                String(appointment.id || appointment.slotId) === String(updatedAppointment.id || updatedAppointment.slotId)
                    ? { ...appointment, ...updatedAppointment }

    if (e.target.dataset.dayGroup) {
        const group = e.target.dataset.dayGroup;
        const isChecked = e.target.checked;
        const form = e.target.closest('form');
        if (!form) return;
        const dayButtons = form.querySelectorAll('.day-btn');
        const groups = {
            weekdays: [1, 2, 3, 4, 5],
            weekends: [0, 6],
            everyday: [0, 1, 2, 3, 4, 5, 6]
        };
        const daysToToggle = groups[group] || [];
        dayButtons.forEach(btn => {
            const dayIndex = parseInt(btn.dataset.day);
            if (daysToToggle.includes(dayIndex)) {
                 if (isChecked) {
                    btn.classList.add('bg-blue-500', 'text-white');
                    btn.classList.remove('bg-gray-200', 'dark:bg-gray-600');

                    btn.classList.remove('bg-blue-500', 'text-white');

document.addEventListener('submit', async (e) => {

                showNotification(err.message || 'Could not add medication.', 'error');
            }

            const patient = state.patients.find(p => p.id === pid);

                const medications = (patient.medications || []).map(m => {
                    if (m.id !== medId) return m;
                    return {
                        ...m,
                        name: String(data.name || '').trim(),
                        dosage: String(data.dosage || '').trim(),
                        frequency: String(data.frequency || '').trim(),
                        startDate: data.startDate || '',
                        lastTaken: data.lastTaken || '',
                        notes: String(data.notes || '').trim(),

                const profilesById = new Map(resolvedProfiles.filter(Boolean).map(profile => [profile.id, profile]));

                const mergeIds = sourceIds.filter(id => {

                const collections = formData.getAll('mergeCollections').map(String);

                            other[col].forEach(item => {
                                const key = typeof item === 'string' ? item : item.id || item.name;
                                if (!seen.has(key)) { merged.push(item); seen.add(key); }

                        } else {
                            merged = merged.concat(other[col]);

                await updatePatientFields(keepId, updates, 'profiles_merged', mergeIds.join(', '), { allowWhenLocked: true });

const getActiveSurveyQuestionsContainer = () =>
    document.getElementById('edit-questions-container') || document.getElementById('questions-container');

const updateBranchingLogicDropdowns = () => {
    const questionsContainer = getActiveSurveyQuestionsContainer();
    if (!questionsContainer) return;
    const questionElements = questionsContainer.querySelectorAll('.question-block');
    let displayQuestionNumber = 0;
    const questionOptions = Array.from(questionElements).map((el, index) => {
        const section = el.querySelector('select[name$="-section"]')?.value || '';
        const isScript = el.dataset.scriptBlock === '1';
        const numberedControl = el.querySelector('input[name$="-numbered"]');
        const isNumbered = !isScript && !NON_NUMBERED_PSQ_SECTIONS.has(section) && numberedControl?.checked !== false;
        if (isNumbered) displayQuestionNumber += 1;
        const textControl = el.querySelector('input[name$="-text"], textarea[name$="-script"]');
        const snippet = String(textControl?.value || '').trim().slice(0, 42);
        const label = isScript
            ? `Go to section: ${section || 'Script'}`
            : isNumbered
                ? `Go to Question ${displayQuestionNumber}${snippet ? ` — ${snippet}` : ''}`
                : `Go to unnumbered item${section ? `: ${section}` : ''}${snippet ? ` — ${snippet}` : ''}`;
        return { value: String(index + 1), text: label };
    });
    const sectionOptions = [...new Set(Array.from(questionElements)
        .map(el => el.querySelector('select[name$="-section"]')?.value || '')
        .filter(Boolean))];
    const allDropdowns = questionsContainer.querySelectorAll('select[name$="-option-next"]');
    allDropdowns.forEach(dropdown => {
        // Prefer live .value; only use data-selected-next for initial hydrate from edit HTML
        const currentValue = dropdown.value || dropdown.dataset.selectedNext || 'submit';
        dropdown.innerHTML = `
            <optgroup label="End survey">
                <option value="submit">End — Completed</option>
                <option value="pass">End — Pass (eligible)</option>
                <option value="fail">End — Fail / NQ</option>
            </optgroup>
            <optgroup label="Go to question">
            </optgroup>
            <optgroup label="Go to section">
                <option value="next-section">Go to next section</option>
                ${sectionOptions.map(section => `<option value="section:${escapeHtmlPhi(section)}">Go to ${escapeHtmlPhi(section)}</option>`).join('')}
            </optgroup>
        `;
        const goGroup = dropdown.querySelector('optgroup[label="Go to question"]');
        questionOptions.forEach(opt => {
            const o = document.createElement('option');
            o.value = opt.value;
            o.textContent = opt.text;
            goGroup.appendChild(o);
        });
        dropdown.value = currentValue;
        if (![...dropdown.options].some(o => o.value === currentValue)) dropdown.value = 'submit';
        dropdown.dataset.selectedNext = dropdown.value;
        if (!dropdown.dataset.branchSyncBound) {
            dropdown.dataset.branchSyncBound = '1';
            dropdown.addEventListener('change', () => {
                dropdown.dataset.selectedNext = dropdown.value;
            });
        }
    });
};

const updateQuestionLabel = (qId) => {

// Drag and drop functionality for question reordering
const setupDragAndDrop = () => {
    const container = getActiveSurveyQuestionsContainer();
    if (!container) return;
    
    const questions = container.querySelectorAll('.question-block');
    questions.forEach(question => {
        question.draggable = true;
        question.addEventListener('dragstart', handleDragStart);
        question.addEventListener('dragover', handleDragOver);
        question.addEventListener('drop', handleDrop);
        question.addEventListener('dragend', handleDragEnd);
    });
};

let draggedElement = null;

const handleDragStart = (e) => {
    draggedElement = e.target;
    e.target.style.opacity = '0.5';
};

const handleDragOver = (e) => {
    e.preventDefault();
};

const handleDrop = (e) => {
    e.preventDefault();
    if (draggedElement && e.target !== draggedElement) {
        const container = getActiveSurveyQuestionsContainer();
        const afterElement = getDragAfterElement(container, e.clientY);
        if (afterElement == null) {
            container.appendChild(draggedElement);
        } else {
            container.insertBefore(draggedElement, afterElement);
        }
        renumberSurveyQuestions();
        updateBranchingLogicDropdowns();
    }
};

const renumberSurveyQuestions = () => {
    const container = getActiveSurveyQuestionsContainer();
    if (!container) return;
    let qNum = 0;
    Array.from(container.querySelectorAll('.question-block')).forEach((block) => {
        const label = block.querySelector('[id$="-label"]');
        if (!label) return;
        const section = block.querySelector('select[name$="-section"]')?.value || '';
        const numberedControl = block.querySelector('input[name$="-numbered"]');
        if (block.dataset.scriptBlock === '1' || NON_NUMBERED_PSQ_SECTIONS.has(section) || numberedControl?.checked === false) {
            label.textContent = section || (block.dataset.scriptBlock === '1' ? 'Script' : 'Unnumbered question');
            return;
        }
        qNum += 1;
        label.textContent = 'Question ' + qNum;
    });
};

const handleDragEnd = (e) => {
    e.target.style.opacity = '';
    draggedElement = null;
    renumberSurveyQuestions();
};

const getDragAfterElement = (container, y) => {
    const draggableElements = [...container.querySelectorAll('.question-block:not(.dragging)')];
    
    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        
        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
};

    const optionsContainer = document.querySelector(`div[data-options-for="${qId}"]`);

    // Branching for single-select, dropdown, and multi-select (UAT-060)
    if (type === 'single-select' || type === 'dropdown' || type === 'multi-select') {
        optionHTML += `<select name="${qId}-option-next" class="w-52 p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-800 dark:text-white"></select>`;

        calendarHTML += `<div class="bg-gray-50 dark:bg-gray-700/50"></div>`;
    }
    for (let day = 1; day <= daysInMonth; day++) {
        const currentDate = new Date(year, month, day);
        const dateString = toLocalDateKey(currentDate);
        let appointmentsHTML = '';
        filteredSchedules.forEach(schedule => {
            (Array.isArray(schedule.slots) ? schedule.slots : []).forEach(slot => {

const openVisitScheduleTab = ({ siteId, studyId, visit, scheduleId, dayFilter, label: labelOverride } = {}) => {
    const siteName = state.sites.find(s => s.id === siteId)?.name || 'Site';
    const studyName = state.studies.find(s => s.id === studyId)?.title || 'Study';
    const visitLabel = visit || 'all';
    // Include scheduleId so multiple schedules for the same visit stay as separate tabs
    const tabId = [siteId || 'all', studyId || 'all', visitLabel, scheduleId || 'any'].join('|');
    const label = labelOverride || (visitLabel === 'all'
        ? `${studyName} · ${siteName}`
        : `${visitLabel} · ${studyName} · ${siteName}`);
    const tabs = [...(state.visitScheduleTabs || [])];
    const existingIdx = tabs.findIndex(t => t.id === tabId);
    const nextTab = {
        id: tabId,
        label,
        siteId: siteId || 'all',
        studyId: studyId || 'all',
        visit: visitLabel,
        scheduleId: scheduleId || '',
        dayFilter: dayFilter || state.schedulingBookedDateFilter || 'today',
    };
    if (existingIdx >= 0) tabs[existingIdx] = { ...tabs[existingIdx], ...nextTab };
    else tabs.push(nextTab);
    state.visitScheduleTabs = tabs;
    state.activeVisitScheduleTabId = tabId;
    return tabId;
};

/** Open one Visits tab per visit (keeps prior tabs). Activates the last one. */
const openVisitScheduleTabs = (entries = []) => {
    const list = (entries || []).filter(e => e && (e.visit || e.scheduleId || e.siteId || e.studyId));
    if (!list.length) return null;
    let lastId = null;
    list.forEach(entry => {
        lastId = openVisitScheduleTab(entry);
    });
    return lastId;
};

const renderBookedAppointmentsView = () => {
    const container = document.getElementById('booked-view-container');
    if(!container) return;
    let bookedAppointments = [];
    state.patients.forEach(p => {
        getPatientAppointments(p)
            .filter(appointment => (appointment.status || 'scheduled') !== 'cancelled')
            .forEach(appointment => {
            const schedule = state.schedules.find(s => s.id === appointment.scheduleId);
            if (schedule) {
                const slot = schedule.slots.find(s => s.id === appointment.slotId);
                if(slot) {
                    bookedAppointments.push({ patient: p, appointment, schedule, slot });
                }
            }
        });
    });
    if (state.schedulingSiteFilter !== 'all') {
        bookedAppointments = bookedAppointments.filter(({ patient, appointment, schedule }) => {
            const currentEnrollment = patient.enrollments?.find(e => e.status === 'current');
            return (appointment.siteId || schedule.siteId || currentEnrollment?.siteId) === state.schedulingSiteFilter;
        });
    }
    if (state.schedulingStudyFilter !== 'all') {
        bookedAppointments = bookedAppointments.filter(({ patient, appointment, schedule }) => {
            const currentEnrollment = patient.enrollments?.find(e => e.status === 'current');
            return (appointment.studyId || schedule.studyId || currentEnrollment?.studyId) === state.schedulingStudyFilter;
        });
    }
    if (state.schedulingVisitFilter !== 'all') {
        bookedAppointments = bookedAppointments.filter(({ appointment, schedule }) =>
            (appointment.visit || schedule.visit) === state.schedulingVisitFilter
        );
    }
    const dateFilter = state.schedulingBookedDateFilter || 'today';
    if (dateFilter !== 'all') {
        const dayKey = dateFilter === 'today' ? toLocalDateKey(new Date()) : dateFilter;
        bookedAppointments = bookedAppointments.filter(({ slot }) => toLocalDateKey(slot.startTime) === dayKey);
    }
    bookedAppointments.sort((a,b) => new Date(a.slot.startTime) - new Date(b.slot.startTime));

const findDuplicates = () => {
    const potentialDuplicates = new Map();
    const pushKey = (key, patient) => {
        if (!key) return;
        if (!potentialDuplicates.has(key)) potentialDuplicates.set(key, []);
        const arr = potentialDuplicates.get(key);
        if (!arr.some(p => p.id === patient.id)) arr.push(patient);
    };
    state.patients.forEach(patient => {
        if (patient.status === 'Merged' || patient.mergedIntoId) return;
        if (patient.lastName && patient.dob && patient.firstName) {
            const firstNameKey = String(patient.firstName).toLowerCase().substring(0, 3);
            pushKey('name|' + String(patient.lastName).toLowerCase() + '|' + patient.dob + '|' + firstNameKey, patient);
        }
        const email = String(patient.email || '').trim().toLowerCase();
        if (email && email.includes('@')) pushKey('email|' + email, patient);
        const phone = String(patient.phoneNumber || '').replace(/\D/g, '');
        if (phone.length >= 10) pushKey('phone|' + phone.slice(-10), patient);
    });
    const seen = new Set();
    const actualDuplicates = [];
    for (const group of potentialDuplicates.values()) {
        if (group.length < 2) continue;
        const sig = group.map(p => p.id).sort().join('|');
        if (seen.has(sig)) continue;
        seen.add(sig);
        actualDuplicates.push(group);
    }
    return actualDuplicates;
};

const loadOperationalPatients = async () => {
    const pageSize = 500;
    const maxPatients = 10000;
    try {
        let offset = 0;
        let all = [];
        let total = null;
        while (all.length < maxPatients) {
            const result = await queryPatientsServer({
                limit: pageSize,
                offset,
                includeTotal: offset === 0,
            });
            if (offset === 0) total = result.total;
            const batch = result.items || [];
            all = all.concat(batch);
            if (!batch.length || batch.length < pageSize) break;
            if (total != null && all.length >= total) break;
            offset += pageSize;
        }
        return { patients: all, total: total ?? all.length };
    } catch (err) {
        console.warn('Operational patient query unavailable, falling back to full fetch:', err.message);
        const patients = await fetchData('patients');
        return { patients, total: patients.length };
    }
};

const loadAllData = async (options = {}) => {

        }));
        const sortedPatients = normalizedPatients.sort((a, b) => `${a.firstName || ''} ${a.lastName || ''}`.localeCompare(`${b.firstName || ''} ${b.lastName || ''}`));

const handleCtmsMessage = async (event) => {
    // In a real application, you would check event.origin for security.
    // For example: if (event.origin !== 'https://mhillora.github.io') return;
    const { type, payload } = event.data;
    if (type === 'CTMS_DATA_UPDATE' && payload) {
        const { studyId, enrolled, screenFails } = payload;
        if (!studyId || typeof enrolled === 'undefined' || typeof screenFails === 'undefined') {
            console.warn("Received invalid CTMS data payload:", payload);

        try {
            await updateDocument('studies', studyId, {
                enrolled: parseInt(enrolled, 10),

                sourceSystem: 'artemis'
            });
            const studyTitle = state.studies.find(s => s.id === studyId)?.title || 'a study';

            if (params.get('tab') === 'scheduling') {
                state.activeTab = 'scheduling';
                if (params.get('view')) state.schedulingView = params.get('view');
                if (params.get('site')) state.schedulingSiteFilter = params.get('site');
                if (params.get('study')) state.schedulingStudyFilter = params.get('study');
                if (params.get('visit')) state.schedulingVisitFilter = params.get('visit');
                if (params.get('day')) state.schedulingBookedDateFilter = params.get('day');
                if (params.get('view') === 'booked' && (params.get('visit') || params.get('site') || params.get('study'))) {
                    openVisitScheduleTab({
                        siteId: params.get('site') || 'all',
                        studyId: params.get('study') || 'all',
                        visit: params.get('visit') || 'all',
                        scheduleId: '',
                    });
                }
            }
        } catch { /* ignore */ }
        render();
        
    } catch (error) {
        console.error("NASA initialization failed:", error);
        const errorMessage = "Error: Could not connect to the server. Please refresh the page.";
        mainContent.innerHTML = `<div class="p-4 bg-red-100 rounded-md text-red-700">${errorMessage}</div>`;
    }
};
window.addEventListener('resize', () => {
    if (sidebar.dataset.autoCollapsedForViewport === '1') {
        sidebar.classList.toggle('sidebar-collapsed', window.innerWidth >= 768 && window.innerWidth < 1180);
    }
    if (!sidePanelContainer.classList.contains('translate-x-full') && document.body.classList.contains('patient-panel-open')) {
        syncSidebarForPatientPanel(true);
    }
});
window.onload = init;
</script>
</body>
</html>

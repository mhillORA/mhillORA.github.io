                            userStudiesAccess: state.currentUser.studiesAccess,
                            userStudies: state.currentUser.studies,
                            userSitesAccess: state.currentUser.sitesAccess,
                            userSites: state.currentUser.sites,
                            userPermissionLevel: state.currentUser.permissionLevel
                        };
                    }
                }
                
                // Fall back to individual user permissions if set
                if (state.currentUser.tabs || state.currentUser.studiesAccess || state.currentUser.sitesAccess) {
                    return {
                        tabs: state.currentUser.tabs || [],
                        studiesAccess: state.currentUser.studiesAccess || 'all',
                        studies: state.currentUser.studies || [],
                        sitesAccess: state.currentUser.sitesAccess || 'all',
                        sites: state.currentUser.sites || [],
                        permissionLevel: state.currentUser.permissionLevel || 'read'
                    };
                }
                
                // Admin users and Managers have full access
                const effectiveLevel = getEffectivePermissionLevel(state.currentUser);
                if (effectiveLevel === 'Manager') {
                    return {
                        tabs: 'all',
                        studiesAccess: 'all',
                        studies: [],
                        sitesAccess: 'all',
                        sites: [],
                        permissionLevel: 'full'
                    };
                }
                
                // Default for non-Managers: limited access
                // Supervisors get scheduler access with read-only permissions
                const userEffectiveLevel = getEffectivePermissionLevel(state.currentUser);
                if (userEffectiveLevel === 'Supervisor') {
                    return {
                        tabs: ['scheduler', 'timeOff'],
                        studiesAccess: 'all',
                        studies: [],
                        sitesAccess: 'all',
                        sites: [],
                        permissionLevel: 'read'
                    };
                }
                
                // Default for CRC users
                return {
                    tabs: ['scheduler', 'timeOff'],
                    studiesAccess: 'all',
                    studies: [],
                    sitesAccess: 'all',
                    sites: [],
                    permissionLevel: 'read'
                };
            };
            
            const canAccessTab = (tabId) => {
                const permissions = getUserPermissions();
                if (!permissions) return false;
                
                // Managers always have access
                if (state.currentUser && (isAdminUser() || getEffectivePermissionLevel() === 'Manager')) {
                    return true;
                }
                
                // CRC users have restricted tab access - they cannot access:
                // scheduler, timeOffRequests, managerView, reporting
                if (state.currentUser && getEffectivePermissionLevel() === 'CRC' && !isAdminUser()) {
                    const crcRestrictedTabs = ['scheduler', 'timeOffRequests', 'managerView', 'reporting'];
                    if (crcRestrictedTabs.includes(tabId)) {
                        return false;
                    }
                }
                
                // Check user-specific overrides first
                if (permissions.userTabs !== undefined) {
                    return permissions.userTabs === 'all' || permissions.userTabs.includes(tabId);
                }
                
                // Check permission set
                if (permissions.tabs === 'all') return true;
                return Array.isArray(permissions.tabs) && permissions.tabs.includes(tabId);
            };
            
            const canAccessStudy = (studyId) => {
                const permissions = getUserPermissions();
                if (!permissions) return false;
                
                // Managers always have access
                if (state.currentUser && (isAdminUser() || getEffectivePermissionLevel() === 'Manager')) {
                    return true;
                }
                
                // Check user-specific overrides first
                if (permissions.userStudiesAccess !== undefined) {

                    return Array.isArray(permissions.userStudies) && permissions.userStudies.includes(studyId);

                // Check permission set
                if (permissions.studiesAccess === 'all') return true;
                return Array.isArray(permissions.studies) && permissions.studies.includes(studyId);

                // Check permission set

            // Helper function to check if current user is admin
            const isAdminUser = () => {
                return state.currentUser && state.currentUser.username && 
                       state.currentUser.username.toLowerCase().trim() === 'admin';

            // Helper function to get display permission level (shows "Admin" for admin users)

            // Helper function to get effective permission level for access checks (admin = Manager)
            const getEffectivePermissionLevel = (user = state.currentUser) => {
                if (!user) return 'CRC';
                if (user.username && user.username.toLowerCase().trim() === 'admin') {
                    return 'Manager'; // Admin always has Manager-level access
                }
                return user.permissionLevel || 'CRC';
            };
            
            const getPermissionLevel = () => {
                const permissions = getUserPermissions();
                if (!permissions) return 'read';
                
                // Admin users always have full access
                if (isAdminUser()) return 'full';
                
                // Check user-specific override first
                if (permissions.userPermissionLevel) {
                    if (permissions.userPermissionLevel === 'Manager') return 'full';
                    if (permissions.userPermissionLevel === 'Supervisor') return 'read';
                    return 'read';
                }
                
                // Check permission set
                return permissions.permissionLevel || 'read';
            };
            
            const canEdit = () => {
                const level = getPermissionLevel();
                return level === 'edit' || level === 'full';
            };
            
            const canDelete = () => {
                const level = getPermissionLevel();
                return level === 'full';
            };
            
            // Helper function to get logged-in CRC's ID
            const getLoggedInCrcId = () => {
                if (!state.currentUser || (getEffectivePermissionLevel() !== 'CRC' || isAdminUser())) {
                    return null;
                }
                
                // First, check if user has a direct crcId link (most reliable)
                if (state.currentUser.crcId) {
                    const linkedCrc = state.crcs.find(c => c.id === state.currentUser.crcId);
                    if (linkedCrc) {
                        console.log('Found CRC via user.crcId link:', linkedCrc.name, linkedCrc.id);
                        console.log('User object:', { username: state.currentUser.username, email: state.currentUser.email, crcId: state.currentUser.crcId });
                        return linkedCrc.id;
                    } else {
                        console.warn('User has crcId but CRC not found in state.crcs:', state.currentUser.crcId);
                        console.log('Available CRCs:', state.crcs.map(c => ({ id: c.id, name: c.name })));
                    }
                } else {
                    console.log('User does not have crcId field. User object:', { 
                        username: state.currentUser.username, 
                        email: state.currentUser.email, 
                        permissionLevel: state.currentUser.permissionLevel,
                        hasCrcId: !!state.currentUser.crcId
                    });
                }
                
                // Try to find CRC by username (which should match email or name)
                if (state.currentUser.username) {
                    const username = state.currentUser.username.toLowerCase().trim();
                    const matchingCrc = state.crcs.find(crc => {
                        const crcName = (crc.name || '').toLowerCase().trim();
                        const crcEmail = (crc.email || crc.userEmail || '').toLowerCase().trim();
                        // Match by name or email
                        return crcName === username || crcEmail === username || 
                               crcName.includes(username) || username.includes(crcName.split(' ')[0]);
                    });
                    if (matchingCrc) {
                        console.log('Found CRC via username match:', matchingCrc.name, matchingCrc.id);
                        return matchingCrc.id;
                    }
                }
                
                // Try to find by email
                if (state.currentUser.email) {
                    const userEmail = state.currentUser.email.toLowerCase().trim();
                    const matchingCrc = state.crcs.find(crc => {
                        const crcEmail = (crc.email || crc.userEmail || '').toLowerCase().trim();
                        return crcEmail === userEmail;
                    });
                    if (matchingCrc) {
                        console.log('Found CRC via email match:', matchingCrc.name, matchingCrc.id);
                        return matchingCrc.id;
                    }
                }
                
                // Try partial name matching as last resort
                if (state.currentUser.username) {
                    const usernameParts = state.currentUser.username.toLowerCase().trim().split(' ');
                    const firstName = usernameParts[0];
                    if (firstName) {
                        const matchingCrc = state.crcs.find(crc => {
                            const crcName = (crc.name || '').toLowerCase().trim();
                            const crcNameParts = crcName.split(' ');
                            return crcNameParts[0] === firstName || crcName === firstName;
                        });
                        if (matchingCrc) {
                            console.log('Found CRC via partial name match:', matchingCrc.name, matchingCrc.id);
                            return matchingCrc.id;
                        }
                    }
                }
                
                console.warn('Could not find CRC for user:', state.currentUser.username, state.currentUser.email);
                return null;
            };
            
            // Helper function to check if an event belongs to a specific CRC (checks both crcId and roleAssignments)
            const eventBelongsToCrc = (event, crcId) => {
                if (!crcId || !event) return false;
                
                // Check legacy crcId
                if (event.crcId === crcId) {
                    return true;
                }
                
                // Check roleAssignments (includes both regular roles and training roles)
                // Training roles work the same way - CRC is assigned to the Training role in roleAssignments
                // The trainingAssignments just specify what they're training for (e.g., "ICF")
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    const foundInRoles = Object.values(event.roleAssignments).some(assignments => {
                        if (Array.isArray(assignments)) {
                            return assignments.includes(crcId);
                        }
                        return false;
                    });
                    if (foundInRoles) {
                        return true;
                    }
                }
                
                return false;
            };
            
            // Helper function to check if an event is a Site Assignment with a CRC assigned (not empty/open shift)
            const isSiteAssignmentWithCrc = (event) => {
                if (!event || event.type !== 'Site Assignment') return false;
                
                // Check if there's a CRC assigned via legacy crcId (SITE_STAFF and UNASSIGNED don't count)
                if (event.crcId && event.crcId !== 'SITE_STAFF' && event.crcId !== 'UNASSIGNED' && event.crcId !== null && event.crcId !== undefined) {
                    return true;
                }
                
                // Check if there are any CRCs assigned via roleAssignments (SITE_STAFF and UNASSIGNED don't count)
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    const hasAssignedCrc = Object.values(event.roleAssignments).some(assignments => {
                        if (Array.isArray(assignments)) {
                            return assignments.some(crcId => crcId && crcId !== 'SITE_STAFF' && crcId !== 'UNASSIGNED' && crcId !== null && crcId !== undefined);
                        }
                        return false;
                    });
                    if (hasAssignedCrc) {
                        return true;
                    }
                }
                
                return false;
            };
            
            // Helper function to get hours for a specific CRC from an event
            // Correctly divides hours when multiple CRCs are assigned to the same event
            const getEventHoursForCrc = (event, crcId) => {
                if (!event || !crcId) return 0;
                
                const eventHours = parseFloat(event.hours) || 0;
                if (eventHours === 0) return 0;
                
                // Count how many CRCs are assigned to this event (SITE_STAFF and UNASSIGNED don't count)
                const assignedCrcs = new Set();
                
                // Check legacy crcId
                if (event.crcId && event.crcId !== 'SITE_STAFF' && event.crcId !== 'UNASSIGNED') {
                    assignedCrcs.add(event.crcId);
                }
                
                // Check roleAssignments
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    Object.values(event.roleAssignments).forEach(assignments => {
                        if (Array.isArray(assignments)) {
                            assignments.forEach(id => {
                                if (id && id !== 'SITE_STAFF' && id !== 'UNASSIGNED') {
                                    assignedCrcs.add(id);
                                }
                            });
                        }
                    });
                }
                
                // If this CRC is not assigned, return 0
                if (!assignedCrcs.has(crcId)) return 0;
                
                // Divide hours equally among all assigned CRCs
                const crcCount = assignedCrcs.size;
                return crcCount > 0 ? eventHours / crcCount : 0;
            };
            
            // Helper function to calculate hours for a CRC from Site Assignment events only
            // Optionally includes Travel Day events
            // This ensures we only count work hours, not PTO/Unavailable/Open Shifts
            // Correctly divides hours when multiple CRCs are assigned to the same event
            const calculateCrcHours = (events, crcId = null, options = {}) => {
                const { includeTravel = false } = options;
                
                // Filter to only Site Assignment events with CRCs assigned (or Travel if included)
                const workEvents = events.filter(e => {
                    // Must be Site Assignment with CRC assigned
                    if (isSiteAssignmentWithCrc(e)) {
                        // If filtering for specific CRC, check if this CRC is assigned
                        if (crcId) {
                            return eventBelongsToCrc(e, crcId);
                        }
                        return true; // Count all Site Assignments with CRCs
                    }
                    
                    // Optionally include Travel Day events
                    if (includeTravel && e.type === 'Travel Day') {
                        if (crcId) {
                            return eventBelongsToCrc(e, crcId);
                        }
                        return true;
                    }
                    
                    return false;
                });
                
                // Sum hours using helper function that correctly divides hours
                if (crcId) {
                    // For specific CRC, use getEventHoursForCrc to divide hours correctly
                    return workEvents.reduce((sum, e) => sum + getEventHoursForCrc(e, crcId), 0);
                } else {
                    // For total hours (no specific CRC), sum all hours (no division needed)
                    return workEvents.reduce((sum, e) => sum + (parseFloat(e.hours) || 0), 0);
                }
            };
            
            // Helper function to check if an event is an open shift
            const isOpenShift = (event) => {
                // Check if event type is explicitly "Open Shift"
                if (event.type === 'Open Shift') return true;
                // Check if it's a Site Assignment with no CRC assigned
                if (event.type === 'Site Assignment') {
                    // Check legacy crcId
                    if (!event.crcId) {
                        // Check roleAssignments - if empty or all null, it's an open shift
                        if (!event.roleAssignments || Object.keys(event.roleAssignments).length === 0) {
                            return true;
                        }
                        // Check if all role assignments are null or empty
                        const allEmpty = Object.values(event.roleAssignments).every(assignments => {
                            if (!Array.isArray(assignments)) return true;
                            return assignments.length === 0 || assignments.every(a => !a || a === null);
                        });
                        if (allEmpty) return true;
                    }
                }
                return false;
            };
            
            // Helper function to apply open shifts filter
            const applyOpenShiftsFilter = (events) => {
                if (!state.selectedOpenShiftsFilter || state.selectedOpenShiftsFilter === 'all') {
                    return events;
                }
                if (state.selectedOpenShiftsFilter === 'open-only') {
                    return events.filter(isOpenShift);
                } else if (state.selectedOpenShiftsFilter === 'assigned-only') {
                    return events.filter(e => !isOpenShift(e));
                }
                return events;

            // Helper function to filter events for logged-in CRC
            const getFilteredEventsForCrc = (events) => {
                const crcId = getLoggedInCrcId();
                if (!crcId) {
                    return events; // Not a CRC user, return all events

                // Filter to only show this CRC's events (check both crcId and roleAssignments)

                if (!state.currentUser) return state.studies;
                
                const isSupervisor = state.currentUser && getEffectivePermissionLevel() === 'Supervisor';
                
                // Managers see all
                if (isAdminUser() || getEffectivePermissionLevel() === 'Manager') {

                return state.crc_sites.filter(site => canAccessSite(site.id));

            const getFilteredEvents = () => {

                // Managers see all
                if (isAdminUser() || getEffectivePermissionLevel() === 'Manager') {

                const filteredStudies = getFilteredStudies();
                const filteredSites = getFilteredSites();

                const siteIds = new Set(filteredSites.map(s => s.id));
                
                return state.crc_events.filter(event => {
                    // If event has studyIds, check if any are accessible
                    if (event.studyIds && Array.isArray(event.studyIds) && event.studyIds.length > 0) {

                });

            // Weather widget functionality
            const updateWeather = async () => {
                const weatherWidget = document.getElementById('weather-widget');
                const weatherTemp = document.getElementById('weather-temp');
                const weatherIcon = weatherWidget?.querySelector('i[data-lucide]');
                
                if (!weatherWidget || !weatherTemp) return;
                
                try {
                    // Get user's location
                    const position = await new Promise((resolve, reject) => {
                        if (!navigator.geolocation) {
                            reject(new Error('Geolocation is not supported'));
                            return;
                        }
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            timeout: 10000,
                            maximumAge: 300000 // Cache for 5 minutes
                        });
                    });
                    
                    const { latitude, longitude } = position.coords;
                    
                    // Use Open-Meteo API (free, no API key required)
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
                    
                    try {
                        const response = await fetch(url);
                        if (response.ok) {
                            const data = await response.json();
                            const temp = Math.round(data.current.temperature_2m);
                            const weatherCode = data.current.weather_code;
                            
                            // Update temperature
                            weatherTemp.textContent = `${temp}°`;
                            
                            // Update icon based on weather code (WMO Weather interpretation codes)
                            let iconName = 'cloud';
                            // Clear sky
                            if (weatherCode === 0) iconName = 'sun';
                            // Mainly clear, partly cloudy, overcast
                            else if (weatherCode === 1 || weatherCode === 2) iconName = 'cloud-sun';
                            else if (weatherCode === 3) iconName = 'cloud';
                            // Fog, depositing rime fog
                            else if (weatherCode === 45 || weatherCode === 48) iconName = 'cloud-fog';
                            // Drizzle, rain, freezing rain
                            else if (weatherCode >= 51 && weatherCode <= 67) iconName = 'cloud-rain';
                            // Snow, snow grains, snow showers
                            else if (weatherCode >= 71 && weatherCode <= 77) iconName = 'snowflake';
                            // Rain showers, snow showers, thunderstorm
                            else if (weatherCode >= 80 && weatherCode <= 86) iconName = 'cloud-rain';
                            else if (weatherCode >= 95 && weatherCode <= 99) iconName = 'cloud-lightning';
                            
                            if (weatherIcon) {
                                weatherIcon.setAttribute('data-lucide', iconName);
                                lucide.createIcons();
                            }
                        } else {
                            throw new Error('Weather API error');
                        }
                    } catch (apiError) {
                        // If API fails, show a placeholder
                        weatherTemp.textContent = '--°';
                        if (weatherIcon) {
                            weatherIcon.setAttribute('data-lucide', 'cloud');
                            lucide.createIcons();
                        }

            const DATA_REFRESH_INTERVAL_MS = 10 * 60 * 1000; // 10 minutes

            let dataRefreshTimerId = null;

            // --- Change Logging for Catch-Up Feature ---
            const logChange = (type, details) => {
                try {
                    const change = {
                        id: crypto.randomUUID(),
                        timestamp: Date.now(),
                        type, // 'shift_created', 'shift_updated', 'shift_deleted', 'crc_reassigned', 'study_updated'
                        details
                    };
                    if (!state.changeLog) {
                        state.changeLog = [];
                    }
                    state.changeLog.push(change);
                    // Keep only last 7 days of changes
                    const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
                    state.changeLog = state.changeLog.filter(c => c.timestamp > sevenDaysAgo);
                    // Persist to localStorage
                    try {
                        localStorage.setItem('chaos_changeLog', JSON.stringify(state.changeLog));
                        console.log('Change logged:', type, details, 'Total changes:', state.changeLog.length);
                    } catch (e) {
                        console.warn('Failed to persist change log:', e);
                    }
                } catch (error) {
                    console.error('Error in logChange:', error);
                }
            };

            const loadChangeLog = () => {

                        const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
                        state.changeLog = parsed.filter(c => c.timestamp > sevenDaysAgo);
                        console.log('Loaded change log from localStorage:', state.changeLog.length, 'changes');
                    } else {
                        state.changeLog = state.changeLog || [];
                        console.log('No change log in localStorage, initializing empty array');

                    console.warn('Failed to load change log:', e);

            const getChangesLast24Hours = () => {

                return state.changeLog
                    .filter(c => c.timestamp > twentyFourHoursAgo)
                    .sort((a, b) => b.timestamp - a.timestamp);
            };
            
            const getChangesByDateRange = (startDate, endDate, updatesOnly = false) => {
                if (!state.changeLog || state.changeLog.length === 0) {

                // Parse dates correctly - handle date strings like "2024-01-15"
                const start = startDate ? new Date(startDate + 'T00:00:00').getTime() : 0;
                const end = endDate ? new Date(endDate + 'T23:59:59').getTime() : Date.now();
                
                console.log('Filtering changes:', {

            const formatChangeDetails = (change) => {
                const time = new Date(change.timestamp);
                const timeStr = time.toLocaleString();
                const details = change.details || {};
                
                switch (change.type) {
                    case 'shift_created':
                        return {
                            icon: 'plus-circle',
                            color: 'text-green-600 dark:text-green-400',
                            title: 'Shift Created',
                            message: `New ${details.eventType || 'shift'} scheduled${details.date ? ` for ${details.date}` : ''}${details.siteName ? ` at ${details.siteName}` : ''}${details.crcNames && details.crcNames.length > 0 ? ` with ${details.crcNames.join(', ')}` : ''}`,
                            time: timeStr
                        };
                    case 'shift_updated':
                        const updates = [];
                        if (details.crcChanged) {
                            updates.push(`CRC changed from ${details.oldCrcName || 'unassigned'} to ${details.newCrcName || 'unassigned'}`);
                        }
                        if (details.dateChanged) {
                            updates.push(`Date changed from ${details.oldDate || 'N/A'} to ${details.newDate || 'N/A'}`);
                        }
                        if (details.siteChanged) {
                            updates.push(`Site changed from ${details.oldSiteName || 'N/A'} to ${details.newSiteName || 'N/A'}`);
                        }
                        if (details.studyChanged) {
                            updates.push(`Study changed from ${details.oldStudyName || 'N/A'} to ${details.newStudyName || 'N/A'}`);

                    case 'shift_deleted':

                            message: `${details.eventType || 'Shift'}${details.date ? ` on ${details.date}` : ''}${details.siteName ? ` at ${details.siteName}` : ''}${details.crcNames && details.crcNames.length > 0 ? ` with ${details.crcNames.join(', ')}` : ''} was removed`,
                            time: timeStr

                    case 'crc_reassigned':
                        return {

                            time: timeStr

                    case 'study_updated':
                        const studyUpdates = [];

                            time: timeStr
                        };
                    case 'training_updated':
                        const trainingUpdates = [];
                        if (details.crcName) {
                            trainingUpdates.push(`${details.crcName}`);
                        }
                        if (details.trainingName) {

                        if (details.expirationDateChanged) {

                        return {

                            time: timeStr
                        };
                    default:
                        return {

                            color: 'text-gray-600 dark:text-gray-400',

            };

            const refreshDataSilently = async (options = {}) => {
                const { skipPermissionSets = false } = options;
                if (!state.initialLoadComplete) return;
                if (isRefreshingData) return;
                isRefreshingData = true;
                try {
                    const basePromises = [
                        apiService.getCrcs(),
                        apiService.getSites(),
                        apiService.getStudies(),
                        apiService.getEvents(),
                        apiService.getRoles(),
                        apiService.getTrainingTypes()
                    ];
                    
                    // Permission sets feature is disabled - API endpoint doesn't exist yet
                    // To re-enable, uncomment the block below:
                    /*
                    if (!skipPermissionSets && state.currentUser && state.currentUser.permissionLevel === 'Manager') {
                        basePromises.push(
                            apiService.getPermissionSets().catch(error => {
                                if (error.status === 404) {
                                    return [];
                                }
                                if (error.status !== 404) {
                                    console.warn('Permission sets endpoint error:', error.status);
                                }
                                throw error;
                            })
                        );
                    }
                    */

                    const results = await Promise.all(basePromises);
                    let crcs, sites, studies, events, roles, training_types, permissionSets;
                    // Permission sets feature disabled - always unpack without them
                    [crcs, sites, studies, events, roles, training_types] = results;
                    permissionSets = []; // Empty array - feature not in use

                    let timeOffRequests = [];
                    try {
                        timeOffRequests = await apiService.getTimeOffRequests();
                    } catch (error) {
                        console.warn('CHAOS: Failed to refresh time off requests:', error);
                    }

                    let travel = [];
                    try {
                        travel = await apiService.getTravel();
                    } catch (error) {
                        console.warn('CHAOS: Failed to refresh travel data:', error);
                    }

                    let announcements = [];
                    try {
                        announcements = await apiService.getAnnouncements();
                        console.log('CHAOS: Loaded', announcements.length, 'announcements');
                    } catch (error) {
                        console.warn('CHAOS: Failed to refresh announcements:', error);
                    }

                    let usersUpdate = undefined;
                    if (state.currentUser && (isAdminUser() || getEffectivePermissionLevel() === 'Manager')) {
                        try {
                            usersUpdate = await apiService.getUsers();
                        } catch (error) {
                            console.warn('CHAOS: Failed to refresh users list:', error);
                        }
                    }

                    // Normalize sites: map 'pi' from ARTEMIS to 'principalInvestigator' for consistency
                    sites = sites.map(site => {
                        if (site.pi && !site.principalInvestigator) {
                            site.principalInvestigator = site.pi;
                        }
                        return site;
                    });
                    
                    crcs.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    sites.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    
                    // Add permanent Virtual site for trainings
                    const virtualSiteExists = sites.some(s => s.id === 'virtual' || s.name === 'Virtual');
                    if (!virtualSiteExists) {
                        sites.push({
                            id: 'virtual',
                            name: 'Virtual',
                            address: '',
                            city: '',
                            state: '',
                            zipCode: ''
                        });
                        // Re-sort after adding Virtual site
                        sites.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    }
                    
                    // Helper function to check if a study should be shown
                    const isStudyActive = (study) => {
                        const statusString = String(study.status || study.state || study.phase || '').toLowerCase();
                        
                        // Exclude ONLY closed studies - show everything else from ARTEMIS
                        if (statusString.includes('closed')) {
                            return false;
                        }
                        
                        // Include all other studies from ARTEMIS (they have siteIds)
                        // This includes: enrolling, recruiting, active, completed (but not closed), etc.
                        return true;
                    };
                    
                    let sanitizedStudies = Array.isArray(studies) ? studies.filter(study => {
                        // Must have siteIds from ARTEMIS
                        if (!Array.isArray(study.siteIds) || study.siteIds.length === 0) return false;
                        // Must be active
                        return isStudyActive(study);
                    }) : [];
                    sanitizedStudies.sort((a, b) => (a.title || a.name || '').localeCompare(b.title || b.name || ''));
                    ensureTrainingRole(roles);
                    roles.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    
                    // Clean up duplicate PTO/Unavailable events - keep only one per CRC per day
                    // Only runs if duplicates are detected, and only deletes them once
                    // Tracks cleaned CRC+date combinations to avoid re-processing
                    const cleanupDuplicatePTOEvents = async (eventsList) => {
                        // Load previously cleaned CRC+date combinations from localStorage
                        const cleanedDuplicatesKey = 'chaos_cleaned_pto_duplicates';
                        let cleanedDuplicateKeys = new Set();
                        try {
                            const stored = localStorage.getItem(cleanedDuplicatesKey);
                            if (stored) {
                                cleanedDuplicateKeys = new Set(JSON.parse(stored));
                            }
                        } catch (e) {
                            // If localStorage fails, start fresh
                            cleanedDuplicateKeys = new Set();
                        }
                        
                        const ptoMap = new Map(); // key: `${crcId}-${date}`, value: array of events
                        let hasDuplicates = false;
                        
                        // First pass: Find all PTO/Unavailable events and group by CRC+date
                        // Early exit if no duplicates found
                        eventsList.forEach(event => {
                            if ((event.type === 'Unavailable' || event.type === 'Paid Time Off' || event.type === 'PTO') && event.crcId && event.date) {
                                const key = `${event.crcId}-${event.date}`;
                                if (!ptoMap.has(key)) {
                                    ptoMap.set(key, []);
                                }
                                ptoMap.get(key).push(event);
                                // Check if we found a duplicate (more than 1 event for same CRC+date)
                                if (ptoMap.get(key).length > 1) {
                                    hasDuplicates = true;
                                }
                            }
                        });
                        
                        // Early return if no duplicates found - no need to process further
                        if (!hasDuplicates) {
                            return eventsList;
                        }
                        
                        // Only process if duplicates exist
                        const duplicatesToDelete = [];
                        const cleanedKeys = [];
                        
                        // For each CRC+date with multiple events, keep the first one, mark others for deletion
                        ptoMap.forEach((eventList, key) => {
                            if (eventList.length > 1) {
                                // Skip if we've already cleaned this CRC+date combination
                                if (cleanedDuplicateKeys.has(key)) {
                                    return; // Already cleaned, skip
                                }
                                
                                // Sort by createdAt (most recent first) or keep first
                                eventList.sort((a, b) => {
                                    const aTime = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                                    const bTime = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                                    return bTime - aTime; // Most recent first
                                });
                                
                                // Keep the first (most recent), delete the rest
                                for (let i = 1; i < eventList.length; i++) {
                                    duplicatesToDelete.push(eventList[i]);
                                }
                                
                                // Mark this CRC+date combination as cleaned
                                cleanedKeys.push(key);
                            }
                        });
                        
                        // Delete duplicates from database (only if we found any NEW duplicates)
                        if (duplicatesToDelete.length > 0) {
                            console.log(`Found ${duplicatesToDelete.length} new duplicate PTO events to clean up`);
                            
                            for (const duplicate of duplicatesToDelete) {
                                try {
                                    await apiService.deleteEvent(duplicate.id);
                                    console.log(`Deleted duplicate PTO event ${duplicate.id} for CRC ${duplicate.crcId} on ${duplicate.date}`);
                                } catch (error) {
                                    console.error(`Error deleting duplicate PTO event ${duplicate.id}:`, error);
                                    // Remove the key from cleanedKeys if deletion failed
                                    const key = `${duplicate.crcId}-${duplicate.date}`;
                                    const keyIndex = cleanedKeys.indexOf(key);
                                    if (keyIndex > -1) {
                                        cleanedKeys.splice(keyIndex, 1);
                                    }
                                }
                            }
                            
                            // Mark successfully processed CRC+date combinations as cleaned
                            if (cleanedKeys.length > 0) {
                                cleanedKeys.forEach(key => cleanedDuplicateKeys.add(key));
                                try {
                                    // Store cleaned keys (keep only last 500 to avoid localStorage bloat)
                                    const cleanedArray = Array.from(cleanedDuplicateKeys);
                                    const trimmedArray = cleanedArray.slice(-500);
                                    localStorage.setItem(cleanedDuplicatesKey, JSON.stringify(trimmedArray));
                                } catch (e) {
                                    console.warn('Failed to save cleaned duplicates to localStorage:', e);
                                }
                            }
                            
                            // Remove duplicates from the events array
                            const duplicateIds = new Set(duplicatesToDelete.map(e => e.id));
                            return eventsList.filter(e => !duplicateIds.has(e.id));
                        }
                        
                        return eventsList;
                    };
                    
                    // Duplicate PTO cleanup disabled - existing logic should prevent duplicates
                    // events = await cleanupDuplicatePTOEvents(events || []);
                    
                    const artemisStudyIdsSet = new Set(sanitizedStudies.map(study => study.id));
                    const sanitizedEvents = Array.isArray(events) ? events.reduce((acc, event) => {
                        if (Array.isArray(event.studyIds) && event.studyIds.length > 0) {
                            const filteredIds = event.studyIds.filter(studyId => artemisStudyIdsSet.has(studyId));
                            if (filteredIds.length === 0) {
                                if (event.type === 'Site Assignment') {
                                    return acc;
                                }
                                acc.push({ ...event, studyIds: [] });
                                return acc;
                            }
                            if (filteredIds.length !== event.studyIds.length) {
                                acc.push({ ...event, studyIds: filteredIds });
                                return acc;
                            }
                        }
                        acc.push(event);
                        return acc;
                    }, []) : events;

                    const updates = {
                        crcs,
                        crc_sites: sites,
                        studies: sanitizedStudies,
                        crc_events: sanitizedEvents,
                        roles,
                        training_types,
                        timeOffRequests,
                        travel,
                        announcements
                    };
                    if (usersUpdate) {
                        updates.users = usersUpdate;
                    }
                    if (permissionSets !== undefined) {
                        updates.permissionSets = permissionSets;
                    }

                    setState(updates, { skipRender: true });
                    refreshActiveTabContent();
                } catch (error) {
                    console.error('CHAOS: Background data refresh failed:', error);
                } finally {
                    isRefreshingData = false;
                }
            };

            const scheduleDataRefresh = () => {
                if (dataRefreshTimerId) {
                    clearTimeout(dataRefreshTimerId);
                }

            const parseAsUnixSeconds = (value) => {
                if (!value || typeof value !== 'string' || value.trim() === '') return null;
                
                // Handle datetime-local format (YYYY-MM-DDTHH:mm)
                // datetime-local inputs return values without timezone, so we need to treat them as local time
                let date;
                if (value.includes('T')) {
                    // datetime-local format: treat as local time
                    // Create date from the string - JavaScript will interpret it in local timezone
                    date = new Date(value);
                } else if (value.match(/^\d{10}$/)) {
                    // Already a Unix timestamp in seconds
                    return parseInt(value, 10);
                } else if (value.match(/^\d{13}$/)) {
                    // Unix timestamp in milliseconds
                    return Math.floor(parseInt(value, 10) / 1000);
                } else {
                    // Try to parse as a date string
                    date = new Date(value);
                }
                
                if (Number.isNaN(date.getTime())) {
                    console.warn('Failed to parse date value:', value);
                    return null;
                }
                
                return Math.floor(date.getTime() / 1000);
            };

            const parseNavanBookingEntries = (raw) => {
                const bookings = [];
                const invalid = [];
                if (!raw) {
                    return { bookings, invalid };
                }
                const dedupe = new Set();
                raw.split(/\r?\n/).forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;
                    const parts = trimmed.split(/[,|\s]+/).map(p => p.trim()).filter(Boolean);
                    const bookingId = parts[0] || '';
                    const bookingUuid = parts[1] || '';
                    if (!bookingId && !bookingUuid) {
                        invalid.push(trimmed);
                        return;
                    }
                    const key = (bookingUuid || bookingId).toLowerCase();
                    if (dedupe.has(key)) return;
                    dedupe.add(key);
                    bookings.push({
                        bookingId: bookingId || undefined,
                        bookingUuid: bookingUuid || undefined
                    });
                });
                return { bookings, invalid };
            };

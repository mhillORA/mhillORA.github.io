                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-2xl w-full ${maxWidthClass} relative transform transition-all scale-95 opacity-0 animate-fade-in-up">
                        <div class="modal-content overflow-y-auto max-h-[90vh] custom-scrollbar pr-4">
                            ${content}
                        </div>
                        <button data-action="close-modal" class="absolute top-3 right-3 text-gray-500 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white rounded-full p-1 hover:bg-gray-200 dark:hover:bg-gray-700">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <style>
                        @keyframes fade-in-up {
                            from { transform: translateY(20px) scale(0.95); opacity: 0; }
                            to { transform: translateY(0) scale(1); opacity: 1; }
                        }
                        .animate-fade-in-up { animation: fade-in-up 0.3s ease-out forwards; }
                    </style>
                `;
                modalContainer.classList.remove('hidden');
                lucide.createIcons();
                initializeDateInputs(modalContainer);

                if (modalContainer.querySelector('#crc-event-form')) {
                    const form = modalContainer.querySelector('#crc-event-form');
                    const startDateInput = form.querySelector('input[name="startDate"]');
                    const endDateInput = form.querySelector('input[name="endDate"]');
                    const crcSelect = form.querySelector('select[name="crcId"]');
                    const eventTypeSelect = form.querySelector('#crc-event-type');
                    
                    // Initialize form visibility and role assignments based on event type
                    if (eventTypeSelect) {
                        handleEventTypeChange(eventTypeSelect);
                        eventTypeSelect.addEventListener('change', () => handleEventTypeChange(eventTypeSelect));
                    }
                    
                    updateCrcDropdownAvailability();
                    if (form.dataset.eventId && crcSelect.value) {
                        updateCrcHoursDisplay(crcSelect.value, startDateInput.value);
                    }
                    
                    // Auto-advance end date to next available date when start date is selected
                    if (startDateInput && endDateInput) {
                        startDateInput.addEventListener('change', (e) => {
                            if (e.target.value) {
                                const startDate = new Date(e.target.value + 'T00:00:00');
                                // Default end date to same as start date (not next day)
                                if (!endDateInput.value || endDateInput.value < e.target.value) {
                                    endDateInput.value = e.target.value;
                                }
                                // Update travel selection when dates change
                                updateTravelSelectionContainer();
                            }
                        });
                        endDateInput.addEventListener('change', () => {
                            // Update travel selection when end date changes
                            updateTravelSelectionContainer();
                        });
                    }
                    
                    form.querySelectorAll('input[type="date"], select').forEach(el => {
                        el.addEventListener('change', updateCrcDropdownAvailability);
                    });
                    
                    // Add event listeners for study and site selection to update role assignments
                    const studySelect = form.querySelector('select[name="studyIds"]');
                    const siteSelect = form.querySelector('select[name="siteId"]');
                    if (studySelect) {
                        studySelect.addEventListener('change', () => {
                            // Immediately enable visit dropdown when study is selected
                            const visitNumberSelect = document.getElementById('visitNumberSelect');
                            if (visitNumberSelect && studySelect.value) {
                                visitNumberSelect.disabled = false;
                            }
                            handleShiftStudySiteSelection();
                        });
                    }
                    if (siteSelect) {
                        siteSelect.addEventListener('change', handleShiftStudySiteSelection);
                    }
                     if(crcSelect) crcSelect.addEventListener('change', (e) => {
                        updateCrcHoursDisplay(e.target.value, startDateInput.value);
                        handleShiftStudySiteSelection();
                        // Render role assignments when CRCs are selected (for Travel Day with training roles)
                        const eventId = form.dataset.eventId || null;
                        const existingEvent = eventId ? state.crc_events.find(e => e.id === eventId) : null;
                        renderRoleAssignments(form, existingEvent);
                    });
                    // Initialize visit dropdown on form load
                    handleShiftStudySiteSelection();
                    
                    // Ensure visit dropdown is enabled and populated if a study is already selected
                    const visitNumberSelect = document.getElementById('visitNumberSelect');
                    if (studySelect && visitNumberSelect) {
                        const selectedStudies = Array.from(studySelect.selectedOptions).map(opt => opt.value).filter(Boolean);
                        if (selectedStudies.length > 0) {
                            // Immediately enable the dropdown
                            visitNumberSelect.disabled = false;
                            // Force re-population of visit dropdown
                            setTimeout(() => {
                                handleShiftStudySiteSelection();
                            }, 100);
                        }
                    }

                    const duplicatePanel = form.querySelector('#duplicate-panel');
                    const duplicateAssignmentsContainer = form.querySelector('#duplicate-assignments-container');
                    const duplicateToggleButton = form.querySelector('#toggle-duplicate-panel');
                    const duplicateApplyButton = form.querySelector('#apply-duplicate-selection');
                    const duplicateClearButton = form.querySelector('#clear-duplicate-selection');
                    const duplicateEnabledInput = form.querySelector('input[name="duplicateEnabled"]');
                    const duplicateSummary = form.querySelector('#duplicate-summary');
                    const duplicateGroupInput = form.querySelector('input[name="duplicateGroupNumber"]');
                    const duplicateVisitInput = form.querySelector('input[name="duplicateVisitNumber"]');
                    const duplicateStartDateInput = form.querySelector('input[name="duplicateStartDate"]');
                    const duplicateEndDateInput = form.querySelector('input[name="duplicateEndDate"]');
                    const duplicateStartTravelInput = form.querySelector('input[name="duplicateIncludeStartTravel"]');
                    const duplicateEndTravelInput = form.querySelector('input[name="duplicateIncludeEndTravel"]');
                    let duplicateSelectionApplied = false;

                    const ensureDuplicateDefaults = () => {
                        const editingMode = !!(form.dataset.eventId);
                        if (!duplicatePanel) return;
                        const defaultStart = duplicatePanel.dataset.defaultStartDate || '';
                        const defaultEnd = duplicatePanel.dataset.defaultEndDate || '';
                        const defaultGroup = duplicatePanel.dataset.defaultGroup || '';
                        const defaultVisit = duplicatePanel.dataset.defaultVisit || '';
                        if (duplicateStartDateInput && !duplicateStartDateInput.value && defaultStart) {
                            duplicateStartDateInput.value = defaultStart;
                        }
                        if (duplicateEndDateInput && !duplicateEndDateInput.value && defaultEnd) {
                            duplicateEndDateInput.value = defaultEnd;
                        }
                        if (duplicateGroupInput && !duplicateGroupInput.value && defaultGroup) {
                            duplicateGroupInput.value = defaultGroup;
                        }
                        if (duplicateVisitInput && !duplicateVisitInput.value && defaultVisit) {
                            duplicateVisitInput.value = defaultVisit;
                        }
                        // Travel checkboxes default to unchecked - only create travel days when explicitly selected
                        if (duplicateStartTravelInput && !duplicateStartTravelInput.hasAttribute('data-initialized')) {
                            duplicateStartTravelInput.checked = false;
                            duplicateStartTravelInput.setAttribute('data-initialized', 'true');
                        }
                        if (duplicateEndTravelInput && !duplicateEndTravelInput.hasAttribute('data-initialized')) {
                            duplicateEndTravelInput.checked = false;
                            duplicateEndTravelInput.setAttribute('data-initialized', 'true');
                        }
                    };

                    const refreshDuplicateAssignments = () => {
                        if (!duplicateAssignmentsContainer) return;
                        const previousSelections = new Set();
                        duplicateAssignmentsContainer.querySelectorAll('input[name="duplicateSelection"]:checked').forEach(cb => previousSelections.add(cb.value));
                        
                        // Get saved config if available
                        const savedConfig = form._duplicateConfig || null;
                        
                        // Collect from main role assignment container
                        const roleSelects = form.querySelectorAll('#role-assignment-container select[name^="role-"]');
                        const assignmentsByRole = new Map();
                        roleSelects.forEach(select => {
                            const nameParts = select.name.split('-').slice(1);
                            if (nameParts.length < 2) return;
                            const [roleId] = nameParts;
                            if (!assignmentsByRole.has(roleId)) {
                                assignmentsByRole.set(roleId, new Set());
                            }
                            if (select.value) {
                                assignmentsByRole.get(roleId).add(select.value);
                            }
                        });
                        
                        // Also collect from duplicate panel dropdowns (for newly added people)
                        const duplicateRoleSelects = duplicateAssignmentsContainer.querySelectorAll('select[name^="duplicate-role-"]');
                        duplicateRoleSelects.forEach(select => {
                            if (!select.value) return; // Skip empty selections
                            const nameParts = select.name.split('-');
                            if (nameParts.length < 4) return;
                            const roleId = nameParts[2];
                            if (!assignmentsByRole.has(roleId)) {
                                assignmentsByRole.set(roleId, new Set());
                            }
                            assignmentsByRole.get(roleId).add(select.value);
                        });
                        if (assignmentsByRole.size === 0) {
                            duplicateAssignmentsContainer.innerHTML = `<p class="text-xs text-gray-500 dark:text-gray-400">Assign roles to staff first to enable duplication.</p>`;
                            if (duplicateApplyButton) duplicateApplyButton.setAttribute('disabled', 'disabled');
                            return;
                        }
                        const fragments = [];
                        assignmentsByRole.forEach((crcIds, roleId) => {
                            const role = state.roles.find(r => r.id === roleId);
                            const roleName = role ? role.name : 'Role';
                            
                            // Get all qualified CRCs for this role
                            const qualifiedCrcs = state.crcs.filter(c => hasValidTraining(c, roleName))
                                .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                            
                            // Get existing assignments for this role
                            const existingAssignments = Array.from(crcIds);
                            
                            // Get saved quantity for this role (if any) - check both saved config and current form
                            const savedConfig = form._duplicateConfig || null;
                            const savedQuantity = savedConfig?.roleQuantities?.[roleId] || existingAssignments.length;
                            
                            // Build dropdowns - show existing assignments plus ability to add more
                            let roleHTML = `
                                <div class="border dark:border-gray-700 rounded-md p-3 bg-white dark:bg-gray-900">
                                    <div class="flex items-center justify-between mb-2">
                                        <p class="text-xs font-semibold text-gray-600 dark:text-gray-300">${roleName}</p>
                                        <div class="flex items-center gap-2">
                                            <label class="text-xs text-gray-600 dark:text-gray-400">Quantity:</label>
                                            <input type="number" name="duplicate-role-quantity-${roleId}" min="0" value="${savedQuantity}" class="w-16 p-1 text-xs border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white" data-role-id="${roleId}">
                                        </div>
                                    </div>
                                    <div class="space-y-2" id="duplicate-role-${roleId}-assignments">
                            `;
                            
                            // Show existing assignments with checkboxes and ability to remove
                            // Use saved quantity or existing assignments length, whichever is larger
                            const displayCount = Math.max(savedQuantity, existingAssignments.length);
                            for (let index = 0; index < displayCount; index++) {
                                const crcId = existingAssignments[index] || '';
                                const crc = crcId ? state.crcs.find(c => c.id === crcId) : null;
                                const crcName = crc ? crc.name : '';
                                roleHTML += `
                                    <div class="flex items-center gap-2">
                                        <input type="checkbox" name="duplicateSelection" value="${roleId}::${crcId}" ${crcId ? 'checked' : ''} class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                        <select name="duplicate-role-${roleId}-${index}" class="flex-1 p-1 text-xs border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white">
                                            <option value="">Select Staff</option>
                                            ${qualifiedCrcs.map(c => `<option value="${c.id}" ${c.id === crcId ? 'selected' : ''}>${c.name}</option>`).join('')}
                                        </select>
                                    </div>
                                `;
                            }
                            
                            // Add button to add more people to this role
                            roleHTML += `
                                        <button type="button" class="add-duplicate-role-person text-xs text-blue-600 dark:text-blue-400 hover:underline mt-2" data-role-id="${roleId}">
                                            + Add more to ${roleName}
                                        </button>
                                    </div>
                                </div>
                            `;
                            
                            fragments.push(roleHTML);
                        });
                        duplicateAssignmentsContainer.innerHTML = fragments.join('');
                        if (duplicateApplyButton) duplicateApplyButton.removeAttribute('disabled');
                    const newCheckboxes = duplicateAssignmentsContainer.querySelectorAll('input[name="duplicateSelection"]');
                    const defaultAllChecked = !(duplicateSelectionApplied || previousSelections.size > 0);
                    newCheckboxes.forEach(cb => {
                        if (previousSelections.size > 0) {
                            cb.checked = previousSelections.has(cb.value);
                        } else {
                            cb.checked = defaultAllChecked || !duplicateSelectionApplied;
                        }
                    });
                    
                    // Update duplicate travel selection container
                    const duplicateTravelContainer = form.querySelector('#duplicate-travel-container');
                    const duplicateTravelSelection = form.querySelector('#duplicate-travel-selection');
                    if (duplicateTravelContainer && duplicateTravelSelection) {
                        const allAssignedCrcs = new Set();
                        assignmentsByRole.forEach((crcIds) => {
                            crcIds.forEach(crcId => allAssignedCrcs.add(crcId));
                        });
                        
                        if (allAssignedCrcs.size > 0) {
                            duplicateTravelContainer.classList.remove('hidden');
                            
                            const duplicateStartDate = duplicateStartDateInput?.value || '';
                            const duplicateEndDate = duplicateEndDateInput?.value || duplicateStartDate;
                            
                            // Helper to get travel hours from Navan data
                            const getTravelHoursForCrc = (crcId, travelDate) => {
                                if (!travelDate || !state.travel) return null;
                                const crc = state.crcs.find(c => c.id === crcId);
                                if (!crc) return null;
                                
                                const crcNameLower = (crc.name || '').toLowerCase();
                                const travelDateStr = typeof travelDate === 'string' ? travelDate : toDateOnlyString(travelDate);
                                
                                const travelRecord = (state.travel || []).find(travel => {
                                    if (!travel) return false;
                                    const travelCrcId = travel.crcId;
                                    if (travelCrcId !== crcId && travelCrcId !== crc.name) {
                                        if (travel.travelerName && travel.travelerName.toLowerCase() !== crcNameLower) return false;
                                    }
                                    
                                    const travelDate = getTravelPrimaryDate(travel);
                                    if (!travelDate) return false;
                                    const travelDateOnly = toDateOnlyString(travelDate);
                                    return travelDateOnly === travelDateStr;
                                });
                                
                                if (travelRecord && travelRecord.bookingType === 'FLIGHT') {
                                    return travelRecord.flightDuration || travelRecord.hours || null;
                                }
                                return null;
                            };
                            
                            let travelHtml = '';
                            Array.from(allAssignedCrcs).sort().forEach(crcId => {
                                const crc = state.crcs.find(c => c.id === crcId);
                                if (!crc) return;
                                
                                const startTravelDate = duplicateStartDate ? new Date(new Date(duplicateStartDate).getTime() - 24 * 60 * 60 * 1000) : null;
                                const endTravelDate = duplicateEndDate ? new Date(new Date(duplicateEndDate).getTime() + 24 * 60 * 60 * 1000) : null;
                                
                                const startTravelHours = startTravelDate ? getTravelHoursForCrc(crcId, toDateOnlyString(startTravelDate)) : null;
                                const endTravelHours = endTravelDate ? getTravelHoursForCrc(crcId, toDateOnlyString(endTravelDate)) : null;
                                
                                const startHoursText = startTravelHours ? ` (${startTravelHours} hrs from Navan)` : '';
                                const endHoursText = endTravelHours ? ` (${endTravelHours} hrs from Navan)` : '';
                                
                                const isSupervisor = state.currentUser && state.currentUser.permissionLevel === 'Supervisor';
                                travelHtml += `
                                    <div class="border dark:border-gray-600 rounded p-2 bg-gray-50 dark:bg-gray-800">
                                        <p class="text-xs font-medium dark:text-white mb-1">${crc.name}</p>
                                        <div class="space-y-1">
                                            <label class="flex items-center">
                                                <input type="checkbox" name="duplicate-travel-start-${crcId}" ${isSupervisor ? 'disabled' : ''} class="mr-1 rounded border-gray-300 text-blue-600 focus:ring-blue-500 ${isSupervisor ? 'opacity-50 cursor-not-allowed' : ''}">
                                                <span class="text-xs text-gray-700 dark:text-gray-300">Travel before start${startHoursText}</span>
                                            </label>
                                            <label class="flex items-center">
                                                <input type="checkbox" name="duplicate-travel-end-${crcId}" ${isSupervisor ? 'disabled' : ''} class="mr-1 rounded border-gray-300 text-blue-600 focus:ring-blue-500 ${isSupervisor ? 'opacity-50 cursor-not-allowed' : ''}">
                                                <span class="text-xs text-gray-700 dark:text-gray-300">Travel after end${endHoursText}</span>
                                            </label>
                                        </div>
                                    </div>
                                `;
                            });
                            duplicateTravelSelection.innerHTML = travelHtml;
                        } else {
                            duplicateTravelContainer.classList.add('hidden');
                        }
                    }
                    };

                    const resetDuplicateSelection = () => {
                        if (duplicateEnabledInput) duplicateEnabledInput.value = 'false';
                        if (duplicateSummary) duplicateSummary.textContent = '';
                        duplicateSelectionApplied = false;
                        if (duplicateAssignmentsContainer) {
                            duplicateAssignmentsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                                cb.checked = true;
                            });
                        }
                    };

                    if (duplicateToggleButton && duplicatePanel) {
                        duplicateToggleButton.addEventListener('click', () => {
                            duplicatePanel.classList.toggle('hidden');
                            if (!duplicatePanel.classList.contains('hidden')) {
                                ensureDuplicateDefaults();
                                refreshDuplicateAssignments();
                            }
                        });
                    }
                    if (duplicateApplyButton) {
                        duplicateApplyButton.addEventListener('click', () => {
                            if (!duplicateAssignmentsContainer) return;
                            const selected = duplicateAssignmentsContainer.querySelectorAll('input[name="duplicateSelection"]:checked');
                            if (selected.length === 0) {
                                showNotification('Select at least one staff member to duplicate.', 'error');
                                return;
                            }
                            
                            // Collect role quantities and save to form for next visit
                            const roleQuantities = {};
                            const quantityInputs = form.querySelectorAll('input[name^="duplicate-role-quantity-"]');
                            quantityInputs.forEach(input => {
                                const roleId = input.dataset.roleId || input.name.replace('duplicate-role-quantity-', '');
                                const quantity = parseInt(input.value) || 0;
                                if (quantity > 0) {
                                    roleQuantities[roleId] = quantity;
                                }
                            });
                            
                            // Save config to form for next visit
                            form._duplicateConfig = {
                                groupNumber: duplicateGroupInput?.value || '',
                                visitNumber: duplicateVisitInput?.value || '',
                                startDate: duplicateStartDateInput?.value || '',
                                endDate: duplicateEndDateInput?.value || '',
                                roleQuantities: roleQuantities
                            };
                            
                            if (duplicateEnabledInput) duplicateEnabledInput.value = 'true';
                            duplicateSelectionApplied = true;
                            const groupLabel = duplicateGroupInput && duplicateGroupInput.value ? duplicateGroupInput.value : 'next group';
                            const visitLabel = duplicateVisitInput && duplicateVisitInput.value ? duplicateVisitInput.value : 'next visit';
                            if (duplicateSummary) {
                                duplicateSummary.textContent = `${selected.length} assignment${selected.length === 1 ? '' : 's'} ready for ${groupLabel} / ${visitLabel}.`;
                            }
                            showNotification('Duplicate configuration saved. Submit the shift to create the next schedule.', 'success');
                        });
                    }
                    if (duplicateClearButton) {
                        duplicateClearButton.addEventListener('click', () => {
                            resetDuplicateSelection();
                            ensureDuplicateDefaults();
                            refreshDuplicateAssignments();
                            showNotification('Duplicate configuration cleared.', 'info');
                        });
                    }
                    
                    // Update duplicate travel selection when dates change
                    if (duplicateStartDateInput) {
                        duplicateStartDateInput.addEventListener('change', (e) => {
                            // Auto-advance duplicate end date to next day when start date is selected
                            if (e.target.value && duplicateEndDateInput) {
                                const startDate = new Date(e.target.value + 'T00:00:00');
                                const nextDate = new Date(startDate);
                                nextDate.setDate(nextDate.getDate() + 1);
                                duplicateEndDateInput.value = toDateOnlyString(nextDate);
                            }
                            refreshDuplicateAssignments();
                        });
                    }
                    if (duplicateEndDateInput) {
                        duplicateEndDateInput.addEventListener('change', () => {
                            refreshDuplicateAssignments();
                        });
                    }
                    
                    // Handle adding more people to roles in duplicate panel
                    document.addEventListener('click', (e) => {
                        if (e.target.classList.contains('add-duplicate-role-person')) {
                            const roleId = e.target.dataset.roleId;
                            const role = state.roles.find(r => r.id === roleId);
                            if (!role) return;
                            
                            const roleName = role.name;
                            const qualifiedCrcs = state.crcs.filter(c => hasValidTraining(c, roleName))
                                .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                            
                            const container = e.target.previousElementSibling;
                            if (!container) return;
                            
                            // Count existing assignments for this role
                            const existingCount = container.querySelectorAll('select[name^="duplicate-role-"]').length;
                            
                            // Add new dropdown
                            const newSelect = document.createElement('div');
                            newSelect.className = 'flex items-center gap-2';
                            newSelect.innerHTML = `
                                <input type="checkbox" name="duplicateSelection" value="${roleId}::" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" disabled>
                                <select name="duplicate-role-${roleId}-${existingCount}" class="flex-1 p-1 text-xs border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white">
                                    <option value="">Select Staff</option>
                                    ${qualifiedCrcs.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                                </select>
                            `;
                            
                            // Enable checkbox when staff is selected
                            const select = newSelect.querySelector('select');
                            const checkbox = newSelect.querySelector('input[type="checkbox"]');
                            select.addEventListener('change', () => {
                                if (select.value) {
                                    checkbox.value = `${roleId}::${select.value}`;
                                    checkbox.disabled = false;
                                    checkbox.checked = true;
                                } else {
                                    checkbox.disabled = true;
                                    checkbox.checked = false;
                                }
                            });
                            
                            container.insertBefore(newSelect, e.target);
                        }
                    });
                    
                    // Handle changes to duplicate role assignment dropdowns
                    document.addEventListener('change', (e) => {
                        if (e.target.name && e.target.name.startsWith('duplicate-role-')) {
                            const checkbox = e.target.previousElementSibling;
                            if (checkbox && checkbox.type === 'checkbox') {
                                if (e.target.value) {
                                    const parts = e.target.name.split('-');
                                    const roleId = parts[2];
                                    checkbox.value = `${roleId}::${e.target.value}`;
                                    checkbox.disabled = false;
                                    checkbox.checked = true;
                                } else {
                                    checkbox.disabled = true;
                                    checkbox.checked = false;
                                }
                            }
                        }
                        
                        // Handle quantity changes - update number of assignment slots
                        if (e.target.name && e.target.name.startsWith('duplicate-role-quantity-')) {
                            const roleId = e.target.dataset.roleId || e.target.name.replace('duplicate-role-quantity-', '');
                            const quantity = parseInt(e.target.value) || 0;
                            const role = state.roles.find(r => r.id === roleId);
                            if (!role) return;
                            
                            const roleName = role.name;
                            const qualifiedCrcs = state.crcs.filter(c => hasValidTraining(c, roleName))
                                .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                            
                            const container = e.target.closest('.border').querySelector(`#duplicate-role-${roleId}-assignments`);
                            if (!container) return;
                            
                            // Get existing assignments
                            const existingAssignments = [];
                            container.querySelectorAll('select[name^="duplicate-role-"]').forEach(select => {
                                if (select.value) {
                                    existingAssignments.push(select.value);
                                }
                            });
                            
                            // Clear container
                            const addButton = container.querySelector('.add-duplicate-role-person');
                            container.innerHTML = '';
                            
                            // Rebuild slots based on new quantity
                            for (let index = 0; index < quantity; index++) {
                                const crcId = existingAssignments[index] || '';
                                const crc = crcId ? state.crcs.find(c => c.id === crcId) : null;
                                
                                const slotDiv = document.createElement('div');
                                slotDiv.className = 'flex items-center gap-2';
                                slotDiv.innerHTML = `
                                    <input type="checkbox" name="duplicateSelection" value="${roleId}::${crcId}" ${crcId ? 'checked' : ''} class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <select name="duplicate-role-${roleId}-${index}" class="flex-1 p-1 text-xs border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white">
                                        <option value="">Select Staff</option>
                                        ${qualifiedCrcs.map(c => `<option value="${c.id}" ${c.id === crcId ? 'selected' : ''}>${c.name}</option>`).join('')}
                                    </select>
                                `;
                                
                                // Add change listener to update checkbox
                                const select = slotDiv.querySelector('select');
                                const checkbox = slotDiv.querySelector('input[type="checkbox"]');
                                select.addEventListener('change', () => {
                                    if (select.value) {
                                        checkbox.value = `${roleId}::${select.value}`;
                                        checkbox.disabled = false;
                                        checkbox.checked = true;
                                    } else {
                                        checkbox.disabled = true;
                                        checkbox.checked = false;
                                    }
                                });
                                
                                container.appendChild(slotDiv);
                            }
                            
                            // Re-add the add button
                            if (addButton) {
                                container.appendChild(addButton);
                            }
                            
                            // Update travel selection
                            setTimeout(() => {
                                refreshDuplicateAssignments();
                            }, 100);
                        }
                    });

                    currentDuplicatePanelController = {
                        refresh: refreshDuplicateAssignments,
                        clear: resetDuplicateSelection
                    };
                    refreshDuplicateAssignments();
                }
                if (modalContainer.querySelector('#unavailability-calendar-container')) {
                    // Refresh time off requests before rendering calendar to show latest data
                    (async () => {
                        try {
                            const updatedRequests = await apiService.getTimeOffRequests();
                            setState({ timeOffRequests: Array.isArray(updatedRequests) ? updatedRequests : [] });
                        } catch (error) {
                            console.warn('Failed to refresh time off requests when rendering calendar:', error);
                        }
                        renderUnavailabilityCalendar();
                    })();
                }
                const printButton = modalContainer.querySelector('[data-action="print-report"]');
                if (printButton) {
                    printButton.addEventListener('click', () => window.print());
                }
                
                // Setup bulk training modal interactions
                if (modalContainer.querySelector('#bulk-training-form')) {
                    setupBulkTrainingModal();
                }
                if (modalContainer.querySelector('#truck-csv-upload')) {
                    setupTruckImportModal();
                }
                if (modalContainer.querySelector('#truck-schedule-form')) {
                    setupTruckScheduleModal();
                }
            };

            const closeModal = () => {
                // Clear selected dates when modal closes
                window._ptoSelectedDates = new Set();
                // Clear the stored editing event when modal closes
                window._currentEditingEvent = null;
                if (!modalContainer) {
                    console.error('Modal container not found');
                    return;
                }
                currentDuplicatePanelController = null;
                modalContainer.classList.add('hidden');
                modalContainer.innerHTML = '';
            };

            // --- CSV HANDLING ---
            const parseCSV = (text) => {
                const lines = text.replace(/\r/g, '').split('\n').filter(Boolean);
                if (lines.length < 2) return { headers: [], data: [] };
                const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
                const data = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(',');
                    const rowObject = {};
                    headers.forEach((header, index) => {
                        rowObject[header] = (values[index] || '').trim();
                    });
                    data.push(rowObject);
                }
                return { headers, data };
            };

            const normalizeHeaderKey = (header) => {
                return (header || '').toString().trim().toLowerCase().replace(/[\s_\-]/g, '');
            };

            const handleCsvUpload = async (file, uploadType = 'shifts') => {
                if (!file) return;
                openModal(`
                    <div class="text-center p-4">
                        <h3 class="text-xl font-semibold mb-4 dark:text-white">Processing CSV...</h3>
                        <div class="flex items-center justify-center space-x-2">
                            <svg class="animate-spin h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p class="dark:text-gray-300">Reading file and preparing data. Please wait.</p>
                        </div>
                    </div>
                `);
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = e.target.result;
                    const { headers, data } = parseCSV(text);
                    const normalizedHeaders = headers.map(normalizeHeaderKey);
                    const looksLikeTimeOffCSV = (() => {
                        if (uploadType === 'timeOffRequests') return true;
                        const hasEventType = normalizedHeaders.includes('eventtype');
                        const hasTimeOffType = normalizedHeaders.includes('timeofftype') || normalizedHeaders.includes('ptoType'.toLowerCase()) || normalizedHeaders.includes('leavetype') || normalizedHeaders.includes('timeoff');
                        const hasCrcName = normalizedHeaders.includes('crcname');
                        const hasStartDate = normalizedHeaders.includes('startdate') || normalizedHeaders.includes('eventdate') || normalizedHeaders.includes('date');
                        return hasCrcName && hasStartDate && (hasTimeOffType || !hasEventType);
                    })();

                    if (uploadType === 'crcs') {
                        await importCRCs(headers, data);
                    } else if (looksLikeTimeOffCSV) {
                        await importTimeOffRequests(headers, data);
                    } else {
                        await importShifts(headers, data);
                    }
                };
                reader.onerror = () => {
                    openModal(`<h3 class="text-xl font-bold dark:text-white">Import Error</h3><p class="dark:text-gray-300">Could not read the selected file.</p>`);
                };
                reader.readAsText(file);
            };

            const importCRCs = async (headers, data) => {
                const requiredHeaders = ['CRCName', 'HomeLocation'];
                const missingHeaders = requiredHeaders.filter(h => !headers.includes(h));
                if (missingHeaders.length > 0) {
                    openModal(`<h3 class="text-xl font-bold dark:text-white">Import Error</h3><p class="dark:text-gray-300">CRC CSV file is missing required headers. It must contain: ${missingHeaders.join(', ')}</p>`);
                    return;
                }

                // Batch operations replaced with individual API calls
                const errors = [];
                let successCount = 0;
                
                for (const [index, row] of data.entries()) {
                    const rowNum = index + 2;
                    const { CRCName, HomeLocation, Region, EmploymentType, Title } = row;

                    if (!CRCName || !HomeLocation) {
                        errors.push(`Row ${rowNum}: Missing required value for CRCName or HomeLocation.`);
                        continue;
                    }

                    const crcData = {
                        name: CRCName.trim(),
                        title: (Title || '').trim(),
                        homeLocation: HomeLocation.trim(),
                        region: (Region || '').trim(),
                        employmentType: (EmploymentType || 'FTE').trim(),
                        trainings: [],
                        capabilities: [],
                        trainingLevel: ''
                    };
                    
                    // Geocode the home location
                    const coordinates = await geocodeLocation(HomeLocation.trim());
                    if (coordinates) {
                        crcData.coordinates = {
                            lat: coordinates.lat,
                            lng: coordinates.lng
                        };
                    }
                    
                    await apiService.createCrc(crcData);
                    successCount++;
                }

                if (errors.length > 0) {
                    const errorList = errors.map(err => `<li>${err}</li>`).join('');
                    openModal(`
                        <h3 class="text-xl font-bold text-red-500">Import Complete with Errors</h3>
                        <p class="my-2 dark:text-gray-300">Successfully prepared <strong>${successCount}</strong> CRCs to be created.</p>
                        <p class="my-2 dark:text-gray-300">The following ${errors.length} rows could not be imported:</p>
                        <ul class="list-disc list-inside bg-red-100 dark:bg-red-900/50 p-4 rounded-md text-sm max-h-60 overflow-y-auto custom-scrollbar">
                            ${errorList}
                        </ul>
                        <div class="mt-6 text-right">
                            <button data-action="close-modal" class="py-2 px-4 rounded-md bg-gray-200 dark:bg-gray-600">Close</button>
                        </div>
                    `, 'lg');
                }
                
                if (successCount > 0) {
                    // Batch operations replaced with individual API calls
                    
                    // --- FIX START: Manually refresh state after import ---
                    if (errors.length === 0) {
                        closeModal();
                        showNotification(`${successCount} CRCs imported successfully!`, 'success');
                    }
                    
                    // Fetch the updated CRCs to refresh the UI immediately
                    const updatedCrcs = await apiService.getCrcs();
                    if (updatedCrcs.length > 0) {
                        updatedCrcs.sort((a, b) => {
                            const aName = (a.name || '').toString();
                            const bName = (b.name || '').toString();
                            return aName.localeCompare(bName);
                        });
                    }

                    setState({ crcs: updatedCrcs });
                    // --- FIX END ---
                } else if (errors.length === 0) {
                    closeModal();
                    showNotification('No new CRCs found in the CSV file.', 'info');
                }
            };

            const importShifts = async (headers, data) => {
                const requiredHeaders = ['Date', 'EventType'];
                const missingHeaders = requiredHeaders.filter(h => !headers.includes(h));
                if (missingHeaders.length > 0) {
                    openModal(`<h3 class="text-xl font-bold dark:text-white">Import Error</h3><p class="dark:text-gray-300">CSV file is missing required headers. It must contain: ${missingHeaders.join(', ')}</p>`);
                    return;
                }

                // Batch operations replaced with individual API calls
                const errors = [];
                let successCount = 0;
                let timeOffRequestsCreated = 0;

                const crcMap = new Map(state.crcs.map(c => [c.name.toLowerCase(), c.id]));
                const siteMap = new Map(state.crc_sites.map(s => [s.name.toLowerCase(), s.id]));
                const studyMap = new Map(state.studies.map(s => [s.name.toLowerCase(), s.id]));
                const timeOffRequestKeys = new Set(
                    (state.timeOffRequests || []).map(req => `${req.crcId}_${req.date || req.startDate}`)
                );
                const requestedBy = state.currentUser?.id || state.currentUser?.username || 'csv-import';
                
                for (const [index, row] of data.entries()) {
                    const rowNum = index + 2;
                    const { Date: date, EventType, CRCName, SiteName, StudyName, Roles, Notes, Hours, Period, VisitNumber, PrincipalInvestigator, Mileage } = row;
                    if (!date || !EventType) {
                        errors.push(`Row ${rowNum}: Missing required value for Date or EventType.`);
                        continue;
                    }
                    if (isNaN(new Date(date).getTime())) {
                        errors.push(`Row ${rowNum}: Invalid date format for "${date}". Please use YYYY-MM-DD.`);
                        continue;
                    }

                    const rowNormalized = {};
                    Object.entries(row).forEach(([key, value]) => {
                        rowNormalized[normalizeHeaderKey(key)] = (value || '').trim();
                    });

                    const normalizedEventType = (EventType || '').toString().trim().toLowerCase();
                    const normalizedEventTypeSimple = normalizedEventType.replace(/[\s-]/g, '');
                    const isTimeOffImportRow = ['timeoffrequest', 'timeoff', 'pto', 'ptorequest', 'vacation', 'sick', 'holiday', 'bereavement', 'juryduty', 'jury'].includes(normalizedEventTypeSimple);

                    if (isTimeOffImportRow) {
                        if (!CRCName) {
                            errors.push(`Row ${rowNum}: CRCName is required for time off requests.`);
                            continue;
                        }
                        const crcId = crcMap.get(CRCName.trim().toLowerCase());
                        if (!crcId) {
                            errors.push(`Row ${rowNum}: CRC "${CRCName}" not found.`);
                            continue;
                        }

                        const startDateObj = parseDateFlexible(date);
                        if (!startDateObj) {
                            errors.push(`Row ${rowNum}: Invalid start date "${date}" for time off request.`);
                            continue;
                        }

                        const endDateRaw = rowNormalized['enddate'] || (row.EndDate || '').trim();
                        const endDateObj = endDateRaw ? parseDateFlexible(endDateRaw) : startDateObj;
                        if (!endDateObj) {
                            errors.push(`Row ${rowNum}: Invalid end date "${endDateRaw}" for time off request.`);
                            continue;
                        }
                        if (endDateObj < startDateObj) {
                            errors.push(`Row ${rowNum}: End date "${endDateRaw}" is before start date "${date}" for time off request.`);
                            continue;
                        }

                        const typeValue = rowNormalized['timeofftype'] || rowNormalized['type'] || EventType || 'Time Off';
                        const periodValue = rowNormalized['period'] || (Period || 'Full Day');
                        let hoursValue = parseFloat(rowNormalized['hours'] || (Hours || ''));
                        if (!Number.isFinite(hoursValue) || hoursValue <= 0) {
                            hoursValue = getHoursForPeriod(periodValue);
                        }
                        const notesValue = rowNormalized['notes'] || (Notes || '');

                        const cursor = new Date(startDateObj.getFullYear(), startDateObj.getMonth(), startDateObj.getDate());
                        const limit = new Date(endDateObj.getFullYear(), endDateObj.getMonth(), endDateObj.getDate());

                        while (cursor <= limit) {
                            const dateStr = toDateOnlyString(cursor);
                            const duplicateKey = `${crcId}_${dateStr}`;
                            if (!timeOffRequestKeys.has(duplicateKey)) {
                                const requestPayload = {
                                    crcId,
                                    requestedBy,
                                    date: dateStr,
                                    startDate: dateStr,
                                    endDate: dateStr,
                                    type: typeValue || 'Time Off',
                                    hours: hoursValue,
                                    period: periodValue,
                                    notes: notesValue || undefined,
                                    status: 'pending'
                                };
                                try {
                                    await apiService.createTimeOffRequest(requestPayload);
                                    timeOffRequestKeys.add(duplicateKey);
                                    timeOffRequestsCreated++;
                                } catch (error) {
                                    console.error('Error creating time off request from shift import:', error);
                                    errors.push(`Row ${rowNum}: Failed to create time off request for ${CRCName} on ${dateStr}. ${error?.message || error}`);
                                }
                            }
                            cursor.setDate(cursor.getDate() + 1);
                        }

                        continue;
                    }

                    const eventData = {
                        date: date.trim(),
                        type: EventType.trim(),
                        notes: (Notes || '').trim(),
                        roles: Roles ? Roles.split(';').map(r => r.trim()) : [],
                        hours: Hours ? parseFloat(Hours) : (state.settings[EventType.trim()] || 8),
                        period: (Period || 'Full Day'),
                        visitNumber: VisitNumber || null,
                        principalInvestigator: PrincipalInvestigator || null,
                        mileage: Mileage ? parseFloat(Mileage) : null,
                        isOverridden: false,
                        groupId: crypto.randomUUID(),
                        crcId: null, siteId: null, studyIds: [],
                    };
                    
                    let hasError = false;

                    if (EventType !== 'Open Shift' && !CRCName) {
                        errors.push(`Row ${rowNum}: CRCName is required for EventType "${EventType}".`);
                        hasError = true;
                    }
                    if (CRCName) {
                        const crcId = crcMap.get(CRCName.toLowerCase());
                        if (crcId) {
                            eventData.crcId = crcId;
                        } else {
                            errors.push(`Row ${rowNum}: CRC "${CRCName}" not found.`);
                            hasError = true;
                        }
                    }

                    if (SiteName) {
                        const siteNameTrimmed = SiteName.trim();
                        const siteNameLower = siteNameTrimmed.toLowerCase();
                        let siteId = siteMap.get(siteNameLower);
                        if (!siteId) {
                            const newSiteDoc = await apiService.createSite({ name: siteNameTrimmed });
                            siteId = newSiteDoc.id;
                            siteMap.set(siteNameLower, siteId);
                        }
                        eventData.siteId = siteId;
                    }
                    
                    if (StudyName) {
                        const studyNames = StudyName.split(';').map(s => s.trim()).filter(Boolean);
                        const studyIds = [];
                        for (const sName of studyNames) {
                            const sNameLower = sName.toLowerCase();
                            let studyId = studyMap.get(sNameLower);
                            if (!studyId) {
                                const newStudyDoc = await apiService.createStudy({ name: sName });
                                studyId = newStudyDoc.id;
                                studyMap.set(sNameLower, studyId);
                            }
                            studyIds.push(studyId);
                        }
                        if (studyIds.length > 0) eventData.studyIds = studyIds;
                    }

                    if (!hasError) {
                        const newEventRef = null;
                        await apiService.createEvent(newEventRef, eventData);
                        successCount++;
                    }
                }

                if (errors.length > 0) {
                    const errorList = errors.map(err => `<li>${err}</li>`).join('');
                    openModal(`
                        <h3 class="text-xl font-bold text-red-500">Import Complete with Errors</h3>
                        <p class="my-2 dark:text-gray-300">Successfully prepared <strong>${successCount}</strong> shifts to be created.</p>
                        <p class="my-2 dark:text-gray-300">The following ${errors.length} rows could not be imported:</p>
                        <ul class="list-disc list-inside bg-red-100 dark:bg-red-900/50 p-4 rounded-md text-sm max-h-60 overflow-y-auto custom-scrollbar">
                            ${errorList}
                        </ul>
                        <div class="mt-6 text-right">
                            <button data-action="close-modal" class="py-2 px-4 rounded-md bg-gray-200 dark:bg-gray-600">Close</button>
                        </div>
                    `, 'lg');
                }
                
                if (successCount > 0) {
                    // Batch operations replaced with individual API calls
                    // --- FIX START: Manually refresh state after import ---
                    if (errors.length === 0) {
                        closeModal();
                        showNotification(`${successCount} shifts imported successfully!`, 'success');
                    }

                    // Fetch the updated collections to refresh the UI immediately
                    const [updatedEvents, updatedSites, updatedStudies] = await Promise.all([
                        apiService.getEvents(),
                        apiService.getSites(),
                        apiService.getStudies()
                    ]);

                    if (updatedSites.length > 0) {
                        updatedSites.sort((a, b) => {
                            const aName = (a.name || '').toString();
                            const bName = (b.name || '').toString();
                            return aName.localeCompare(bName);
                        });
                    }
                    // Helper function to check if a study should be shown
                    const isStudyActive = (study) => {
                        const statusString = String(study.status || study.state || study.phase || '').toLowerCase();
                        
                        // Exclude ONLY closed studies - show everything else from ARTEMIS
                        if (statusString.includes('closed')) {
                            return false;
                        }
                        
                        // Include all other studies from ARTEMIS (they have siteIds)
                        // This includes: enrolling, recruiting, active, completed (but not closed), etc.
                        return true;
                    };
                    
                    let sanitizedUpdatedStudies = Array.isArray(updatedStudies) ? updatedStudies.filter(study => {
                        // Must have siteIds from ARTEMIS
                        if (!Array.isArray(study.siteIds) || study.siteIds.length === 0) return false;
                        // Must be active
                        return isStudyActive(study);
                    }) : [];
                    if (sanitizedUpdatedStudies.length > 0) {
                        sanitizedUpdatedStudies = sanitizedUpdatedStudies.slice().sort((a, b) => {
                            const aName = (a.name || a.title || '').toString();
                            const bName = (b.name || b.title || '').toString();
                            return aName.localeCompare(bName);
                        });
                    }

                    setState({
                        crc_events: updatedEvents,
                        crc_sites: updatedSites,
                        studies: sanitizedUpdatedStudies
                    });
                    // --- FIX END ---
                } else if (errors.length === 0) {
                    closeModal();
                    showNotification('No new shifts found in the CSV file.', 'info');
                }
            };

            const importTimeOffRequests = async (headers, data) => {
                const normalizedHeaders = headers.map(normalizeHeaderKey);
                const hasCrcHeader = normalizedHeaders.includes('crcname');
                const hasDateHeader = normalizedHeaders.includes('startdate') || normalizedHeaders.includes('eventdate') || normalizedHeaders.includes('date');

                if (!hasCrcHeader || !hasDateHeader) {
                    openModal(`<h3 class="text-xl font-bold dark:text-white">Import Error</h3><p class="dark:text-gray-300">Time Off CSV must include at least CRCName and Date (or StartDate/EventDate) columns.</p>`);
                    return;
                }

                const headerLookup = {};
                headers.forEach(header => {
                    headerLookup[normalizeHeaderKey(header)] = header;
                });

                const errors = [];
                let createdCount = 0;

                const existingRequestKeys = new Set(
                    (state.timeOffRequests || []).map(req => `${req.crcId}_${req.date || req.startDate}`)
                );

                const crcMap = new Map(
                    state.crcs.map(crc => [crc.name ? crc.name.trim().toLowerCase() : '', crc.id])
                );

                const requestedBy = state.currentUser?.id || state.currentUser?.username || 'csv-import';

                const getRowValue = (row, key) => {
                    const normalizedKey = normalizeHeaderKey(key);
                    if (row.hasOwnProperty(key)) return (row[key] || '').trim();
                    if (headerLookup[normalizedKey] && row.hasOwnProperty(headerLookup[normalizedKey])) {
                        return (row[headerLookup[normalizedKey]] || '').trim();
                    }
                    return (row[normalizedKey] || '').trim?.() || '';
                };

                for (const [index, row] of data.entries()) {
                    const rowNum = index + 2;
                    const rowNormalized = {};
                    Object.entries(row).forEach(([key, value]) => {
                        rowNormalized[normalizeHeaderKey(key)] = (value || '').trim();
                    });

                    const crcNameRaw = rowNormalized['crcname'] || getRowValue(row, 'CRCName');
                    if (!crcNameRaw) {
                        errors.push(`Row ${rowNum}: Missing CRCName.`);
                        continue;
                    }
                    const crcId = crcMap.get(crcNameRaw.trim().toLowerCase());
                    if (!crcId) {
                        errors.push(`Row ${rowNum}: CRC "${crcNameRaw}" not found in CHAOS.`);
                        continue;
                    }

                    const startDateRaw = rowNormalized['startdate'] || rowNormalized['date'] || rowNormalized['eventdate'] ||
                        getRowValue(row, 'StartDate') || getRowValue(row, 'Date') || getRowValue(row, 'EventDate');
                    if (!startDateRaw) {
                        errors.push(`Row ${rowNum}: Missing Date/StartDate.`);
                        continue;
                    }

                    const startDateObj = parseDateFlexible(startDateRaw);
                    if (!startDateObj) {
                        errors.push(`Row ${rowNum}: Invalid start date "${startDateRaw}".`);
                        continue;
                    }

                    const endDateRaw = rowNormalized['enddate'] || getRowValue(row, 'EndDate') || startDateRaw;
                    const endDateObj = parseDateFlexible(endDateRaw);
                    if (!endDateObj) {
                        errors.push(`Row ${rowNum}: Invalid end date "${endDateRaw}".`);
                        continue;
                    }

                    if (endDateObj < startDateObj) {
                        errors.push(`Row ${rowNum}: End date "${endDateRaw}" is before start date "${startDateRaw}".`);
                        continue;
                    }

                    const type = rowNormalized['timeofftype'] || rowNormalized['type'] || getRowValue(row, 'TimeOffType') || getRowValue(row, 'Type') || 'Time Off';
                    const period = rowNormalized['period'] || getRowValue(row, 'Period') || 'Full Day';
                    let hours = parseFloat(rowNormalized['hours'] || getRowValue(row, 'Hours'));
                    if (!Number.isFinite(hours) || hours <= 0) {
                        hours = getHoursForPeriod(period);
                    }
                    const notes = rowNormalized['notes'] || getRowValue(row, 'Notes') || '';

                    const cursor = new Date(startDateObj.getFullYear(), startDateObj.getMonth(), startDateObj.getDate());
                    const limit = new Date(endDateObj.getFullYear(), endDateObj.getMonth(), endDateObj.getDate());

                    while (cursor <= limit) {
                        const dateStr = toDateOnlyString(cursor);
                        const duplicateKey = `${crcId}_${dateStr}`;
                        if (existingRequestKeys.has(duplicateKey)) {
                            cursor.setDate(cursor.getDate() + 1);
                            continue;
                        }

                        const requestPayload = {
                            crcId,
                            requestedBy,
                            date: dateStr,
                            startDate: dateStr,
                            endDate: dateStr,
                            type: type || 'Time Off',
                            hours,
                            period,
                            notes: notes || undefined,
                            status: 'pending'
                        };

                        try {
                            await apiService.createTimeOffRequest(requestPayload);
                            existingRequestKeys.add(duplicateKey);
                            createdCount++;
                        } catch (error) {
                            console.error('Error creating time off request from CSV:', error);
                            errors.push(`Row ${rowNum}: Failed to create time off request for ${crcNameRaw} on ${dateStr}. ${error?.message || error}`);
                        }

                        cursor.setDate(cursor.getDate() + 1);
                    }
                }

                if (createdCount > 0) {
                    try {
                        const updatedRequests = await apiService.getTimeOffRequests();
                        setState({ timeOffRequests: updatedRequests });
                        // Always refresh both time off views if they exist
                        setTimeout(() => {
                            if (document.getElementById('time-off-requests-content')) {
                                renderTimeOffRequestsContent();
                            }
                            if (document.getElementById('time-off-content')) {
                                renderTimeOffContent();
                            }
                            if (document.getElementById('unavailability-calendar-container')) {
                                renderUnavailabilityCalendar();
                            }
                        }, 100);
                    } catch (refreshError) {
                        console.error('Error refreshing time off requests after import:', refreshError);
                    }
                }

                if (errors.length > 0) {
                    const errorList = errors.map(err => `<li>${err}</li>`).join('');
                    openModal(`
                        <h3 class="text-xl font-bold text-red-500">Import Complete with Errors</h3>
                        <p class="my-2 dark:text-gray-300"><strong>${createdCount}</strong> time off request${createdCount === 1 ? '' : 's'} created successfully.</p>
                        <p class="my-2 dark:text-gray-300">The following issues occurred:</p>
                        <ul class="list-disc list-inside bg-red-100 dark:bg-red-900/60 p-4 rounded-md text-sm max-h-60 overflow-y-auto custom-scrollbar">
                            ${errorList}
                        </ul>
                        <div class="mt-6 text-right">
                            <button data-action="close-modal" class="py-2 px-4 rounded-md bg-gray-200 dark:bg-gray-600">Close</button>
                        </div>
                    `, 'lg');
                } else {
                    closeModal();
                    const message = createdCount > 0
                        ? `${createdCount} time off request${createdCount === 1 ? '' : 's'} imported successfully!`
                        : 'No new time off requests found in the CSV file.';
                    showNotification(message, createdCount > 0 ? 'success' : 'info');
                }
            };

            const downloadTemplate = (templateType) => {
                let headers, rows;
                
                if (templateType === 'shifts') {
                    headers = ['Date', 'EventType', 'CRCName', 'SiteName', 'StudyName', 'Roles', 'Hours', 'Period', 'Notes', 'VisitNumber', 'PrincipalInvestigator', 'Mileage'];
                    // Create a sample row with examples
                    rows = [
                        [
                            '2025-01-15', // Date
                            'Site Assignment', // EventType
                            'John Doe', // CRCName (must match existing CRC)
                            'Sample Site', // SiteName
                            'Study A; Study B', // StudyName (semicolon separated)
                            'Coordinator; Monitor', // Roles (semicolon separated)
                            '8', // Hours
                            'Full Day', // Period
                            'Sample notes', // Notes
                            '1', // VisitNumber
                            'Dr. Smith', // PrincipalInvestigator
                            '' // Mileage
                        ]
                    ];
                } else if (templateType === 'crcs') {
                    headers = ['CRCName', 'HomeLocation', 'Region', 'EmploymentType'];
                    rows = [
                        [
                            'John Doe', // CRCName
                            'New York, NY', // HomeLocation
                            'East', // Region
                            'FTE' // EmploymentType
                        ]
                    ];
                } else if (templateType === 'timeoff') {

            const exportCurrentMonthToCSV = () => {

                        const newForm = form.cloneNode(true);
                        form.parentNode.replaceChild(newForm, form);
                        
                        newForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            const formData = new FormData(newForm);
                            const startDate = formData.get('startDate');
                            const endDate = formData.get('endDate');
                            let selectedEventTypes = formData.getAll('eventTypes');
                            const isSupervisor = state.currentUser && getEffectivePermissionLevel() === 'Supervisor';
                            if (isSupervisor) {
                                // Enforce supervisor export restriction even if someone manipulates the DOM
                                const allowed = new Set(['Site Assignment', 'Travel Day']);
                                selectedEventTypes = selectedEventTypes.filter(t => allowed.has(t));
                            }
                            
                            if (!startDate || !endDate) {
                                showNotification('Please select both start and end dates.', 'error');
                                return;
                            }
                            
                            if (new Date(startDate) > new Date(endDate)) {
                                showNotification('Start date must be before or equal to end date.', 'error');
                                return;
                            }
                            
                            if (selectedEventTypes.length === 0) {
                                showNotification(isSupervisor
                                    ? 'Supervisors can only export Site Assignments and/or Travel Days.'
                                    : 'Please select at least one event type to export.', 'error');
                                return;
                            }
                            
                            performExportWithDateRange(startDate, endDate, selectedEventTypes);
                            closeModal();
                        });
                    }
                }, 100);
            };

            const performExportWithDateRange = (startDate, endDate, selectedEventTypes = []) => {
                // Filter events by date range
                let eventsToExport = state.crc_events.filter(e => {
                    const eventDate = e.date;
                    return eventDate >= startDate && eventDate <= endDate;
                });
                
                // Enforce Supervisor export restriction (Site Assignment + Travel Day only)
                const isSupervisor = state.currentUser && getEffectivePermissionLevel() === 'Supervisor';
                if (isSupervisor) {
                    const allowed = new Set(['Site Assignment', 'Travel Day']);
                    selectedEventTypes = Array.isArray(selectedEventTypes) ? selectedEventTypes.filter(t => allowed.has(t)) : [];
                }

                // Filter by selected event types
                // For supervisors, selectedEventTypes will only contain 'Site Assignment' and/or 'Travel Day'
                // For managers/admins, it can include 'Paid Time Off' as well
                if (selectedEventTypes && selectedEventTypes.length > 0) {
                    eventsToExport = eventsToExport.filter(e => {
                        // Handle PTO variations
                        if (selectedEventTypes.includes('Paid Time Off')) {
                            if (e.type === 'Paid Time Off' || e.type === 'PTO' || e.type === 'Unavailable') {
                                return true;
                            }
                        }
                        // Handle exact matches
                        return selectedEventTypes.includes(e.type);
                    });
                } else {
                    // Fallback: if no event types selected (shouldn't happen with validation, but just in case)
                    if (isSupervisor) {
                        // For supervisors, default to Site Assignment and Travel Day
                        eventsToExport = eventsToExport.filter(e => 
                            e.type === 'Site Assignment' || e.type === 'Travel Day'
                        );
                    }
                }
                
                // Apply the same filters that are used in the calendar view
                // CRC filter
                if (state.selectedCrcFilter && state.selectedCrcFilter !== 'all') {
                    eventsToExport = eventsToExport.filter(e => eventBelongsToCrc(e, state.selectedCrcFilter));

                // Site filter
                if (state.selectedSiteFilter && state.selectedSiteFilter !== 'all') {
                    eventsToExport = eventsToExport.filter(e => e.siteId === state.selectedSiteFilter);
                }
                
                // Study filter
                if (state.selectedStudyFilter && state.selectedStudyFilter !== 'all') {
                    eventsToExport = eventsToExport.filter(e => 
                        (e.studyIds || []).includes(state.selectedStudyFilter)
                    );
                }
                
                // Open shifts filter

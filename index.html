    <script>
        // --- Azure API Configuration ---
        const API_BASE_URL = '/api';
        
        // --- API Service ---
        class ApiService {
            constructor() {
                this.baseUrl = API_BASE_URL;
                this.apiKey = 'your-api-key-here'; // This should be set from environment or config
                this.retryAttempts = 3;
                this.retryDelay = 1000; // 1 second
            }
            
            async request(endpoint, options = {}) {
                const url = `${API_BASE_URL}${endpoint}`;
                const config = {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                };

                // Debug logging
                console.log('API Request:', {
                    url,
                    method: config.method || 'GET',
                    body: (() => {
                        if (!config.body) return undefined;
                        try { return JSON.parse(config.body); } catch { return config.body; }
                    })()
                });

                try {
                    const response = await fetch(url, config);
                    
                    if (!response.ok) {
                        // Read body ONCE to avoid "body stream already read"
                        const rawText = await response.text();
                        let parsed = null;
                        try { parsed = rawText ? JSON.parse(rawText) : null; } catch { parsed = null; }

                        console.error('API Error Response:', {
                            status: response.status,
                            statusText: response.statusText,
                            body: rawText,
                            errorJson: parsed,
                            url: url,
                            method: config.method || 'GET',
                            requestBody: (() => {
                                if (!config.body) return undefined;
                                try { return JSON.parse(config.body); } catch { return config.body; }
                            })()
                        });

                        const msg = parsed && typeof parsed === 'object' && parsed.error
                            ? parsed.error
                            : (rawText || 'Unknown error');
                        throw new Error(`API request failed: ${response.status} ${response.statusText} - ${msg}`);
                    }
                    
                    // Handle different response types
                    if (response.status === 204) {
                        return null; // No content
                    }
                    
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return await response.json();
                    }
                    
                    return await response.text();
                } catch (error) {
                    console.error('API request error:', error);
                    throw error;
                }
            }

            // Studies
            async getStudies() {
                return this.request('/studies');
            }

            async getStudy(id) {
                return this.request(`/studies/${id}`);
            }

            async createStudy(study) {
                return this.request('/studies', {
                    method: 'POST',
                    body: JSON.stringify(study)
                });
            }

            async updateStudy(id, study) {

            const washoutPatients = [];
            
            studies.forEach(study => {
                const studyPatients = allPatients.filter(p => {
                    const pastEnrollments = p.enrollments?.filter(e => e.status === 'past') || [];
                    return pastEnrollments.some(e => e.studyId === study.id && e.exitedDate);

                    if (enrollment) {
                        const exitDate = new Date(enrollment.exitedDate);
                        const washoutCompleteDate = new Date(exitDate);
                        washoutCompleteDate.setDate(washoutCompleteDate.getDate() + (study.washoutDays || 30));
                        
                        const today = new Date();
                        const diffMs = washoutCompleteDate.getTime() - today.getTime();
                        const daysRemaining = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                        
                        // Include patients who are still in washout or recently became eligible (within last 7 days)
                        if (daysRemaining > -7) {
                            washoutPatients.push({
                                ...patient,
                                studyId: study.id,
                                exitDate: enrollment.exitedDate,
                                washoutCompleteDate: washoutCompleteDate.toISOString(),

         */
        const notifyNasaOfUpdate = (studyId) => {
            try {
                if (!nasaWindow || nasaWindow.closed) {
                    console.warn("N.A.S.A. window not available for sync.");
                    return false;
                }
                
                const study = allStudies.find(s => s.id === studyId);
                if (!study) {
                    console.warn(`Study with ID ${studyId} not found for sync.`);
                    return false;
                }

                const studyPatients = allPatients.filter(p => {
                    const currentEnrollment = p.enrollments?.find(e => e.status === 'current');
                    return currentEnrollment?.studyId === study.id;
                });

                const enrolledCount = studyPatients.filter(p => p.status && p.status.toLowerCase() === 'enrolled').length;
                const screenFailCount = studyPatients.filter(p => p.status && p.status.toLowerCase() === 'screen fail').length;

                const payload = {
                    studyId: study.id,
                    enrolled: enrolledCount,
                    screenFails: screenFailCount,
                    timestamp: new Date().toISOString()
                };
                
                nasaWindow.postMessage({ type: 'CTMS_DATA_UPDATE', payload }, '*');
                console.log(`Successfully synced study ${study.title} with N.A.S.A.:`, payload);

                                </div>

                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Interval (minutes)</label>
                                    <input type="number" id="artemis-schedule-interval-minutes" name="duration" value="60" min="5" required class="mt-1 block w-full p-2 border rounded border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white"/>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Capacity</label>
                                    <input type="number" id="artemis-schedule-capacity" name="capacity" value="2" min="1" required class="mt-1 block w-full p-2 border rounded border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white"/>
                                </div>
                            </div>

                            <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:text-sm">
                                Create Schedule
                            </button>
                        </form>
                    </div>

                    <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                            <div>
                                <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200">Schedules</h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400">${schedules.length} schedules • ${totalSlots} slots</p>
                            </div>
                            <button id="refresh-schedules-btn" class="inline-flex items-center px-3 py-2 border border-gray-300 dark:border-gray-600 text-sm font-medium rounded-md shadow-sm text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                ${getIcon('sync')} <span class="ml-2">Refresh</span>
                            </button>
                        </div>
                        <div id="artemis-schedules-list" class="space-y-3"></div>
                    </div>
                </div>
            `;
        };

        const renderAllCrcs = () => {
            const listEl = document.getElementById('crc-list');
            const searchEl = document.getElementById('crc-search');
            if (!listEl) return;

            const term = String(searchEl?.value || '').trim().toLowerCase();
            const crcs = (allCrcs || [])
                .filter(c => c && (c.name || c.title || c.homeLocation || c.region))
                .filter(c => {
                    if (!term) return true;
                    const hay = `${c.name || ''} ${c.title || ''} ${c.region || ''} ${c.homeLocation || ''} ${c.employmentType || ''}`.toLowerCase();
                    return hay.includes(term);
                })
                .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));

            listEl.innerHTML = crcs.length === 0
                ? `<div class="text-sm text-gray-500 dark:text-gray-400">No CRCs found.</div>`
                : crcs.map(c => `
                    <div class="p-3 rounded-md border border-gray-200 dark:border-gray-700">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <div class="font-semibold text-gray-900 dark:text-gray-100 truncate">${c.name || 'Unnamed CRC'}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">
                                    ${c.title ? escapeHtml(c.title) : '—'}
                                    ${c.region ? ` • ${escapeHtml(c.region)}` : ''}
                                    ${c.employmentType ? ` • ${escapeHtml(c.employmentType)}` : ''}
                                </div>
                                ${c.homeLocation ? `<div class="text-xs text-gray-500 dark:text-gray-400 truncate">Home: ${escapeHtml(c.homeLocation)}</div>` : ''}
                            </div>
                            <div class="text-xs text-gray-400">ID: ${c.id || ''}</div>
                        </div>
                    </div>
                `).join('');

            if (searchEl && !searchEl.dataset.bound) {
                searchEl.dataset.bound = '1';
                searchEl.addEventListener('input', () => renderAllCrcs());
            }
        };

        const escapeHtml = (value) => {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        };

        const formatSiteSurveyRoleLabel = (role) => {
            const r = String(role || '').trim().toLowerCase();
            if (r === 'pi') return 'PI';
            if (r === 'coordinator') return 'Coordinator';
            return String(role || '').trim() || 'role';
        };

        const getArtemisSiteLegacyStats = (siteId) => {
            if (window.ArtemisLegacy && typeof window.ArtemisLegacy.getLegacyForArtemisSite === 'function') {
                return window.ArtemisLegacy.getLegacyForArtemisSite(siteId);
            }
            return null;
        };

        const refreshArtemisLegacySiteIndex = async () => {
            if (!window.ArtemisLegacy || typeof window.ArtemisLegacy.refreshArtemisLegacyIndex !== 'function') return;
            try {
                await window.ArtemisLegacy.refreshArtemisLegacyIndex(allSites);
            } catch (err) {
                console.warn('Legacy site index refresh failed', err);
            }
        };

        const legacySiteHistoryHtml = (siteId, { compact = false } = {}) => {
            const legacy = getArtemisSiteLegacyStats(siteId);
            if (!legacy || !legacy.nStudies) {
                return compact
                    ? `<span class="text-xs text-gray-400 dark:text-gray-500">—</span>`
                    : `<div class="rounded-xl border border-dashed border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/20 p-4 text-sm text-gray-500 dark:text-gray-400">
                        No matching legacy (historical) site data for this name yet.
                       </div>`;
            }
            const studyList = (legacy.studyNames || []).slice(0, compact ? 3 : 12);
            const more = (legacy.studyNames || []).length - studyList.length;
            const studiesListHtml = studyList.length
                ? `<ul class="mt-2 space-y-1 text-xs text-gray-600 dark:text-gray-300">${studyList.map(n => `<li class="flex gap-2"><span class="text-indigo-400">•</span><span>${escapeHtml(n)}</span></li>`).join('')}${more > 0 ? `<li class="text-gray-400 italic">+ ${more} more</li>` : ''}</ul>`
                : '';
            if (compact) {
                return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-violet-100 text-violet-800 dark:bg-violet-900/40 dark:text-violet-200" title="${legacy.nStudies} past studies">${legacy.nStudies} past</span>`;
            }
            return `
                <div class="rounded-xl border border-violet-200 dark:border-violet-900/50 bg-gradient-to-br from-violet-50/80 to-white dark:from-violet-950/30 dark:to-gray-800 overflow-hidden">
                    <div class="px-4 py-3 border-b border-violet-100 dark:border-violet-900/40 flex items-center justify-between gap-3">
                        <div>
                            <div class="text-xs font-semibold uppercase tracking-wide text-violet-700 dark:text-violet-300">Historical performance</div>
                            <div class="text-[11px] text-gray-500 dark:text-gray-400 mt-0.5">Matched legacy site: ${escapeHtml(legacy.legacyName || '')}</div>
                        </div>
                        <button type="button" id="legacy-sites-tab-btn" class="text-xs text-violet-700 dark:text-violet-300 hover:underline font-medium shrink-0">Legacy details →</button>
                    </div>
                    <div class="p-4 grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="survey-summary-chip"><div class="label">Past studies</div><div class="value text-violet-700 dark:text-violet-300">${legacy.nStudies}</div></div>
                        <div class="survey-summary-chip"><div class="label">Legacy enrolled</div><div class="value">${Number(legacy.enrolled || 0).toLocaleString()}</div></div>
                        <div class="survey-summary-chip"><div class="label">Legacy screened</div><div class="value">${Number(legacy.screened || 0).toLocaleString()}</div></div>
                        <div class="survey-summary-chip"><div class="label">E / S rate</div><div class="value">${legacy.screened > 0 ? Math.round((legacy.enrolled / legacy.screened) * 100) + '%' : '—'}</div></div>
                    </div>
                    ${studiesListHtml ? `<div class="px-4 pb-4"><div class="text-xs font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wide">Past study names</div>${studiesListHtml}</div>` : ''}
                </div>`;
        };

        const formatSurveyAnswerValue = (value) => {
            if (value == null) return '';
            return String(value).trim();
        };

        const renderSurveyAnswerValueHtml = (value, type) => {
            const val = formatSurveyAnswerValue(value);
            if (!val) return `<span class="text-gray-400 dark:text-gray-500 italic text-sm">No answer</span>`;

            const trimmed = val.trim();
            const lower = trimmed.toLowerCase();
            if (/^(yes|no|n\/a|na|none|unknown|not applicable)$/i.test(trimmed)) {
                const cls = lower === 'yes' ? 'survey-val-yes' : lower === 'no' ? 'survey-val-no' : 'survey-val-neutral';
                return `<span class="survey-answer-badge ${cls}">${escapeHtml(trimmed)}</span>`;
            }

            if (type === 'date' || /^\d{4}-\d{2}-\d{2}/.test(trimmed)) {
                try {
                    const d = new Date(trimmed);
                    if (!Number.isNaN(d.getTime())) {
                        return `<span class="survey-answer-text font-medium">${escapeHtml(d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }))}</span>`;
                    }
                } catch (_) {}
            }

            if (type === 'number' || /^-?\d+(\.\d+)?$/.test(trimmed)) {
                return `<span class="survey-answer-text font-mono font-semibold text-indigo-700 dark:text-indigo-300">${escapeHtml(trimmed)}</span>`;
            }

            if (trimmed.includes(',')) {
                const items = trimmed.split(',').map(s => s.trim()).filter(Boolean);
                if (items.length >= 2) {
                    if (items.length <= 6) {
                        return `<div class="survey-answer-pills">${items.map(i => `<span class="survey-answer-pill">${escapeHtml(i)}</span>`).join('')}</div>`;
                    }
                    return `<ul class="survey-answer-list">${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
                }
            }

            if (type === 'textarea' || trimmed.length > 100) {
                return `<div class="survey-answer-long">${escapeHtml(trimmed)}</div>`;
            }

            return `<span class="survey-answer-text">${escapeHtml(trimmed)}</span>`;
        };

        const surveyAnswerCount = (response) => {
            return asSurveyList(response?.answers).filter(a => a && String(a.value ?? '').trim() !== '').length;
        };

        const surveyScoreBadgeHtml = (response) => {
            const score = response?.score;
            if (!score || typeof score.pct !== 'number') return '';
            const pct = score.pct;
            const color = pct >= 80
                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200'
                : pct >= 50
                    ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200'
                    : 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-200';
            return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${color}" title="Score: ${score.earned} / ${score.totalWeight} pts">Score ${pct}%</span>`;
        };

        const surveyScoreRingHtml = (response) => {
            const score = response?.score;
            if (!score || typeof score.pct !== 'number') return '';
            const pct = score.pct;
            const stroke = pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
            const r = 18;
            const c = 2 * Math.PI * r;
            const offset = c - (pct / 100) * c;
            return `
                <div class="relative w-11 h-11 shrink-0" title="Score ${pct}% (${score.earned}/${score.totalWeight} pts)">
                    <svg class="w-11 h-11 -rotate-90" viewBox="0 0 44 44">
                        <circle cx="22" cy="22" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="4"/>
                        <circle cx="22" cy="22" r="${r}" fill="none" stroke="${stroke}" stroke-width="4"
                            stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
                    </svg>
                    <span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-gray-700 dark:text-gray-200">${pct}%</span>
                </div>`;
        };

        const asSurveyList = (value) => Array.isArray(value) ? value : [];

        const surveyAnswersListHtml = (response, { skipEmpty = true, layout = 'grid' } = {}) => {
            const answers = asSurveyList(response?.answers);
            const rows = answers.filter(a => {
                if (!a) return false;
                if (a.skipped && (a.value == null || String(a.value).trim() === '')) return !skipEmpty;
                return skipEmpty ? String(a.value ?? '').trim() !== '' : true;
            });
            if (!rows.length) {
                return `<div class="text-sm text-gray-500 dark:text-gray-400 py-4 text-center">No answers on this record.</div>`;
            }
            const gridCls = layout === 'grid' ? 'survey-answers-grid' : 'space-y-3';
            return `<div class="${gridCls}">${rows.map(a => {
                const val = formatSurveyAnswerValue(a.value);
                const type = (a.type || 'text').toLowerCase();
                const isLong = type === 'textarea' || val.length > 100 || (val.includes(',') && val.split(',').length > 6);
                return `
                    <div class="survey-answer-card${isLong ? ' span-full' : ''}">
                        <div class="survey-answer-q">${escapeHtml(a.label || a.questionId || 'Question')}</div>
                        <div class="survey-answer-a">${renderSurveyAnswerValueHtml(a.value, type)}</div>
                        ${a._keptFromPrior ? `<div class="text-[10px] text-blue-500 dark:text-blue-400 mt-1">Kept from prior submission</div>` : ''}
                    </div>`;
            }).join('')}</div>`;
        };

        const siteSurveySectionsHtml = (siteId) => {
            const latestBySurvey = latestSurveyResponsesBySurvey(siteId);
            const pending = (allSiteSurveyAssignments || []).filter(
                a => a && a.siteId === siteId && String(a.status || '').toLowerCase() !== 'submitted'
            );

            if (!latestBySurvey.length && !pending.length) {
                return `
                    <div class="survey-empty-state">
                        <div class="text-4xl mb-3 opacity-60">📋</div>
                        <div class="font-semibold text-gray-800 dark:text-gray-100">No surveys yet</div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 max-w-sm mx-auto">Send a feasibility or site survey to capture answers here.</p>
                    </div>`;
            }

            const pendingHtml = pending.length ? `
                <div class="rounded-xl border border-amber-200 dark:border-amber-800/50 bg-amber-50/60 dark:bg-amber-900/10 p-4 mb-4">
                    <div class="text-sm font-semibold text-amber-900 dark:text-amber-100">${pending.length} survey link${pending.length === 1 ? '' : 's'} awaiting response</div>
                    <div class="text-xs text-amber-800/80 dark:text-amber-200/80 mt-1">Open Comms to copy links or resend.</div>
                </div>` : '';

            const cards = latestBySurvey.map((r, idx) => {
                const when = r.submittedAt
                    ? new Date(r.submittedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
                    : (r.createdAt ? new Date(r.createdAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : 'N/A');
                const title = (allSiteSurveyDefinitions || []).find(d => d.id === r.surveyId)?.title || r.surveyId || 'Survey';
                const answerCount = surveyAnswerCount(r);
                const roleLabel = formatSiteSurveyRoleLabel(r.targetRole);
                const openFirst = idx === 0 ? ' open' : '';

                return `
                    <details class="survey-accordion"${openFirst}>
                        <summary>
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(title)}</span>
                                    ${surveyScoreBadgeHtml(r)}
                                    ${r._resubmitCount ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-200">Updated ${r._resubmitCount}×</span>` : ''}
                                </div>
                                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 text-xs text-gray-500 dark:text-gray-400">
                                    <span class="inline-flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                                        ${escapeHtml(roleLabel)}
                                    </span>
                                    <span>${escapeHtml(when)}</span>
                                    <span>${answerCount} answer${answerCount === 1 ? '' : 's'}</span>
                                    ${r.displayName ? `<span>${escapeHtml(r.displayName)}</span>` : ''}
                                </div>
                            </div>
                            ${surveyScoreRingHtml(r)}
                        </summary>
                        <div class="survey-accordion-body">
                            ${surveyAnswersListHtml(r, { skipEmpty: true })}
                            <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700 flex justify-end">
                                <button type="button" class="view-site-survey-response-btn text-sm text-indigo-600 dark:text-indigo-400 hover:underline font-medium" data-response-id="${escapeHtml(r.id)}">Open full view</button>
                            </div>
                        </div>
                    </details>`;
            }).join('');

            return pendingHtml + `<div class="space-y-3">${cards}</div>`;
        };

        const wireSiteDetailsModalUI = (siteId, { initialTab = 'overview' } = {}) => {
            const root = document.querySelector('#modal-container .site-modal-content');
            if (!root) return;

            const setTab = (tab) => {
                root.querySelectorAll('[data-site-tab]').forEach(btn => {
                    btn.classList.toggle('site-tab-active', btn.getAttribute('data-site-tab') === tab);
                });
                root.querySelectorAll('[data-site-panel]').forEach(panel => {
                    panel.classList.toggle('hidden', panel.getAttribute('data-site-panel') !== tab);
                });
            };

            root.querySelectorAll('[data-site-tab]').forEach(btn => {
                btn.addEventListener('click', () => setTab(btn.getAttribute('data-site-tab')));
            });

            setTab(initialTab);
        };

        const latestSurveyResponsesBySurvey = (siteId) => {
            const grouped = new Map();
            (allSiteSurveyResponses || [])
                .filter(r => r && r.siteId === siteId && !r._archived)
                .slice()
                .sort((a, b) => String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || '')))
                .forEach(r => {
                    const key = r.surveyId || r.id;
                    if (!grouped.has(key)) grouped.set(key, r);
                });
            return Array.from(grouped.values());
        };

        const siteSurveyStatusHtml = (siteId) => {
            const assignments = (allSiteSurveyAssignments || []).filter(a => a && a.siteId === siteId);
            const responses = (allSiteSurveyResponses || []).filter(r => r && r.siteId === siteId);
            const pending = assignments.filter(a => String(a.status || '').toLowerCase() !== 'submitted').length;
            const latest = latestSurveyResponsesBySurvey(siteId)[0];
            const pill = latest
                ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200">Answers in</span>`
                : (pending
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200">${pending} open</span>`
                    : `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">None</span>`);
            return { assignments, responses, pending, latest, pill };
        };

        const createSiteSurveyResponseModal = (response) => {
            if (!response) return;
            const siteName = allSites.find(s => s.id === response.siteId)?.name || response.siteId || 'Site';
            const surveyTitle = (allSiteSurveyDefinitions || []).find(d => d.id === response.surveyId)?.title || response.surveyId || 'Survey';
            const when = response.submittedAt
                ? new Date(response.submittedAt).toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' })
                : (response.createdAt ? new Date(response.createdAt).toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' }) : 'N/A');
            const answerCount = surveyAnswerCount(response);

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content dark:bg-gray-800" style="max-width: 56rem;">
                        <div class="p-0 overflow-hidden rounded-xl">
                            <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 dark:from-indigo-800 dark:to-indigo-900 px-6 py-5 text-white">
                                <div class="flex items-start justify-between gap-3">
                                    <div class="min-w-0">
                                        <div class="text-indigo-200 text-xs font-semibold uppercase tracking-wider mb-1">Survey response</div>
                                        <h2 class="text-xl font-bold truncate">${escapeHtml(surveyTitle)}</h2>
                                        <div class="text-indigo-100 text-sm mt-1">${escapeHtml(siteName)} · ${escapeHtml(formatSiteSurveyRoleLabel(response.targetRole))}</div>
                                    </div>
                                    <div class="flex items-center gap-3 shrink-0">
                                        ${surveyScoreRingHtml(response)}
                                        <button type="button" data-action="cancel" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-sm text-white">Close</button>
                                    </div>
                                </div>
                            </div>
                            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex flex-wrap gap-4 text-sm text-gray-600 dark:text-gray-300">
                                <span><strong class="text-gray-800 dark:text-gray-100">${answerCount}</strong> answers</span>
                                <span>Submitted ${escapeHtml(when)}</span>
                                ${response._resubmitCount ? `<span class="text-blue-600 dark:text-blue-400">Updated ${response._resubmitCount}×</span>` : ''}
                                ${response.displayName || response.email ? `<span>${escapeHtml(response.displayName || '')}${response.displayName && response.email ? ' · ' : ''}${escapeHtml(response.email || '')}</span>` : ''}
                            </div>
                            <div class="p-6 max-h-[65vh] overflow-y-auto">
                                ${surveyAnswersListHtml(response, { skipEmpty: false })}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            showModal(modalHTML);
        };

        const siteDetailField = (label, valueHtml) => {
            if (!valueHtml) return '';
            return `
                <div>
                    <dt class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(label)}</dt>
                    <dd class="text-sm text-gray-900 dark:text-gray-100 mt-0.5">${valueHtml}</dd>
                </div>
            `;
        };

        const formatSiteAddressHtml = (site) => {
            const lines = [
                site.address1,
                site.address2,
                [site.city, site.state, site.zipCode || site.zip].filter(Boolean).join(', '),
                site.country
            ].filter(line => line && String(line).trim());
            if (lines.length === 0) return '';
            return lines.map(line => escapeHtml(line)).join('<br>');
        };

        const formatSiteMailingAddressHtml = (site) => {
            const lines = [
                site.mailingAddress1,
                site.mailingAddress2,
                [site.mailingCity, site.mailingState, site.mailingZipCode].filter(Boolean).join(', '),
                site.mailingCountry
            ].filter(line => line && String(line).trim());
            if (lines.length === 0) return '';
            return lines.map(line => escapeHtml(line)).join('<br>');
        };

        const formatSiteCoordinatorHtml = (name, email) => {
            if (!name && !email) return '';
            if (name && email) {
                return `${escapeHtml(name)} <span class="text-gray-500 dark:text-gray-400">(${escapeHtml(email)})</span>`;
            }
            return escapeHtml(name || email);
        };

        const getSiteInvestigatorPairs = (site) => ([
            [site?.pi, site?.piEmail],
            [site?.pi2Name, site?.pi2Email],
            [site?.pi3Name, site?.pi3Email],
        ]);

        const formatSiteInvestigatorsSummary = (site) => {
            const names = getSiteInvestigatorPairs(site)
                .map(([name]) => name)
                .filter(name => name && String(name).trim());
            return names.length ? names.join(', ') : 'N/A';
        };

        const createSiteDetailsModal = (siteId, { initialTab = 'overview' } = {}) => {
            const site = (allSites || []).find(s => s && s.id === siteId);
            if (!site) return;

            const legacyStats = getArtemisSiteLegacyStats(siteId);

            const addressHtml = formatSiteAddressHtml(site);
            const mailingAddressHtml = formatSiteMailingAddressHtml(site);
            const studiesAtSite = (allStudies || []).filter(st => (st.siteIds || []).includes(site.id));
            const sitePatients = (allPatients || []).filter(p => {
                const currentEnrollment = p.enrollments?.find(e => e.status === 'current');
                return currentEnrollment?.siteId === site.id;
            });
            const enrolledCount = sitePatients.filter(p => p.status && p.status.toLowerCase() === 'enrolled').length;
            const screenFailedCount = sitePatients.filter(p => p.status && p.status.toLowerCase() === 'screen fail').length;
            const totalScreened = enrolledCount + screenFailedCount;
            const screenFailRate = totalScreened > 0 ? Math.round((screenFailedCount / totalScreened) * 100) : 0;
            const indicationBadges = ensureArray(site.indication).map(ind =>
                `<span class="inline-block text-xs bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-200 px-2 py-0.5 rounded-full mr-1 mb-1">${escapeHtml(ind)}</span>`
            ).join('');
            const studyListHtml = studiesAtSite.length
                ? studiesAtSite.map(st => escapeHtml(st.title || st.id)).join(', ')
                : '';

            const siteAssignments = (allSiteSurveyAssignments || []).filter(a => a && a.siteId === siteId);
            const responses = (allSiteSurveyResponses || [])
                .filter(r => r && r.siteId === siteId && !r._archived)
                .slice()
                .sort((a, b) => String(b.submittedAt || b.createdAt || '').localeCompare(String(a.submittedAt || a.createdAt || '')));
            const latestBySurvey = latestSurveyResponsesBySurvey(siteId);
            const surveyAnswerTotal = latestBySurvey.reduce((n, r) => n + surveyAnswerCount(r), 0);
            const scoredResponses = latestBySurvey.filter(r => r.score && typeof r.score.pct === 'number');
            const avgScore = scoredResponses.length
                ? Math.round(scoredResponses.reduce((s, r) => s + r.score.pct, 0) / scoredResponses.length)
                : null;

            const statusBadgeCls = String(site.status || '').toLowerCase() === 'active'
                ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200'
                : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300';

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content site-modal-content dark:bg-gray-800 overflow-hidden">
                        <!-- Header -->
                        <div class="bg-gradient-to-br from-slate-50 to-indigo-50/80 dark:from-gray-900 dark:to-indigo-950/40 px-6 pt-6 pb-4 border-b border-gray-200 dark:border-gray-700">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap mb-1">
                                        <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100 truncate">${escapeHtml(site.name || site.id)}</h2>
                                        <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold ${statusBadgeCls}">${escapeHtml(site.status || 'N/A')}</span>
                                        ${site.siteNameAbbreviation ? `<span class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(site.siteNameAbbreviation)}</span>` : ''}
                                    </div>
                                    ${indicationBadges ? `<div class="mt-1">${indicationBadges}</div>` : ''}
                                </div>
                                <div class="flex gap-2 shrink-0">
                                    <button type="button" class="send-site-survey-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700 shadow-sm" data-site-id="${escapeHtml(site.id)}">Send survey</button>
                                    <button type="button" data-action="edit-site" data-id="${escapeHtml(site.id)}" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 text-sm hover:bg-white dark:hover:bg-gray-700">Edit</button>
                                    <button type="button" data-action="cancel" class="px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm">Close</button>
                                </div>
                            </div>
                            <!-- Tabs -->
                            <div class="flex gap-1 mt-4">
                                <button type="button" class="site-tab-btn" data-site-tab="overview">Overview</button>
                                <button type="button" class="site-tab-btn" data-site-tab="surveys">
                                    Surveys
                                    ${latestBySurvey.length ? `<span class="ml-1 inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 rounded-full bg-indigo-600 text-white text-[10px] font-bold">${latestBySurvey.length}</span>` : ''}
                                </button>
                            </div>
                        </div>

                        <div class="p-6 max-h-[70vh] overflow-y-auto">
                            <!-- Overview panel -->
                            <div data-site-panel="overview" class="space-y-5">
                                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                                    <div class="survey-summary-chip"><div class="label">Active studies</div><div class="value">${studiesAtSite.length}</div></div>
                                    <div class="survey-summary-chip border-violet-200 dark:border-violet-900/40"><div class="label">Past studies</div><div class="value text-violet-700 dark:text-violet-300">${legacyStats?.nStudies ?? '—'}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Total (active + past)</div><div class="value">${studiesAtSite.length + (legacyStats?.nStudies || 0)}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Enrolled (live)</div><div class="value">${enrolledCount}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Legacy enrolled</div><div class="value">${legacyStats?.enrolled ? Number(legacyStats.enrolled).toLocaleString() : '—'}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Surveys</div><div class="value">${latestBySurvey.length}</div></div>
                                </div>
                                ${legacySiteHistoryHtml(siteId)}
                                <div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden">
                                    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 text-sm font-semibold text-gray-700 dark:text-gray-200">Site information</div>
                                    <dl class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
                                        ${siteDetailField('Site address', addressHtml)}
                                        ${siteDetailField('Mailing address', mailingAddressHtml)}
                                        ${siteDetailField('Investigator 1', formatSiteCoordinatorHtml(site.pi, site.piEmail))}
                                        ${siteDetailField('Investigator 2', formatSiteCoordinatorHtml(site.pi2Name, site.pi2Email))}
                                        ${siteDetailField('Investigator 3', formatSiteCoordinatorHtml(site.pi3Name, site.pi3Email))}
                                        ${siteDetailField('Primary site coordinator', formatSiteCoordinatorHtml(site.siteCoordinator, site.siteCoordinatorEmail))}
                                        ${siteDetailField('Optional coordinator 2', formatSiteCoordinatorHtml(site.siteCoordinator2Name, site.siteCoordinator2Email))}
                                        ${siteDetailField('Optional coordinator 3', formatSiteCoordinatorHtml(site.siteCoordinator3Name, site.siteCoordinator3Email))}
                                        ${siteDetailField('Studies', studyListHtml)}
                                    </dl>
                                </div>
                            </div>

                            <!-- Surveys panel -->
                            <div data-site-panel="surveys" class="hidden space-y-4">
                                ${latestBySurvey.length || siteAssignments.length ? `
                                <div class="survey-summary-strip">
                                    <div class="survey-summary-chip"><div class="label">Completed</div><div class="value">${latestBySurvey.length}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Pending links</div><div class="value">${siteAssignments.filter(a => String(a.status || '').toLowerCase() !== 'submitted').length}</div></div>
                                    <div class="survey-summary-chip"><div class="label">Total answers</div><div class="value">${surveyAnswerTotal}</div></div>
                                    ${avgScore != null ? `<div class="survey-summary-chip"><div class="label">Avg score</div><div class="value text-indigo-600 dark:text-indigo-400">${avgScore}%</div></div>` : ''}
                                </div>` : ''}
                                ${siteSurveySectionsHtml(siteId)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            showModal(modalHTML);
            wireSiteDetailsModalUI(siteId, { initialTab });
        };

        const getStaffHTML = () => {
            return `
                <div class="px-4 py-6 sm:px-0 space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-200">PI / Coordinators</h2>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Separate staff records linked to sites (studies derived via site participation).</p>
                        </div>
                        <div class="flex gap-2 flex-wrap justify-end">
                            <select id="staff-role-filter" class="rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm">
                                <option value="all">All</option>
                                <option value="pi">PI</option>
                                <option value="coordinator">Coordinator</option>
                            </select>
                            <input id="staff-search" type="text" placeholder="Search name/email/site/study…" class="w-full sm:w-72 rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm" />
                            <button id="add-staff-btn" class="inline-flex items-center px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 text-sm font-medium">
                                Add PI/Coordinator
                            </button>
                        </div>
                    </div>

                    <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-hidden">
                        <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 font-semibold">Staff (${allSiteStaff.length})</div>
                        <div class="p-4">
                            <div id="staff-list" class="space-y-2"></div>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderStaff = () => {
            const listEl = document.getElementById('staff-list');
            const roleEl = document.getElementById('staff-role-filter');
            const searchEl = document.getElementById('staff-search');
            if (!listEl) return;

            const role = String(roleEl?.value || 'all').toLowerCase();
            const term = String(searchEl?.value || '').trim().toLowerCase();

            const items = (allSiteStaff || [])
                .filter(s => s && s.siteId && s.role)
                .filter(s => role === 'all' ? true : String(s.role).toLowerCase() === role)
                .map(s => {
                    const site = allSites.find(x => x.id === s.siteId);
                    const siteName = site?.name || s.siteId;
                    const studies = allStudies
                        .filter(st => (st.siteIds || []).includes(s.siteId))
                        .map(st => st.title)
                        .filter(Boolean);
                    const assignments = (allSiteSurveyAssignments || [])
                        .filter(a => a && a.siteId === s.siteId)
                        .filter(a => {
                            const r = String(s.role || '').toLowerCase();
                            const tr = String(a.targetRole || '').toLowerCase();
                            return !tr ? true : tr === r;
                        })
                        .slice()
                        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
                    return { ...s, siteName, studies, assignments };
                })
                .filter(s => {
                    if (!term) return true;
                    const assignmentHay = (s.assignments || []).map(a => `${a.id || ''} ${a.status || ''} ${a.surveyId || ''}`).join(' ');
                    const hay = `${s.name || ''} ${s.email || ''} ${s.siteName || ''} ${(s.studies || []).join(' ')} ${assignmentHay}`.toLowerCase();
                    return hay.includes(term);
                })
                .sort((a, b) =>
                    String(a.siteName || '').localeCompare(String(b.siteName || '')) ||
                    String(a.role || '').localeCompare(String(b.role || '')) ||
                    String(a.name || '').localeCompare(String(b.name || ''))
                );

            listEl.innerHTML = items.length === 0
                ? `<div class="text-sm text-gray-500 dark:text-gray-400">No staff found.</div>`
                : items.map(s => `
                    <div class="p-3 rounded-md border border-gray-200 dark:border-gray-700">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <div class="font-semibold text-gray-900 dark:text-gray-100">${escapeHtml(s.name || '(no name)')}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(String(s.role || '').toUpperCase())}${s.email ? ` • ${escapeHtml(s.email)}` : ''}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Site: ${escapeHtml(s.siteName)}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">Studies: ${(s.studies || []).length ? escapeHtml((s.studies || []).slice(0, 4).join(', ')) + ((s.studies || []).length > 4 ? '…' : '') : '—'}</div>
                                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                                    Surveys:
                                    ${(s.assignments || []).length
                                        ? (s.assignments || []).slice(0, 4).map(a => {
                                            const url = `${window.location.origin}/site-survey.html?assignmentId=${encodeURIComponent(a.id)}`;
                                            const label = `${a.status || 'sent'} • ${String(a.createdAt || '').slice(0, 10) || 'date'} • ${String(a.surveyId || '').slice(0, 8)}`;
                                            return `<a class="text-blue-600 dark:text-blue-400 underline mr-2" href="${url}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a>`;
                                        }).join(' ')
                                        : '—'}
                                </div>
                            </div>
                            <div class="flex flex-col items-end gap-2 shrink-0">
                                <button type="button" class="edit-staff-btn px-3 py-1.5 rounded-md bg-gray-100 dark:bg-gray-700 text-sm" data-staff-id="${escapeHtml(s.id)}">Edit</button>
                                <div class="text-xs text-gray-400">ID: ${escapeHtml(s.id || '')}</div>
                            </div>
                        </div>
                    </div>
                `).join('');

            if (roleEl && !roleEl.dataset.bound) {
                roleEl.dataset.bound = '1';
                roleEl.addEventListener('change', () => renderStaff());
            }
            if (searchEl && !searchEl.dataset.bound) {
                searchEl.dataset.bound = '1';
                searchEl.addEventListener('input', () => renderStaff());
            }
        };

        const stripStaffLinkFromSite = (site, staffId, role) => {
            if (!site || !staffId) return site;
            const s = { ...site };
            const r = String(role || '').toLowerCase();
            if (r === 'pi' && s.piStaffId === staffId) {
                delete s.piStaffId;
                s.pi = '';
                s.piEmail = '';
            }
            if (r === 'coordinator' && s.coordinatorStaffId === staffId) {
                delete s.coordinatorStaffId;
                s.siteCoordinator = '';
                s.siteCoordinatorEmail = '';
            }
            return s;
        };

        const assignStaffToSiteRecord = (site, staff) => {
            if (!site || !staff?.id) return site;
            const s = { ...site };
            const r = String(staff.role || '').toLowerCase();
            if (r === 'pi') {
                s.piStaffId = staff.id;
                s.pi = staff.name || '';
                s.piEmail = staff.email || '';
            } else if (r === 'coordinator') {
                s.coordinatorStaffId = staff.id;
                s.siteCoordinator = staff.name || '';
                s.siteCoordinatorEmail = staff.email || '';
            }
            return s;
        };

        const createStaffModal = (existingStaff = null) => {
            const isEdit = !!(existingStaff && existingStaff.id);
            const sites = (allSites || []).slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            const r = String(existingStaff?.role || 'pi').toLowerCase();
            const rolePiSel = r === 'pi' ? 'selected' : '';
            const roleCoordSel = r === 'coordinator' ? 'selected' : '';
            const nameVal = isEdit ? escapeHtml(existingStaff.name || '') : '';
            const emailVal = isEdit ? escapeHtml(existingStaff.email || '') : '';

            const modalHTML = `
                <div class="modal-backdrop">
                    <div class="modal-content import-modal-content dark:bg-gray-800">
                        <form id="staff-form" ${isEdit ? `data-edit-id="${escapeHtml(existingStaff.id)}"` : ''}>
                            <div class="p-6 space-y-4">
                                <div>
                                    <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">${isEdit ? 'Edit PI / Coordinator' : 'Add PI / Coordinator'}</h2>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${isEdit ? 'Update the staff record and site assignment.' : 'Create a staff record and assign it to a site.'}</p>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Site</label>
                                        <select name="siteId" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                                            <option value="">Select…</option>
                                            ${sites.map(s => `<option value="${escapeHtml(s.id)}" ${isEdit && s.id === existingStaff.siteId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Role</label>
                                        <select name="role" required class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2">
                                            <option value="pi" ${rolePiSel}>PI</option>
                                            <option value="coordinator" ${roleCoordSel}>Coordinator</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                                        <input name="email" type="email" value="${emailVal}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Name</label>
                                        <input name="name" required value="${nameVal}" class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2" />
                                    </div>
                                </div>
                                <div id="staff-form-error" class="text-sm text-red-600 dark:text-red-300 hidden"></div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-700 px-4 py-3 sm:px-6 flex flex-row-reverse gap-2">
                                <button type="submit" class="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 sm:w-auto sm:text-sm">${isEdit ? 'Save' : 'Create & Assign'}</button>
                                <button type="button" data-action="cancel" class="inline-flex justify-center rounded-md border border-gray-300 dark:border-gray-500 shadow-sm px-4 py-2 bg-white dark:bg-gray-800 text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 sm:w-auto sm:text-sm">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            showModal(modalHTML);
        };

        const getCommunicationsHTML = () => {
            const definitionsCount = asSurveyList(allSiteSurveyDefinitions).length;
            const assignmentsCount = asSurveyList(allSiteSurveyAssignments).length;
            const responsesCount = asSurveyList(allSiteSurveyResponses).length;

            const filterSiteName = commsSiteFilterId
                ? ((allSites || []).find(s => s.id === commsSiteFilterId)?.name || commsSiteFilterId)
                : '';
            return `
                <div class="px-4 py-6 sm:px-0 space-y-6">
                    <div id="comms-site-filter-banner" class="${commsSiteFilterId ? '' : 'hidden'} mb-4 flex flex-wrap items-center justify-between gap-2 p-3 rounded-lg border border-indigo-200 dark:border-indigo-800 bg-indigo-50 dark:bg-indigo-900/20">
                        <span class="text-sm text-indigo-900 dark:text-indigo-100">Showing surveys for <strong>${escapeHtml(filterSiteName)}</strong></span>
                        <button type="button" id="clear-comms-site-filter-btn" class="px-3 py-1.5 rounded-md bg-white dark:bg-gray-800 border border-indigo-300 dark:border-indigo-600 text-sm text-indigo-800 dark:text-indigo-200">Show all sites</button>
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 dark:text-gray-200">Communications</h2>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage site surveys (PI / Coordinator) and track responses.</p>
                        </div>
                        <div class="flex gap-2">
                            <button id="new-site-survey-btn" class="inline-flex items-center px-4 py-2 rounded-md bg-indigo-600 text-white hover:bg-indigo-700 text-sm font-medium">
                                New Site Survey
                            </button>
                            <button id="new-site-survey-assignment-btn" class="inline-flex items-center px-4 py-2 rounded-md bg-gray-700 text-white hover:bg-gray-800 text-sm font-medium">
                                Send Survey
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">

            ];

            const getTimeOffRangeBounds = (range, customStart, customEnd) => {
                const now = new Date();
                const startOfCurrentMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                let startDate = new Date(startOfCurrentMonth);
                let endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);

                switch ((range || '').toString()) {
                    case '3months': {
                        endDate = new Date(startDate.getFullYear(), startDate.getMonth() + 3, 0);
                        break;
                    }
                    case '6months': {
                        endDate = new Date(startDate.getFullYear(), startDate.getMonth() + 6, 0);
                        break;
                    }
                    case 'year': {
                        startDate = new Date(now.getFullYear(), 0, 1);
                        endDate = new Date(now.getFullYear(), 12, 0);
                        break;
                    }
                    case 'custom': {
                        const parsedStart = parseDateFlexible(customStart);
                        const parsedEnd = parseDateFlexible(customEnd);
                        if (parsedStart && parsedEnd && parsedStart <= parsedEnd) {
                            startDate = new Date(parsedStart.getFullYear(), parsedStart.getMonth(), parsedStart.getDate());
                            endDate = new Date(parsedEnd.getFullYear(), parsedEnd.getMonth(), parsedEnd.getDate());
                        }
                        break;
                    }
                    case 'month':
                    default: {
                        // Defaults already set
                        break;
                    }
                }

                // Ensure endDate is at least startDate
                if (endDate < startDate) {
                    endDate = new Date(startDate);
                }

                return {
                    startDate,
                    endDate,
                    startDateStr: toDateOnlyString(startDate),
                    endDateStr: toDateOnlyString(endDate)
                };
            };

            const getHoursForPeriod = (period) => {
                const value = (period || '').toLowerCase();
                if (!value || value === 'full day') return 8;
                if (['am', 'pm', 'before 2pm', 'half day'].includes(value)) return 4;
                if (value.includes('-')) {
                    // Custom time like "9:00 AM - 3:00 PM"
                    try {
                        const [startRaw, endRaw] = value.split('-').map(v => v.trim());
                        const toMinutes = (timeStr) => {
                            const match = timeStr.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)?/i);
                            if (!match) return null;
                            let hour = parseInt(match[1], 10);
                            const minute = match[2] ? parseInt(match[2], 10) : 0;
                            const ampm = match[3] ? match[3].toLowerCase() : null;
                            if (ampm === 'pm' && hour < 12) hour += 12;
                            if (ampm === 'am' && hour === 12) hour = 0;
                            return (hour * 60) + minute;
                        };
                        const startMinutes = toMinutes(startRaw);
                        const endMinutes = toMinutes(endRaw);
                        if (startMinutes !== null && endMinutes !== null && endMinutes > startMinutes) {
                            const diffHours = (endMinutes - startMinutes) / 60;
                            return Math.max(1, Math.min(diffHours, 12));
                        }
                    } catch (err) {
                        console.warn('Failed to parse custom period for hours:', period, err);
                    }
                }
                return 8;
            };

            const getTimeOffRequestRange = (request) => {
                if (!request) return null;
                const startDate = parseDateFlexible(request.startDate || request.date);
                const endDate = parseDateFlexible(request.endDate || request.date || request.startDate);
                if (!startDate && !endDate) return null;

                const start = startDate
                    ? new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate())
                    : null;
                const endSource = endDate || startDate;
                const end = endSource
                    ? new Date(endSource.getFullYear(), endSource.getMonth(), endSource.getDate())
                    : null;

                if (!start && !end) return null;
                if (!start) return { start: new Date(end), end: new Date(end) };
                if (!end) return { start: new Date(start), end: new Date(start) };

                if (end < start) {
                    return { start: new Date(end), end: new Date(start) };
                }

                return { start, end };
            };

            const doesTimeOffRequestIntersectRange = (request, rangeStart, rangeEnd) => {
                if (!rangeStart && !rangeEnd) return true;
                const span = getTimeOffRequestRange(request);
                if (!span) return false;
                const start = rangeStart ? new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate()) : null;
                const end = rangeEnd ? new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), rangeEnd.getDate()) : null;
                const rangeEndTime = end ? end.getTime() : Number.POSITIVE_INFINITY;
                const rangeStartTime = start ? start.getTime() : Number.NEGATIVE_INFINITY;
                return span.start.getTime() <= rangeEndTime && span.end.getTime() >= rangeStartTime;
            };

            const getDailyEntriesForTimeOffRequest = (request, rangeStart, rangeEnd) => {
                const span = getTimeOffRequestRange(request);
                if (!span) return [];

                const startBoundary = rangeStart
                    ? new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate())
                    : null;
                const endBoundary = rangeEnd
                    ? new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), rangeEnd.getDate())
                    : null;

                const normalizedHoursSource = Number.isFinite(request?.hours) ? Number(request.hours) : getHoursForPeriod(request?.period);
                const normalizedHours = Number.isFinite(normalizedHoursSource) && normalizedHoursSource > 0
                    ? normalizedHoursSource
                    : 8;

                const entries = [];
                const cursor = new Date(span.start);
                const limit = new Date(span.end);
                while (cursor <= limit) {
                    const withinLower = !startBoundary || cursor.getTime() >= startBoundary.getTime();
                    const withinUpper = !endBoundary || cursor.getTime() <= endBoundary.getTime();
                    if (withinLower && withinUpper) {
                        const dateStr = toDateOnlyString(cursor);
                        entries.push({
                            date: new Date(cursor.getTime()),
                            dateStr,
                            status: normalizeTimeOffStatus(request?.status),
                            statusLabel: formatTimeOffStatus(request?.status),
                            period: request?.period || 'Full Day',
                            hours: normalizedHours,
                            type: request?.type || request?.category || 'Time Off',
                            requestId: request?.id || '',
                            crcId: request?.crcId,
                            payload: request
                        });
                    }
                    cursor.setDate(cursor.getDate() + 1);
                }

                return entries;
            };

            const getMonthKey = (dateObj) => {
                if (!(dateObj instanceof Date)) return '';
                return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
            };

            const getMonthLabel = (monthKey) => {
                if (!monthKey) return '';
                const [year, month] = monthKey.split('-').map(num => parseInt(num, 10));
                if (!year || !month) return monthKey;
                const date = new Date(year, month - 1, 1);
                return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            };

            const formatHours = (hours) => {
                const value = Number(hours) || 0;
                return value % 1 === 0 ? value.toString() : value.toFixed(1);
            };

            const formatDays = (days) => {
                const value = Number(days) || 0;
                return value % 1 === 0 ? value.toString() : value.toFixed(2);
            };

            const calculateTimeOffSummary = (range, customStart, customEnd) => {
                const { startDate, endDate } = getTimeOffRangeBounds(range, customStart, customEnd);
                const startTime = startDate.getTime();
                const endTime = endDate.getTime();

                const requests = Array.isArray(state.timeOffRequests) ? state.timeOffRequests : [];
                const summaries = new Map();
                const monthKeysSet = new Set();

                requests.forEach(request => {
                    if (!request) return;
                    const crcId = request.crcId;
                    if (!crcId) return;

                    const status = normalizeTimeOffStatus(request.status);
                    const start = parseDateFlexible(request.startDate || request.date);
                    const end = parseDateFlexible(request.endDate || request.date || request.startDate);
                    if (!start || !end) return;

                    const cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
                    const limit = new Date(end.getFullYear(), end.getMonth(), end.getDate());
                    while (cursor <= limit) {
                        const time = cursor.getTime();
                        if (time >= startTime && time <= endTime) {
                            const dateStr = toDateOnlyString(cursor);
                            const monthKey = getMonthKey(cursor);
                            monthKeysSet.add(monthKey);

                            const hours = Number.isFinite(request.hours) ? Number(request.hours) : getHoursForPeriod(request.period);
                            const normalizedHours = Number.isFinite(hours) && hours > 0 ? hours : 8;
                            const dayFraction = Math.max(0.125, normalizedHours / 8);

                            if (!summaries.has(crcId)) {
                                const crc = state.crcs.find(c => c.id === crcId);
                                summaries.set(crcId, {
                                    crcId,
                                    crcName: crc ? crc.name : `CRC ${crcId}`,
                                    pendingHours: 0,
                                    approvedHours: 0,
                                    rejectedHours: 0,
                                    pendingDays: 0,
                                    approvedDays: 0,
                                    rejectedDays: 0,
                                    months: {}
                                });
                            }

                            const summary = summaries.get(crcId);
                            if (!summary.months[monthKey]) {
                                summary.months[monthKey] = {
                                    pendingHours: 0,
                                    approvedHours: 0,
                                    rejectedHours: 0,
                                    pendingDays: 0,
                                    approvedDays: 0,
                                    rejectedDays: 0
                                };
                            }

                            if (status === 'pending') {
                                summary.pendingHours += normalizedHours;
                                summary.pendingDays += dayFraction;
                                summary.months[monthKey].pendingHours += normalizedHours;
                                summary.months[monthKey].pendingDays += dayFraction;
                            } else if (status === 'approved') {
                                summary.approvedHours += normalizedHours;
                                summary.approvedDays += dayFraction;
                                summary.months[monthKey].approvedHours += normalizedHours;
                                summary.months[monthKey].approvedDays += dayFraction;
                            } else if (status === 'rejected') {
                                summary.rejectedHours += normalizedHours;
                                summary.rejectedDays += dayFraction;
                                summary.months[monthKey].rejectedHours += normalizedHours;
                                summary.months[monthKey].rejectedDays += dayFraction;
                            }
                        }
                        cursor.setDate(cursor.getDate() + 1);
                    }
                });

                const sortedMonthKeys = Array.from(monthKeysSet).sort();

                return {
                    summaries,
                    monthKeys: sortedMonthKeys,
                    startDate,
                    endDate
                };
            };

            const TRAINING_ROLE_NAME = 'Training';
            const TRAINING_ROLE_ID = 'training-role';
            const TRAINING_ROLE_KEY = TRAINING_ROLE_NAME.toLowerCase();
            const isTrainingRoleName = (name) => (name || '').trim().toLowerCase() === TRAINING_ROLE_KEY;
            
            const ensureTrainingRole = (rolesArray = []) => {
                if (!rolesArray.some(role => isTrainingRoleName(role?.name))) {
                    rolesArray.push({ id: TRAINING_ROLE_ID, name: TRAINING_ROLE_NAME, trainingNames: [] });
                }
                return rolesArray;
            };
            
            const incrementSequentialLabel = (value, defaultPrefix = '') => {
                if (!value || typeof value !== 'string') {
                    return '';
                }
                const trimmed = value.trim();
                if (trimmed.length === 0) return '';
                const match = trimmed.match(/^([A-Za-z]*)(\d+)$/);
                if (match) {
                    const prefix = match[1] || defaultPrefix;
                    const number = parseInt(match[2], 10);
                    if (Number.isFinite(number)) {
                        return `${prefix}${number + 1}`;
                    }
                }
                const numeric = parseInt(trimmed, 10);
                if (Number.isFinite(numeric)) {
                    return String(numeric + 1);
                }
                return trimmed;
            };
            
            const suggestNextGroupNumber = (currentValue) => {
                if (!currentValue) return '';
                return incrementSequentialLabel(currentValue, 'G');
            };
            
            const suggestNextVisitNumber = (currentValue) => {
                if (!currentValue) return '';
                return incrementSequentialLabel(currentValue, 'V');
            };
            
            // Role order matching Excel template
            const ROLE_ORDER = [
                'ICF', 'ICF/medHx', 'Medhx Update', 'Medhx', 'EyeCup', 'CAE', 'Schirmers', 'Doc Tech', 'Dispense', 
                'Tear Collection', 'Skin Test', 'Allergy Doc Tech', 'CAC (Timed)', 
                'CAC (Titration)', 'Allergen', 'QC', 'SV', 'oversight', 'Travel'
            ];
            
            const getRoleSortOrder = (roleName) => {
                if (!roleName) return 9999;
                const index = ROLE_ORDER.findIndex(r => r.toLowerCase() === roleName.toLowerCase());
                return index >= 0 ? index : 9999;
            };
            
            const sortRolesByExcelOrder = (roles) => {
                return [...roles].sort((a, b) => {
                    const aName = typeof a === 'string' ? a : (a?.name || '');
                    const bName = typeof b === 'string' ? b : (b?.name || '');
                    const aOrder = getRoleSortOrder(aName);
                    const bOrder = getRoleSortOrder(bName);
                    if (aOrder !== bOrder) return aOrder - bOrder;
                    return aName.localeCompare(bName);
                });
            };
            
            const getAllRoles = (events, rolesFromDB) => {
                const rolesFromState = (rolesFromDB || []).map(r => r?.name).filter(Boolean);
                const rolesFromEvents = new Set();
                (events || []).forEach(event => {
                    if (Array.isArray(event.roles)) {
                        event.roles.filter(Boolean).forEach(role => rolesFromEvents.add(role));
                    }
                    if (event.roleAssignments && typeof event.roleAssignments === 'object') {
                        Object.keys(event.roleAssignments).forEach(roleId => {
                            const matchingRole = rolesFromDB.find(r => r.id === roleId);
                            if (matchingRole?.name) {
                                rolesFromEvents.add(matchingRole.name);
                            }
                        });
                    }
                });
                const combinedRoles = new Set([...rolesFromState, ...rolesFromEvents]);
                combinedRoles.add(TRAINING_ROLE_NAME);
                return sortRolesByExcelOrder(Array.from(combinedRoles).filter(Boolean));
            };
            
            /**
             * Determines if text on a given hex color background should be black or white.
             * @param {string} hexColor - The background color in hex format (e.g., '#RRGGBB').
             * @returns {string} - '#000000' for black or '#FFFFFF' for white.
             */
            const getContrastColor = (hexColor) => {
                if (!hexColor || hexColor.length < 7) return '#000000';
                try {
                    const r = parseInt(hexColor.substr(1, 2), 16);
                    const g = parseInt(hexColor.substr(3, 2), 16);
                    const b = parseInt(hexColor.substr(5, 2), 16);
                    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                    return (yiq >= 128) ? '#000000' : '#FFFFFF';
                } catch (e) {
                    return '#000000';
                }
            };

            const getTrainingNamesForRole = (roleName) => {
                if (!roleName) return [];
                const role = (state.roles || []).find(r => (r?.name || '').trim().toLowerCase() === roleName.trim().toLowerCase());
                if (role && Array.isArray(role.trainingNames) && role.trainingNames.length > 0) {
                    return role.trainingNames
                        .filter(Boolean)
                        .map(n => n.trim())
                        .filter(n => n.length > 0);
                }
                // If role has no trainingNames set, return empty array (no training required)
                return [];
            };
            
            // Find all roles that require a specific training
            const getRolesRequiringTraining = (trainingName) => {
                if (!trainingName) return [];
                const trainingLower = trainingName.trim().toLowerCase();
                return (state.roles || []).filter(role => {
                    if (!role || !Array.isArray(role.trainingNames)) return false;
                    return role.trainingNames.some(tn => 
                        tn && tn.trim().toLowerCase() === trainingLower
                    );
                });
            };
            
            // Get the last date a CRC was assigned to a role that requires a specific training
            const getLastPerformedDate = (crcId, trainingName) => {
                if (!crcId || !trainingName) return null;
                
                // Find all roles that require this training
                const rolesRequiringTraining = getRolesRequiringTraining(trainingName);
                if (rolesRequiringTraining.length === 0) return null;
                
                const roleIds = new Set(rolesRequiringTraining.map(r => r.id));
                const roleNames = new Set(rolesRequiringTraining.map(r => r.name.toLowerCase()));
                
                let lastDate = null;
                
                // Check all events for this CRC
                (state.crc_events || []).forEach(event => {
                    if (!event || event.type !== 'Site Assignment') return;
                    
                    // Check if this CRC is assigned to any role in this event
                    if (event.roleAssignments && typeof event.roleAssignments === 'object') {
                        Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                            // Check if this role requires the training
                            if (!roleIds.has(roleId)) return;
                            
                            // Check if this CRC is assigned to this role
                            if (!Array.isArray(assignments)) return;
                            const isCrcAssigned = assignments.some(assignedId => {
                                if (assignedId === crcId) return true;
                                // Also check by name in case of ID mismatch
                                const assignedCrc = state.crcs.find(c => c.id === assignedId);
                                return assignedCrc && assignedCrc.id === crcId;
                            });
                            
                            if (isCrcAssigned && event.date) {
                                const eventDate = new Date(event.date + 'T00:00:00');
                                if (!lastDate || eventDate > lastDate) {
                                    lastDate = eventDate;
                                }
                            }
                        });
                    }
                    
                    // Also check legacy roles array
                    if (event.crcId === crcId && Array.isArray(event.roles)) {
                        const hasRequiredRole = event.roles.some(roleName => 
                            roleNames.has(roleName.toLowerCase())
                        );
                        if (hasRequiredRole && event.date) {
                            const eventDate = new Date(event.date + 'T00:00:00');
                            if (!lastDate || eventDate > lastDate) {
                                lastDate = eventDate;
                            }
                        }
                    }
                });
                
                return lastDate;
            };

            const hasValidTraining = (crc, roleName) => {
                if (isTrainingRoleName(roleName)) return true;
                const requiredTrainingNames = getTrainingNamesForRole(roleName);
                // If no training is required for this role, all CRCs are eligible
                if (requiredTrainingNames.length === 0) return true;
                // If training is required but CRC has no trainings, they're not eligible
                if (!crc.trainings || !Array.isArray(crc.trainings)) return false;
                // Check if CRC has at least one valid (non-expired) required training
                const today = new Date();
                return crc.trainings.some(training => {
                    const isExpired = new Date(training.expirationDate) < today;
                    return !isExpired && requiredTrainingNames.some(req => (training.name || '').trim().toLowerCase() === req.trim().toLowerCase());
                });
            };

            const getUnavailabilityPeriod = (crcId, date) => {
                if (!crcId || !date) return null;
                
                // Normalize the date parameter to YYYY-MM-DD format for comparison
                const normalizedDate = toDateOnlyString(parseDateFlexible(date));
                if (!normalizedDate) return null;
                
                // Get approved time off request IDs
                const approvedRequestIds = new Set(
                    state.timeOffRequests
                        .filter(req => {
                            const normalizedStatus = normalizeTimeOffStatus(req.status);
                            return normalizedStatus === 'approved';
                        })
                        .map(req => req.id)
                );
                
                // Check for Paid Time Off / Time Off events (generated by approved requests or manually created)
                const ptoEv = (state.crc_events || []).find(e => {
                    const eventDate = toDateOnlyString(parseDateFlexible(e.date));
                    return e.crcId === crcId && 
                           (e.type === 'Paid Time Off' || e.type === 'Time Off') && 
                           eventDate === normalizedDate &&
                           (!e.timeOffRequestId || approvedRequestIds.has(e.timeOffRequestId));
                });
                if (ptoEv) return ptoEv.period || 'Full Day';
                
                // Check for approved time off requests
                const approvedTimeOffRequest = state.timeOffRequests.find(req => {
                    if (req.crcId !== crcId) return false;
                    const normalizedStatus = normalizeTimeOffStatus(req.status);
                    if (normalizedStatus !== 'approved') return false;
                    
                    // Normalize request dates
                    const reqStart = toDateOnlyString(parseDateFlexible(req.startDate || req.date));
                    const reqEnd = toDateOnlyString(parseDateFlexible(req.endDate || req.date || req.startDate));
                    
                    if (!reqStart) return false;
                    
                    // Check if normalized date falls within the request range
                    if (normalizedDate === reqStart) return true;
                    if (reqEnd && normalizedDate >= reqStart && normalizedDate <= reqEnd) return true;
                    return false;
                });
                
                if (approvedTimeOffRequest) {
                    return approvedTimeOffRequest.period || 'Full Day';
                }
                
                return null;
            };

            const isCRCUnavailable = (crcId, date, period, excludeEventId = null, excludeGroupId = null) => {
                if (!crcId || !date) return false;
                
                // Normalize the date parameter to YYYY-MM-DD format for comparison
                const normalizedDate = toDateOnlyString(parseDateFlexible(date));
                if (!normalizedDate) return false;
                
                // Check for rejected time off requests - if rejected, they should be available
                const rejectedTimeOffRequest = state.timeOffRequests.find(req => {
                    if (req.crcId !== crcId) return false;
                    const normalizedStatus = normalizeTimeOffStatus(req.status);
                    if (normalizedStatus !== 'rejected') return false;
                    
                    // Normalize request dates
                    const reqStart = toDateOnlyString(parseDateFlexible(req.startDate || req.date));
                    const reqEnd = toDateOnlyString(parseDateFlexible(req.endDate || req.date || req.startDate));
                    
                    if (!reqStart) return false;
                    
                    // Check if normalized date falls within rejected request range
                    if (normalizedDate === reqStart) return true;
                    if (reqEnd && normalizedDate >= reqStart && normalizedDate <= reqEnd) return true;
                    return false;
                });
                
                // If there's a rejected time off request for this date, they are available
                if (rejectedTimeOffRequest) return false;
                
                // Check for ANY Site Assignment on this date (excluding the current event if editing)
                // Only consider valid Site Assignments (with CRC assigned or valid role assignments)
                const conflictingSiteAssignments = state.crc_events.filter(event => {
                    // Exclude the current event being edited
                    if (excludeEventId && event.id === excludeEventId) return false;
                    
                    // Also exclude all events in the same group (for multi-day shifts)
                    if (excludeGroupId && event.groupId && event.groupId === excludeGroupId) return false;
                    
                    // Must be a Site Assignment
                    if (event.type !== 'Site Assignment') return false;
                    
                    // Normalize event date for comparison
                    const eventDate = toDateOnlyString(parseDateFlexible(event.date));
                    if (!eventDate || eventDate !== normalizedDate) return false;
                    
                    // Ignore N/A entries - events with no CRC and no valid role assignments
                    const hasCrcId = event.crcId && event.crcId.trim() !== '';
                    const hasValidRoleAssignments = event.roleAssignments &&
                        Object.keys(event.roleAssignments).length > 0 &&
                        Object.values(event.roleAssignments).some(assignments =>
                            Array.isArray(assignments) && assignments.some(crcId => 
                                crcId && crcId.trim() !== '' && crcId !== 'UNASSIGNED' && crcId !== 'SITE_STAFF'
                            )
                        );
                    
                    // Skip N/A entries (no CRC and no valid role assignments)
                    if (!hasCrcId && !hasValidRoleAssignments) return false;
                    
                    // Check if this CRC is assigned to this event
                    if (event.crcId === crcId) return true;
                    
                    // Check roleAssignments
                    if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                        return Object.values(event.roleAssignments).some(assignments => {
                            if (Array.isArray(assignments)) {
                                return assignments.includes(crcId);
                            }
                            return false;
                        });
                    }
                    
                    return false;
                });
                
                // If there's a conflicting Site Assignment, they are unavailable
                if (conflictingSiteAssignments.length > 0) return true;
                
                // Get approved time off request IDs (using normalized status check)
                const approvedRequestIds = new Set(
                    state.timeOffRequests
                        .filter(req => {
                            const normalizedStatus = normalizeTimeOffStatus(req.status);
                            return normalizedStatus === 'approved';
                        })
                        .map(req => req.id)
                );
                
                // Check for approved time off requests (including multi-day ranges)
                // IMPORTANT: Only check approved requests, NOT pending or rejected
                const approvedTimeOffRequest = state.timeOffRequests.find(req => {
                    if (req.crcId !== crcId) return false;
                    // Only check approved requests - pending/rejected should not make them unavailable
                    const normalizedStatus = normalizeTimeOffStatus(req.status);
                    if (normalizedStatus !== 'approved') return false;
                    
                    // Normalize request dates
                    const reqStart = toDateOnlyString(parseDateFlexible(req.startDate || req.date));
                    const reqEnd = toDateOnlyString(parseDateFlexible(req.endDate || req.date || req.startDate));
                    
                    if (!reqStart) return false;
                    
                    // Check if normalized date falls within the request range
                    if (normalizedDate === reqStart) return true;
                    if (reqEnd && normalizedDate >= reqStart && normalizedDate <= reqEnd) return true;
                    return false;
                });
                
                // If there's an approved time off request, check if it covers this period
                if (approvedTimeOffRequest) {
                    const requestPeriod = approvedTimeOffRequest.period || 'Full Day';
                    // If period is 'Full Day', any approved request makes them unavailable
                    if (period === 'Full Day') return true;
                    // For specific periods, check if the request covers that period
                    if (requestPeriod === 'Full Day' || requestPeriod === period) return true;
                }
                
                // Check if CRC has any event rows on this date that would make them unavailable.
                // IMPORTANT: We no longer treat legacy `type === 'Unavailable'` events as blocking by themselves,
                // because they can be "invisible blockers". The source of truth is approved time off requests
                // (and the approved-event records those requests generate).
                
                const eventsOnDate = state.crc_events.filter(event => {
                    // Exclude the current event being edited
                    if (excludeEventId && event.id === excludeEventId) return false;
                    
                    // Normalize event date for comparison
                    const eventDate = toDateOnlyString(parseDateFlexible(event.date));
                    if (!eventDate || eventDate !== normalizedDate) return false;
                    
                    // Check if this is an unavailability event
                    if (event.crcId !== crcId) return false;
                    if (event.type !== 'Paid Time Off' && event.type !== 'Time Off') return false;
                    return true;
                });
                
                // If there's an approved time off request, check if it covers this period
                if (approvedTimeOffRequest) {
                    const requestPeriod = approvedTimeOffRequest.period || 'Full Day';
                    // If period is 'Full Day', any approved request makes them unavailable
                    if (period === 'Full Day') return true;
                    // For specific periods, check if the request covers that period
                    if (requestPeriod === 'Full Day' || requestPeriod === period) return true;
                }
                
                // If no approved time off request and no events, they are available
                if (eventsOnDate.length === 0) return false;
                
                // If period is 'Full Day', any unavailability makes them unavailable
                if (period === 'Full Day') return true;
                
                // For specific periods, check if the unavailability covers that period
                return eventsOnDate.some(event => 
                    !event.period || event.period === 'Full Day' || event.period === period
                );
            };
            
            // Helper function to get conflicting appointment info for display
            const getConflictingAppointmentInfo = (crcId, date, excludeEventId = null, excludeGroupId = null) => {
                const conflictingEvents = state.crc_events.filter(event => {
                    if (excludeEventId && event.id === excludeEventId) return false;
                    // Also exclude all events in the same group (for multi-day shifts)
                    if (excludeGroupId && event.groupId && event.groupId === excludeGroupId) return false;
                    if (event.type !== 'Site Assignment' || event.date !== date) return false;
                    
                    if (event.crcId === crcId) return true;
                    if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                        return Object.values(event.roleAssignments).some(assignments => {
                            if (Array.isArray(assignments)) {
                                return assignments.includes(crcId);
                            }
                            return false;
                        });
                    }
                    return false;
                });
                
                if (conflictingEvents.length === 0) return null;
                
                // Get info from first conflicting event
                const conflict = conflictingEvents[0];
                const site = state.crc_sites.find(s => s.id === conflict.siteId);
                const study = conflict.studyIds && conflict.studyIds.length > 0 
                    ? state.studies.find(s => s.id === conflict.studyIds[0])
                    : null;
                
                const siteName = site ? site.name : 'Unknown Site';
                const studyName = study ? (study.title || study.name) : 'Unknown Study';
                
                return {
                    site: siteName,
                    study: studyName,
                    event: conflict
                };
            };

            // Helper function to get training info for a CRC
            const getCRCInTrainingInfo = (crc) => {
                if (!crc || !crc.trainings) return [];
                const today = new Date();
                const thirtyDaysFromNow = new Date(today.getTime() + (30 * 24 * 60 * 60 * 1000));
                const trainingInfo = [];
                
                crc.trainings.forEach(training => {
                    const trainingType = state.training_types?.find(tt => tt.name === training.name);
                    const status = getTrainingStatus(training, trainingType, today, thirtyDaysFromNow);
                    
                    if (status === 'inTraining') {
                        const completionDate = training.completionDate ? new Date(training.completionDate).toLocaleDateString() : '';
                        const displayText = `In Training${completionDate ? ` (${completionDate})` : ''} - ${training.name}`;
                        trainingInfo.push(displayText);
                    }
                });
                
                return trainingInfo;
            };

            const getEventRoles = (event) => {
                if (!event) return [];
                const roleNames = new Set(); // Use Set to avoid duplicates
                
                // New role assignment system - show all roles with their assignments
                if (event.roleAssignments && typeof event.roleAssignments === 'object' && Object.keys(event.roleAssignments).length > 0) {
                    Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                        // Show roles that have at least one assignment (not empty arrays)
                        if (Array.isArray(assignments) && assignments.length > 0 && assignments.some(a => a && a.trim() !== '')) {
                            const role = (state.roles || []).find(r => r && r.id === roleId);
                            if (role && role.name) {
                                // Check if this is a training role and if there's a training assignment
                                if (isTrainingRoleName(role.name) && event.trainingAssignments && event.trainingAssignments[roleId]) {
                                    // For training roles, show "Training - RoleName"
                                    const trainingAssignments = event.trainingAssignments[roleId];
                                    if (Array.isArray(trainingAssignments) && trainingAssignments.length > 0) {
                                        // Get unique training role names
                                        const trainingRoleNames = [...new Set(trainingAssignments.filter(Boolean))];
                                        trainingRoleNames.forEach(trainingRoleName => {
                                            if (trainingRoleName && trainingRoleName.trim() !== '') {
                                                roleNames.add(`Training, ${trainingRoleName}`);
                                            }
                                        });
                                    } else {
                                        roleNames.add(role.name);
                                    }
                                } else {
                                    // For non-training roles, or if no training assignment, just show the role name
                                    roleNames.add(role.name);
                                }
                            }
                        }
                    });
                }
                
                // Also include required roles from study requirements (even if not assigned yet)
                if (event.studyIds && event.studyIds.length > 0 && event.siteId) {
                    const study = (state.studies || []).find(s => event.studyIds.includes(s.id));
                    if (study) {
                        // Check visit-specific requirements first
                        if (event.visitNumber && study.visitRoleRequirements) {
                            const visitKey = `visit-${event.visitNumber}`;
                            const visitReqs = study.visitRoleRequirements[visitKey] || study.visitRoleRequirements['default'];
                            if (visitReqs && typeof visitReqs === 'object') {
                                Object.keys(visitReqs).forEach(roleId => {
                                    const role = (state.roles || []).find(r => r && r.id === roleId);
                                    if (role && role.name) {
                                        roleNames.add(role.name);
                                    }
                                });
                            }
                        } else if (study.visitRoleRequirements && study.visitRoleRequirements['default']) {
                            // Use default visit requirements
                            Object.keys(study.visitRoleRequirements['default']).forEach(roleId => {
                                const role = (state.roles || []).find(r => r && r.id === roleId);
                                if (role && role.name) {
                                    roleNames.add(role.name);
                                }
                            });
                        } else if (study.siteRoleRequirements && study.siteRoleRequirements[event.siteId]) {
                            // Fallback to site-specific requirements
                            Object.keys(study.siteRoleRequirements[event.siteId]).forEach(roleId => {
                                const role = (state.roles || []).find(r => r && r.id === roleId);
                                if (role && role.name) {
                                    roleNames.add(role.name);
                                }
                            });
                        } else if (study.requiredRoles && Array.isArray(study.requiredRoles)) {
                            // Fallback to general required roles
                            study.requiredRoles.forEach(roleId => {
                                const role = (state.roles || []).find(r => r && r.id === roleId);
                                if (role && role.name) {
                                    roleNames.add(role.name);
                                }
                            });
                        }
                    }
                }
                
                // Legacy roles system - ensure we get role names properly
                if (roleNames.size === 0 && event.roles && Array.isArray(event.roles) && event.roles.length > 0) {
                    event.roles.forEach(role => {
                        if (role && typeof role === 'string' && role.trim() !== '') {
                            roleNames.add(role);
                        }
                    });
                }
                
                return Array.from(roleNames);
            };
            
            // Get ALL roles for an event, including empty ones (for planning grid display)
            const getAllEventRoles = (event) => {
                // For Travel Day events, only return training roles (e.g., "Training, ICF")
                if (event.type === 'Travel Day') {
                    const roleNames = [];
                    if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                        Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                            if (Array.isArray(assignments) && assignments.filter(Boolean).length > 0) {
                                const role = state.roles.find(r => r.id === roleId);
                                if (role && isTrainingRoleName(role.name)) {
                                    // For training roles, show "Training, [training type]"
                                    if (event.trainingAssignments && event.trainingAssignments[roleId]) {
                                        const trainingTypes = [...new Set(event.trainingAssignments[roleId].filter(Boolean))];
                                        trainingTypes.forEach(trainingType => {
                                            roleNames.push(`Training, ${trainingType}`);
                                        });
                                    } else {
                                        roleNames.push(role.name);
                                    }
                                }
                            }
                        });
                    }
                    return roleNames;
                }
                
                const roleNames = [];
                const roleCounts = new Map(); // Track how many of each role (for empty slots)
                
                // Get role requirements from study
                if (event.studyIds && event.studyIds.length > 0 && event.siteId) {
                    const study = state.studies.find(s => event.studyIds.includes(s.id));
                    if (study) {
                        // Check visit-specific requirements first
                        if (event.visitNumber && study.visitRoleRequirements) {
                            const visitKey = `visit-${event.visitNumber}`;
                            const visitReqs = study.visitRoleRequirements[visitKey] || study.visitRoleRequirements['default'];
                            if (visitReqs) {
                                Object.entries(visitReqs).forEach(([roleId, quantity]) => {
                                    const role = state.roles.find(r => r.id === roleId);
                                    if (role) {
                                        roleCounts.set(roleId, { name: role.name, required: quantity, assigned: 0 });
                                    }
                                });
                            }
                        } else if (study.visitRoleRequirements && study.visitRoleRequirements['default']) {
                            // Use default visit requirements
                            Object.entries(study.visitRoleRequirements['default']).forEach(([roleId, quantity]) => {
                                const role = state.roles.find(r => r.id === roleId);
                                if (role) {
                                    roleCounts.set(roleId, { name: role.name, required: quantity, assigned: 0 });
                                }
                            });
                        } else if (study.siteRoleRequirements && study.siteRoleRequirements[event.siteId]) {
                            // Fallback to site-specific requirements
                            Object.entries(study.siteRoleRequirements[event.siteId]).forEach(([roleId, quantity]) => {
                                const role = state.roles.find(r => r.id === roleId);
                                if (role) {
                                    roleCounts.set(roleId, { name: role.name, required: quantity, assigned: 0 });
                                }
                            });
                        } else if (study.requiredRoles && study.requiredRoles.length > 0) {
                            // Fallback to general required roles
                            study.requiredRoles.forEach(roleId => {
                                const role = state.roles.find(r => r.id === roleId);
                                if (role) {
                                    roleCounts.set(roleId, { name: role.name, required: 1, assigned: 0 });
                                }
                            });
                        }
                    }
                }
                
                // Count assigned roles (including training roles)
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                        const assignedCount = Array.isArray(assignments) ? assignments.filter(Boolean).length : 0;
                        const role = state.roles.find(r => r.id === roleId);
                        if (!role) return;
                        
                        // For training roles, show the training role name (e.g., "Training - ICF")
                        let displayName = role.name;
                        if (isTrainingRoleName(role.name) && event.trainingAssignments && event.trainingAssignments[roleId]) {
                            const trainingTypes = [...new Set(event.trainingAssignments[roleId].filter(Boolean))];
                            if (trainingTypes.length > 0) {
                                displayName = `Training, ${trainingTypes.join(', ')}`;
                            }
                        }
                        
                        if (roleCounts.has(roleId)) {
                            roleCounts.get(roleId).assigned = assignedCount;
                            roleCounts.get(roleId).name = displayName; // Update display name
                        } else {
                            // Role is assigned but not in requirements - add it
                            roleCounts.set(roleId, { name: displayName, required: assignedCount, assigned: assignedCount });
                        }
                    });
                }
                
                // Build role names list - deduplicate and show counts
                const roleSummary = new Map();
                roleCounts.forEach(({ name, required, assigned }) => {
                    if (required > 0) {
                        if (assigned === required) {
                            roleSummary.set(name, required);
                        } else {
                            roleSummary.set(name, `${assigned}/${required}`);
                        }
                    }
                });
                
                // Convert to array format: "RoleName x3" or "RoleName 2/5"
                roleSummary.forEach((count, name) => {
                    if (typeof count === 'number' && count === 1) {
                        roleNames.push(name);
                    } else if (typeof count === 'number') {
                        roleNames.push(`${name} x${count}`);
                    } else {
                        roleNames.push(`${name} ${count}`);
                    }
                });
                
                // If no role requirements found, fall back to assigned roles only
                if (roleNames.length === 0) {
                    return getEventRoles(event);
                }
                
                return roleNames;
            };
            
            // Check if an event is understaffed (has fewer assigned people than required)
            const isEventUnderstaffed = (event) => {
                if (!event.studyIds || event.studyIds.length === 0 || !event.siteId) {
                    return false; // Can't check requirements without study/site
                }
                
                const study = state.studies.find(s => event.studyIds.includes(s.id));
                if (!study) return false;
                
                const roleCounts = new Map();
                
                // Get role requirements from study
                if (event.visitNumber && study.visitRoleRequirements) {
                    const visitKey = `visit-${event.visitNumber}`;
                    const visitReqs = study.visitRoleRequirements[visitKey] || study.visitRoleRequirements['default'];
                    if (visitReqs) {
                        Object.entries(visitReqs).forEach(([roleId, quantity]) => {
                            roleCounts.set(roleId, { required: quantity, assigned: 0 });
                        });
                    }
                } else if (study.visitRoleRequirements && study.visitRoleRequirements['default']) {
                    Object.entries(study.visitRoleRequirements['default']).forEach(([roleId, quantity]) => {
                        roleCounts.set(roleId, { required: quantity, assigned: 0 });
                    });
                } else if (study.siteRoleRequirements && study.siteRoleRequirements[event.siteId]) {
                    Object.entries(study.siteRoleRequirements[event.siteId]).forEach(([roleId, quantity]) => {
                        roleCounts.set(roleId, { required: quantity, assigned: 0 });
                    });
                } else if (study.requiredRoles && study.requiredRoles.length > 0) {
                    study.requiredRoles.forEach(roleId => {
                        roleCounts.set(roleId, { required: 1, assigned: 0 });
                    });
                }
                
                // Count assigned roles
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                        const assignedCount = Array.isArray(assignments) ? assignments.filter(Boolean).length : 0;
                        if (roleCounts.has(roleId)) {
                            roleCounts.get(roleId).assigned = assignedCount;
                        }
                    });
                }
                
                // Check if any role has assigned < required
                for (const { required, assigned } of roleCounts.values()) {
                    if (required > 0 && assigned < required) {
                        return true;
                    }
                }
                
                return false;
            };
            
            // Helper function to get visit display name from study
            // Returns { display: string, isCustomName: boolean } to indicate if V prefix should be added
            const getVisitDisplayName = (visitNumber, studyIds) => {
                if (!visitNumber || !studyIds || studyIds.length === 0) {
                    return visitNumber ? visitNumber : '';
                }
                
                // Try to get visit name from the first study (most common case)
                const study = state.studies.find(s => studyIds.includes(s.id));
                if (study && study.visitNames) {
                    const visitKey = `visit-${visitNumber}`;
                    const visitName = study.visitNames[visitKey] || study.visitNames[visitNumber];
                    if (visitName) {
                        // Return custom name - check if it already starts with V or Visit
                        // If custom name is just a number or starts with a number, return just the number
                        const trimmed = visitName.trim();
                        if (/^\d+$/.test(trimmed)) {
                            return trimmed; // Just a number, will get V prefix
                        }
                        if (/^v\d+$/i.test(trimmed) || /^visit\s*\d+$/i.test(trimmed)) {
                            // Already has V or Visit prefix - return just the number part
                            return trimmed.replace(/^v(?:isit)?\s*/i, '');
                        }
                        // Custom name like "Screening" - return as-is (caller will handle V prefix)
                        return trimmed;
                    }
                }
                
                // Fallback to just the number (V prefix is added where needed)
                return visitNumber;
            };
            
            // Helper function to get CRCs assigned to an event from roleAssignments
            const getEventCRCs = (event) => {
                const crcs = [];
                if (event.crcId) {
                    // Legacy: check top-level crcId
                    const crc = state.crcs.find(c => c.id === event.crcId);
                    if (crc) crcs.push(crc);
                }
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    // New system: get CRCs from roleAssignments (includes regular roles and training roles)
                    Object.values(event.roleAssignments).forEach(assignments => {
                        if (Array.isArray(assignments)) {
                            assignments.forEach(crcId => {
                                if (crcId && crcId !== 'SITE_STAFF' && crcId !== 'UNASSIGNED') {
                                    const crc = state.crcs.find(c => c.id === crcId);
                                    if (crc && !crcs.find(c => c.id === crc.id)) {
                                        crcs.push(crc);
                                    }
                                }
                            });
                        }
                    });
                }
                // Training assignments are already included above since CRCs are in roleAssignments for Training role
                // The trainingAssignments just specify what they're training for (e.g., "ICF")
                return crcs;
            };

            // Helper function to get roles and training info for a specific CRC in an event
            const getCRCRolesForEvent = (crcId, event) => {
                const roles = [];
                const trainingInfo = [];
                
                if (!event.roleAssignments || !event.roleAssignments) return { roles, trainingInfo };
                
                // Find all roles this CRC is assigned to
                Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                    if (Array.isArray(assignments) && assignments.includes(crcId)) {
                        const role = state.roles.find(r => r.id === roleId);
                        if (role) {
                            const roleName = role.name;
                            roles.push(roleName);
                            
                            // If this is a Training role, get what they're training for
                            if (isTrainingRoleName(roleName) && event.trainingAssignments && event.trainingAssignments[roleId]) {
                                const trainingAssignments = event.trainingAssignments[roleId];
                                const crcIndex = assignments.indexOf(crcId);
                                if (crcIndex >= 0 && trainingAssignments[crcIndex]) {
                                    trainingInfo.push(trainingAssignments[crcIndex]);
                                }
                            }
                        }
                    }
                });
                
                return { roles, trainingInfo };
            };

            const checkRoleFulfillment = (event) => {
                if (!event.studyIds || event.studyIds.length === 0 || !event.siteId) return { fulfilled: true, missingRoles: [], unfilledSlots: [], totalUnfilled: 0 };
                
                // Get role requirements for this specific Study-Site combination
                const studySiteRoleRequirements = {};
                event.studyIds.forEach(studyId => {
                    try {
                        const study = state.studies?.find(s => s.id === studyId);
                        // Fallback: If study not found, continue without it - don't block deletion
                        if (study && study.siteRoleRequirements && study.siteRoleRequirements[event.siteId]) {
                            Object.keys(study.siteRoleRequirements[event.siteId]).forEach(roleId => {
                                const requiredCount = study.siteRoleRequirements[event.siteId][roleId];
                                studySiteRoleRequirements[roleId] = (studySiteRoleRequirements[roleId] || 0) + requiredCount;
                            });
                        }
                    } catch (error) {
                        console.warn('Study lookup failed for studyId:', studyId, 'but continuing...', error);
                        // Continue without this study - don't block deletion
                    }
                });
                
                // Count assigned roles - handle both new roleAssignments and legacy roles
                const assignedRoles = {};
                
                // Check for new roleAssignments structure first
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                        // Filter out empty/null assignments AND 'UNASSIGNED' (which is an explicit unfilled marker)
                        const validAssignments = assignments.filter(a => a && a !== 'UNASSIGNED');
                        assignedRoles[roleId] = validAssignments.length;
                    });
                }
                // Fallback to legacy roles structure
                else if (event.roles && event.roles.length > 0) {
                    event.roles.forEach(roleName => {
                        const role = state.roles.find(r => r.name === roleName);
                        if (role) {
                            assignedRoles[role.id] = (assignedRoles[role.id] || 0) + 1;
                        }
                    });
                }
                
                // Check fulfillment and gather unfilled slot info
                const missingRoles = [];
                const unfilledSlots = []; // Detailed list of unfilled slots with role names
                let totalUnfilled = 0;
                
                Object.keys(studySiteRoleRequirements).forEach(roleId => {
                    const required = studySiteRoleRequirements[roleId];
                    const assigned = assignedRoles[roleId] || 0;
                    if (assigned < required) {
                        const role = state.roles.find(r => r.id === roleId);
                        if (role) {
                            const unfilled = required - assigned;
                            missingRoles.push(`${role.name} (${assigned}/${required})`);
                            // Add each unfilled slot to the list
                            for (let i = 0; i < unfilled; i++) {
                                unfilledSlots.push({ roleId, roleName: role.name, slotIndex: assigned + i });
                            }
                            totalUnfilled += unfilled;
                        }
                    }
                });
                
                // Also check roleAssignments for null slots or UNASSIGNED (open positions)
                if (event.roleAssignments && Object.keys(event.roleAssignments).length > 0) {
                    Object.entries(event.roleAssignments).forEach(([roleId, assignments]) => {
                        if (Array.isArray(assignments)) {
                            const role = state.roles.find(r => r.id === roleId);
                            if (role) {
                                assignments.forEach((crcId, index) => {
                                    // Treat empty, null, or UNASSIGNED as unfilled slots
                                    if (!crcId || crcId === '' || crcId === 'UNASSIGNED') {
                                        // This is an unfilled slot
                                        const alreadyAdded = unfilledSlots.find(s => s.roleId === roleId && s.slotIndex === index);
                                        if (!alreadyAdded) {
                                            unfilledSlots.push({ roleId, roleName: role.name, slotIndex: index });
                                            totalUnfilled++;
                                            if (!missingRoles.find(m => m.startsWith(role.name))) {
                                                // Count filled excluding UNASSIGNED
                                                const filled = assignments.filter(a => a && a !== 'UNASSIGNED').length;
                                                missingRoles.push(`${role.name} (${filled}/${assignments.length})`);
                                            }
                                        }
                                    }
                                });
                            }
                        }
                    });
                }
                
                return {
                    fulfilled: missingRoles.length === 0 && totalUnfilled === 0,
                    missingRoles: missingRoles,
                    unfilledSlots: unfilledSlots,
                    totalUnfilled: totalUnfilled
                };
            };

            // Check for unfilled shifts in the next 2 weeks
            const hasUnfilledShiftsInNextTwoWeeks = () => {
                if (!state.crc_events || !state.crc_events.length || !state.managerViewNotificationsEnabled) {
                    return false;
                }

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const twoWeeksFromNow = new Date(today);
                twoWeeksFromNow.setDate(twoWeeksFromNow.getDate() + 14);

                // Filter events in the next 2 weeks that are Site Assignments
                const upcomingShifts = state.crc_events.filter(event => {
                    if (event.type !== 'Site Assignment') return false;
                    if (!event.date) return false;
                    
                    const eventDate = new Date(event.date + 'T00:00:00');
                    return eventDate >= today && eventDate <= twoWeeksFromNow;
                });

                // Check each shift to see if it's unfilled
                for (const event of upcomingShifts) {
                    const fulfillment = checkRoleFulfillment(event);
                    if (!fulfillment.fulfilled) {
                        return true; // Found at least one unfilled shift
                    }
                    
                    // Also check if it's a Site Assignment with no CRCs assigned at all
                    if (!isSiteAssignmentWithCrc(event)) {
                        return true; // Found an open shift
                    }
                }

                return false;
            };

            // --- CALCULATION FUNCTIONS ---
            const calculateMonthlyUtilization = (dateInMonth, crcIdsToCalculate = []) => {
                const year = dateInMonth.getFullYear();
                const month = dateInMonth.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                let totalWorkingDaysInMonth = 0;
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayOfWeek = new Date(year, month, day).getDay();
                    if (dayOfWeek > 0 && dayOfWeek < 6) { // Monday to Friday
                        totalWorkingDaysInMonth++;
                    }
                }

                const stats = {};
                const targetCrcs = crcIdsToCalculate.length > 0
                    ? state.crcs.filter(c => crcIdsToCalculate.includes(c.id))
                    : state.crcs;

                targetCrcs.forEach(crc => {
                    const eventsThisMonth = state.crc_events.filter(e => {
                        const eventDate = new Date(e.date + 'T00:00:00');
                        // Check if CRC is assigned to this event (either as primary crcId or in roleAssignments)
                        // AND it's a Site Assignment with CRC assigned (not empty/open shift)
                        return eventBelongsToCrc(e, crc.id) && 
                               eventDate.getFullYear() === year && 
                               eventDate.getMonth() === month &&
                               isSiteAssignmentWithCrc(e);
                    });
                    
                    const nonWorkEventTypes = ['Paid Time Off', 'Unavailable'];

                    const productiveDaysSet = new Set();
                    eventsThisMonth.forEach(e => {
                        // Only count Site Assignments with CRCs assigned
                        if (isSiteAssignmentWithCrc(e)) {
                            productiveDaysSet.add(e.date);
                        }
                    });

                    const nonWorkDaysSet = new Set();
                    eventsThisMonth.forEach(e => {
                        if (nonWorkEventTypes.includes(e.type)) {
                           nonWorkDaysSet.add(e.date);
                        }
                    });
                    const productiveDays = productiveDaysSet.size;
                    const nonWorkDays = nonWorkDaysSet.size;

                    const crcAvailableWorkDays = totalWorkingDaysInMonth - nonWorkDays;
                    const utilizationPercent = crcAvailableWorkDays > 0 ? Math.round((productiveDays / crcAvailableWorkDays) * 100) : 0;
                    
                    stats[crc.id] = {
                        utilizationPercent,
                        productiveDays,
                        nonWorkDays,
                        availableWorkDays: crcAvailableWorkDays,
                        totalWorkDays: totalWorkingDaysInMonth
                    };
                });
                return stats;
            };

            const calculateWeeklyUtilization = (dateInWeek) => {
                const dayOfWeek = getDaySaturdayStart(dateInWeek);
                const startOfWeek = new Date(dateInWeek);
                startOfWeek.setDate(dateInWeek.getDate() - dayOfWeek);
                startOfWeek.setHours(0, 0, 0, 0);

                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                endOfWeek.setHours(23, 59, 59, 999);

                const stats = {};
                state.crcs.forEach(crc => {
                    // Only count Site Assignment events with CRCs assigned (not empty/open shifts)
                    const eventsThisWeek = state.crc_events.filter(e => {
                        const eventDate = new Date(e.date + 'T12:00:00');
                        return eventDate >= startOfWeek && 
                               eventDate <= endOfWeek;
                    });
                    // Calculate hours using helper - Site Assignment only
                    const totalHours = calculateCrcHours(eventsThisWeek, crc.id, { includeTravel: false });
                    stats[crc.id] = {
                        totalHours,
                        utilizationPercent: Math.round((totalHours / 40) * 100)
                    };
                });
                return stats;
            };

            // --- CORE FUNCTIONS ---
            const setState = (newState, options = {}) => {
                // Preserve changeLog if it exists and isn't being explicitly updated
                const existingChangeLog = state.changeLog;
                state = { ...state, ...newState };
                // If changeLog wasn't in newState, preserve the existing one
                if (!('changeLog' in newState) && existingChangeLog) {
                    state.changeLog = existingChangeLog;
                }
                // Ensure changeLog is always an array
                if (!state.changeLog) {
                    state.changeLog = [];
                }
                if (options.skipRender) {
                    return;
                }
                console.log('CHAOS: setState called. authReady=', state.authReady, 'initialLoadComplete=', state.initialLoadComplete);
                if (state.authReady && state.initialLoadComplete) {
                    // Always force-hide the loading overlay once we're ready.
                    // This must be idempotent because other code paths can accidentally re-show the overlay,
                    // which would block all clicks (dashboard filters, tabs, etc.).
                    if (loadingOverlay) {
                        loadingOverlay.classList.add('hidden');
                        loadingOverlay.style.display = 'none';
                        loadingOverlay.style.pointerEvents = 'none';
                    }
                    
                    // Only stop the phrase “rotation” once.
                    if (!overlayHidden) {
                        overlayHidden = true;
                        console.log('CHAOS: Both flags true, hiding loading overlay and rendering...');
                        window.requestAnimationFrame(() => {
                            render();
                            stopLoadingPhraseRotation();

                        });
                    } else {
                        window.requestAnimationFrame(() => {

                } else {

            };

            const render = () => {

            // Initialize dual scrollbar sync for planning grids
            const initDualScroll = () => {
                document.querySelectorAll('.dual-scroll-wrapper').forEach(wrapper => {
                    const topScroll = wrapper.querySelector('.dual-scroll-top');
                    const mainScroll = wrapper.querySelector('.dual-scroll-main');
                    
                    if (!topScroll || !mainScroll) return;
                    
                    // Set the spacer width to match the table width
                    const table = mainScroll.querySelector('table');
                    const spacer = topScroll.querySelector('.dual-scroll-spacer');
                    if (table && spacer) {
                        spacer.style.width = table.scrollWidth + 'px';
                    }
                    
                    // Sync scroll positions
                    let isSyncing = false;
                    topScroll.addEventListener('scroll', () => {
                        if (isSyncing) return;
                        isSyncing = true;
                        mainScroll.scrollLeft = topScroll.scrollLeft;
                        isSyncing = false;
                    });
                    mainScroll.addEventListener('scroll', () => {

            // Permission checking helper functions
            const getUserPermissions = () => {
                if (!state.currentUser) return null;
                
                // If user has a permission set, use it
                if (state.currentUser.permissionSetId) {
                    const permissionSet = (state.permissionSets || []).find(ps => ps.id === state.currentUser.permissionSetId);
                    if (permissionSet) {
                        return {
                            tabs: permissionSet.tabs || [],
                            studiesAccess: permissionSet.studiesAccess || 'all',
                            studies: permissionSet.studies || [],
                            sitesAccess: permissionSet.sitesAccess || 'all',
                            sites: permissionSet.sites || [],
                            permissionLevel: permissionSet.permissionLevel || 'read',

const setupScheduleFormDependencies = () => {
    const studySelect = document.getElementById('schedule-study-select');
    const siteSelect = document.getElementById('schedule-site-select');
    const visitSelect = document.getElementById('schedule-visit-select');
    const startTimeInput = document.getElementById('schedule-start-time');
    const endTimeInput = document.getElementById('schedule-end-time');
    const intervalInput = document.getElementById('schedule-interval-minutes');
    const capacityInput = document.getElementById('schedule-capacity');
    
    if (!studySelect || !siteSelect) return;

    const getEffectiveVisitConfig = ({ studyId, siteId, visit }) => {
        const study = state.studies.find(s => s.id === studyId);
        const site = state.sites.find(s => s.id === siteId);

        const defaults = {
            defaultStartTime: '08:00',
            defaultEndTime: '16:00',
            patientsPerHour: 2
        };

        const studyProfile = Array.isArray(study?.visitProfiles)
            ? study.visitProfiles.find(v => String(v?.visitName || '') === String(visit || ''))
            : null;

        const siteOverride = site?.schedulingOverrides && typeof site.schedulingOverrides === 'object'
            ? site.schedulingOverrides[String(visit || '')]
            : null;

        const defaultStartTime = (siteOverride && (siteOverride.startTime || siteOverride.defaultStartTime))
            || (studyProfile && studyProfile.defaultStartTime)
            || defaults.defaultStartTime;

        const defaultEndTime = (siteOverride && (siteOverride.endTime || siteOverride.defaultEndTime))
            || (studyProfile && studyProfile.defaultEndTime)
            || defaults.defaultEndTime;

        const patientsPerHour = (siteOverride && siteOverride.patientsPerHour)
            || (studyProfile && studyProfile.patientsPerHour)
            || defaults.patientsPerHour;

        return { defaultStartTime, defaultEndTime, patientsPerHour };
    };

    const applyVisitConfigToForm = () => {
        if (!visitSelect || !startTimeInput || !endTimeInput || !intervalInput || !capacityInput) return;
        const studyId = studySelect.value;
        const siteId = siteSelect.value;
        const visit = visitSelect.value;
        if (!studyId || !visit) return;

        const cfg = getEffectiveVisitConfig({ studyId, siteId, visit });
        startTimeInput.value = cfg.defaultStartTime || '08:00';
        endTimeInput.value = cfg.defaultEndTime || '16:00';
        intervalInput.value = '60';
        capacityInput.value = String(cfg.patientsPerHour || 2);
    };
    
    studySelect.addEventListener('change', (e) => {
        const selectedStudyId = e.target.value;
        
        if (!selectedStudyId) {
            siteSelect.innerHTML = '<option value="">Select a Study First</option>';
            siteSelect.disabled = true;
            applyVisitConfigToForm();
            return;
        }
        
        // Find the selected study
        const selectedStudy = state.studies.find(s => s.id === selectedStudyId);
        
        if (!selectedStudy) {
            siteSelect.innerHTML = '<option value="">No sites available</option>';
            siteSelect.disabled = true;
            applyVisitConfigToForm();
            return;
        }
        
        // Get sites assigned to this study in ARTEMIS
        const studySiteIds = selectedStudy.siteIds || [];
        const availableSites = state.sites.filter(site => 
            studySiteIds.includes(site.id) && site.status === 'Active'
        );
        
        if (availableSites.length === 0) {
            siteSelect.innerHTML = '<option value="">No sites assigned to this study</option>';
            siteSelect.disabled = true;
            applyVisitConfigToForm();
            return;
        }
        
        // Populate site dropdown with filtered sites
        siteSelect.innerHTML = '<option value="">Select a Site</option>' + 
            availableSites.map(site => `<option value="${site.id}">${site.name}</option>`).join('');
        siteSelect.disabled = false;

        applyVisitConfigToForm();
    });

    if (visitSelect) {
        visitSelect.addEventListener('change', applyVisitConfigToForm);
    }
    if (siteSelect) {
        siteSelect.addEventListener('change', applyVisitConfigToForm);
    }

    applyVisitConfigToForm();
};

/**
 * Get washout status for a patient
 * @param {Object} patient - Patient object
 * @returns {Object|null} - Washout status object or null
 */
/**
 * Convert NASA patient format (with enrollments array) to Azure format (with studyId/siteId)
 * @param {Object} patient - Patient object with enrollments array
 * @returns {Object} - Patient object with Azure format
 */
const computePatientDenormalized = (patient) => {
    const enrollments = Array.isArray(patient?.enrollments) ? patient.enrollments : [];
    const current = enrollments.find(e => e && e.status === 'current');
    const enrolledStudyIds = [...new Set(
        enrollments.filter(e => e && ['current', 'past'].includes(e.status) && e.studyId).map(e => e.studyId)
    )];
    const candidateStudyIds = [...new Set(
        enrollments.filter(e => e && e.status === 'candidate' && e.studyId).map(e => e.studyId)
    )];
    return {
        currentStudyId: current?.studyId || null,
        currentSiteId: current?.siteId || null,
        enrolledStudyIds,
        candidateStudyIds,
    };
};

/** Same study matching for Studies roster, Reporting, and Pipeline (string-safe + appointments). */
const patientBelongsToStudy = (patient, studyId) => {
    if (!patient || !studyId) return false;
    if (patient.status === 'Merged' || patient.mergedIntoId) return false;
    const sid = String(studyId);
    const denorm = computePatientDenormalized(patient);
    if (denorm.currentStudyId != null && String(denorm.currentStudyId) === sid) return true;
    if ((denorm.enrolledStudyIds || []).some(id => String(id) === sid)) return true;
    if ((denorm.candidateStudyIds || []).some(id => String(id) === sid)) return true;
    if ((patient.enrollments || []).some(e => e && e.studyId != null && String(e.studyId) === sid)) return true;
    const appts = typeof getPatientAppointments === 'function' ? getPatientAppointments(patient) : (patient.appointments || []);
    if ((appts || []).some(a => a && a.studyId != null && String(a.studyId) === sid && (a.status || 'scheduled') !== 'cancelled')) return true;
    if (patient.appointment?.studyId != null && String(patient.appointment.studyId) === sid) return true;
    return false;
};

const patientBelongsToSite = (patient, siteId) => {
    if (!patient || !siteId) return false;
    const sid = String(siteId);
    const denorm = computePatientDenormalized(patient);
    if (denorm.currentSiteId != null && String(denorm.currentSiteId) === sid) return true;
    if ((patient.enrollments || []).some(e => e && e.siteId != null && String(e.siteId) === sid)) return true;
    if (patient.homeSiteId != null && String(patient.homeSiteId) === sid) return true;
    const appts = typeof getPatientAppointments === 'function' ? getPatientAppointments(patient) : (patient.appointments || []);
    if ((appts || []).some(a => a && a.siteId != null && String(a.siteId) === sid && (a.status || 'scheduled') !== 'cancelled')) return true;
    return false;
};

/**
 * Convert Azure patient format (with studyId/siteId) to NASA format (with enrollments array)
 * @param {Object} azurePatient - Patient object from Azure
 * @returns {Object} - Patient object with NASA format
 */
const convertPatientFromAzureFormat = (azurePatient) => {
    let enrollments = [];
    if (Array.isArray(azurePatient.enrollments) && azurePatient.enrollments.length) {
        enrollments = azurePatient.enrollments.map(e => ({ ...e }));
    } else {
        if (azurePatient.studyId && azurePatient.siteId) {
            enrollments.push({
                studyId: azurePatient.studyId,
                siteId: azurePatient.siteId,
                status: 'current',
                enrolledDate: new Date().toISOString(),
                exitedDate: null
            });
        }
        if (azurePatient.studyHistory && Array.isArray(azurePatient.studyHistory)) {
            azurePatient.studyHistory.forEach(history => {
                enrollments.push({
                    studyId: history.studyId,
                    siteId: history.siteId,
                    status: 'past',
                    enrolledDate: history.enrolledDate,
                    exitedDate: history.exitedDate
                });
            });
        }
    }
    const { studyId, siteId, studyHistory, currentStudyId, currentSiteId, enrolledStudyIds, candidateStudyIds, ...rest } = azurePatient;
    let firstName = rest.firstName || '';
    let lastName = rest.lastName || '';
    if ((!firstName || !lastName) && rest.name && typeof rest.name === 'string') {
        const parts = rest.name.trim().split(/\s+/).filter(Boolean);
        if (!firstName && parts.length) firstName = parts[0];
        if (!lastName && parts.length > 1) lastName = parts.slice(1).join(' ');
    }
    if (rest.first_name && !firstName) firstName = String(rest.first_name).trim();
    if (rest.last_name && !lastName) lastName = String(rest.last_name).trim();
    return normalizePatientRecord({
        ...rest,
        firstName,
        lastName,
        enrollments,
        inclusionCriteriaMet: azurePatient.inclusionCriteriaMet === true,
        exclusionCriteriaMet: azurePatient.exclusionCriteriaMet === true
    });
};

const getWashoutStatus = (patient) => {
    if (!patient.enrollments || patient.enrollments.length === 0) return false;
    
    // Find the most recent past enrollment
    const pastEnrollments = patient.enrollments.filter(e => e.status === 'past');
    if (pastEnrollments.length === 0) return null;
    
    const mostRecentPastEnrollment = pastEnrollments.reduce((latest, current) => {
        if (!latest.exitedDate || !current.exitedDate) return latest;
        return new Date(current.exitedDate) > new Date(latest.exitedDate) ? current : latest;
    });
    
    if (!mostRecentPastEnrollment.exitedDate) return null;
    
    // Get the study to find washout days
    const study = state.studies.find(s => s.id === mostRecentPastEnrollment.studyId);
    const washoutDays = study?.washoutDays || 30; // Default to 30 days
    const studyTitle = study?.title || 'Unknown Study';
    
    const exitedDate = new Date(mostRecentPastEnrollment.exitedDate);
    const washoutEndDate = new Date(exitedDate);
    washoutEndDate.setDate(exitedDate.getDate() + washoutDays);
    
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    washoutEndDate.setHours(0, 0, 0, 0);
    
    const diffMs = washoutEndDate.getTime() - today.getTime();
    const remainingDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    
    // Only return washout status if still in washout period
    if (today < washoutEndDate && remainingDays > 0) {
        return {
            washoutDays,
            exitedDate,
            washoutEndDate,
            remainingDays,
            studyTitle,
            studyId: mostRecentPastEnrollment.studyId
        };
    }
    
    return null;
};

const patientHasRecruitmentStatus = (patient) => String(patient?.status || '').trim().length > 0;

const patientVisibleToCurrentUser = (patient) => {
    if (!patient) return false;
    if (patient.status === 'Merged' || patient.mergedIntoId) return false;
    const allowedSites = getUserAllowedSiteIds();
    const allowedStudies = getUserAllowedStudyIds();
    if (allowedSites === null && allowedStudies === null) return true;

    if (!patientHasRecruitmentStatus(patient)) {
        const homeSiteId = patient.homeSiteId;
        const userId = state.currentUser?.id;
        if (homeSiteId && allowedSites !== null && !allowedSites.includes(homeSiteId)) return false;
        if (userId && (patient.claimedByUserId === userId || patient.assignedToUserId === userId)) return true;
        return true;
    }

    const denorm = computePatientDenormalized(patient);
    const siteId = denorm.currentSiteId;
    const studyId = denorm.currentStudyId;

    if (allowedStudies !== null && denorm.candidateStudyIds?.some((id) => allowedStudies.includes(id))) return true;

    if (siteId || studyId) {
        if (allowedSites !== null && siteId && !allowedSites.includes(siteId)) return false;
        if (allowedStudies !== null && studyId && !allowedStudies.includes(studyId)) return false;
        return true;
    }

    const homeSiteId = patient.homeSiteId;
    const userId = state.currentUser?.id;
    if (allowedSites !== null && homeSiteId && allowedSites.includes(homeSiteId)) return true;
    if (userId && (patient.claimedByUserId === userId || patient.assignedToUserId === userId)) return true;
    if (!siteId && !studyId && !homeSiteId) return true;
    return false;
};

const queryPatientsServer = async (options = {}) => {

        search: options.search || '',
        limit: options.limit || 50,
        offset: options.offset || 0,
        includeTotal: options.includeTotal !== false,
    };
    const mapItems = (result) => ({
        ...result,
        items: (result.items || []).map(p => normalizePatientRecord(convertPatientFromAzureFormat(p))),
    });
    const endpoints = ['patients/query', 'patient-query'];
    let lastError = null;
    for (const endpoint of endpoints) {
        try {
            return mapItems(await apiCall(endpoint, 'POST', body));
        } catch (err) {
            lastError = err;
            if (err.status !== 404 && err.status !== 400) throw err;
        }
    }
    return queryPatientsLocally(body, lastError);
};

const queryPatientsLocally = async (body, priorError = null) => {
    let patients = state.patients?.length ? state.patients : await fetchData('patients');
    patients = filterPatientsForCurrentUser(patients);
    const search = String(body.search || '').trim().toLowerCase();
    if (search) {
        patients = patients.filter((p) => {
            const hay = `${p.firstName || ''} ${p.lastName || ''} ${p.email || ''} ${p.globalId || ''} ${p.phoneNumber || ''}`.toLowerCase();
            return hay.includes(search);
        });
    }
    const offset = parseInt(body.offset, 10) || 0;
    const limit = parseInt(body.limit, 10) || 50;
    const items = patients.slice(offset, offset + limit);
    if (!items.length && priorError) console.warn('Patient query API unavailable, using local cache:', priorError.message);
    return { items, total: patients.length, limit, offset };
};

const getPatientAppointments = (patient) => {
    if (!patient) return [];
    if (Array.isArray(patient.appointments) && patient.appointments.length) {
        return [...patient.appointments].sort((a, b) => new Date(a.time) - new Date(b.time));
    }
    if (patient.appointment?.time) {
        return [{ ...patient.appointment, id: patient.appointment.id || 'legacy-appt' }];
    }
    return [];
};

const getPrimaryAppointment = (patient) => {
    const now = Date.now();
    const appts = getPatientAppointments(patient).filter(a => (a.status || 'scheduled') !== 'cancelled');
    const upcoming = appts.filter(a => a.time && new Date(a.time).getTime() >= now);
    if (upcoming.length) return upcoming[0];
    return appts.length ? appts[appts.length - 1] : null;
};

const normalizePatientRecord = (patient) => {
    if (!patient) return patient;
    const normalized = { ...patient };
    if (!Array.isArray(normalized.tasks)) normalized.tasks = [];
    if (!Array.isArray(normalized.consentRecords)) normalized.consentRecords = [];
    if (!Array.isArray(normalized.communications)) normalized.communications = [];
    if (!Array.isArray(normalized.waitlist)) normalized.waitlist = [];
    if (!Array.isArray(normalized.auditTrail)) normalized.auditTrail = [];
    if (!Array.isArray(normalized.visitLogs)) normalized.visitLogs = [];
    if (!Array.isArray(normalized.completedVisits)) normalized.completedVisits = [];
    if (!Array.isArray(normalized.medications)) normalized.medications = [];
    if (!Array.isArray(normalized.tags)) normalized.tags = [];
    if (!Array.isArray(normalized.race)) normalized.race = normalized.race ? [normalized.race] : [];
    if (!Array.isArray(normalized.surveyDrafts)) normalized.surveyDrafts = [];
    if (!Array.isArray(normalized.pendingConsentLinks)) normalized.pendingConsentLinks = [];
    if (normalized.deceased == null) normalized.deceased = false;
    if (normalized.profileLocked == null) normalized.profileLocked = !!normalized.deceased;
    if (normalized.emailInvalid == null) normalized.emailInvalid = false;
    if (normalized.emailUnsubscribed == null) normalized.emailUnsubscribed = false;
    if (!normalized.overallStatus) normalized.overallStatus = '';
    if (!normalized.nqReason) normalized.nqReason = '';
    if (!normalized.niReason) normalized.niReason = '';
    if (!normalized.sexAssignedAtBirth) normalized.sexAssignedAtBirth = '';
    if (!normalized.ethnicity) normalized.ethnicity = '';
    if (!patientHasRecruitmentStatus(normalized)) {
        normalized.pipelineStage = 'lead';
        if (!normalized.status) normalized.status = '';
    } else if (!normalized.pipelineStage) {
        normalized.pipelineStage = inferPipelineStage(normalized);
    } else {
        const canonical = normalizePipelineStageId(normalized.pipelineStage);
        normalized.pipelineStage = canonical || inferPipelineStage(normalized);
    }
    if (!normalized.eligibilityStatus) normalized.eligibilityStatus = 'unknown';
    const appts = getPatientAppointments(normalized);
    normalized.appointments = appts;
    normalized.appointment = getPrimaryAppointment(normalized);
    return normalized;
};

const inferPipelineStage = (patient) => {
    if (!patientHasRecruitmentStatus(patient)) return 'lead';
    if (patient.status === 'Screen Fail') return 'screen_fail';
    if (patient.status === 'Enrolled') return 'enrolled';
    if (patient.consentRecords?.some(c => c.status === 'signed')) return 'consented';
    const appt = getPrimaryAppointment(patient);
    if (appt?.checkInStatus === 'checked-in') return 'showed';
    if (appt?.time && new Date(appt.time) > new Date()) return 'scheduled';
    if (patient.surveyResults?.length || patient.status === 'Pre-Screening') return 'pre_screened';
    if (patient.contactLogs?.length) return 'contacted';
    if (patient.registryStatus === 'Inactive') return 'inactive';
    return 'lead';
};

const normalizePipelineStageId = (stage) => {
    if (stage == null || stage === '') return null;
    const raw = String(stage).trim().toLowerCase().replace(/-/g, '_').replace(/\s+/g, '_');
    const aliases = {
        lead: 'lead',
        contacted: 'contacted',
        prescreened: 'pre_screened',
        pre_screen: 'pre_screened',
        scheduled: 'scheduled',
        showed: 'showed',
        consented: 'consented',
        enrolled: 'enrolled',
        screenfail: 'screen_fail',
        screen_failed: 'screen_fail',
        inactive: 'inactive',
        candidate: 'lead',
    };
    const id = aliases[raw] || raw;
    return PIPELINE_STAGES.some(s => s.id === id) ? id : null;
};

const getEffectivePipelineStage = (patient) => {
    if (!patient) return 'lead';
    if (!patientHasRecruitmentStatus(patient)) return 'lead';
    const normalized = normalizePipelineStageId(patient.pipelineStage);
    if (normalized) return normalized;
    const inferred = normalizePipelineStageId(inferPipelineStage(patient));
    return inferred || 'lead';
};

const mergeCommunicationTemplate = (templateKey, patient) => {
    const tpl = COMMUNICATION_TEMPLATES[templateKey];
    if (!tpl) return { subject: '', body: '' };
    const enrollment = patient.enrollments?.find(e => e.status === 'current');
    const study = enrollment ? state.studies.find(s => s.id === enrollment.studyId) : null;
    const site = enrollment ? state.sites.find(s => s.id === enrollment.siteId) : null;
    const appt = getPrimaryAppointment(patient);
    const vars = {
        firstName: patient.firstName || '',
        study: study?.title || 'your study',
        site: site?.name || 'the site',
        visit: appt?.visit || 'visit',
        appointmentTime: appt?.time ? new Date(appt.time).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'TBD'
    };
    const replace = (s) => String(s).replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] || '');
    return { subject: replace(tpl.subject), body: replace(tpl.body) };
};

const evaluateSurveyEligibility = (survey, answers) => {
    const rules = Array.isArray(survey?.eligibilityRules) ? survey.eligibilityRules : [];
    if (!rules.length) return { status: 'unknown', reasons: [] };
    const answerMap = {};
    (answers || []).forEach(a => { answerMap[String(a.question || '').trim().toLowerCase()] = a.answer; });
    const reasons = [];
    let status = 'eligible';
    for (const rule of rules) {
        const qText = String(rule.questionText || '').trim().toLowerCase();
        const answer = answerMap[qText];
        if (answer === undefined || answer === null || answer === '') continue;
        const actual = String(answer).trim().toLowerCase();
        const expected = String(rule.value || '').trim().toLowerCase();
        let match = false;
        if (rule.operator === 'equals') match = actual === expected;
        else if (rule.operator === 'not_equals') match = actual !== expected;
        else if (rule.operator === 'contains') match = actual.includes(expected);
        else if (rule.operator === 'gte') match = parseFloat(actual) >= parseFloat(expected);
        else if (rule.operator === 'lte') match = parseFloat(actual) <= parseFloat(expected);
        if (!match) continue;
        if (rule.result === 'fail') { status = 'ineligible'; reasons.push(rule.reason || `Failed: ${rule.questionText}`); }
        else if (rule.result === 'pi_review' && status === 'eligible') { status = 'pi_review'; reasons.push(rule.reason || `PI review: ${rule.questionText}`); }
    }
    return { status, reasons };
};

const getSchedulingBlockReason = (patient) => {
    if (!patient) return 'Patient not found';
    if (patient.profileLocked || patient.deceased) return 'Profile is locked (deceased)';
    if (SCHEDULING_TEST_MODE) return null;
    if (patient.doNotContact) return 'Patient is marked do-not-contact';
    if (patient.eligibilityStatus === 'ineligible') return 'Patient is ineligible per survey/rules';
    if (patient.eligibilityStatus === 'pi_review') return 'Patient requires PI review before scheduling';
    if (patient.exclusionCriteriaMet === true) return 'Exclusion criteria met';
    if (isWashoutPeriodActive(patient)) return 'Washout period active';
    return null;
};

const getSchedulingContext = (patient) => {
    const currentEnrollment = patient.enrollments?.find(e => e.status === 'current');
    if (currentEnrollment?.studyId && currentEnrollment?.siteId) {
        return {
            studyId: currentEnrollment.studyId,
            siteId: currentEnrollment.siteId,
            enrollment: currentEnrollment,
        };
    }
    if (!SCHEDULING_TEST_MODE) return null;
    return { studyId: null, siteId: null, enrollment: null };
};

const getBookableSchedulesForPatient = (patient) => {
    const completedVisits = patient?.completedVisits || [];
    const ctx = getSchedulingContext(patient);
    if (ctx?.studyId && ctx?.siteId) {
        return state.schedules.filter(s =>
            s.siteId === ctx.siteId &&
            s.studyId === ctx.studyId &&
            !completedVisits.includes(s.visit)
        );
    }
    if (SCHEDULING_TEST_MODE) {
        return state.schedules.filter(s => Array.isArray(s.slots) && s.slots.length);
    }
    return [];
};

const canSchedulePatient = (patient) => !getSchedulingBlockReason(patient);

const generateScreeningNumber = (patient, study, site) => {
    if (patient.screeningNumber) return patient.screeningNumber;
    const siteAbbr = (site?.siteNameAbbreviation || site?.name || 'SITE').replace(/\W+/g, '').slice(0, 4).toUpperCase();
    const studyAbbr = (study?.protocolNumber || study?.title || 'STD').replace(/\W+/g, '').slice(0, 6).toUpperCase();
    const seq = String((state.patients || []).filter(p => {
        const e = p.enrollments?.find(en => en.status === 'current');
        return e?.studyId === study?.id && e?.siteId === site?.id;
    }).length + 1).padStart(3, '0');
    return `${siteAbbr}-${studyAbbr}-${seq}`;
};

const updatePatientFields = async (patientId, fields, auditAction = null, auditDetails = '', options = {}) => {
    const patient = await resolvePatientById(patientId);
    if (!patient) throw new Error('Patient not found');
    const unlocking = fields.profileLocked === false || fields.deceased === false;
    if (isPatientProfileLocked(patient) && !(unlocking && isManagerUser()) && !options.allowWhenLocked) {
        throw new Error('Profile is locked (deceased). A manager must unlock it before edits.');
    }
    const updates = { ...fields, lastUpdated: new Date().toISOString() };
    if (updates.deceased === true) updates.profileLocked = true;
    const auditedKeys = Object.keys(fields).filter(k => k !== 'auditTrail' && k !== 'lastUpdated');
    const autoDetails = buildFieldDiffDetails(patient, { ...patient, ...updates }, auditedKeys);
    const action = auditAction || (auditedKeys.length ? 'profile_updated' : null);
    const details = auditDetails || autoDetails;
    if (action) {
        updates.auditTrail = [...(patient.auditTrail || []), appendPatientAuditEntry(patient, action, details)];
    }
    await updateDocument('patients', patientId, updates);
};

const getStudyVisitMatrix = (study) => {
    if (Array.isArray(study?.visitMatrix) && study.visitMatrix.length) return study.visitMatrix;
    const fromProfiles = (study?.visitProfiles || []).map((v, i) => ({
        visitName: v.visitName || `Visit ${i + 1}`,
        windowDaysMin: v.windowDaysMin ?? null,
        windowDaysMax: v.windowDaysMax ?? null,
        anchorVisit: v.anchorVisit || null
    }));
    if (fromProfiles.length) return fromProfiles;
    return [1, 2, 3, 4, 5].map(n => ({ visitName: `Visit ${n}`, windowDaysMin: null, windowDaysMax: null, anchorVisit: n > 1 ? `Visit ${n - 1}` : null }));
};

const computeRecruitmentFunnel = (patients, filters = {}) => {
    let list = filterPatientsForCurrentUser([...patients]);
    if (filters.studyId && filters.studyId !== 'all') {
        list = list.filter(p => patientBelongsToStudy(p, filters.studyId));
    }
    if (filters.siteId && filters.siteId !== 'all') {
        list = list.filter(p => patientBelongsToSite(p, filters.siteId));
    }
    const stageIds = PIPELINE_STAGES.map(s => s.id);
    const counts = Object.fromEntries(stageIds.map(id => [id, 0]));
    list.forEach(p => {
        const stage = getEffectivePipelineStage(p);
        if (counts[stage] !== undefined) counts[stage]++;
    });
    const leads = list.length;
    const scheduled = list.filter(p => getPatientAppointments(p).some(a => a.time && new Date(a.time) > new Date())).length;
    const enrolled = list.filter(p => p.status === 'Enrolled').length;
    const screenFails = list.filter(p => p.status === 'Screen Fail').length;
    const conversion = (from, to) => from > 0 ? Math.round((to / from) * 100) : 0;
    return {
        counts,
        totals: { leads, scheduled, enrolled, screenFails, preScreened: counts.pre_screened + counts.scheduled + counts.showed + counts.consented + counts.enrolled },
        rates: {
            leadToPreScreen: conversion(leads, counts.pre_screened + counts.scheduled + counts.showed + counts.consented + counts.enrolled + counts.screen_fail),
            preScreenToScheduled: conversion(counts.pre_screened, scheduled),
            scheduledToEnrolled: conversion(scheduled, enrolled),
            screenFailRate: conversion(leads, screenFails)
        }
    };
};

const getOpenTasksForPatients = (patients, options = {}) => {
    const { dueOnly = false, assigneeId = null } = options;
    const todayEnd = new Date();
    todayEnd.setHours(23, 59, 59, 999);
    const tasks = [];
    filterPatientsForCurrentUser(patients || []).forEach(patient => {
        (patient.tasks || []).forEach(task => {
            if ((task.status || 'open') === 'completed') return;
            if (assigneeId && task.assignedToUserId !== assigneeId) return;
            if (dueOnly && task.dueDate && new Date(task.dueDate) > todayEnd) return;
            tasks.push({ patient, task });
        });
    });
    return tasks.sort((a, b) => new Date(a.task.dueDate || 0) - new Date(b.task.dueDate || 0));
};

/** Canvas signature pad (trackpad / mouse / touch). Returns { clear, isEmpty, toDataURL }. */
const attachSignaturePad = (canvas) => {
    if (!canvas) return null;
    const ctx = canvas.getContext('2d');
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const cssW = canvas.clientWidth || 640;
    const cssH = canvas.clientHeight || 180;
    canvas.width = Math.floor(cssW * ratio);
    canvas.height = Math.floor(cssH * ratio);
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#0f172a';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cssW, cssH);
    let drawing = false;
    let empty = true;
    const pos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const src = e.touches && e.touches[0] ? e.touches[0] : e;
        return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    };
    const start = (e) => {
        e.preventDefault();
        drawing = true;
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    };
    const move = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        empty = false;
    };
    const end = (e) => {
        if (!drawing) return;
        e.preventDefault();
        drawing = false;
    };
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    return {
        clear: () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cssW, cssH);
            empty = true;
        },
        isEmpty: () => empty,
        toDataURL: () => canvas.toDataURL('image/png'),
    };
};

const escapeHtml = (value) => String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')

                    <div><label class="block text-sm font-medium mb-1">Printed full name *</label>
                        <input type="text" name="signedBy" required class="w-full p-3 border rounded-md" placeholder="Type your full legal name" autocomplete="name"></div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Signature (use trackpad or mouse) *</label>
                        <canvas id="public-sig-pad" class="econsent-sig-pad" width="640" height="180"></canvas>
                        <button type="button" id="public-clear-sig" class="mt-2 text-sm underline text-slate-600">Clear signature</button>
                    </div>
                    <label class="flex items-start gap-2 text-sm"><input type="checkbox" name="acknowledged" value="1" required class="mt-1"> I have read and understand this informed consent form, and I agree to participate as described.</label>

            </div>`;

        const pad = attachSignaturePad(document.getElementById('public-sig-pad'));
        document.getElementById('public-clear-sig')?.addEventListener('click', () => pad?.clear());
        document.getElementById('public-econsent-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const statusEl = document.getElementById('public-econsent-status');
            const submitBtn = document.getElementById('public-econsent-submit');
            if (!pad || pad.isEmpty()) {
                statusEl.textContent = 'Please draw your signature on the pad.';

const handleOutsideClick = (e) => {
    try {
        // Keep patient profile open while a modal is open (contact log, edit, survey, etc.)
        if (modalContainer && !modalContainer.classList.contains('hidden')) return;
        if (e.target.closest('#modal-container') || e.target.closest('[data-action="add-contact-log"]') || e.target.closest('[data-action="edit-patient"]') || e.target.closest('[data-action="survey-patient"]') || e.target.closest('[data-action="schedule-patient"]') || e.target.closest('[data-action="add-visit-log"]') || e.target.closest('[data-action="add-task"]') || e.target.closest('[data-action="add-consent"]') || e.target.closest('[data-action="create-econsent-link"]') || e.target.closest('[data-action="collect-econsent-office"]') || e.target.closest('[data-action="schedule-communication"]') || e.target.closest('[data-action="mark-patient-deceased"]')) {
            return;
        }
        if (!sidePanelContainer.contains(e.target) && !sidePanelContainer.classList.contains('translate-x-full')) {
            if (!e.target.closest('button[data-action="view-patient"]')) {
                closeSidePanel();
            }
        }
    } catch (error) {
        console.error('Error handling outside click:', error);
    }
};

/**
 * Open side panel with enhanced styling and error handling
 * @param {string} content - HTML content to display
 * @param {boolean} isPatientProfile - Whether this is a patient profile panel
 */
const openSidePanel = (content, isPatientProfile = false) => {
    try {
        sidePanelContainer.innerHTML = `
            <div class="side-panel-content h-full overflow-y-auto p-8 animate-in slide-in-from-right duration-300">
                ${content}
            </div>`;
        sidePanelContainer.classList.remove('translate-x-full');
        
        if (isPatientProfile) {
            document.body.classList.add('patient-panel-open');
            syncSidebarForPatientPanel(true);
            setTimeout(() => { 
                document.addEventListener('click', handleOutsideClick, true);
            }, 100);
        } else {
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }
        
        // Re-initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    } catch (error) {
        console.error('Error opening side panel:', error);
        showNotification('Failed to open side panel', 'error');
    }
};

/**
 * Close side panel with cleanup
 */
const closeSidePanel = () => {
    try {
        sidePanelContainer.classList.add('translate-x-full');
        overlay.classList.add('opacity-0', 'pointer-events-none');
        sidePanelContainer.innerHTML = '';
        document.body.classList.remove('patient-panel-open');
        syncSidebarForPatientPanel(false);
        state.currentPatientProfileTab = 'details';
        document.removeEventListener('click', handleOutsideClick, true);
    } catch (error) {
        console.error('Error closing side panel:', error);
    }
};

const updateEnrollmentNumbers = (studyId) => {
    const study = state.studies.find(s => s.id === studyId);
    if (!study) return;
    
    // Get participants for this study
    const studyParticipants = state.patients.filter(p => patientBelongsToStudy(p, studyId));
    
    const enrolledCount = studyParticipants.filter(p => p.status === 'Enrolled').length;
    const screenFailCount = studyParticipants.filter(p => p.status === 'Screen Fail').length;
    const targetEnrollment = study.target || 0;
    const enrollmentProgress = targetEnrollment > 0 ? Math.round((enrolledCount / targetEnrollment) * 100) : 0;
    
    // Calculate open appointment slots for this study
    const studySchedules = state.schedules.filter(s => s.studyId === studyId);
    let openAppointments = 0;
    studySchedules.forEach(schedule => {
        (Array.isArray(schedule.slots) ? schedule.slots : []).forEach(slot => {
            const bookedCount = state.patients.filter(p => p.appointment && p.appointment.slotId === slot.id).length;
            const availableSlots = (slot.capacity || 0) - bookedCount;
            if (availableSlots > 0) {
                openAppointments += availableSlots;
            }
        });
    });
    
    // Update the display
    const totalEnrolledEl = document.getElementById('total-enrolled');
    const targetEnrollmentEl = document.getElementById('target-enrollment');
    const screenFailsEl = document.getElementById('screen-fails');
    const openAppointmentsEl = document.getElementById('open-appointments');
    const enrollmentProgressEl = document.getElementById('enrollment-progress');
    
    if (totalEnrolledEl) totalEnrolledEl.textContent = enrolledCount;
    if (targetEnrollmentEl) targetEnrollmentEl.textContent = targetEnrollment;
    if (screenFailsEl) screenFailsEl.textContent = screenFailCount;
    if (openAppointmentsEl) openAppointmentsEl.textContent = openAppointments;
    if (enrollmentProgressEl) enrollmentProgressEl.textContent = `${enrollmentProgress}%`;
};

const renderStudyParticipants = (studyId) => {
    const tableBody = document.getElementById('participants-table-body');
    if (!tableBody) return;
    
    // Get participants for this study
    let studyParticipants = state.patients.filter(p => patientBelongsToStudy(p, studyId));
    
    // Apply search filter
    if (state.participantSearchTerm) {
        const searchTerm = state.participantSearchTerm.toLowerCase();
        
        // Helper function to normalize phone numbers for searching
        const normalizePhoneForSearch = (phone) => {
            if (!phone) return '';
            return phone.replace(/\D/g, ''); // Remove all non-digits
        };
        
        studyParticipants = studyParticipants.filter(p => {
            const nameMatch = `${p.firstName} ${p.lastName}`.toLowerCase().includes(searchTerm);
            const emailMatch = p.email && p.email.toLowerCase().includes(searchTerm);
            const globalIdMatch = p.globalId && p.globalId.toLowerCase().includes(searchTerm);
            
            // Phone number matching with format normalization
            let phoneMatch = false;
            if (p.phoneNumber) {
                const normalizedSearchTerm = searchTerm.replace(/\D/g, ''); // Remove non-digits from search term
                const normalizedPhone = normalizePhoneForSearch(p.phoneNumber);
                phoneMatch = normalizedPhone.includes(normalizedSearchTerm);
            }
            
            const matches = nameMatch || emailMatch || phoneMatch || globalIdMatch;
            return matches;
        });

                `"${siteName}"`,
                `"${appointmentInfo}"`,
                `"${p.email || 'N/A'}"`,
                `${formatPhoneFive9(p.phoneNumber) || ''}`,
                `"${p.dob || 'N/A'}"`
            ];
            csvRows.push(row.join(','));
        }
        
        const csvString = csvRows.join('\r\n');
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        const study = state.studies.find(s => s.id === state.selectedStudyId);
        const studyTitle = study ? study.title.replace(/[^a-zA-Z0-9]/g, '_') : 'study';
        const date = new Date().toISOString().split('T')[0];
        link.setAttribute("download", `participants_${studyTitle}_${date}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        showNotification("Participants exported successfully!", "success");
    } catch (error) {
        console.error("Failed to export participants:", error);
        showNotification("Failed to export participants. See console for details.", "error");
    }
};

const loadPatientsPage = async (offset = 0) => {
    try {
        const result = await queryPatientsServer({
            search: state.patientSearchTerm || '',
            offset,
            limit: state.patientsPageSize,
            includeTotal: true,
        });
        state.patientsPageItems = result.items;
        state.patientsServerTotal = result.total;
        state.patientsPageOffset = offset;
        return result;
    } catch (err) {
        console.warn('Server patient query failed, using cached patients:', err.message);
        const local = await queryPatientsLocally({
            search: state.patientSearchTerm || '',
            offset,
            limit: state.patientsPageSize,
            includeTotal: true,
        }, err);
        state.patientsPageItems = local.items;
        state.patientsServerTotal = local.total;
        state.patientsPageOffset = offset;
        state.patientsUseServerQuery = false;
        return local;
    }
};

const buildRegistryValueInputHTML = (field, op, value = '') => {
    const def = COHORT_CRITERIA_FIELD_DEFS.find(d => d.field === field) || COHORT_CRITERIA_FIELD_DEFS[0];
    if (op === 'between') {
        const arr = Array.isArray(value) ? value : ['', ''];
        return `<div class="flex gap-2"><input type="number" data-registry-value="0" class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full" placeholder="Min" value="${arr[0] ?? ''}"><input type="number" data-registry-value="1" class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full" placeholder="Max" value="${arr[1] ?? ''}"></div>`;
    }
    if (op === 'not_enrolled_in') {
        return `<select class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full">${state.studies.filter(isActualStudy).map(s => `<option value="${s.id}" ${value === s.id ? 'selected' : ''}>${s.title}</option>`).join('')}</select>`;
    }
    if (op === 'appointment_on_date') {
        return `<input type="date" class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full" value="${value || ''}">`;
    }
    if (op === 'has_appointment') {
        return `<span class="text-sm text-gray-500 dark:text-gray-400 p-2">Has any appointment date</span>`;
    }
    if (field === 'homeSiteId') {
        return `<select class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full">${state.sites.map(s => `<option value="${s.id}" ${value === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select>`;
    }
    if (op === 'in') {
        return `<input type="text" class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full" placeholder="Comma-separated values" value="${Array.isArray(value) ? value.join(', ') : value}">`;
    }
    if (def.presets) {
        return `<select class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full">${def.presets.map(p => `<option value="${p}" ${value === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`;
    }
    if (op === 'is_true' || op === 'is_false') {
        return `<span class="text-sm text-gray-500 dark:text-gray-400 p-2">No value needed</span>`;
    }
    return `<input type="text" class="registry-cond-value p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white w-full" value="${value}">`;
};

const buildRegistryConditionRowHTML = (cond, index) => {
    const def = COHORT_CRITERIA_FIELD_DEFS.find(d => d.field === cond.field) || COHORT_CRITERIA_FIELD_DEFS[0];
    const op = cond.op || def.ops[0];
    const value = cond.value ?? '';
    const fieldOptions = COHORT_CRITERIA_FIELD_DEFS.map(d => `<option value="${d.field}" ${cond.field === d.field ? 'selected' : ''}>${d.label}</option>`).join('');
    const opOptions = (COHORT_CRITERIA_FIELD_DEFS.find(d => d.field === cond.field) || def).ops.map(o => `<option value="${o}" ${op === o ? 'selected' : ''}>${o}</option>`).join('');
    const valueInput = buildRegistryValueInputHTML(cond.field, op, value);
    return `
        <div class="registry-condition-row grid grid-cols-1 md:grid-cols-12 gap-2 items-center" data-index="${index}">
            <select data-registry-field class="md:col-span-3 p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white">${fieldOptions}</select>
            <select data-registry-op class="md:col-span-2 p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white">${opOptions}</select>
            <div class="md:col-span-6 registry-value-cell">${valueInput}</div>
            <button type="button" data-action="registry-remove-condition" data-index="${index}" class="md:col-span-1 text-red-600 hover:text-red-800 text-sm">Remove</button>
        </div>`;
};

const collectRegistryCriteriaFromDom = () => {
    const logic = document.getElementById('registry-criteria-logic')?.value || 'AND';
    const rows = document.querySelectorAll('.registry-condition-row');
    const conditions = [];
    rows.forEach((row) => {
        const field = row.querySelector('[data-registry-field]')?.value;
        const op = row.querySelector('[data-registry-op]')?.value;
        if (!field || !op) return;
        let value = null;
        if (op === 'between') {
            const inputs = row.querySelectorAll('.registry-cond-value');
            value = [parseFloat(inputs[0]?.value), parseFloat(inputs[1]?.value)];
        } else if (op === 'is_true' || op === 'is_false') {
            value = null;
        } else if (op === 'in') {
            const raw = row.querySelector('.registry-cond-value')?.value || '';
            value = raw.split(',').map(s => s.trim()).filter(Boolean);
        } else if (field === '_enrollment' && op === 'not_enrolled_in') {
            value = row.querySelector('.registry-cond-value')?.value || '';
            conditions.push({ field: '_enrollment', op, value });
            return;
        } else if (field === '_enrollment') {
            conditions.push({ field: '_enrollment', op, value: null });
            return;
        } else if (op === 'has_appointment') {
            conditions.push({ field: 'primaryAppointmentDate', op, value: null });
            return;
        } else if (op === 'appointment_on_date') {
            value = row.querySelector('.registry-cond-value')?.value || '';
            conditions.push({ field: 'primaryAppointmentDate', op, value });
            return;
        } else {
            value = row.querySelector('.registry-cond-value')?.value ?? '';
            if (field === 'age' && op !== 'between') value = parseFloat(value);
        }
        conditions.push({ field, op, value });
    });
    return { logic, conditions };
};

    const countEl = document.getElementById('registry-results-count');
    if (!body) return;
    const total = state.registryTotal ?? 0;
    const offset = state.registryOffset || 0;
    const pageSize = state.registryPageSize || 50;
    if (countEl) countEl.textContent = total ? `(showing ${offset + 1}–${Math.min(offset + pageSize, total)} of ${total.toLocaleString()})` : '';
    body.innerHTML = (state.registryResults || []).map(p => {
        const denorm = computePatientDenormalized(p);
        const studyTitle = denorm.currentStudyId ? (state.studies.find(s => s.id === denorm.currentStudyId)?.title || denorm.currentStudyId) : '—';
        return `<tr>
            <td class="px-3 py-2"><button data-action="view-patient" data-id="${p.id}" class="text-blue-600 hover:underline">${phiName(p)}</button></td>
            <td class="px-3 py-2">${p.state || '—'}</td>
            <td class="px-3 py-2">${p.therapeuticArea || '—'}</td>
            <td class="px-3 py-2">${p.eligibilityStatus || '—'}</td>
            <td class="px-3 py-2">${studyTitle}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="5" class="px-3 py-4 text-gray-500">Run Preview or Search to see participants.</td></tr>';
};

const loadRegistryPage = async (offset = 0) => {
    const criteria = collectRegistryCriteriaFromDom();
    state.registryCriteria = criteria;
    try {
        const result = await queryPatientsServer({
            criteria,
            offset,
            limit: state.registryPageSize,
            includeTotal: true,
        });
        state.registryResults = result.items;
        state.registryTotal = result.total;
        state.registryOffset = offset;
        renderRegistryResults();
    } catch (err) {
        showNotification(`Registry query failed: ${err.message}`, 'error');
    }
};

const loadCohortRules = async () => {
    try {
        const rules = await apiCall('cohort-rules');
        state.cohortRules = Array.isArray(rules) ? rules : [];
    } catch {
        state.cohortRules = state.cohortRules || [];
    }
};

const loadBulkJobs = async () => {
    try {
        const jobs = await apiCall('bulk-jobs');
        state.bulkJobs = Array.isArray(jobs) ? jobs : [];

        state.bulkJobs = state.bulkJobs || [];
    }
};

const getDayAppointmentsModalHTML = (dateString) => {
    const date = new Date(dateString + 'T00:00:00');
    const dayName = date.toLocaleDateString('default', { weekday: 'long', month: 'long', day: 'numeric' });
    const slotsForDay = [];
    state.schedules.forEach(schedule => {
        (Array.isArray(schedule.slots) ? schedule.slots : []).forEach(slot => {
            if (toLocalDateKey(slot.startTime) === dateString) {
                slotsForDay.push({ schedule, slot });
            }
        });
    });
    slotsForDay.sort((a, b) => new Date(a.slot.startTime) - new Date(b.slot.startTime));
    let contentHTML = `<h2 class="text-2xl font-bold dark:text-white mb-4">Schedule for ${dayName}</h2>`;
    if (slotsForDay.length > 0) {
        contentHTML += `<div class="space-y-4">`;
        slotsForDay.forEach(({ schedule, slot }) => {
            const study = state.studies.find(s => s.id === schedule.studyId);
            const site = state.sites.find(s => s.id === schedule.siteId);
            const patientsInSlot = state.patients.flatMap(patient =>
                getPatientAppointments(patient)
                    .filter(appointment => appointment.slotId === slot.id && (appointment.status || 'scheduled') !== 'cancelled')
                    .map(appointment => ({ patient, appointment })));
            const bookedCount = patientsInSlot.length;
            const isFull = bookedCount >= (slot.capacity || 0);
            contentHTML += `
                <div class="p-4 border dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-700/50 cursor-pointer appointment-slot" data-schedule-id="${schedule.id}" data-slot-id="${slot.id}">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-bold text-lg dark:text-white">${new Date(slot.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</p>
                            <p class="font-medium text-sm dark:text-gray-200">${schedule.visit || 'General'} - ${study?.title || 'N/A'}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">${site?.name || 'N/A'}</p>
                        </div>
                        <div class="text-right text-sm">
                            <p class="font-semibold ${isFull ? 'text-red-500' : 'text-green-500'}">
                                ${bookedCount} / ${slot.capacity || 0} Booked
                            </p>
                        </div>
                    </div>
                    <div class="mt-2 border-t dark:border-gray-600 pt-2 text-sm">
                        ${patientsInSlot.length > 0
                            ? patientsInSlot.map(p => `<p class="dark:text-gray-300"><i data-lucide="user" class="inline-block w-4 h-4 mr-1"></i><button data-action="view-patient" data-id="${p.id}" class="text-blue-600 dark:text-blue-400 hover:underline">${phiName(p)}</button></p>`).join('')
                            : '<p class="text-gray-500 dark:text-gray-400">No participants scheduled.</p>'
                        }
                    </div>
                </div>
            `;
        });
        contentHTML += `</div>`;
    } else {
        contentHTML += `<p class="text-center text-gray-500 dark:text-gray-400 py-8">No appointment slots available for this day.</p>`;
    }
    return contentHTML;
};

};
const getBookingModalHTML = (patient, visitFilter = 'all') => {
    if (!patient) return `<h2>Patient not found</h2>`;
    const blockReason = getSchedulingBlockReason(patient);
    if (blockReason) {
        return `
            <h2 class="text-2xl font-bold dark:text-white mb-4">Schedule for ${phiName(patient)}</h2>
            <p class="text-red-500">${blockReason}</p>
        `;
    }
    const schedulingContext = getSchedulingContext(patient);
    if (!schedulingContext) {
         return `
            <h2 class="text-2xl font-bold dark:text-white mb-4">Schedule for ${phiName(patient)}</h2>
            <p class="text-red-500">This patient is not currently enrolled in a study and cannot be scheduled.</p>
            ${SCHEDULING_TEST_MODE ? '<p class="text-sm text-gray-500 mt-2">Add at least one study, site, and schedule with slots to test booking.</p>' : ''}
        `;
    }
    const { studyId: ctxStudyId, siteId: ctxSiteId } = schedulingContext;
    const availableSchedules = getBookableSchedulesForPatient(patient);
    const uniqueVisits = [...new Set(availableSchedules.map(s => s.visit).filter(Boolean))].sort();
    if (availableSchedules.length === 0) {
        return `
            <h2 class="text-2xl font-bold dark:text-white mb-4">Schedule for ${phiName(patient)}</h2>
            <p class="text-red-500">No available schedules match the patient's assigned site, study, and visit history.</p>
            <div class="mt-4 p-4 bg-gray-100 dark:bg-gray-800 rounded text-sm">
                <p><strong>Details:</strong></p>
                <p>Patient Site ID: ${phi(ctxSiteId || '—')}</p>
                <p>Patient Study ID: ${phi(ctxStudyId || '—')}</p>
                <p>Total Schedules: ${state.schedules.length}</p>
            </div>
        `;
    }
    // This function will now be responsible for rendering the calendar inside the modal
    const renderBookingCalendar = (date, patient, currentFilter) => {
        const month = date.getMonth();
        const year = date.getFullYear();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay();
        const monthName = date.toLocaleString('default', { month: 'long' });
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const filteredSchedules = currentFilter === 'all' 
            ? availableSchedules 
            : availableSchedules.filter(s => s.visit === currentFilter);
        const availableSlotsByDay = {};
        filteredSchedules.forEach(schedule => {
            (Array.isArray(schedule.slots) ? schedule.slots : []).forEach(slot => {
                const bookedCount = countPatientsInSlot(slot.id);
                const capacity = SCHEDULING_TEST_MODE ? Math.max(slot.capacity || 0, 1) : (slot.capacity || 0);
                if (SCHEDULING_TEST_MODE || bookedCount < capacity) {
                    const slotDate = toLocalDateKey(slot.startTime);
                    if (!slotDate) return;
                    if (!availableSlotsByDay[slotDate]) {
                        availableSlotsByDay[slotDate] = [];
                    }
                    availableSlotsByDay[slotDate].push({scheduleId: schedule.id, scheduleType: schedule.visit, ...slot, booked: bookedCount});
                }
            });
        });
        let calendarHTML = `
            <div class="flex justify-between items-center mb-4 dark:text-white">
                <button data-action="prev-booking-month" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"><i data-lucide="chevron-left"></i></button>
                <h3 class="text-xl font-semibold">${monthName} ${year}</h3>
                <button data-action="next-booking-month" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"><i data-lucide="chevron-right"></i></button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-sm">
                ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => `<div class="font-semibold text-gray-500 dark:text-gray-400">${day}</div>`).join('')}
            `;
        for (let i = 0; i < startDayOfWeek; i++) { calendarHTML += `<div></div>`; }
        for (let day = 1; day <= daysInMonth; day++) {
            const currentDate = new Date(year, month, day);
            const dateString = toLocalDateKey(currentDate);
            const hasSlots = availableSlotsByDay[dateString];

                </button>
            `;
        }
        calendarHTML += `</div>`;
        return calendarHTML;

const captureEntraProfileFromToken = (token) => {
    const parts = String(token || '').split('.');
    if (parts.length !== 3) throw new Error('Invalid Microsoft token.');
    let base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    const payload = JSON.parse(atob(base64));
    const entraId = payload.oid || payload.sub;
    const email = payload.email || payload.preferred_username || payload.upn || '';
    const name = payload.name || `${payload.given_name || ''} ${payload.family_name || ''}`.trim();
    const upn = String(payload.preferred_username || payload.upn || email || '').toLowerCase();
    const isGuest = upn.includes('#ext#') || String(payload.acct || '').toLowerCase() === '1';
    if (!entraId) throw new Error('Microsoft account is missing a user identifier.');
    return { entraId, email, name, isGuest, isInternal: !isGuest && isInternalWorkEmail(email) };
};

const verifyEntraForAccessRequest = async () => {
    if (!msalInstance) {
        showNotification('Microsoft sign-in is not configured yet.', 'error');
        return;
    }
    const loginResponse = await msalInstance.loginPopup({
        scopes: ['openid', 'profile', 'email'],
        prompt: 'select_account',
    });
    const token = loginResponse?.idToken;
    if (!token) throw new Error('No sign-in token returned from Microsoft.');
    state.pendingEntraProfile = captureEntraProfileFromToken(token);
    showNotification(`Microsoft account linked: ${state.pendingEntraProfile.email || state.pendingEntraProfile.name}`, 'success');
    render();
};

const handleEntraIdLogin = async () => {
    const errorDiv = document.getElementById('login-gate-error');
    const showLoginError = (message) => {
        if (!errorDiv) return;
        errorDiv.textContent = message;
        errorDiv.classList.remove('hidden');
    };
    if (errorDiv) errorDiv.classList.add('hidden');

    if (!msalInstance) {
        showLoginError('Microsoft sign-in is not configured. Set ENTRA_CLIENT_ID on the NASA API and redeploy.');
        return;
    }

    try {
        const loginResponse = await msalInstance.loginPopup({
            scopes: ['openid', 'profile', 'email'],
            prompt: 'select_account',
        });
        const token = loginResponse?.idToken;
        if (!token) throw new Error('No sign-in token returned from Microsoft.');

        const apiUser = await apiCall('users/authenticate-entra', 'POST', { token });
        setSignedInUser(apiUser);
        state.pendingEntraProfile = null;
        showNotification(`Signed in as ${state.currentUser.email || state.currentUser.username}`, 'success');
        render();
    } catch (error) {
        console.error('Entra ID login error:', error);
        if (error?.errorCode === 'user_cancelled') {
            showLoginError('Sign-in cancelled.');
            return;
        }
        const code = error?.body?.code;
        if (code === 'ACCESS_REQUIRED') {
            state.pendingEntraProfile = error.body.entraProfile || null;
            state.showLoginGate = false;
            state.activeTab = 'requestAccess';
            const isStaffDomain = isInternalWorkEmail(state.pendingEntraProfile?.email);
            showNotification(
                isStaffDomain
                    ? 'Your work account was not recognized. Contact an administrator or use emergency local login.'
                    : 'No NASA account yet. Submit an access request for manager approval.',
                'info'
            );
            render();
            return;
        }
        if (code === 'ACCESS_PENDING') {
            showLoginError('Your access request is pending manager approval.');
            return;
        }
        if (code === 'ACCESS_DENIED') {
            showLoginError('Your access request was denied. Contact your manager.');
            return;
        }
        showLoginError(error?.message || 'Microsoft sign-in failed. Try again or use a local account.');
    }
};

const setupRequestAccessForm = () => {
    const form = document.getElementById('request-access-form');
    if (!form) return;

    // Avoid duplicate bindings on re-render
    if (form.dataset.bound === 'true') return;
    form.dataset.bound = 'true';

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const siteId = document.getElementById('request-site-id')?.value || '';
        const siteName = state.sites.find(s => s.id === siteId)?.name || siteId || 'Unknown site';
        const emailOrUsername = String(document.getElementById('request-email-username')?.value || '').trim();
        const displayNameInput = String(document.getElementById('request-display-name')?.value || '').trim();
        const notes = document.getElementById('request-notes')?.value || '';
        if (!displayNameInput) {
            showNotification('Your name is required.', 'error');
            return;
        }
        if (!emailOrUsername || !emailOrUsername.includes('@')) {
            showNotification('A valid work email is required.', 'error');
            return;
        }
        if (!siteId) {
            showNotification('Please select a site.', 'error');
            return;
        }
        if (isInternalWorkEmail(emailOrUsername)) {
            showNotification('ORA work accounts should use Sign in with Microsoft on the login page.', 'warning');
            return;
        }

        const resolvedEmail = emailOrUsername;
        const resolvedName = displayNameInput;
        const req = {
            id: ensureId('req'),
            createdAt: new Date().toISOString(),
            status: 'pending',
            siteId,
            siteName,
            requestedLogin: resolvedEmail,
            email: resolvedEmail,
            displayName: resolvedName,
            entraId: '',
            authType: 'entra',
            userPartition: 'external',
            notes,
        };
        (async () => {
            try {
                const saved = await createDocument('accessRequests', req);
                state.accessRequests = [saved, ...(state.accessRequests || [])];
                saveLocalState();
                showNotification(`Request submitted for ${siteName}. A manager will review it shortly.`, 'success');
                render();
            } catch (error) {
                state.accessRequests = [req, ...(state.accessRequests || [])];
                saveLocalState();
                showNotification(`Request saved locally (API error): ${siteName}`, 'warning');
            }
        })();
    });
};

const setupApproveAccessRequestForm = (requestId) => {
    const form = document.getElementById('manageR-approve-request-form');
    if (!form) return;

    form.addEventListener('submit', async function onApproveSubmit(e) {
        e.preventDefault();
        const req = (state.accessRequests || []).find(r => r.id === requestId);
        if (!req) {
            showNotification('Request not found.', 'error');
            return;
        }
        const fd = new FormData(form);
        const allowedSiteIds = fd.getAll('allowedSiteIds').map(String);
        const allowedStudyIds = fd.getAll('allowedStudyIds').map(String);
        const role = String(fd.get('role') || 'External').trim();
        try {
            const result = await apiCall(`access-requests/${requestId}/approve`, 'POST', {
                role,
                allowedSiteIds,
                allowedStudyIds,
            });
            if (result?.user) {
                const normalized = normalizeApiUser(result.user);
                const existingIdx = (state.managedUsers || []).findIndex(u => u.id === normalized.id);
                if (existingIdx >= 0) {
                    state.managedUsers[existingIdx] = normalized;
                } else {
                    state.managedUsers = [normalized, ...(state.managedUsers || [])];
                }
            }
            const updatedRequest = result?.request || { ...req, status: 'approved', approvedAt: new Date().toISOString() };
            state.accessRequests = (state.accessRequests || []).map(r => r.id === requestId ? updatedRequest : r);
            saveLocalState();
            closeModal();
            const inv = result?.invitation;
            const email = result?.user?.email || result?.user?.username || req?.email || '';
            if (inv?.sent) {
                showNotification(`Approved. Microsoft invitation sent to ${email}.`, 'success');
            } else if (inv?.error) {
                showNotification(`User created, but Microsoft invitation failed: ${inv.error}`, 'warning');
            } else if (inv?.skipped && inv?.reason === 'graph-not-configured') {
                showNotification(`User created. Configure Graph API credentials to auto-send Microsoft invitations.`, 'warning');
            } else {
                showNotification(result?.user
                    ? `Approved. ${email} can sign in after accepting their Microsoft invitation.`
                    : 'Request approved.', 'success');
            }
            render();
        } catch (error) {
            console.error('Approve access request failed:', error);
            showNotification(error.message || 'Could not approve request.', 'error');
        }
    }, { once: true });
};

const formatSurveyBranchTarget = (survey, target) => {
    if (target === 'pass') return 'End — Pass';
    if (target === 'fail') return 'End — Fail';
    if (target === 'submit') return 'End — Completed';
    if (target === 'next-section') return 'Next section';
    if (String(target || '').startsWith('section:')) return `Section — ${String(target).slice(8)}`;
    if (!Number.isNaN(Number(target)) && Number(target) > 0) {
        const rawIndex = Number(target) - 1;
        const item = survey?.questions?.[rawIndex];
        if (!item) return `Item ${target}`;
        if (!isNumberedSurveyQuestion(item)) return `Section/item — ${item.section || item.text || target}`;
        const displayNumber = (survey.questions || []).slice(0, rawIndex + 1).filter(isNumberedSurveyQuestion).length;
        return `Question ${displayNumber}`;
    }
    return String(target || 'End — Completed');
};

const getViewSurveyModalHTML = (survey) => {
    if (!survey) return `<h2>Survey not found</h2>`;
    const study = state.studies.find(s => s.id === survey.studyId);

        const displayNumber = isNumberedSurveyQuestion(q)

        // Display question table if available

        return `

                                ${row.map(cell => `<td class="px-2 py-1 border dark:border-gray-600">${applyScriptVariables(cell, patient)}</td>`).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    const vars = getScriptVariableMap(patient);
    const numberedQs = (survey.questions || []).filter(isNumberedSurveyQuestion);
    const numberedIndex = isNumberedSurveyQuestion(question)
        ? numberedQs.findIndex(q => q === question) + 1
        : null;
    const progressLabel = question.isScript || !isNumberedSurveyQuestion(question)
        ? (question.isScript ? 'Script' : (section || 'Section'))
        : `Question ${numberedIndex} of ${numberedQs.length}`;
    const history = state.currentSurveyState.history || [];
    const isContactDetails = isSurveyContactDetailsStep(question);
    const isMedReviewSection = isSurveyMedicationStep(question);
    const useProfileEditor = isContactDetails || isMedReviewSection;
    const contactDetailsHTML = isContactDetails ? getSurveyContactDetailsEditorHTML(patient) : '';
    const medEditorHTML = isMedReviewSection ? getSurveyMedicationEditorHTML(patient) : '';
    const completedHTML = (answers || []).length
        ? `<details class="mb-4 border dark:border-gray-600 rounded-lg" open>
            <summary class="cursor-pointer px-3 py-2 text-sm font-semibold dark:text-white bg-gray-50 dark:bg-gray-900/40">Completed responses (${answers.length}) — scroll / expand to review</summary>
            <div class="p-3 max-h-48 overflow-y-auto space-y-2 text-sm dark:text-gray-300">
                ${answers.map(a => `<div class="border-b dark:border-gray-700 pb-2"><strong class="dark:text-white">${escapeHtmlPhi(a.question)}</strong><div class="whitespace-pre-wrap">${phi(a.answer)}</div></div>`).join('')}
            </div>
           </details>`
        : '';
    const defaultNext = (question.options && question.options[0] && question.options[0].next)
        || (currentQuestionIndex + 2 <= survey.questions.length ? String(currentQuestionIndex + 2) : 'submit');
    const isCallScript = question.isScript && (section === 'Voicemail Script' || section === 'Live Patient Script');
    // At most one Voicemail + one Live script (UAT-123/116) — never duplicate the same section
    const callScripts = isCallScript
        ? (() => {
            const out = [];
            ['Voicemail Script', 'Live Patient Script'].forEach(sec => {
                const idx = (survey.questions || []).findIndex(q => q.isScript && q.section === sec);
                if (idx >= 0) out.push({ q: survey.questions[idx], idx });
            });
            return out;
        })()
        : [];
    const priorMulti = String(priorAnswer || '').split('|').map(s => s.trim()).filter(Boolean);
    // UAT-062: section header is standalone + collapsible; questions live underneath (not an empty <details>)
    const sectionWrapOpen = section && !isContactDetails
        ? `<details class="mb-3 border dark:border-gray-600 rounded-lg" open>
            <summary class="cursor-pointer px-3 py-2 text-xs uppercase tracking-wide text-blue-600 dark:text-blue-400 font-semibold bg-gray-50 dark:bg-gray-900/40 rounded-t-lg">${escapeHtmlPhi(section)}</summary>
            <div class="p-3 border-t dark:border-gray-700">`
        : '';
    const sectionWrapClose = section && !isContactDetails ? `</div></details>` : '';
    return `
        <h2 class="text-2xl font-bold dark:text-white mb-2 break-words">${survey.title}</h2>
        ${sectionWrapOpen}
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">${progressLabel} · Recruiter: ${vars['{{recruiter_name}}'] || '—'} · Site: ${vars['{{site_name}}'] || '—'} · Study: ${vars['{{study_name}}'] || '—'}</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Tokens auto-fill from patient site/study and your first name.</p>
        ${completedHTML}
        ${contactDetailsHTML}
        ${medEditorHTML}
        <form id="take-survey-form">
            ${question.isScript || useProfileEditor ? `
            ${isCallScript ? callScripts.map(({ q }) => `
                <details class="mb-3 border border-indigo-300 dark:border-indigo-700 rounded-lg bg-indigo-50 dark:bg-indigo-950/30" open>
                    <summary class="cursor-pointer p-3 font-semibold text-indigo-800 dark:text-indigo-200">${q.section}</summary>
                    <div class="p-4 pt-1 text-base dark:text-white break-words whitespace-pre-wrap">${applyScriptVariables(q.text || '', patient)}</div>
                </details>
            `).join('') : (!useProfileEditor ? `
                <details class="mb-3 border border-indigo-300 dark:border-indigo-700 rounded-lg bg-indigo-50 dark:bg-indigo-950/30" open>
                    <summary class="cursor-pointer p-3 font-semibold text-indigo-800 dark:text-indigo-200">${section || 'Script'}</summary>
                    <div class="p-4 pt-1 text-base dark:text-white break-words whitespace-pre-wrap">${questionText}</div>
                </details>
                ${notesHTML}
                ${tableHTML}
            ` : `
                ${questionText ? `<p class="text-sm text-gray-600 dark:text-gray-400 mb-3">${questionText}</p>` : ''}
                ${notesHTML}
                ${tableHTML}
            `)}
            <input type="hidden" name="answer" value="${isContactDetails ? 'Contact details reviewed' : (isMedReviewSection ? 'Medications reviewed' : 'Script read')}">
            <input type="hidden" name="answerNext" value="${defaultNext}">
            ` : `
            <p class="text-lg font-semibold dark:text-white mb-4 break-words whitespace-normal">${questionText}</p>
            ${notesHTML}
            ${tableHTML}
            <div class="space-y-3 dark:text-gray-300">
                ${question.type === 'open-text' ? `
                    <textarea name="answer" rows="4" required class="w-full p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white" placeholder="Enter response / script notes…">${String(priorAnswer || '').replace(/</g, '&lt;')}</textarea>
                    <input type="hidden" name="answerNext" value="${defaultNext}">
                ` : question.type === 'dropdown' ? `
                    <select name="answer" required class="w-full p-2 border dark:border-gray-600 rounded bg-white dark:bg-gray-700 dark:text-white">
                        <option value="">Select…</option>
                        ${(question.options || []).map(opt => `<option value="${String(opt.text).replace(/"/g, '&quot;')}" data-next="${opt.next || 'submit'}" ${priorAnswer === opt.text ? 'selected' : ''}>${applyScriptVariables(opt.text, patient)}</option>`).join('')}
                    </select>
                ` : question.type === 'multi-select' ? `
                    ${(question.options || []).map((opt, index) => `
                        <div>
                            <input type="checkbox" id="option-${index}" name="answerMulti" value="${String(opt.text).replace(/"/g, '&quot;')}" data-next="${opt.next || defaultNext}" ${priorMulti.includes(opt.text) ? 'checked' : ''} class="mr-2">
                            <label for="option-${index}" class="break-words whitespace-normal">${applyScriptVariables(opt.text, patient)}</label>
                        </div>
                    `).join('')}
                    <input type="hidden" name="answerNext" value="${defaultNext}">
                ` : (question.options || []).map((opt, index) => `
                    <div>
                        <input type="radio" id="option-${index}" name="answer" value="${String(opt.text).replace(/"/g, '&quot;')}" data-next="${opt.next || 'submit'}" ${priorAnswer === opt.text ? 'checked' : ''} required class="mr-2">
                        <label for="option-${index}" class="break-words whitespace-normal">${applyScriptVariables(opt.text, patient)}</label>
                    </div>
                `).join('')}
            </div>
            `}
            <div class="mt-6 flex gap-2">
                ${history.length ? `<button type="button" data-action="survey-go-back" class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-white py-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-600">Go back</button>` : ''}
                <button type="button" data-action="save-survey-progress" class="flex-1 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white py-2 rounded-md hover:bg-gray-300 dark:hover:bg-gray-500">Save Progress</button>
                <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-md">${question.isScript || useProfileEditor ? 'Continue' : 'Next'}</button>
            </div>
        </form>
        ${sectionWrapClose}
    `;
};

    if (!study) return `<h2>Study not found</h2>`;
    
    // Get patients that are NOT currently enrolled in this study
    const availablePatients = getScopedPatients().filter(p => {
        const currentEnrollment = p.enrollments?.find(e => e.status === 'current');
        return !currentEnrollment || currentEnrollment.studyId !== studyId;
    });
    
    // Get sites available for this study
    const studySiteIds = study.siteIds || [];
    const availableSites = state.sites.filter(site => 
        studySiteIds.includes(site.id) && site.status === 'Active'
    );
    
    return `

                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Name</th>

                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Current Study</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase">Action</th>
                    </tr>
                </thead>
                <tbody id="add-patient-search-results" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                    ${availablePatients.length === 0 ? `
                        <tr><td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">All patients are already enrolled in this study.</td></tr>

                        const currentEnrollment = p.enrollments?.find(e => e.status === 'current');

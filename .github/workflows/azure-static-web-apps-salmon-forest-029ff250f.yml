name: Azure Static Web Apps CI/CD - CHAOS

on:
  push:
    branches:
      - chaos-scheduler
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - chaos-scheduler

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy CHAOS
    # REMOVED the permissions block - not needed for deployment token
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # REMOVED the OIDC steps (Install OIDC Client, Get Id Token)
      - name: Build And Deploy CHAOS
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_FOREST_029FF250F }} # Only deployment token needed
          action: "upload"
          app_location: "/" # Location of your frontend code (index.html)
          api_location: "api" # Location of your API code (index.js, package.json, host.json)
          output_location: "/" # Since skip_app_build is true, this points to the same as app_location
          skip_app_build: true # Tells Azure not to run npm build on the frontend
          skip_api_build: false
          env: # <--- ADD THIS BLOCK
      NODE_VERSION: "20"
          # REMOVED the github_id_token parameter

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_FOREST_029FF250F }} # Also use deployment token here
          action: "close"
          # REMOVED github_id_token if it was present





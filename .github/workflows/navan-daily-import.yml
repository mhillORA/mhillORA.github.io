name: Navan Daily Import

# Replaces app.timer('navanAutoImport') from api/index.js (schedule: 0 12 * * *)
# Calls the existing HTTP endpoint — no server timer required on Azure SWA.

on:
  schedule:
    - cron: '0 12 * * *' # Daily 12:00 UTC (7 AM EST / 8 AM EDT) — from api/index.js
  workflow_dispatch: # Manual run from GitHub Actions tab

jobs:
  navan-import:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/navan-import
        env:
          # Hostname from azure-static-web-apps-salmon-forest-029ff250f.yml
          SWA_HOST: salmon-forest-029ff250f.azurestaticapps.net
        run: |
          curl -sfS -X POST "https://${SWA_HOST}/api/navan-import" \
            -H "Content-Type: application/json" \
            -d '{"importType":"range","pastDays":30,"futureDays":30}'

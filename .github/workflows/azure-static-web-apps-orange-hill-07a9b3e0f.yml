name: Azure Static Web Apps CI/CD - NASA

on:
  push:
    branches:
      - NASA # Triggers on pushes to the NASA branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - NASA # Triggers on PRs targeting the NASA branch

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy NASA App
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_HILL_07A9B3E0F }} # Token for the 'orange-hill' SWA
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/" # Location of index.html
          api_location: "api" # CORRECTED: Points to your API folder
          output_location: "" # Assumes no frontend build step needed for "/"
          # Consider adding skip_app_build: true if your root '/' only contains static files
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_HILL_07A9B3E0F }}
          action: "close"

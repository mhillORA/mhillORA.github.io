name: Gold → Cosmos daily ping

# 11:00 UTC. Timer in the Functions app also runs; this is a backup HTTP poke.
# Uses SWA App Settings for Cosmos. No COSMOS_* in GitHub.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: POST /api/gold/sync
        env:
          GOLD_SYNC_KEY: ${{ secrets.GOLD_SYNC_KEY }}
          GOLD_SYNC_URL: ${{ secrets.GOLD_SYNC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GOLD_SYNC_KEY:-}" ]; then
            echo "Missing Actions secret GOLD_SYNC_KEY"
            exit 1
          fi
          URL="${GOLD_SYNC_URL:-}"
          if [ -z "$URL" ]; then
            echo "Missing Actions secret GOLD_SYNC_URL"
            exit 1
          fi
          curl -sS -f -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-sync-key: $GOLD_SYNC_KEY" \
            -d '{}'

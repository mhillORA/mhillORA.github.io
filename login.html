<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Ora Data Lens</title>
  <meta name="theme-color" content="#001123" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #001123; }
    body {
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      color: #fff;
      min-height: 100%;
    }
    .gate {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 24px 24px 11vh;
      background:
        linear-gradient(180deg, rgba(0,17,35,.15) 40%, rgba(0,17,35,.55) 100%),
        url("img/logo-poster.png") center / cover no-repeat;
    }
    .sign-in {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      padding: 12px 28px;
      border: 1px solid rgba(62, 189, 172, .85);
      border-radius: 999px;
      background: rgba(5, 44, 73, .72);
      color: #fff;
      font: 500 15px/1.2 "Segoe UI", Roboto, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0, 17, 35, .45);
      transition: background 160ms ease, transform 160ms ease;
    }
    .sign-in:hover { background: rgba(42, 144, 132, .85); transform: translateY(-1px); }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,.7);
    }
  </style>
</head>
<body>
  <main class="gate">
    <a class="sign-in" href="/.auth/login/aad?post_login_redirect_uri=/">Sign in</a>
    <div class="hint">Microsoft · Ora Entra</div>
  </main>
  <script>
    try { sessionStorage.removeItem("odl.booted"); } catch (e) {}
    fetch("/.auth/me")
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (payload) {
        var principal = Array.isArray(payload) ? payload[0] : payload && payload.clientPrincipal;
        if (principal) location.replace("/");
      })
      .catch(function () {});
  </script>
</body>
</html>
